<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Progress — Sekiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16130f;
    --ink-soft: #23201a;
    --paper: #ece4d3;
    --paper-dim: #cfc4ab;
    --blood: #7a1f1f;
    --blood-bright: #a8321f;
    --gold: #a8853d;
    --line: rgba(236,228,211,0.14);
    --font-display: 'Shippori Mincho', serif;
    --font-body: 'Zen Kaku Gothic New', sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) {
    --bg: var(--ink);
    --bg-panel: var(--ink-soft);
    --text: var(--paper);
    --text-dim: var(--paper-dim);
  }
  /* Não há regra seguindo prefers-color-scheme de propósito: o site é escuro
     por padrão, e só fica claro se a pessoa pedir. Sem isto, quem usa o sistema
     no claro abriria no claro. */
  :root[data-theme="light"] {
    --bg: #ece4d3;
    --bg-panel: #ddd2b8;
    --text: #201a12;
    --text-dim: #4a3f2d;
    --line: rgba(32,26,18,0.14);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    /* `transparent` numa parada de gradiente é preto transparente, e a
       interpolação até ele deixa uma faixa cinza visível no meio. Terminar na
       mesma cor com alfa zero resolve, e o fixed evita emenda ao rolar. */
    background-image:
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(122,31,31,0.20), rgba(122,31,31,0) 70%);
    background-repeat: no-repeat;
    background-attachment: fixed;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 20px 80px; }

  header.top {
    border-bottom: 1px solid var(--line);
    padding-bottom: 22px;
    margin-bottom: 24px;
  }
  /* Tudo do cabeçalho numa coluna centrada: o título manda, e o que vem
     depois é subordinado a ele em vez de disputar a linha. */
  .top-centro { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 3.1rem;
    letter-spacing: 0.04em;
    margin: 0;
    line-height: 1.05;
    text-align: center;
  }
  h1 span { color: var(--blood-bright); }

  /* Discreto mas legível: o mesmo tom apagado das outras notas, com um fio
     acima para separar. Não usa opacidade baixa, que some no tema claro. */
  .made-by {
    margin-top: 44px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.14em;
    text-transform: lowercase;
  }

  /* --- contador de mortes: campo próprio, abaixo do cabeçalho --- */
  /* Moldura de placa: fio externo, um segundo fio dourado por dentro e quatro
     cantoneiras. É o vocabulário de moldura do jogo — canto sempre reforçado,
     nunca arredondado — feito com a paleta que a página já tem, sem cor nova.
     Cantos retos de propósito: o raio de 3px amolecia a peça. */
  .deaths-panel {
    position: relative;
    border: 1px solid var(--line);
    background: var(--bg-panel);
    border-radius: 0;
    padding: 20px 22px 18px;
    margin-bottom: 26px;
  }
  .deaths-panel::before,
  .deaths-panel::after {
    content: "";
    position: absolute;
    pointer-events: none;
  }
  /* fio interno */
  .deaths-panel::before {
    inset: 5px;
    border: 1px solid var(--gold);
    opacity: 0.3;
  }
  /* cantoneiras: oito faixas, duas por canto */
  .deaths-panel::after {
    inset: 0;
    background:
      linear-gradient(var(--gold), var(--gold)) 0 0 / 16px 2px no-repeat,
      linear-gradient(var(--gold), var(--gold)) 0 0 / 2px 16px no-repeat,
      linear-gradient(var(--gold), var(--gold)) 100% 0 / 16px 2px no-repeat,
      linear-gradient(var(--gold), var(--gold)) 100% 0 / 2px 16px no-repeat,
      linear-gradient(var(--gold), var(--gold)) 0 100% / 16px 2px no-repeat,
      linear-gradient(var(--gold), var(--gold)) 0 100% / 2px 16px no-repeat,
      linear-gradient(var(--gold), var(--gold)) 100% 100% / 16px 2px no-repeat,
      linear-gradient(var(--gold), var(--gold)) 100% 100% / 2px 16px no-repeat;
  }
  .deaths-head { display: flex; align-items: baseline; gap: 12px; }
  .deaths-kanji {
    font-family: var(--font-display);
    font-size: 1.9rem;
    font-weight: 800;
    color: var(--blood-bright);
    line-height: 1;
  }
  /* O número de mortes sangra: o vermelho escorre de cima para baixo dentro do
     glifo, e uma gota cai da base de tempos em tempos. Duas animações
     independentes, para não ficar um pulso só, mecânico. */
  .deaths-count {
    position: relative;
    font-family: var(--font-display);
    font-size: 2.9rem;
    font-weight: 800;
    line-height: 1;
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
    background-image: linear-gradient(
      180deg,
      #ffd8cc 0%, #ff6a3d 18%, #d4462a 36%, #8c1a10 62%, #3d0a06 100%);
    background-size: 100% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: escorrer 2.4s ease-in-out infinite;
    filter: drop-shadow(0 0 12px rgba(212,70,42,0.8)) drop-shadow(0 2px 3px rgba(0,0,0,0.85));
  }
  @keyframes escorrer {
    0%   { background-position: 50% 0%; }
    45%  { background-position: 50% 100%; }
    100% { background-position: 50% 0%; }
  }
  /* A gota. Nasce colada na base do número e cai, sumindo no caminho. */
  .deaths-count::after {
    content: "";
    position: absolute;
    left: 58%;
    top: 92%;
    width: 4px;
    height: 13px;
    border-radius: 0 0 60% 60%;
    background: linear-gradient(180deg, #ff5b33, #8c1a10 65%, transparent);
    opacity: 0;
    animation: pingar 3.1s ease-in infinite;
  }
  @keyframes pingar {
    0%, 30%  { transform: translateY(0) scaleY(0.3); opacity: 0; }
    40%      { transform: translateY(4px) scaleY(1); opacity: 1; }
    80%      { transform: translateY(46px) scaleY(1.8); opacity: 0.8; }
    100%     { transform: translateY(78px) scaleY(2.4); opacity: 0; }
  }
  /* Quem pediu menos movimento no sistema recebe o número parado. */
  @media (prefers-reduced-motion: reduce) {
    .deaths-count, .tempo-num, .boss-num, .headless-num,
    .boss-quadro::before, .headless-quadro::before, .headless-quadro {
      animation: none;
    }
    .deaths-count { background-position: 50% 30%; }
    .tempo-num { background-position: 40% 50%; }
    .boss-num, .headless-num { background-position: 50% 30%; }
    .boss-quadro::before, .headless-quadro::before { opacity: 0.85; }
    .deaths-count::after, .pingo { display: none; }
  }
  .deaths-note {
    font-size: 0.72rem;
    color: var(--text-dim);
    line-height: 1.5;
    margin-top: 10px;
  }
  .deaths-note:empty { display: none; }

  /* Termômetro de 0 a 1000. O recuo lateral é metade da largura do pino, para
     ele não vazar do campo nos extremos da escala. */
  /* O recuo é metade da largura do pino, para ele não vazar do campo nos
     extremos. A pista interna tem a largura exata do tubo, e é isso que deixa o
     pino ser posicionado só com uma porcentagem — sem conta em pixel no script,
     que quebraria quando o rosto muda de tamanho no celular. */
  .therm { margin-top: 20px; padding: 0 22px; }
  .therm-rail { position: relative; padding-top: 40px; }
  .therm-track {
    height: 12px;
    border-radius: 99px;
    background: var(--bg);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .therm-fill {
    height: 100%;
    width: 0%;
    border-radius: 99px;
    /* Frio para quente sem sair da paleta: papel apagado, ouro, sangue. */
    background: linear-gradient(90deg, var(--paper-dim), var(--gold) 38%, var(--blood) 72%, var(--blood-bright));
    transition: width 0.5s ease;
  }
  .therm-pin {
    position: absolute;
    top: 0;
    left: 0%;
    width: 40px;
    height: 40px;
    transform: translateX(-50%);
    transition: left 0.5s ease;
  }
  .therm-skull {
    display: block;
    font-size: 30px;
    line-height: 40px;
    text-align: center;
    /* Pedir a fonte de emoji do sistema é o ponto: cada aparelho desenha a
       caveira dele, e no iPhone sai a da Apple. */
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  /* Haste ligando o rosto ao tubo, para a leitura ser exata e não aproximada. */
  .therm-pin::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 100%;
    width: 1px;
    height: 10px;
    margin-left: -0.5px;
    background: var(--blood-bright);
  }
  .therm-scale {
    display: flex;
    justify-content: space-between;
    margin-top: 7px;
    font-size: 0.66rem;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  /* Sem offset calibrado o número é desconhecido, não zero: o rosto sai de cena
     e o tubo fica vazio, em vez de fingir uma leitura em 0. */
  .deaths-panel.unknown .deaths-count,
  .deaths-panel.unknown .deaths-kanji { color: var(--text-dim); }
  .deaths-panel.unknown .therm-pin { opacity: 0.28; filter: grayscale(1); }
  .deaths-panel.unknown .therm-pin::after { background: var(--line); }
  /* Estourou a escala: o pino encosta no fim e o 1000 vira "1000+". */
  .deaths-panel.over .therm-scale span:last-child { color: var(--blood-bright); }
  /* Faixa do botão de tema: colada no topo, alinhada à direita. */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 10px;
  }
  .theme-toggle {
    background: none;
    border: 0;
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: 0.9rem;
    line-height: 1;
    padding: 2px 4px;
    cursor: pointer;
    opacity: 0.4;
    transition: opacity 0.15s ease;
  }
  .theme-toggle:hover { opacity: 1; color: var(--text); }
  /* Assinatura: presente, mas sem puxar o olho para longe do progresso. */
  /* Assinatura com peso: é o nome do projeto, não uma nota de rodapé. */
  .assinatura {
    font-family: var(--font-display);
    font-size: 0.92rem;
    font-weight: 500;
    color: var(--gold);
    letter-spacing: 0.22em;
    text-transform: lowercase;
    white-space: nowrap;
  }
  .theme-toggle:hover { color: var(--text); border-color: var(--gold); }

  .overall {
    margin-bottom: 30px;
  }
  .overall-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: var(--font-display);
    margin-bottom: 8px;
  }
  .overall-row .count { font-size: 1.4rem; font-weight: 700; }
  .overall-row .label { font-size: 0.85rem; color: var(--text-dim); font-family: var(--font-body); }
  .bar-track {
    height: 6px;
    background: var(--bg-panel);
    border-radius: 0;
    overflow: hidden;
    position: relative;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blood), var(--blood-bright));
    width: 0%;
    transition: width 0.4s ease;
  }

  /* --- os quadrados 1:1 --- */
  /* São duas fileiras de dois: chefes e Headless logo abaixo do menu, e
     conquistas e tempo de jogo no fim. O teto de 320px existe porque, com só
     dois quadrados por fileira, 1fr numa tela larga faria cada um virar um
     painel de 330px de altura; centralizados e limitados eles ficam do mesmo
     tamanho em qualquer largura. No celular o teto não pega e continua sendo
     dois por linha, como antes. */
  .dois-quadrados {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(148px, 320px));
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  /* Sem moldura e sem fundo: estes dois não são placas como os de mortes e
     chefes, só precisam se parecer um com o outro. */
  .quadro {
    aspect-ratio: 1 / 1;
    border: 0;
    background: none;
    padding: 4px 6px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-width: 0;
    /* Sem isto o conteúdo mais alto que o quadrado estica a caixa e o 1:1
       vai embora: aspect-ratio cede para o conteúdo, não o contrário. */
    min-height: 0;
    overflow: hidden;
  }
  .quadro-topo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .quadro-num {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 2.1rem;
    line-height: 1;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .quadro-rot {
    font-size: 0.68rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .quadro-pe { width: 100%; }

  /* Anel de progresso: enche o quadrado, que era o problema da barra. */
  .quadro-anel { align-items: center; justify-content: center; gap: 8px; }
  /* O anel dimensiona pela ALTURA disponível, e não pela largura: assim ele
     nunca empurra o quadrado para fora do 1:1. */
  /* `align-self: center` e `width: auto` são o que faz o anel derivar a
     largura da altura. Sem eles o flex em coluna estica a caixa até a largura
     toda, o aspect-ratio puxa a altura junto, e o anel vaza do quadrado. */
  .anel {
    position: relative;
    flex: 0 1 auto;
    align-self: center;
    min-height: 0;
    height: 100%;
    width: auto;
    aspect-ratio: 1 / 1;
  }
  .anel svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  .anel circle { fill: none; stroke-width: 9; }
  /* O trilho era da cor do fundo, o que funcionava quando o quadrado tinha
     fundo próprio. Sem ele, o trilho sumia e só o arco preenchido aparecia —
     não dava para ver quanto falta. */
  .anel-trilho { stroke: var(--bg-panel); }
  .anel-fio {
    stroke: var(--blood-bright);
    stroke-linecap: butt;
    /* 2πr com r=42. O dasharray é o anel inteiro; o offset é o que falta. */
    stroke-dasharray: 263.89;
    stroke-dashoffset: 263.89;
    transition: stroke-dashoffset 0.6s ease;
  }
  .anel-meio {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px;
  }
  .anel-pct {
    font-family: var(--font-display); font-weight: 800;
    font-size: clamp(1.4rem, 5.5vw, 2.1rem);
    line-height: 1; color: var(--text); font-variant-numeric: tabular-nums;
  }
  .anel-num { font-size: 0.72rem; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .quadro-rot-centro { text-align: center; }
  /* --- tempo de jogo: o número é metal, e o metal melhora com as horas --- */
  .tempo-meio {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
  }
  .tempo-num {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(2.4rem, 11vw, 4.2rem);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    /* O brilho é um gradiente atravessando o glifo, recortado pelo texto. A
       faixa clara corre devagar, como luz passando por metal polido. */
    background-image: linear-gradient(
      100deg,
      var(--m1) 0%, var(--m2) 22%, var(--m3) 34%, #ffffff 40%,
      var(--m3) 46%, var(--m2) 60%, var(--m1) 100%);
    background-size: 320% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: polir 3.2s linear infinite;
    filter: drop-shadow(0 2px 1px rgba(0,0,0,0.75)) brightness(1.25) contrast(1.35);
  }
  @keyframes polir {
    0%   { background-position: 140% 50%; }
    100% { background-position: -40% 50%; }
  }
  /* Metais de partida; o script troca conforme as horas. */
  .quadro { --m1: #5d5952; --m2: #8d877e; --m3: #c9c3b8; }

  /* Marcos de 25 em 25 horas até 200. */
  .marcos { display: flex; gap: 2px; height: 8px; }
  .marcos i {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 1px;
  }
  .marcos i.cheio { background: var(--gold); border-color: var(--gold); }
  .marcos i.parcial { background: linear-gradient(90deg, var(--gold) var(--p), transparent var(--p)); }
  .marcos-esc {
    display: flex; justify-content: space-between;
    font-size: 0.6rem; color: var(--text-dim); margin-top: 5px;
  }

  /* Quadrado que é botão inteiro: alvo grande, nada de alvo dentro de alvo. */
  .quadro-botao { padding: 0; position: relative; }
  .quadro-abre {
    width: 100%; height: 100%;
    appearance: none; background: none; border: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
    cursor: pointer; font-family: var(--font-body);
  }
  .quadro-kanji { font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; line-height: 1; }
  .quadro-botao .quadro-num { font-size: clamp(2.2rem, 9vw, 3.4rem); }
  .quadro-botao .quadro-rot { text-align: center; }
  .quadro-botao::after {
    content: "▾";
    position: absolute; right: 8px; bottom: 6px;
    font-size: 0.7rem; color: var(--text-dim);
    transition: transform 0.2s ease;
  }
  .quadro-botao.aberto::after { transform: rotate(180deg); }

  /* --- bloco 3: mortes de chefe --- */
  /* --- sangue e terror: os dois quadrados de contagem --- */

  /* O sangue é o ponto do desenho. O resto da página é contido de propósito
     para que estes dois possam ser assim. */
  .boss-quadro {
    background: radial-gradient(120% 90% at 50% 0%, rgba(140,20,12,0.38), rgba(22,14,12,0.9) 72%);
    box-shadow: inset 0 0 26px rgba(168,50,31,0.45);
    overflow: hidden;
  }
  .boss-quadro::before {
    content: "";
    position: absolute; inset: 0;
    border: 2px solid transparent;
    border-image: linear-gradient(180deg,
      #400b07 0%, #8c1a10 18%, #d4462a 34%, #ff5b33 46%,
      #d4462a 58%, #8c1a10 78%, #400b07 100%) 1;
    animation: sangue-borda 2.6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes sangue-borda {
    0%, 100% { opacity: 0.55; filter: saturate(1) brightness(0.9); }
    50%      { opacity: 1;    filter: saturate(1.9) brightness(1.35); }
  }
  .boss-kanji { color: #ff5b33; text-shadow: 0 0 14px rgba(255,91,51,0.85), 0 0 34px rgba(168,50,31,0.6); }
  .boss-num {
    background-image: linear-gradient(180deg,
      #ffd8cc 0%, #ff6a3d 22%, #d4462a 40%, #8c1a10 62%, #4a0d08 100%);
    background-size: 100% 300%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
    animation: escorrer-forte 2.8s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(212,70,42,0.75)) drop-shadow(0 2px 2px rgba(0,0,0,0.8));
  }
  @keyframes escorrer-forte {
    0%   { background-position: 50% 0%; }
    45%  { background-position: 50% 100%; }
    100% { background-position: 50% 0%; }
  }

  /* Três gotas com tempos diferentes, para não virar um metrônomo. */
  .pingo {
    position: absolute; top: 0; width: 4px; border-radius: 0 0 60% 60%;
    background: linear-gradient(180deg, #ff5b33, #8c1a10 60%, transparent);
    opacity: 0; pointer-events: none;
  }
  .pingo.p1 { left: 22%; height: 12px; animation: gotejar 3.4s ease-in infinite; }
  .pingo.p2 { left: 51%; height: 16px; animation: gotejar 4.7s ease-in 0.8s infinite; }
  .pingo.p3 { left: 76%; height: 10px; animation: gotejar 5.9s ease-in 1.9s infinite; }
  @keyframes gotejar {
    0%       { transform: translateY(0) scaleY(0.3); opacity: 0; }
    12%      { transform: translateY(6px) scaleY(1); opacity: 1; }
    72%      { transform: translateY(78px) scaleY(1.7); opacity: 0.85; }
    100%     { transform: translateY(150px) scaleY(2.2); opacity: 0; }
  }

  /* Headless: roxo, e o medo é o tremor. A moldura pulsa fora de compasso com
     o sangue do vizinho, o que deixa os dois inquietos em vez de sincronizados. */
  .headless-quadro {
    background: radial-gradient(120% 90% at 50% 100%, rgba(78,26,120,0.42), rgba(16,12,22,0.92) 72%);
    box-shadow: inset 0 0 26px rgba(124,58,186,0.45);
    overflow: hidden;
    animation: tremor 6.1s ease-in-out infinite;
  }
  .headless-quadro::before {
    content: "";
    position: absolute; inset: 0;
    border: 2px solid transparent;
    border-image: linear-gradient(180deg,
      #1b0f2b 0%, #4e1a78 20%, #7c3aba 38%, #b06bf0 50%,
      #7c3aba 62%, #4e1a78 80%, #1b0f2b 100%) 1;
    animation: medo-borda 3.7s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes medo-borda {
    0%, 100% { opacity: 0.4;  filter: saturate(0.8) brightness(0.8); }
    38%      { opacity: 1;    filter: saturate(2) brightness(1.5); }
    52%      { opacity: 0.55; filter: saturate(1.2) brightness(1); }
  }
  /* Tremor curto e irregular: sustos, não balanço.
     O susto ficou mais violento — deslocamento cerca de quatro vezes maior,
     com giro e um empurrão de escala. O que não mudou foi a janela: ela
     continua sendo a mesma fatia do ciclo de 6,1s, de 88% a 100%. É isso que
     mantém igual o intervalo de espera entre um susto e o próximo; a
     intensidade subiu pelo tamanho e pela quantidade de solavancos dentro da
     janela, não por ela ter esticado. */
  @keyframes tremor {
    0%, 88%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
    88.7% { transform: translate(-6px, 4px)  rotate(-1.1deg) scale(1.015); }
    90%   { transform: translate(7px, -5px)  rotate(1.4deg)  scale(0.985); }
    91.2% { transform: translate(-8px, -3px) rotate(-1.6deg) scale(1.02); }
    92.4% { transform: translate(6px, 5px)   rotate(1.1deg)  scale(0.99); }
    93.6% { transform: translate(-5px, 2px)  rotate(-1.3deg) scale(1.012); }
    94.8% { transform: translate(4px, -4px)  rotate(0.9deg)  scale(0.994); }
    96%   { transform: translate(-3px, 3px)  rotate(-0.6deg) scale(1.006); }
    97.2% { transform: translate(2px, -1px)  rotate(0.4deg)  scale(1); }
    98.4% { transform: translate(-1px, 1px)  rotate(-0.2deg) scale(1); }
  }
  .headless-kanji { color: #b06bf0; text-shadow: 0 0 16px rgba(176,107,240,0.9), 0 0 38px rgba(124,58,186,0.6); }
  /* O número era roxo sobre fundo roxo: de longe sumia dentro do próprio
     bloco. Agora é luz de espírito — branco frio puxando para o azul em cima,
     resolvendo em violeta escuro embaixo. Contrasta com o fundo por
     temperatura e por brilho, continua no tema porque a raiz do gradiente e o
     halo em volta seguem roxos, e não se confunde com o vermelho do bloco de
     chefes ao lado. */
  .headless-num {
    background-image: linear-gradient(180deg,
      #f6fdff 0%, #c3ecff 20%, #86caf2 42%, #6470d8 66%, #2a1550 100%);
    background-size: 100% 300%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
    animation: escorrer-forte 4.3s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(198,236,255,0.85))
            drop-shadow(0 0 26px rgba(176,107,240,0.75))
            drop-shadow(0 2px 2px rgba(0,0,0,0.85));
  }
  .headless-quadro .pingo {
    background: linear-gradient(180deg, #b06bf0, #3d1361 60%, transparent);
  }

  /* --- menu de tópicos --- */
  /* Sem fio embaixo e sem os botões colados: o menu era uma régua de texto
     onde nada parecia clicável. Agora cada tópico é uma peça com contorno
     próprio, e o espaço entre elas faz o trabalho que a linha fazia. */
  .topics {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 26px;
  }
  .topic {
    appearance: none;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 2px;
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 10px 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .topic:hover { color: var(--text); border-color: var(--gold); }
  /* O escolhido é peça cheia, não sublinhado: de relance se vê onde se está. */
  .topic.on {
    color: var(--paper);
    background: var(--blood);
    border-color: var(--blood-bright);
  }
  .topic-n {
    margin-left: 8px;
    font-size: 0.66rem;
    letter-spacing: 0;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .topic.on .topic-n { color: var(--paper); opacity: 0.75; }

  /* A gaveta: três risquinhos, e o que não tem vaga fixa no menu mora dentro. */
  .gaveta { position: relative; }
  .gaveta-bt {
    display: inline-flex; flex-direction: column; justify-content: center;
    gap: 3px; padding: 12px 11px; min-width: 38px;
  }
  .gaveta-bt span {
    display: block; width: 14px; height: 2px;
    background: currentColor; border-radius: 1px;
    transition: transform 0.18s ease, opacity 0.18s ease;
  }
  .gaveta.aberta .gaveta-bt span:nth-child(1) { transform: translateY(5px) rotate(45deg); }
  .gaveta.aberta .gaveta-bt span:nth-child(2) { opacity: 0; }
  .gaveta.aberta .gaveta-bt span:nth-child(3) { transform: translateY(-5px) rotate(-45deg); }
  .gaveta-menu {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 20;
    min-width: 190px;
    border: 1px solid var(--line);
    background: var(--bg-panel);
    box-shadow: 0 10px 26px rgba(0,0,0,0.5);
  }
  .gaveta-item {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; gap: 12px;
    appearance: none; background: none; border: 0;
    border-bottom: 1px solid var(--line);
    padding: 12px 14px;
    font-family: var(--font-body); font-size: 0.7rem;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-dim); cursor: pointer; white-space: nowrap;
  }
  .gaveta-item:last-child { border-bottom: 0; }
  .gaveta-item:hover { color: var(--text); background: rgba(168,133,61,0.10); }
  .gaveta-item.on { color: var(--paper); background: var(--blood); }

  section.category {
    margin-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  /* `hidden` sozinho não vence a especificidade de section.category em alguns
     navegadores; explicitar evita a aba trocar e nada sumir. */
  section.category[hidden] { display: none; }
  .cat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    cursor: pointer;
    user-select: none;
    gap: 14px;
  }
  .cat-title-group { display: flex; align-items: baseline; gap: 10px; flex: 1; min-width: 0; }
  .cat-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.05rem;
    white-space: nowrap;
  }
  .cat-progress-text { font-size: 0.78rem; color: var(--text-dim); white-space: nowrap; }
  .cat-mini-bar {
    flex: 1;
    height: 3px;
    background: var(--bg-panel);
    min-width: 30px;
  }
  .cat-mini-fill {
    height: 100%;
    background: var(--gold);
    width: 0%;
    transition: width 0.4s ease;
  }
  /* Alfinete desenhado, não emoji: o emoji trazia cor e brilho que não são
     desta página, e não acompanhava o tema. Alvo de 34px porque o alvo de
     verdade no celular é o dedo, não o desenho. */
  .cat-header .pin {
    appearance: none;
    background: none;
    border: 0;
    padding: 0;
    width: 34px;
    height: 34px;
    margin: -8px -6px -8px 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    order: 1;
    color: var(--text-dim);
    opacity: 0.45;
    transition: opacity 0.15s ease, color 0.15s ease;
  }
  .cat-header .pin svg { width: 13px; height: 13px; display: block; }
  .cat-header .pin:hover { opacity: 0.9; }
  .cat-header .pin.on { opacity: 1; color: var(--gold); }
  .cat-header .chevron { order: 2; }

  .chevron {
    color: var(--text-dim);
    font-size: 0.75rem;
    transition: transform 0.25s ease;
    flex-shrink: 0;
  }
  .category.open .chevron { transform: rotate(90deg); }

  .items {
    display: none;
    padding: 0 0 18px 0;
  }
  .category.open .items { display: block; }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 9px 2px;
    border-bottom: 1px dashed var(--line);
  }
  .item:last-child { border-bottom: none; }
  .item input[type="checkbox"] {
    appearance: none;
    width: 18px;
    height: 18px;
    min-width: 18px;
    margin-top: 2px;
    border: 1px solid var(--gold);
    background: transparent;
    cursor: default;
    position: relative;
    border-radius: 2px;
  }
  .item input[type="checkbox"]:disabled { opacity: 1; }
  .item input[type="checkbox"]:checked {
    background: var(--blood-bright);
    border-color: var(--blood-bright);
  }
  .item input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 5px;
    top: 1px;
    width: 5px;
    height: 9px;
    border: solid var(--paper);
    border-width: 0 2px 2px 0;
    transform: rotate(40deg);
  }
  .item label {
    flex: 1;
    font-size: 0.92rem;
    line-height: 1.4;
    cursor: default;
  }
  .item.done label { color: var(--text-dim); text-decoration: line-through; text-decoration-color: var(--blood); }
  .item .loc { display: block; font-size: 0.72rem; color: var(--text-dim); margin-top: 1px; }
  .item .tag {
    font-size: 0.68rem;
    color: var(--gold);
    border: 1px solid var(--line);
    padding: 1px 6px;
    border-radius: 2px;
    white-space: nowrap;
    align-self: center;
  }

  /* --- sincronização com o save (mesma linguagem visual das tags) --- */
  .sync-line {
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  /* O ponto é um botão. Ele mostra 6px, mas a área de clique é 20px: num
     celular ninguém acerta um alvo de seis pixels. A margem negativa põe o
     ponto de volta exatamente onde ele estava antes de virar botão. */
  .sync-dot {
    appearance: none;
    border: 0;
    background: none;
    padding: 0;
    width: 20px;
    height: 20px;
    margin: -7px 0 -7px -6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .sync-dot::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: transform 0.15s ease;
  }
  .sync-dot:hover::before { transform: scale(1.5); }
  .sync-dot.on::before { background: var(--gold); }
  .sync-dot.off::before { background: var(--blood); }
  .sync-dot[aria-expanded="true"]::before { transform: scale(1.5); }
  .item .tag.auto { color: var(--gold); border-color: var(--gold); }

  /* --- contadores da seção de itens essenciais --- */
  .item.counter { align-items: center; }
  .count-ctl { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .count-val {
    min-width: 34px;
    text-align: right;
    font-family: var(--font-body);
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text);
  }
  .count-ctl .of { font-size: 0.72rem; color: var(--text-dim); white-space: nowrap; min-width: 26px; }
  .sub-head {
    font-size: 0.7rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 14px 2px 4px;
    border-bottom: 1px dashed var(--line);
  }
  .item .tag.pending { color: var(--text-dim); border-color: var(--line); }
  .item input[type="checkbox"].pending { border-style: dashed; opacity: .45; }
  .cat-aviso {
    font-size: 0.72rem;
    color: var(--text-dim);
    padding: 10px 2px 2px;
    line-height: 1.5;
  }

  /* --- novidades desde a última visita --- */
  .novidades {
    border: 1px solid var(--gold);
    border-radius: 3px;
    padding: 12px 14px 10px;
    margin-bottom: 26px;
  }
  .nov-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }
  .nov-titulo {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--gold);
  }
  .nov-lista { list-style: none; margin: 0; padding: 0; }
  .nov-lista li {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 0.82rem;
    padding: 4px 0;
    border-bottom: 1px dashed var(--line);
  }
  .nov-lista li:last-child { border-bottom: none; }
  .nov-lista .nov-tipo {
    font-size: 0.66rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    min-width: 74px;
    flex-shrink: 0;
  }
  .nov-lista .nov-label { flex: 1; min-width: 0; }
  .nov-lista .nov-texto { color: var(--gold); white-space: nowrap; }
  .nov-mais { font-size: 0.72rem; color: var(--text-dim); padding-top: 6px; }
  .visto-btn {
    background: none;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: var(--font-body);
    font-size: 0.7rem;
    padding: 4px 9px;
    border-radius: 2px;
    cursor: pointer;
    white-space: nowrap;
  }
  .visto-btn:hover { background: var(--gold); color: var(--ink); }
  .item .novo {
    width: 6px;
    height: 6px;
    min-width: 6px;
    border-radius: 50%;
    background: var(--gold);
    align-self: center;
  }
  .cat-novo {
    font-size: 0.66rem;
    color: var(--ink);
    background: var(--gold);
    border-radius: 8px;
    padding: 0 6px;
    white-space: nowrap;
  }

  /* Em tela estreita o título longo + a barrinha decorativa estouram a largura
     e a página passa a rolar para o lado. A contagem por seção continua. */
  @media (max-width: 460px) {
    h1 { font-size: 2.3rem; }
    .assinatura { font-size: 0.8rem; letter-spacing: 0.16em; }
    .topic { font-size: 0.64rem; padding: 11px 11px; letter-spacing: 0.06em; }
    .topics { gap: 6px; }
    .boss-card-nome { font-size: 0.85rem; }
    .deaths-panel { padding: 18px 16px 14px; }
    /* Dedo, não cursor: linha do menu e cabeçalho de seção ficam mais altos,
       e o alfinete ganha folga do chevron para não haver clique trocado. */
    .topic { font-size: 0.66rem; padding: 12px 11px 11px; letter-spacing: 0.06em; }
    .cat-header { padding: 16px 0; gap: 8px; }
    .cat-header .pin { width: 40px; height: 40px; margin: -10px -8px -10px 0; }
    .chevron { padding: 8px 0 8px 6px; }
    .dois-quadrados { gap: 10px; }
    .quadro { padding: 13px 14px; }
    .quadro-num { font-size: 1.7rem; }
    .skill { font-size: 2.1rem; }
    .boss-lista { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    .topic-n { margin-left: 5px; font-size: 0.6rem; }
    /* A rolagem lateral aqui era de quando o menu tinha onze tópicos e nenhuma
       gaveta. Com três tópicos e os três risquinhos ela só atrapalha: no
       celular o último item ficava cortado na borda e era preciso arrastar
       para descobrir que existia. Agora o menu quebra em duas colunas e cabe
       inteiro na tela, sem nada escondido fora do quadro. Duas colunas em vez
       de uma linha apertada continuam valendo se algum item for afixado. */
    .topics {
      flex-wrap: wrap;
      row-gap: 6px;
    }
    /* Só os filhos diretos: o botão da gaveta também tem a classe `topic`, e
       ele precisa continuar com os três risquinhos empilhados. */
    .topics > .topic {
      flex: 1 1 calc(50% - 6px);
      min-width: 0;
      display: flex;
      align-items: baseline;
      justify-content: center;
    }
    /* A gaveta não vira meia tela: fica do tamanho dela, encostada à direita
       da última fileira. */
    .topics .gaveta { flex: 0 0 auto; margin-left: auto; }
    .deaths-count { font-size: 2.3rem; }
    .deaths-kanji { font-size: 1.6rem; }
    /* Pino menor e recuo menor: no celular a pista é curta e o rosto grande
       comeria boa parte dela. */
    .therm { padding: 0 18px; }
    .therm-rail { padding-top: 34px; }
    .therm-pin { width: 32px; height: 32px; }
    .therm-skull { font-size: 24px; line-height: 32px; }
    .therm-scale { font-size: 0.6rem; }
    .cat-mini-bar { display: none; }
    .cat-title { white-space: normal; }
    .cat-title-group { min-width: 0; }
  }

  a, button, input { -webkit-tap-highlight-color: transparent; }
  ::selection { background: var(--blood); color: var(--paper); }
</style>
</head>
<body>
<div class="wrap">

  <!-- Faixa só para o botão de tema, no extremo topo à direita: fora do
       cabeçalho, para não disputar espaço com o título nem com a assinatura. -->
  <!-- Ponto de sync na ponta esquerda, botão de tema na direita: a faixa do
       topo passa a ser só estado e controle, e o cabeçalho fica com o título. -->
  <div class="topbar">
    <div class="sync-line" id="syncLine">
      <button class="sync-dot" id="syncDot" type="button" aria-expanded="false"></button>
      <span id="syncText" hidden>looking for the save…</span>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button" title="Switch theme" aria-label="Switch theme">◐</button>
  </div>

  <header class="top">
    <div class="top-centro">
      <h1>Sekiro<span> 進捗</span></h1>
      <div class="assinatura">oaovito game progress</div>
    </div>
  </header>

  <nav class="topics" id="topics" aria-label="Sections" hidden></nav>

  <!-- Bloco 1: as duas contagens de combate, logo abaixo do menu. São o que
       se olha primeiro, então vêm primeiro. -->
  <div class="dois-quadrados">
    <!-- Contador de chefes: mesma proporção dos outros, e abre a lista. -->
    <section class="quadro quadro-botao boss-quadro" id="bossPanel" hidden>
      <button class="quadro-abre" id="bossHead" type="button" aria-expanded="false" aria-controls="bossLista">
        <span class="quadro-kanji boss-kanji">討</span>
        <span class="quadro-num boss-num" id="bossNum">—</span>
        <span class="quadro-rot">boss kills</span>
      </button>
    </section>

    <!-- Headless: roxo, e a moldura treme. -->
    <section class="quadro quadro-botao headless-quadro" id="headlessPanel" hidden>
      <button class="quadro-abre" id="headlessHead" type="button" aria-expanded="false" aria-controls="headlessLista">
        <span class="quadro-kanji headless-kanji">首</span>
        <span class="quadro-num headless-num" id="headlessNum">—</span>
        <span class="quadro-rot">headless</span>
      </button>
    </section>
  </div>

  <!-- Fora da grade de propósito: aberta, empurra o que vem abaixo; fechada,
       devolve tudo ao lugar. Fluxo normal do documento, sem script. -->
  <div class="boss-lista" id="bossLista" hidden></div>
  <div class="boss-lista headless-lista" id="headlessLista" hidden></div>

  <!-- Bloco 2: mortes. -->
  <section class="deaths-panel" id="deaths" hidden>
    <div class="deaths-head" role="group" aria-label="Deaths">
      <span class="deaths-kanji">死</span>
      <span class="deaths-count" id="deathsCount">—</span>
    </div>

    <div class="therm" id="therm">
     <div class="therm-rail">
      <!-- A caveira é o emoji do sistema, não um desenho nosso: assim cada
           aparelho renderiza a dele, e no iPhone sai a caveira da Apple. -->
      <div class="therm-pin" id="thermPin"><span class="therm-skull" role="img" aria-label="deaths">💀</span></div>

      <div class="therm-track"><div class="therm-fill" id="thermFill"></div></div>
      <div class="therm-scale">
        <span>0</span><span>250</span><span>500</span><span>750</span><span>1000</span>
      </div>
     </div>
    </div>

    <div class="deaths-note" id="deathsNote"></div>
  </section>

  <!-- Bloco 3: progresso e tempo de jogo, lado a lado, quadrados. -->
  <div class="dois-quadrados">
    <!-- Anel em vez de barra: num quadrado 1:1 a barra fina deixava a maior
         parte do espaço vazio, e o anel ocupa o quadrado inteiro dizendo a
         mesma coisa. O número vive no meio dele. -->
    <section class="quadro quadro-anel">
      <div class="anel">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle class="anel-trilho" cx="50" cy="50" r="42"/>
          <circle class="anel-fio" id="anelFio" cx="50" cy="50" r="42"/>
        </svg>
        <div class="anel-meio">
          <span class="anel-pct" id="overallPct">—</span>
          <span class="anel-num" id="overallCount">—</span>
        </div>
      </div>
      <span class="quadro-rot quadro-rot-centro" id="overallLabel">complete</span>
    </section>

    <section class="quadro" id="quadroTempo">
      <!-- O número é a peça: grande, no meio, e com o metal do momento. A
           barra abaixo situa isso numa escala de 0 a 200 horas. -->
      <div class="tempo-meio">
        <span class="tempo-num" id="tempoNum">—</span>

</div>

<script>
// O 4º campo de cada item é a chave de sincronização: "<chave>" para memória de
// chefe, "flag:" para event flag, "tool:"/"art:" para registro de arma e
// "good:" para posse de item. Toda linha tem uma — nada aqui é marcado à mão.
// Chefes, mini-chefes e Headless saem das secoes proprias, montadas a partir
// do save: nomes, areas e drops vem do config verificado, nao daqui. O que
// sobra aqui e o que nenhuma delas cobre.
const DATA = [
  { name: "Other Encounters", items: [
    ["Great Serpent", "Sunken Valley", "", "good:greatSerpent"],
  ]},
  { name: "Prosthetic Tools", items: [
    ["Loaded Axe", "", "", "tool:loadedAxe"],
    ["Sabimaru", "", "", "tool:sabimaru"],
    ["Loaded Spear", "", "", "tool:loadedSpear"],
    ["Shinobi Firecracker", "", "", "tool:shinobiFirecracker"],
    ["Flame Vent", "", "", "tool:flameVent"],
    ["Loaded Shuriken", "", "", "tool:loadedShuriken"],
    ["Loaded Umbrella", "", "", "tool:loadedUmbrella"],
    ["Mist Raven's Feathers", "", "", "tool:mistRaven"],
    ["Lazulite Sacred Flame", "Flame Vent upgrade", "", "tool:lazuliteFlame"],
    ["Finger Whistle", "", "", "tool:fingerWhistle"],
    ["Divine Abduction", "", "", "tool:divineAbduction"],
    ["Puppeteer Ninjutsu", "", "ninjutsu", "good:puppeteerNinjutsu"],
    ["Phoenix's Lilac Umbrella", "Loaded Umbrella upgrade", "", "tool:phoenixUmbrella"],
  ]},
  { name: "Key Combat Arts", items: [
    ["Mortal Draw", "", "", "art:mortalDraw"],
    ["Ichimonji", "", "", "art:ichimonji"],
    ["Ichimonji: Double", "", "", "art:ichimonjiDouble"],
    ["Shadowrush", "", "", "art:shadowrush"],
    ["Whirlwind Slash", "", "", "art:whirlwindSlash"],
    ["One Mind", "", "", "art:oneMind"],
    ["Nightjar Slash", "", "", "art:nightjarSlash"],
    ["Empowered Mortal Draw", "", "", "art:empoweredMortalDraw"],
    ["Mikiri Counter", "", "", "art:mikiriCounter"],
    ["High Monk", "", "", "art:highMonk"],
    ["Ashina Cross", "", "", "art:ashinaCross"],
    ["Dragon Flash", "", "", "art:dragonFlash"],
    ["Praying Strikes", "", "", "art:prayingStrikes"],
    ["Floating Passage", "", "", "art:floatingPassage"],
  ]},
];

// Itens essenciais. `auto` diz de onde o valor vem no progress.json.
const ESSENTIALS = [
  { group: "Vitality and healing" },
  { key: "prayerBeads", label: "Prayer Beads", hint: "raise vitality and posture", auto: "beads", total: 40 },
  { key: "prayerNecklaces", label: "Prayer Necklaces", hint: "4 beads = 1 necklace", auto: "necklaces", total: 10 },
  { key: "gourdSeeds", label: "Gourd Seeds", hint: "raise healing charges", auto: "seeds", total: 9 },
  { key: "gourdCharges", label: "Healing Gourd charges", hint: "1 to start, +1 per seed given to Emma", auto: "charges", total: 10 },
  { group: "Prosthetic materials" },
  { key: "scrapIron", label: "Scrap Iron", hint: "common scrap", auto: "mat:scrapIron" },
  { key: "scrapMagnetite", label: "Scrap Magnetite", hint: "tier 2 scrap", auto: "mat:scrapMagnetite" },
  { key: "blackGunpowder", label: "Black Gunpowder", hint: "tier 1 gunpowder", auto: "mat:blackGunpowder" },
  { key: "yellowGunpowder", label: "Yellow Gunpowder", hint: "tier 2 gunpowder", auto: "mat:yellowGunpowder" },
  { key: "lumpOfFatWax", label: "Lump of Fat Wax", hint: "tier 2 wax", auto: "mat:lumpOfFatWax" },
  { key: "lumpOfGraveWax", label: "Lump of Grave Wax", hint: "tier 3 wax", auto: "mat:lumpOfGraveWax" },
  { key: "adamantiteScrap", label: "Adamantite Scrap", hint: "tier 3 scrap", auto: "mat:adamantiteScrap" },
  { key: "fulminatedMercury", label: "Fulminated Mercury", hint: "tier 3 gunpowder", auto: "mat:fulminatedMercury" },
  { key: "lapisLazuli", label: "Lapis Lazuli", hint: "endgame material", auto: "mat:lapisLazuli" },
];

const THEME_KEY = "sekiro-progresso-theme";
// Quando este aparelho viu as novidades pela última vez. É estado de leitura,
// por aparelho — não é progresso, que continua vindo só do save.
const VISTO_KEY = "sekiro-progresso-visto";

// Último progress.json lido. null = o servidor ainda não respondeu.
// A página inteira é um reflexo disto: não existe estado marcado à mão.
let sync = null;
const temSync = () => !!(sync && sync.ok);

let visto = null;
try { visto = localStorage.getItem(VISTO_KEY); } catch (e) { visto = null; }

// Prefixo que liga uma mudança do histórico à chave usada nas linhas do DATA.
const PREFIXO = {
  "boss": "",
  "mini-boss": "flag:",
  "headless": "headless:",
  "prayer-bead": "prayerBeadList:",
  "gourd-seed": "gourdSeedList:",
  "prosthetic": "tool:",
  "art": "art:",
  "item": "good:",
};

// Chave da linha -> item que aquele chefe larga. Vem do progress.json para
// ficar numa fonte só: a config do leitor, não duplicado aqui.
function dropMap() {
  const map = {};
  if (!temSync()) return map;
  for (const b of sync.bosses || []) if (b.drop) map[b.key] = b.drop;
  for (const m of sync.miniBosses || []) if (m.drop) map["flag:" + m.key] = m.drop;
  for (const g of sync.goodsUnlocks || []) if (g.drop) map["good:" + g.key] = g.drop;
  return map;
}

function novidades() {
  if (!temSync() || !Array.isArray(sync.history)) return [];
  if (!visto) return sync.history.slice();
  return sync.history.filter((h) => h.at > visto);
}

/** Chaves (do DATA) e rótulos (dos contadores) que mudaram e ainda não foram vistos. */
function marcasNovas() {
  const linhas = new Set();
  const contadores = new Set();
  for (const h of novidades()) {
    if (h.tipo === "counter") contadores.add(h.label);
    else if (PREFIXO[h.tipo] !== undefined) linhas.add(PREFIXO[h.tipo] + h.chave);
  }
  return { linhas, contadores };
}

function marcarVisto() {
  const lista = novidades();
  const maisNovo = lista.length ? lista[lista.length - 1].at : new Date().toISOString();
  visto = maisNovo;
  try { localStorage.setItem(VISTO_KEY, visto); } catch (e) {}
  render();
}

function slug(catIdx, itemIdx) { return "c" + catIdx + "i" + itemIdx; }

// Quais seções estão abertas. Guardado fora do DOM porque a página é
// redesenhada inteira a cada sincronização (a cada poucos segundos), e sem
// isso a seção que você abriu se fecharia sozinha na próxima atualização.
const openState = new Set();
function setOpen(section, idx) {
  const open = section.classList.toggle("open");
  if (open) openState.add(idx);
  else openState.delete(idx);
  // Com uma aba escolhida, fechar a última seção dela é fechar a aba: a página
  // volta ao menu e ao estado limpo. Deixar a seção ali, aberta-mas-vazia, não
  // seria ter fechado nada.
  //
  // "Última" é o que importa desde que um tópico passou a reunir várias
  // seções: em "Items" são seis, e recolher as contas de oração para ler o
  // resto não pode derrubar a aba inteira. Enquanto sobrar uma irmã aberta,
  // vale o acordeão de sempre.
  if (!open && abaAtual) {
    const irmas = secoesDoTopico(abaAtual);
    const sobrou = topicos.some((t) => irmas.indexOf(t.nome) >= 0 &&
      t.section !== section && t.section.classList.contains("open"));
    if (!sobrou) selecionarAba(null);
  }
}

/* ------------------------------------------------------------------- abas */

/**
 * Menu de tópicos no topo.
 *
 * Cada função de render registra a seção que acabou de montar, em vez de o
 * menu sair varrendo o DOM atrás de `.cat-title`. Isso importa por dois
 * motivos: o menu nunca lista uma seção que não foi desenhada (o que aconteceu
 * de haver, porque seção sem dado nenhum não é montada), e continua verificável
 * fora do navegador.
 */
// Sem "All": o menu passou a ser três tópicos e uma gaveta, e uma aba que
// mostra tudo de uma vez desfaz o propósito de ter separado.
const ABA_CHAVE = "sekiro-progresso-aba";
const FIX_CHAVE = "sekiro-progresso-fixadas";
// Ordem de quem vem primeiro no menu. O resto entra depois, na ordem da página.
// Um tópico do menu pode reunir várias seções. "Items" é isso: junta tudo que
// é item numa aba só, com contas, sementes e materiais no topo — que é a ordem
// em que se consulta, não a ordem em que a página monta.
const GRUPOS = {
  Bosses: ["Bosses"],
  "Mini-bosses": ["Mini-bosses"],
  Items: ["Prayer Beads", "Gourd Seeds", "Essential Items",
    "Sculptor's Idols", "Key Combat Arts", "Other Encounters"],
};
// Fora do menu principal, atrás dos três risquinhos.
const GAVETA = { "Prosthetic Tools": ["Prosthetic Tools"] };
const ORDEM_MENU = ["Bosses", "Mini-bosses", "Items"];
let topicos = [];
let abaAtual = null;
let gavetaAberta = false;
try { abaAtual = localStorage.getItem(ABA_CHAVE); } catch (e) { abaAtual = null; }

/** Quais seções aparecem no menu. Começa nas três e muda pelo alfinete. */
let fixadas = new Set(ORDEM_MENU);
try {
  const salvo = JSON.parse(localStorage.getItem(FIX_CHAVE));
  if (Array.isArray(salvo)) fixadas = new Set(salvo);
} catch (e) { /* nada salvo, ou storage bloqueado */ }

function gravarFixadas() {
  try { localStorage.setItem(FIX_CHAVE, JSON.stringify([...fixadas])); } catch (e) { /* aba anônima */ }
}

function alternarPin(nome) {
  if (fixadas.has(nome)) {
    fixadas.delete(nome);
    // A seção aberta acabou de sair do menu. Deixá-la aberta sem botão que a
    // feche seria um beco sem saída, então volta ao estado limpo.
    if (abaAtual === nome) { abaAtual = null; try { localStorage.removeItem(ABA_CHAVE); } catch (e) {} }
  } else {
    fixadas.add(nome);
  }
  gravarFixadas();
  renderTopicos();
}

/**
 * O alfinete vai no cabeçalho de cada seção.
 *
 * Posto aqui, e não nas cinco funções de render, porque todas montam o
 * cabeçalho como primeiro filho da seção — então dá para fazer uma vez só.
 * O clique precisa parar de subir: o cabeçalho inteiro abre e fecha a seção, e
 * sem isso alfinetar fecharia a seção junto.
 */
function aplicarPins() {
  for (const t of topicos) {
    const header = t.section.children[0];
    if (!header) continue;
    const fixo = fixadas.has(t.nome);
    const b = document.createElement("button");
    b.type = "button";
    b.className = "pin" + (fixo ? " on" : "");
    // Alfinete desenhado, e não o emoji: o emoji trazia cor e brilho que não
    // são desta página e não acompanhava o tema. Este herda `currentColor`.
    b.innerHTML =
      '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M6 1.8h4l-.7 4.1 2.4 2.3H4.3l2.4-2.3z"/>' +
      '<path d="M8 8.2V14"/></svg>';
    const rotulo = fixo ? "Remove from the menu" : "Add to the menu";
    b.title = rotulo;
    b.setAttribute("aria-label", rotulo);
    b.setAttribute("aria-pressed", fixo ? "true" : "false");
    b.addEventListener("click", (ev) => {
      if (ev && ev.stopPropagation) ev.stopPropagation();
      alternarPin(t.nome);
    });
    header.appendChild(b);
  }
}

function registrarTopico(nome, contagem, section) {
  topicos.push({ nome, contagem, section });
}

/** `null` fecha a aba: volta ao menu e à página limpa. */
function selecionarAba(chave) {
  abaAtual = chave;
  try {
    // Gravar o nulo daria a string "null" na próxima visita, que não casa com
    // tópico nenhum — funcionaria por acidente. Apagar é o que diz a verdade.
    if (chave === null) localStorage.removeItem(ABA_CHAVE);
    else localStorage.setItem(ABA_CHAVE, chave);
  } catch (e) { /* aba anônima */ }
  renderTopicos();
}

/** As seções que um tópico mostra. Tópico sem grupo mostra a si mesmo. */
function secoesDoTopico(nome) {
  return (GRUPOS[nome] || GAVETA[nome] || [nome]);
}

function aplicarAba() {
  const alvo = abaAtual ? secoesDoTopico(abaAtual) : [];
  for (const t of topicos) {
    const mostrar = alvo.indexOf(t.nome) >= 0;
    t.section.hidden = !mostrar;
    // A aba escolhida já vem aberta: escolher no menu e ainda ter de clicar no
    // cabeçalho para ver o conteúdo seria um passo a mais sem motivo.
    if (mostrar) {
      t.section.classList.add("open");
      openState.add(t.section.dataset.idx);
      // A ordem do grupo manda: contas, sementes e materiais antes do resto.
      t.section.style.order = alvo.indexOf(t.nome);
    }
  }
}

function renderTopicos() {
  const nav = document.getElementById("topics");
  nav.innerHTML = "";
  aplicarPins();
  if (!topicos.length) { nav.hidden = true; return; }
  nav.hidden = false;

  // A barra é os três tópicos de sempre mais o que foi alfinetado. Uma seção
  // alfinetada entra como tópico próprio: ela não pertence a nenhum dos três
  // grupos, então mostra a si mesma. Sem isto o alfinete não fazia nada — o
  // menu tinha virado uma lista fixa e o botão de alfinetar continuava lá,
  // acendendo e apagando sem efeito nenhum.
  const alfinetados = [...fixadas].filter(
    (n) => ORDEM_MENU.indexOf(n) < 0 && !GAVETA[n] && topicos.some((t) => t.nome === n));
  const BARRA = ORDEM_MENU.concat(alfinetados);

  // Estado inicial: nenhuma aba. A página abre só com o menu, e a área abaixo
  // fica vazia até alguém escolher. Aba guardada que sumiu volta para cá.
  const conhecidos = BARRA.concat(Object.keys(GAVETA));
  if (abaAtual && conhecidos.indexOf(abaAtual) < 0) abaAtual = null;

  // A contagem de um tópico é a soma das seções que ele reúne.
  const contar = (nomes) => {
    let feitos = 0, todos = 0, achou = false;
    for (const nome of nomes) {
      const t = topicos.find((x) => x.nome === nome);
      if (!t || !t.contagem) continue;
      const m = /^(\d+|—)\/(\d+)$/.exec(t.contagem);
      if (!m) continue;
      achou = true;
      if (m[1] !== "—") feitos += Number(m[1]);
      todos += Number(m[2]);
    }
    return achou ? feitos + "/" + todos : "";
  };

  const fazerBotao = (nome, classe) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = classe + (nome === abaAtual ? " on" : "");
    const c = contar(secoesDoTopico(nome));
    b.appendChild(document.createTextNode(nome));
    if (c) {
      const n = document.createElement("span");
      n.className = "topic-n";
      n.textContent = c;
      b.appendChild(n);
    }
    return b;
  };

  for (const nome of BARRA) {
    if (!secoesDoTopico(nome).some((x) => topicos.some((t) => t.nome === x))) continue;
    const b = fazerBotao(nome, "topic");
    b.addEventListener("click", () => selecionarAba(nome === abaAtual ? null : nome));
    nav.appendChild(b);
  }

  // A gaveta: o que não merece vaga fixa no menu, mas precisa existir.
  const naGaveta = Object.keys(GAVETA).filter((nome) =>
    secoesDoTopico(nome).some((x) => topicos.some((t) => t.nome === x)));
  if (naGaveta.length) {
    const wrap = document.createElement("div");
    wrap.className = "gaveta" + (gavetaAberta ? " aberta" : "");

    const bt = document.createElement("button");
    bt.type = "button";
    bt.className = "topic gaveta-bt" + (naGaveta.indexOf(abaAtual) >= 0 ? " on" : "");
    bt.title = "More sections";
    bt.setAttribute("aria-label", "More sections");
    bt.setAttribute("aria-expanded", gavetaAberta ? "true" : "false");
    for (let i = 0; i < 3; i++) bt.appendChild(document.createElement("span"));
    bt.addEventListener("click", () => { gavetaAberta = !gavetaAberta; renderTopicos(); });
    wrap.appendChild(bt);

    const menu = document.createElement("div");
    menu.className = "gaveta-menu";
    menu.hidden = !gavetaAberta;
    for (const nome of naGaveta) {
      const it = fazerBotao(nome, "gaveta-item");
      it.addEventListener("click", () => {
        gavetaAberta = false;
        selecionarAba(nome === abaAtual ? null : nome);
      });
      menu.appendChild(it);
    }
    wrap.appendChild(menu);
    nav.appendChild(wrap);
  }

  aplicarAba();
}

/* ---------------------------------------------------------- sincronização */

// Tudo que o save consegue confirmar sozinho, numa chave só:
//   "<chave>"      memória de chefe
//   "tool:<chave>" ferramenta protética
//   "art:<chave>"  arte de combate
function autoUnlockMap() {
  const map = {};
  if (!sync || !sync.ok) return map;
  for (const b of sync.bosses || []) if (b.defeated) map[b.key] = true;
  for (const t of sync.tools || []) if (t.unlocked) map["tool:" + t.key] = true;
  for (const a of sync.arts || []) if (a.unlocked) map["art:" + a.key] = true;
  for (const m of sync.miniBosses || []) if (m.defeated) map["flag:" + m.key] = true;
  for (const g of sync.goodsUnlocks || []) if (g.unlocked) map["good:" + g.key] = true;
  return map;
}

// Valor automático de um contador, ou null quando o save não sabe responder.
function autoCount(spec) {
  if (!temSync() || !sync.essentials) return null;
  const e = sync.essentials;
  // Um progress.json parcial devolveria undefined aqui, e quem consome testa
  // `=== null` — o que imprimiria "undefined" e contaminaria a soma com NaN.
  const num = (v) => (typeof v === "number" && isFinite(v) ? v : null);
  if (spec === "beads") return e.prayerBeads ? num(e.prayerBeads.collected) : null;
  if (spec === "necklaces") return e.prayerBeads ? num(e.prayerBeads.necklaces) : null;
  // A semente desaparece da bolsa quando é entregue à Emma, então `held` conta
  // as não entregues, não o progresso. `collected` vem das nove flags de coleta.
  if (spec === "seeds") return e.gourdSeeds ? num(e.gourdSeeds.collected) : null;
  if (spec === "charges") return e.gourdSeeds ? num(e.gourdSeeds.charges) : null;
  if (spec && spec.indexOf("mat:") === 0) {
    const key = spec.slice(4);
    const found = (e.materials || []).filter(function (m) { return m.key === key; })[0];
    return found ? num(found.qty) : null;
  }
  return null;
}

const MAX_NOV = 12;

function renderNovidades() {
  const root = document.getElementById("novidades");
  root.innerHTML = "";
  const lista = novidades();
  if (!lista.length) return;

  const cx = document.createElement("div");
  cx.className = "novidades";

  const head = document.createElement("div");
  head.className = "nov-head";
  const quantas = lista.length;
  head.innerHTML = '<span class="nov-titulo">' + quantas +
    (quantas === 1 ? " update" : " updates") + "</span>";
  const btn = document.createElement("button");
  btn.className = "visto-btn";
  btn.textContent = "mark as seen";
  btn.addEventListener("click", marcarVisto);
  head.appendChild(btn);
  cx.appendChild(head);

  const ul = document.createElement("ul");
  ul.className = "nov-lista";
  // Mais recentes primeiro: é o que interessa ao abrir.
  const mostrar = lista.slice().reverse().slice(0, MAX_NOV);
  for (const h of mostrar) {
    const li = document.createElement("li");
    li.innerHTML =
      '<span class="nov-tipo">' + h.tipo + "</span>" +
      '<span class="nov-label">' + h.label + "</span>" +
      '<span class="nov-texto">' + h.texto + "</span>";
    ul.appendChild(li);
  }
  cx.appendChild(ul);

  if (lista.length > MAX_NOV) {
    const mais = document.createElement("div");
    mais.className = "nov-mais";
    mais.textContent = (lista.length - MAX_NOV) + " more before these";
    cx.appendChild(mais);
  }
  root.appendChild(cx);
}

/**
 * Checklists de item colecionável: Prayer Beads e Gourd Seeds.
 *
 * Cada unidade tem flag própria no save, então a lista é nominal: não é "você
 * tem 39 de 40", é "falta esta". Faltando vem primeiro, que é o motivo de abrir
 * a lista.
 */
function renderChecklist(containerId, campo, titulo, resumoExtra) {
  const root = document.getElementById(containerId);
  root.innerHTML = "";
  const lista = temSync() && Array.isArray(sync[campo]) ? sync[campo] : null;
  if (!lista || !lista.length) return null;

  const feitos = lista.filter((x) => x.collected).length;
  const faltam = lista.filter((x) => !x.collected);
  const novas = marcasNovas();
  const novasAqui = lista.filter((x) => novas.linhas.has(campo + ":" + x.key)).length;

  const section = document.createElement("section");
  section.className = "category";
  section.dataset.idx = campo;

  const header = document.createElement("div");
  header.className = "cat-header";
  header.innerHTML = `
    <div class="cat-title-group">
      <span class="cat-title">${titulo}</span>
      <div class="cat-mini-bar"><div class="cat-mini-fill" style="width:${feitos / lista.length * 100}%"></div></div>
    </div>
    ${novasAqui ? `<span class="cat-novo">${novasAqui} new</span>` : ""}
    <span class="cat-progress-text">${feitos}/${lista.length}</span>
    <span class="chevron">▸</span>
  `;
  header.addEventListener("click", () => setOpen(section, campo));
  section.appendChild(header);

  const wrap = document.createElement("div");
  wrap.className = "items";

  const resumo = document.createElement("div");
  resumo.className = "cat-aviso";
  const porOrigem = {};
  for (const x of faltam) porOrigem[x.from] = (porOrigem[x.from] || 0) + 1;
  const partes = Object.keys(porOrigem).map((k) => porOrigem[k] + " " + k);
  resumo.textContent = faltam.length
    ? faltam.length + " missing (" + partes.join(", ") + ")."
    : "All " + lista.length + " collected.";
  if (resumoExtra) resumo.textContent += " " + resumoExtra;
  wrap.appendChild(resumo);

  const grupos = [
    { titulo: "Still missing", itens: faltam },
    { titulo: "Already collected", itens: lista.filter((x) => x.collected) },
  ];
  for (const g of grupos) {
    if (!g.itens.length) continue;
    const h = document.createElement("div");
    h.className = "sub-head";
    h.textContent = g.titulo + " (" + g.itens.length + ")";
    wrap.appendChild(h);
    for (const x of g.itens) {
      const detalhe = [x.area, x.where].filter(Boolean).join(" · ");
      const row = document.createElement("div");
      row.className = "item" + (x.collected ? " done" : "");
      row.innerHTML = `
        <input type="checkbox" ${x.collected ? "checked" : ""} disabled>
        <label>${x.label}${detalhe ? '<span class="loc">' + detalhe + "</span>" : ""}</label>
        <span class="tag auto">auto</span>
        ${novas.linhas.has(campo + ":" + x.key) ? '<span class="novo" title="new since your last visit"></span>' : ""}
      `;
      wrap.appendChild(row);
    }
  }

  section.appendChild(wrap);
  root.appendChild(section);
  registrarTopico(titulo, feitos + "/" + lista.length, section);
  return { feitos, total: lista.length };
}

/**
 * As três listas de inimigos: chefes, mini-chefes e Headless. São a mesma
 * forma — agrupadas por área, na ordem do jogo — então dividem um renderizador.
 *
 * `detected: false` significa "o save não conta isso", e não "está vivo". Nesse
 * caso a linha sai com a caixa tracejada, igual aos ídolos sem calibração: não
 * saber não é a mesma coisa que não ter feito.
 */
function renderEnemies(containerId, campo, titulo, prefixo, detalheExtra) {
  const root = document.getElementById(containerId);
  root.innerHTML = "";
  const lista = temSync() && Array.isArray(sync[campo]) ? sync[campo] : null;
  if (!lista || !lista.length) return 0;

  const rastreaveis = lista.filter((x) => x.detected !== false);
  const feitos = rastreaveis.filter((x) => x.defeated === true).length;
  const semPista = lista.length - rastreaveis.length;
  const novas = marcasNovas();
  const ehNova = (x) => novas.linhas.has(prefixo + x.key);
  const novasAqui = lista.filter(ehNova).length;

  const section = document.createElement("section");
  section.className = "category";
  section.dataset.idx = campo;

  const header = document.createElement("div");
  header.className = "cat-header";
  header.innerHTML = `
    <div class="cat-title-group">
      <span class="cat-title">${titulo}</span>
      <div class="cat-mini-bar"><div class="cat-mini-fill" style="width:${rastreaveis.length ? (feitos / rastreaveis.length * 100) : 0}%"></div></div>
    </div>
    ${novasAqui ? `<span class="cat-novo">${novasAqui} new</span>` : ""}
    <span class="cat-progress-text">${feitos}/${rastreaveis.length}</span>
    <span class="chevron">▸</span>
  `;
  header.addEventListener("click", () => setOpen(section, campo));
  section.appendChild(header);

  const wrap = document.createElement("div");
  wrap.className = "items";

  const faltam = rastreaveis.filter((x) => x.defeated !== true);
  const resumo = document.createElement("div");
  resumo.className = "cat-aviso";
  if (!faltam.length) {
    resumo.textContent = "All " + rastreaveis.length + " done.";
  } else if (faltam.length <= 6) {
    resumo.textContent = faltam.length + " left: " +
      faltam.map((x) => x.label + " (" + x.area + ")").join("; ");
  } else {
    resumo.textContent = faltam.length + " of " + rastreaveis.length + " left.";
  }
  if (semPista) {
    resumo.textContent += " " + semPista + " more " + (semPista === 1 ? "is" : "are") +
      " not recorded anywhere the save can be read from, so " +
      (semPista === 1 ? "it is" : "they are") + " left unmarked.";
  }
  wrap.appendChild(resumo);

  let areaAtual = null;
  for (const x of lista) {
    if (x.area !== areaAtual) {
      areaAtual = x.area;
      const g = document.createElement("div");
      g.className = "sub-head";
      g.textContent = areaAtual || "—";
      wrap.appendChild(g);
    }
    const rastreado = x.detected !== false;
    const marcado = rastreado && x.defeated === true;
    const detalhe = [x.drop ? "drops " + x.drop : "", detalheExtra ? detalheExtra(x) : ""]
      .filter(Boolean).join(" · ");
    const row = document.createElement("div");
    row.className = "item" + (marcado ? " done" : "");
    row.innerHTML = `
      <input type="checkbox" ${marcado ? "checked" : ""} ${rastreado ? "" : 'class="pending"'} disabled>
      <label>${x.label}${detalhe ? '<span class="loc">' + detalhe + "</span>" : ""}</label>
      ${rastreado ? '<span class="tag auto">auto</span>' : '<span class="tag pending">not tracked</span>'}
      ${ehNova(x) ? '<span class="novo" title="new since your last visit"></span>' : ""}
    `;
    wrap.appendChild(row);
  }

  section.appendChild(wrap);
  root.appendChild(section);
  registrarTopico(titulo, feitos + "/" + rastreaveis.length, section);
  return { feitos, total: rastreaveis.length };
}

/**
 * Contador de mortes no cabeçalho.
 *
 * O jogo não guarda essa conta em nenhum lugar conhecido do save, então
 * enquanto o offset não for descoberto o número é um traço, não zero — dizer
 * "0 deaths" seria afirmar algo que não sabemos.
 */
function renderDeaths() {
  const box = document.getElementById("deaths");
  const num = document.getElementById("deathsCount");
  const d = temSync() ? sync.deaths : null;

  if (!d) {                       // sem save lido ainda: não ocupar o cabeçalho
    box.hidden = true;
    return;
  }
  box.hidden = false;
  const nota = document.getElementById("deathsNote");
  const fill = document.getElementById("thermFill");
  const pin = document.getElementById("thermPin");
  const TOPO = 1000;

  if (d.known) {
    // Acima de 1000 o pino encosta no fim: a escala é essa, e esticá-la
    // silenciosamente faria as leituras anteriores mudarem de lugar.
    const pct = Math.min(d.count, TOPO) / TOPO * 100;
    box.className = "deaths-panel" + (d.count > TOPO ? " over" : "");
    num.textContent = d.count;
    fill.style.width = pct + "%";
    pin.style.left = pct + "%";
    // O jogo não guarda contagem de mortes: a busca pelo campo confirmou isso
    // na prática, depois de dez gravações. Então o número é contado por nós, e
    // o texto diz exatamente o que ele é — inclusive o que ele não pega.
    box.title =
      d.how === "counted"
        ? "Counted by watching the save since " +
          (d.desde ? new Date(d.desde).toLocaleDateString() : "tracking started") +
          ". A death only shows up when it costs Sen, and Unseen Aid cancels that loss sometimes."
        : "Read straight from the save.";
    // O painel não carrega parágrafo: é um número para ler de relance. A
    // ressalva não some do produto, muda de lugar — está no `title` acima,
    // que já diz desde quando a conta vale e o que ela não pega.
    nota.textContent =
      d.how === "discovered" && d.count > TOPO ? "Past the end of the scale." : "";
    return;
  }

  box.className = "deaths-panel unknown";
  num.textContent = "—";
  fill.style.width = "0%";
  pin.style.left = "0%";

  const p = d.progresso || {};
  if (d.how === "not-in-save") {
    nota.textContent = "The save does not record deaths.";
    box.title = p.motivo || "";
    return;
  }
  // Ainda procurando. O traço já diz que não se sabe; explicar isso em texto
  // fixo no painel só ocupava espaço. O andamento fica no title, para quem
  // quiser saber por que ainda não tem número.
  nota.textContent = "";
  box.title =
    "Sekiro has no death counter of its own, so the tracker is working out which " +
    "field it is by watching the save. " +
    (p.mortes
      ? p.mortes + " death" + (p.mortes === 1 ? "" : "s") + " seen so far" +
        (p.candidatos ? ", " + p.candidatos + " candidate fields left." : ".")
      : "Waiting for the first death.");
}

/* ------------------------------------------- tempo de jogo e maestria */

// A escala vai até 200 horas, em oito marcos de 25. O emoji é a leitura de
// relance: quanto mais tempo, mais ele insiste na ideia de domínio.
const HORAS_MAX = 200;
const MARCOS = 8;

// A escada agora é de metal, não de emote. Segue a ordem em que os materiais
// aparecem no próprio jogo — ferro, magnetita, adamantita, lazulita —, com
// bronze, prata e ouro no meio, e termina no lazulito, que é o material de fim
// de jogo. Cada degrau são três cores: sombra, corpo e brilho.
const ESCADA = [
  [0,   "scrap iron",  ["#4c4842", "#7b756c", "#b0a99e"]],
  [25,  "iron",        ["#565049", "#8a8479", "#c4bdb1"]],
  [50,  "magnetite",   ["#3f4650", "#6d7787", "#a9b3c2"]],
  [75,  "bronze",      ["#5d3a20", "#9a6533", "#d69a56"]],
  [100, "steel",       ["#4a5158", "#848d96", "#ccd4dc"]],
  [125, "silver",      ["#6a6e73", "#a9aeb4", "#eef1f4"]],
  [150, "gold",        ["#6e4f12", "#b9902f", "#f6dc8a"]],
  [175, "adamantite",  ["#2f3a3f", "#5f7a82", "#a8ccd4"]],
  [200, "lazulite",    ["#1d3a6b", "#3f6dbd", "#9fc6ff"]],
];

function degrau(horas) {
  let atual = ESCADA[0];
  for (const d of ESCADA) if (horas >= d[0]) atual = d;
  return atual;
}

function renderTempo() {
  const num = document.getElementById("tempoNum");
  const quadro = document.getElementById("quadroTempo");
  const marcos = document.getElementById("marcos");
  const t = temSync() ? sync.playtime : null;

  if (!t) {
    num.textContent = "—";
    marcos.innerHTML = "";
    quadro.title = "Playtime comes from Steam's own record. Not available right now.";
    return;
  }

  const horas = t.horas;
  num.textContent = horas >= 100 ? Math.round(horas) : horas.toFixed(1);
  const d = degrau(horas);
  // O metal do momento entra como variáveis; o gradiente do número as usa.
  quadro.style.setProperty("--m1", d[2][0]);
  quadro.style.setProperty("--m2", d[2][1]);
  quadro.style.setProperty("--m3", d[2][2]);
  document.getElementById("tempoRot").textContent = d[1];

  // Oito blocos de 25h. O bloco onde você está fica preenchido em parte, para a
  // barra andar dentro do marco em vez de saltar só ao completá-lo.
  marcos.innerHTML = "";
  for (let i = 0; i < MARCOS; i++) {
    const de = (HORAS_MAX / MARCOS) * i;
    const ate = de + HORAS_MAX / MARCOS;
    const el = document.createElement("i");
    if (horas >= ate) el.className = "cheio";
    else if (horas > de) {
      el.className = "parcial";
      el.style.setProperty("--p", ((horas - de) / (ate - de) * 100) + "%");
    }
    el.title = de + "h – " + ate + "h";
    marcos.appendChild(el);
  }

  quadro.title =
    horas.toFixed(1) + " hours — " + d[1] +
    ". From Steam's own record, so it updates when Steam syncs, not mid-session.";
}

/** Três gotas com tempos diferentes, para não virar metrônomo. */
function porGotas(quadro) {

/**
 * Os dois quadrados de contagem: chefes e Headless.
 *
 * A lista fica fora da grade, logo depois dela. Abrir e fechar é só trocar o
 * `hidden`: o fluxo do documento empurra o que vem abaixo e devolve sozinho,
 * sem medir nada nem animar altura à mão.
 */
function renderContador(cfg) {
  const painel = document.getElementById(cfg.painel);
  const num = document.getElementById(cfg.num);
  const lista = document.getElementById(cfg.lista);
  const dados = temSync() && Array.isArray(sync[cfg.campo]) ? sync[cfg.campo] : null;

  if (!dados || !dados.length) { painel.hidden = true; lista.hidden = true; return; }
  painel.hidden = false;
  num.textContent = cfg.total(dados);
  // Marca no próprio nó em vez de procurar por seletor: o desenho acontece a
  // cada leitura, e sem a marca as gotas se acumulariam a cada passagem.
  if (!painel.dataset.gotas) { porGotas(painel); painel.dataset.gotas = "1"; }

  lista.innerHTML = "";
  for (const b of dados) {
    const card = document.createElement("div");
    card.className = "boss-card" + (cfg.feito(b) ? "" : " zero");

    const n = document.createElement("span");
    n.className = "boss-card-n";
    n.textContent = cfg.marca(b);

    const slot = document.createElement("div");
    slot.className = "boss-icone";
    const kanji = document.createElement("span");
    kanji.textContent = b.emblema || cfg.emblema || "?";
    slot.appendChild(kanji);

    const nome = document.createElement("div");
    nome.className = "boss-card-nome";
    nome.textContent = b.label;

    card.appendChild(n); card.appendChild(slot); card.appendChild(nome);
    if (b.area) {
      const area = document.createElement("div");
      area.className = "boss-card-area";
      area.textContent = b.area;
      card.appendChild(area);
    }

    if (cfg.arte && typeof Image === "function") {
      const caminho = "icones/" + b.key + ".png";
      const img = new Image();
      img.addEventListener("load", () => {
        slot.innerHTML = "";
        slot.style.backgroundImage = "url(" + caminho + ")";
        slot.style.backgroundSize = (b.enquadre && b.enquadre.size) || "cover";
        slot.style.backgroundPosition = (b.enquadre && b.enquadre.pos) || "center";
        slot.style.backgroundRepeat = "no-repeat";
        slot.classList.add("com-arte");
      });
      img.src = caminho;
    }

    card.title = cfg.dica(b);
    lista.appendChild(card);
  }
  document.getElementById(cfg.botao).title = cfg.resumo(dados);
}

function ligarQuadrosAbrem() {
