<!--
  A chama do Ídolo do Escultor, em arquivo.

  A mesma que a página desenha à esquerda do número de mortes, aqui como SVG
  solto porque a lista de jogos a usa como imagem de fundo e `background-image`
  não alcança um símbolo que vive dentro do documento.

  Sem fagulhas e sem animação: no tamanho de um marcador de lista elas só
  sujariam o desenho, e quem precisa do movimento é a peça grande.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 30" width="22" height="30">
  <defs>
    <linearGradient id="c" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1d5f8a" stop-opacity="0.15"/>
      <stop offset="28%" stop-color="#2e9fd4" stop-opacity="0.75"/>
      <stop offset="62%" stop-color="#5ec8f0"/>
      <stop offset="88%" stop-color="#c8f4ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="n" cx="50%" cy="62%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#a5e9ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5ec8f0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <path fill="url(#c)" d="M11 1.2c3.4 4.3 5.2 7.6 5.2 10.4 0 3-1.5 5.2-3.4 6.3 1-2 .7-3.9-1-5.6-.6 2.6-1.9 4.2-3.9 4.9-2.4.8-4.1-.6-4.1-3.2 0-4 2.4-8.4 7.2-12.8z"/>
  <ellipse cx="10.6" cy="13.4" rx="2.6" ry="3.6" fill="url(#n)"/>
</svg>
