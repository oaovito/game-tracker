<!doctype html>
<!--
  A página que o código QR do iPhone abre, servida pelo próprio computador
  (rota /ios de serve.js): o passo a passo para instalar o aplicativo de iOS
  pelo AltStore, com a fonte do Trackeroao (altstore/fonte.json).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trackeroao</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; background: #06070a; color: #f5f6f8; }
  body {
    font: 400 16px/1.5 system-ui, -apple-system, sans-serif;
    padding: calc(28px + env(safe-area-inset-top, 0px)) 20px calc(28px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; align-items: center;
  }
  main { width: min(26rem, 100%); display: flex; flex-direction: column; gap: 18px; }
  h1 { margin: 0 0 6px; font-weight: 800; font-size: 1.7rem; letter-spacing: -0.02em; text-wrap: balance; }
  h1 span { color: #d8ff3c; }
  ol { margin: 0; padding: 0; list-style: none; counter-reset: p; display: flex; flex-direction: column; gap: 14px; }
  li {
    counter-increment: p; position: relative; padding: 16px 16px 16px 54px; border-radius: 18px;
    background: rgba(20, 22, 29, 0.9); border: 1px solid rgba(255, 255, 255, 0.1);
  }
  li::before {
    content: counter(p); position: absolute; left: 16px; top: 15px; width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center; background: #d8ff3c; color: #0c0f02; font-weight: 800; font-size: 0.85rem;
  }
  a.bt {
    display: inline-block; margin-top: 10px; padding: 10px 18px; border-radius: 999px; text-decoration: none;
    background: #d8ff3c; color: #0c0f02; font-weight: 700; font-size: 0.9rem;
  }
  a.leve { color: rgba(245, 246, 248, 0.7); font-size: 0.85rem; text-align: center; }
  a { color: #d8ff3c; }
  p { margin: 0; }
  .nota { color: rgba(245, 246, 248, 0.55); font-size: 0.85rem; }
</style>
</head>
<body>
<main>
  <h1 id="t0">Tracker<span>oao</span></h1>
  <ol>
    <li><p id="t1"></p><a class="bt" href="https://altstore.io">AltStore</a></li>
    <li><p id="t2"></p><a class="bt" id="fonte" href="#"></a></li>
    <li><p id="t4"></p></li>
  </ol>
  <a class="leve" id="direto" href="#"></a>
  <p class="nota" id="t6"></p>
</main>
<script>
var TEXTOS = {"en": ["Trackeroao for iPhone", "Install AltStore on this iPhone.", "Add the Trackeroao source to AltStore.", "Add source", "In AltStore, open Trackeroao and tap Install. Updates arrive through AltStore.", "Or install it straight away", "Open this page on the iPhone, on the same Wi-Fi as the computer."], "pt-BR": ["Trackeroao no iPhone", "Instale o AltStore neste iPhone.", "Adicione a fonte do Trackeroao ao AltStore.", "Adicionar fonte", "No AltStore, abra o Trackeroao e toque em Instalar. As atualizações chegam pelo AltStore.", "Ou instale direto", "Abra esta página no iPhone, no mesmo Wi-Fi do computador."], "es": ["Trackeroao en el iPhone", "Instala AltStore en este iPhone.", "Añade la fuente de Trackeroao a AltStore.", "Añadir fuente", "En AltStore, abre Trackeroao y toca Instalar. Las actualizaciones llegan por AltStore.", "O instálalo directamente", "Abre esta página en el iPhone, en la misma Wi-Fi que el ordenador."], "fr": ["Trackeroao sur iPhone", "Installez AltStore sur cet iPhone.", "Ajoutez la source Trackeroao à AltStore.", "Ajouter la source", "Dans AltStore, ouvrez Trackeroao et touchez Installer. Les mises à jour arrivent par AltStore.", "Ou installez-le directement", "Ouvrez cette page sur l’iPhone, sur le même Wi-Fi que l’ordinateur."], "de": ["Trackeroao auf dem iPhone", "Installiere AltStore auf diesem iPhone.", "Füge die Trackeroao-Quelle zu AltStore hinzu.", "Quelle hinzufügen", "Öffne Trackeroao in AltStore und tippe auf Installieren. Updates kommen über AltStore.", "Oder direkt installieren", "Öffne diese Seite auf dem iPhone, im selben WLAN wie der Computer."], "it": ["Trackeroao su iPhone", "Installa AltStore su questo iPhone.", "Aggiungi la sorgente di Trackeroao ad AltStore.", "Aggiungi sorgente", "In AltStore apri Trackeroao e tocca Installa. Gli aggiornamenti arrivano tramite AltStore.", "Oppure installalo subito", "Apri questa pagina sull’iPhone, sulla stessa Wi-Fi del computer."], "ru": ["Trackeroao на iPhone", "Установите AltStore на этот iPhone.", "Добавьте источник Trackeroao в AltStore.", "Добавить источник", "В AltStore откройте Trackeroao и нажмите «Установить». Обновления приходят через AltStore.", "Или установите сразу", "Откройте эту страницу на iPhone в той же сети Wi-Fi, что и компьютер."], "pl": ["Trackeroao na iPhonie", "Zainstaluj AltStore na tym iPhonie.", "Dodaj źródło Trackeroao do AltStore.", "Dodaj źródło", "W AltStore otwórz Trackeroao i stuknij Zainstaluj. Aktualizacje przychodzą przez AltStore.", "Albo zainstaluj od razu", "Otwórz tę stronę na iPhonie, w tej samej sieci Wi-Fi co komputer."], "tr": ["iPhone’da Trackeroao", "Bu iPhone’a AltStore’u yükleyin.", "Trackeroao kaynağını AltStore’a ekleyin.", "Kaynak ekle", "AltStore’da Trackeroao’yu açıp Yükle’ye dokunun. Güncellemeler AltStore üzerinden gelir.", "Ya da hemen yükleyin", "Bu sayfayı bilgisayarla aynı Wi-Fi’deki iPhone’da açın."], "ja": ["iPhone版 Trackeroao", "この iPhone に AltStore をインストールします。", "Trackeroao のソースを AltStore に追加します。", "ソースを追加", "AltStore で Trackeroao を開き、インストールをタップします。アップデートは AltStore から届きます。", "または直接インストール", "パソコンと同じ Wi-Fi の iPhone でこのページを開いてください。"], "ko": ["iPhone용 Trackeroao", "이 iPhone에 AltStore를 설치하세요.", "AltStore에 Trackeroao 소스를 추가하세요.", "소스 추가", "AltStore에서 Trackeroao를 열고 설치를 누르세요. 업데이트는 AltStore로 받습니다.", "또는 바로 설치", "컴퓨터와 같은 Wi-Fi에 연결된 iPhone에서 이 페이지를 여세요."], "zh-CN": ["iPhone 版 Trackeroao", "在这台 iPhone 上安装 AltStore。", "将 Trackeroao 源添加到 AltStore。", "添加源", "在 AltStore 中打开 Trackeroao 并点按“安装”。更新会通过 AltStore 送达。", "或直接安装", "请在与电脑连接同一 Wi-Fi 的 iPhone 上打开此页面。"]};
var FONTE = "https://raw.githubusercontent.com/oaovito/trackeroao/main/altstore/fonte.json";
var IPA = "https://github.com/oaovito/trackeroao/releases/latest/download/trackeroao.ipa";
var pedidos = (navigator.languages || [navigator.language || "en"]).map(function (l) { return String(l); });
var idioma = "en";
for (var i = 0; i < pedidos.length && idioma === "en"; i++) {
  var l = pedidos[i];
  if (TEXTOS[l]) { idioma = l; break; }
  var base = l.split("-")[0];
  if (base === "pt") { idioma = "pt-BR"; break; }
  if (base === "zh") { idioma = "zh-CN"; break; }
  if (TEXTOS[base]) { idioma = base; break; }
}
var t = TEXTOS[idioma];
document.documentElement.lang = idioma;
document.title = t[0];
document.getElementById("t0").innerHTML = t[0].replace("Trackeroao", "Tracker<span>oao</span>");
document.getElementById("t1").textContent = t[1];
document.getElementById("t2").textContent = t[2];
document.getElementById("t4").textContent = t[4];
document.getElementById("t6").textContent = t[6];
var fonte = document.getElementById("fonte");
fonte.textContent = t[3];
fonte.href = "altstore://source?url=" + encodeURIComponent(FONTE);
var direto = document.getElementById("direto");
direto.textContent = t[5];
direto.href = "altstore://install?url=" + encodeURIComponent(IPA);
</script>
</body>
</html>
