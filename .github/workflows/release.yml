# Publica a release quando um arquivo de notas novo chega a main.
#
# A regra do projeto e que todo ciclo de inovacao ou de correcao termina com
# uma release nova, carregando o instalador daquele momento -- um .exe so, que
# tambem vira o desinstalador dentro da instalacao (ver construir-exe.ps1).
# Quem baixa pelo link da release recebe o .exe, e as instalacoes existentes
# se atualizam sozinhas para a release mais nova (sync/atualizar.js); uma
# release atrasada entrega codigo velho sem aviso nenhum.
#
# O gatilho e o arquivo releases/vX.Y.Z.md aparecer na main: o nome do
# arquivo e a tag, e o resto depois da primeira linha e o corpo. O titulo e
# sempre so o nome do aplicativo e a versao ("Trackeroao 1.6.9"), e toda
# release antiga e acertada para o mesmo formato a cada execucao. A tag e criada pela propria publicacao. Release sem nota nao diz o que
# mudou, entao sem o arquivo nada sai.
#
# Publica toda versao de releases/ que ainda nao tem release, e nao so a do
# ultimo push: se uma execucao falhar, a seguinte recupera, e corrigir o texto
# de uma release que ja existe nao gera outra.
#
# O .exe nasce aqui, num runner Windows, a partir dos .ps1 desta mesma
# versao. Assim nao existe .exe esquecido de reconstruir depois de mexer no
# instalador, nem release que dependa de um Windows a mao.
#
# Toda mudanca em .ps1 passa tambem pelo parser do PowerShell, com ou sem
# release: um erro de sintaxe num script que so roda na maquina de quem instala
# nao pode ser descoberto por quem instala.

name: release

on:
  push:
    branches: [main]
    paths:
      - 'releases/v*.md'
      - 'instalador/**'
      - 'windows/**'
      - 'sync/*.ps1'
      - 'android/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A base de jogos (sync/catalogo-jogos.json.gz) e refeita antes de toda
  # release e entra no commit que a release marca: cada versao sai com a lista
  # de jogos do seu dia, e a varredura reconhece jogos sem depender da rede.
  # Quando nao ha versao pendente, nada e feito aqui.
  catalogo:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refazer a base de jogos
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pendente=""
          for f in releases/v*.md; do
            t="$(basename "$f" .md)"
            gh release view "$t" >/dev/null 2>&1 || pendente="$t"
          done
          if [ -z "$pendente" ]; then echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! node sync/gerar-catalogo.js; then
            # Sem fonte hoje: uma base de ate 15 dias ainda vale; mais velha, ou
            # nenhuma, e a regra do projeto quebrada, e a release espera.
            idade="$(node -e "const b=require('./sync/gerar-catalogo').ler();console.log(b?Math.floor((Date.now()-Date.parse(b.geradoEm))/864e5):999)")"
            if [ "$idade" -gt 15 ]; then echo "base de jogos com $idade dias e nenhuma fonte respondeu"; exit 1; fi
            echo "::warning::base de jogos mantida, com $idade dia(s)"
          fi
          if ! git diff --quiet -- sync/catalogo-jogos.json.gz || [ -n "$(git status --porcelain -- sync/catalogo-jogos.json.gz)" ]; then
            git -c user.name=oaovito -c user.email=oaovito@icloud.com add sync/catalogo-jogos.json.gz
            git -c user.name=oaovito -c user.email=oaovito@icloud.com commit -q -m "Base de jogos atualizada para $pendente"
            git push -q origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # O aplicativo de Android, construido sem Gradle pelo android/construir.sh
  # com as ferramentas do SDK que o runner ubuntu ja traz. Ele vai para dentro
  # do instalador (em <instalacao>\app), e o computador o entrega ao celular
  # pela rede de casa: a release continua tendo so o .exe.
  #
  # A chave de assinatura nasce na propria construcao e nao e guardada em
  # lugar nenhum. O aplicativo e uma casca: o que ele mostra vem sempre do
  # computador, entao ele quase nunca precisa ser trocado no celular. Quando
  # precisar, a versao nova pede para desinstalar a anterior antes.
  android:
    needs: catalogo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.catalogo.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Construir o aplicativo
        shell: bash
        run: |
          v="$(ls releases/v*.md | sed 's|.*/v||; s|\.md$||' | sort -V | tail -n 1)"
          VERSAO="$v" bash android/construir.sh
          test -s android/build/trackeroao.apk
      - uses: actions/upload-artifact@v4
        with:
          name: trackeroao-apk
          path: android/build/trackeroao.apk
          retention-days: 1

  publicar:
    needs: [catalogo, android]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.catalogo.outputs.sha }}

      - name: Os scripts do PowerShell sao validos
        shell: powershell
        run: |
          $erros = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            foreach ($x in $e) { $erros += "$($_.Name):$($x.Extent.StartLineNumber): $($x.Message)" }
          }
          if ($erros) { $erros | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host 'nenhum erro de sintaxe'

      - name: Qual versao falta publicar
        id: versao
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          faltam=""
          for f in releases/v*.md; do
            [ -e "$f" ] || continue
            t="$(basename "$f" .md)"
            gh release view "$t" >/dev/null 2>&1 || faltam="$faltam $t"
          done
          faltam="$(echo $faltam)"
          # O .exe e o desta versao do codigo. Duas versoes pendentes sairiam
          # com o mesmo executavel, e a mais antiga com o errado.
          case "$faltam" in *" "*) echo "mais de uma versao pendente: $faltam"; exit 1;; esac
          echo "tag=$faltam" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: trackeroao-apk
          path: dist\apk

      - name: Construir o executavel
        shell: powershell
        run: |
          .\instalador\construir-janela.ps1 -Saida dist\app
          Copy-Item dist\apk\trackeroao.apk dist\app\trackeroao.apk
          .\instalador\construir-exe.ps1 -Saida dist -Versao "${{ steps.versao.outputs.tag }}" -App dist\app

      # A janela do instalador, num Windows de verdade: abre, le o protocolo
      # @@ do script, termina com 0 quando ele termina bem e com 1 quando ele
      # para com erro. Roda um script de ensaio no lugar do instalador, para
      # nao instalar nada no runner.
      - name: A janela do instalador funciona
        shell: powershell
        timeout-minutes: 5
        run: |
          $bom = New-Object Text.UTF8Encoding($true)
          # O acento vem de um codigo, e nao escrito aqui, para nao depender da
          # codificacao com que o runner grava este passo.
          $fim = 'Ensaio conclu' + [char]0x00ED + 'do'
          $ok = Join-Path $env:RUNNER_TEMP 'ensaio-ok.ps1'
          $ruim = Join-Path $env:RUNNER_TEMP 'ensaio-ruim.ps1'
          [IO.File]::WriteAllText($ok, @(
            'if (-not $env:TRACKEROAO_GUI) { exit 3 }',
            '[Console]::OutputEncoding = [Text.Encoding]::UTF8',
            '[Console]::Out.WriteLine("@@PASSO 40 Baixando o Trackeroao"); Start-Sleep -Milliseconds 2500',
            'Write-Host "uma linha qualquer, que vai so para o registro"',
            '[Console]::Out.WriteLine("@@DETALHE Ele abre sozinho quando voce comecar a jogar.")',
            ('[Console]::Out.WriteLine("@@PRONTO {0}")' -f $fim)
          ) -join "`r`n", $bom)
          [IO.File]::WriteAllText($ruim, @(
            '[Console]::Out.WriteLine("@@PASSO 20 Ensaio que falha")',
            '[Console]::Out.WriteLine("@@ERRO falhou de proposito")',
            'exit 1'
          ) -join "`r`n", $bom)
          $log = Join-Path $env:TEMP 'trackeroao-instalar.log'
          $p = Start-Process dist\trackeroao-instalador.exe -ArgumentList "/ensaio=$ok", '/fechar' -Wait -PassThru
          Get-Content $log -Encoding UTF8 | ForEach-Object { Write-Host "  | $_" }
          if ($p.ExitCode -ne 0) { throw "o ensaio que termina bem saiu com $($p.ExitCode)" }
          if (-not (Select-String -Path $log -SimpleMatch "@@PRONTO $fim" -Encoding UTF8)) { throw 'o registro nao tem a linha do fim, ou o acento chegou trocado' }
          $p = Start-Process dist\trackeroao-instalador.exe -ArgumentList "/ensaio=$ruim", '/fechar' -Wait -PassThru
          if ($p.ExitCode -ne 1) { throw "o ensaio que falha saiu com $($p.ExitCode), e nao 1" }
          # Um erro que o script nao tratou tambem tem de fechar com 1 e chegar ao registro.
          $excecao = Join-Path $env:RUNNER_TEMP 'ensaio-excecao.ps1'
          [IO.File]::WriteAllText($excecao, @(
            '$ErrorActionPreference = ''Stop''',
            'Get-Item ''C:\nao-existe-trackeroao'''
          ) -join "`r`n", $bom)
          $p = Start-Process dist\trackeroao-instalador.exe -ArgumentList "/ensaio=$excecao", '/fechar' -Wait -PassThru
          if ($p.ExitCode -ne 1) { throw "o ensaio com excecao saiu com $($p.ExitCode), e nao 1" }
          if (-not (Select-String -Path $log -SimpleMatch 'nao-existe-trackeroao')) { throw 'o erro do PowerShell nao chegou ao registro' }
          # node escrevendo em stderr, com 'Stop', pela janela: sem Nativo a
          # instalacao morre (era o que parava em 84%); com Nativo ela segue.
          $nativo = [regex]::Match((Get-Content instalador\instalar.ps1 -Raw -Encoding UTF8), '(?s)function Nativo.*?\n\}').Value
          if (-not $nativo) { throw 'nao achei a funcao Nativo no instalar.ps1' }
          $semNativo = Join-Path $env:RUNNER_TEMP 'ensaio-sem-nativo.ps1'
          $comNativo = Join-Path $env:RUNNER_TEMP 'ensaio-com-nativo.ps1'
          $aviso = '& node -e "console.error(''aviso em stderr'')" 2>&1 | ForEach-Object { Write-Host "$_" }'
          [IO.File]::WriteAllText($semNativo, @(
            '$ErrorActionPreference = ''Stop''', $aviso,
            ('[Console]::Out.WriteLine("@@PRONTO {0}")' -f $fim), 'exit 0'
          ) -join "`r`n", $bom)
          [IO.File]::WriteAllText($comNativo, @(
            '$ErrorActionPreference = ''Stop''', $nativo, "Nativo { $aviso }",
            'Nativo { & node -e "console.error(''outro aviso''); process.exit(3)" }',
            'if ($LASTEXITCODE -ne 3) { exit 4 }',
            ('[Console]::Out.WriteLine("@@PRONTO {0}")' -f $fim), 'exit 0'
          ) -join "`r`n", $bom)
          $p = Start-Process dist\trackeroao-instalador.exe -ArgumentList "/ensaio=$semNativo", '/fechar' -Wait -PassThru
          Write-Host "sem Nativo: saiu com $($p.ExitCode)"
          $p = Start-Process dist\trackeroao-instalador.exe -ArgumentList "/ensaio=$comNativo", '/fechar' -Wait -PassThru
          Get-Content $log -Encoding UTF8 | ForEach-Object { Write-Host "  | $_" }
          if ($p.ExitCode -ne 0) { throw "com Nativo, o aviso em stderr ainda derruba o script (saiu com $($p.ExitCode))" }
          $v = (Get-Item dist\trackeroao-instalador.exe).VersionInfo
          Write-Host "produto: $($v.ProductName)  versao: $($v.FileVersion)  descricao: $($v.FileDescription)"
          if ($v.ProductName -ne 'Trackeroao') { throw 'o .exe saiu sem as propriedades do produto' }
          Write-Host 'a janela abriu, leu o protocolo e fechou com o codigo certo'

      - name: A instalacao completa roda num Windows limpo
        timeout-minutes: 15
        shell: powershell
        run: |
          # O instalar.ps1 de verdade, pela janela, do comeco ao fim: baixa a
          # ultima release, copia, registra o servico, o atalho e a porta, e
          # roda a suite -- num Windows sem o jogo, que e o caso em que o
          # parse.js reclama em stderr. Depois, o desinstalar.ps1 desfaz tudo.
          $log = Join-Path $env:TEMP 'trackeroao-instalar.log'
          # O servico instalado aqui nao se atualiza sozinho durante o teste: a
          # release publicada e anterior a esta versao, e a atualizacao trocaria
          # a janela em teste pela antiga no meio das verificacoes. A troca e
          # testada a parte, chamando o /so-janela direto.
          [Environment]::SetEnvironmentVariable('TRACKEROAO_SEM_ATUALIZAR', '1', 'User')
          $env:TRACKEROAO_SEM_ATUALIZAR = '1'
          # Duas vezes seguidas: a segunda e uma reinstalacao por cima, e nada
          # pode sair em dobro por causa dela.
          foreach ($vez in 1, 2) {
            $p = Start-Process dist\trackeroao-instalador.exe -ArgumentList "/ensaio=$PWD\instalador\instalar.ps1", '/fechar' -Wait -PassThru
            Get-Content $log -Encoding UTF8 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  | $_" }
            if ($p.ExitCode -ne 0) { throw "a instalacao completa ($vez) saiu com $($p.ExitCode)" }
          }
          $tarefas = @(Get-ScheduledTask | Where-Object { $_.TaskName -like 'Trackeroao*' }).Count
          $regras = @(Get-NetFirewallRule -DisplayName 'trackeroao*' -ErrorAction SilentlyContinue).Count
          $atalhos = @(Get-ChildItem ([Environment]::GetFolderPath('Desktop')) -Filter 'trackeroao*.lnk').Count
          $chaves = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { $_.PSChildName -like 'trackeroao*' }).Count
          Write-Host "depois de instalar duas vezes: $tarefas tarefa(s), $regras regra(s), $atalhos atalho(s), $chaves registro(s)"
          if ($tarefas -ne 1 -or $regras -gt 1 -or $atalhos -ne 1 -or $chaves -ne 1) { throw 'a reinstalacao duplicou alguma coisa' }
          $destino = Join-Path $env:LOCALAPPDATA 'trackeroao'
          if (-not (Test-Path (Join-Path $destino 'sync\main.js'))) { throw "nada foi instalado em $destino" }

          # O instalador baixa o codigo da ultima release publicada; o que se
          # testa daqui em diante e o deste commit, posto por cima e religado.
          Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" |
            Where-Object { $_.CommandLine -like "*$destino*" } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          Start-Sleep -Seconds 2
          Copy-Item sync\*.js, sync\*.ps1, sync\*.vbs, sync\*.json (Join-Path $destino 'sync') -Force
          Copy-Item trackeroao.html $destino -Force
          schtasks /run /tn TrackeroaoSync | Out-Null
          $vivo = $false
          for ($i = 0; $i -lt 30 -and -not $vivo; $i++) {
            Start-Sleep -Seconds 1
            try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 'http://127.0.0.1:8777/progress.json' | Out-Null; $vivo = $true } catch { }
          }
          if (-not $vivo) { throw 'o servico deste commit nao subiu' }

          # O aplicativo de Android veio no instalador e o computador o entrega.
          if (-not (Test-Path (Join-Path $destino 'app\trackeroao.apk'))) { throw 'o aplicativo de Android nao foi instalado' }
          $apk = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 'http://127.0.0.1:8777/android.apk'
          if ($apk.StatusCode -ne 200 -or $apk.RawContentLength -lt 10000) { throw 'o computador nao entrega o aplicativo de Android' }
          $bloqueado = $false
          try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 'http://127.0.0.1:8777/app/Trackeroao.exe' | Out-Null } catch { $bloqueado = $true }
          if (-not $bloqueado) { throw 'o servidor entrega a janela do Windows pela rede' }
          Write-Host 'o aplicativo de Android esta na instalacao e e entregue pela rede'

          # A janela do Trackeroao: abre e fica de pe, uma segunda abertura nao
          # cria outra, e o sinal do "Fechar" da bandeja a fecha.
          $janela = Join-Path $destino 'app\Trackeroao.exe'
          if (-not (Test-Path $janela)) { throw 'a janela nao foi instalada' }
          $lnk = Get-ChildItem ([Environment]::GetFolderPath('Desktop')) -Filter 'trackeroao*.lnk' | Select-Object -First 1
          $alvo = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk.FullName).TargetPath
          if ($alvo -ne $janela) { throw "o atalho aponta para $alvo, e nao para a janela" }
          function IconeDoAtalho { (New-Object -ComObject WScript.Shell).CreateShortcut($lnk.FullName).IconLocation }
          if ((IconeDoAtalho) -notlike '*\trackeroao\trackeroao.ico,0') { throw "o atalho usa o icone $(IconeDoAtalho)" }
          $j = Start-Process $janela -PassThru
          Start-Sleep -Seconds 12
          if ($j.HasExited) { throw "a janela fechou sozinha (codigo $($j.ExitCode))" }
          $segunda = Start-Process $janela -PassThru
          if (-not $segunda.WaitForExit(15000)) { throw 'a segunda abertura criou outra janela' }
          # A bandeja e o mesmo .exe, filho do servico (node); a janela nao.
          function Trackeroaos([switch]$Bandeja) {
            $nodes = @(Get-CimInstance Win32_Process -Filter "Name='node.exe'" | ForEach-Object { $_.ProcessId })
            @(Get-CimInstance Win32_Process -Filter "Name='Trackeroao.exe'" | Where-Object {
              $eh = ($_.CommandLine -like '*/bandeja*') -or ($nodes -contains $_.ParentProcessId)
              $eh -eq [bool]$Bandeja
            })
          }
          Get-CimInstance Win32_Process -Filter "Name='Trackeroao.exe'" | ForEach-Object { Write-Host "  processo $($_.ProcessId) (pai $($_.ParentProcessId)): $($_.CommandLine)" }
          if (@(Trackeroaos).Count -ne 1) { throw "janelas abertas: $(@(Trackeroaos).Count), e nao 1" }

          # O icone da bandeja e o proprio Trackeroao.exe, que a abertura acende
          # pelo servico, e o Windows o lista com o nome do produto.
          $tray = $null
          # Recem-instalado, o servico pode demorar a atender o pedido da janela.
          for ($i = 0; $i -lt 60 -and -not $tray; $i++) { Start-Sleep -Milliseconds 500; $tray = (Trackeroaos -Bandeja) | Select-Object -First 1 }
          if (-not $tray) {
            $log = Join-Path $destino 'sync\trackeroao.log'
            if (Test-Path $log) { Get-Content $log -Tail 40 | ForEach-Object { Write-Host "  log: $_" } }
            throw 'o icone da bandeja nao acendeu com a janela'
          }
          if (@(Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" | Where-Object { $_.CommandLine -like '*bandeja.ps1*' }).Count) { throw 'a bandeja ainda roda pelo PowerShell' }
          $desc = (Get-Item $janela).VersionInfo.FileDescription
          if ($desc -ne 'Trackeroao') { throw "o Windows listaria a bandeja como '$desc'" }
          Write-Host "bandeja: Trackeroao.exe /bandeja (pid $($tray.ProcessId)), descricao '$desc'"

          # Orcamento de recursos: com a janela aberta e parada, o Trackeroao
          # inteiro (servico, janela, bandeja e o motor da pagina) tem de
          # gastar como um aplicativo leve de uso continuo. Passar daqui e
          # regressao, e so sobe com autorizacao explicita.
          $orcCpu = 2.0; $orcRam = 400
          function ArvoreTrackeroao {
            $todos = @(Get-CimInstance Win32_Process)
            $raiz = @($todos | Where-Object { $_.Name -eq 'Trackeroao.exe' -or ($_.Name -eq 'node.exe' -and $_.CommandLine -like '*sync*main.js*') } | ForEach-Object { $_.ProcessId })
            $ids = New-Object System.Collections.Generic.HashSet[int]
            $fila = New-Object System.Collections.Generic.Queue[int]
            foreach ($r in $raiz) { if ($ids.Add([int]$r)) { $fila.Enqueue([int]$r) } }
            while ($fila.Count) {
              $p = $fila.Dequeue()
              foreach ($f in @($todos | Where-Object { $_.ParentProcessId -eq $p })) { if ($ids.Add([int]$f.ProcessId)) { $fila.Enqueue([int]$f.ProcessId) } }
            }
            @($ids)
          }
          Start-Sleep -Seconds 5
          $ids = ArvoreTrackeroao
          $antes = @{}; foreach ($i in $ids) { try { $antes[$i] = (Get-Process -Id $i).TotalProcessorTime.TotalMilliseconds } catch { } }
          $t0 = Get-Date
          Start-Sleep -Seconds 20
          $cpuMs = 0; $ram = 0
          # Memoria como a do Gerenciador de Tarefas: conjunto de trabalho privado.
          $privada = @{}
          Get-CimInstance Win32_PerfRawData_PerfProc_Process | ForEach-Object { $privada[[int]$_.IDProcess] = [long]$_.WorkingSetPrivate }
          foreach ($i in $ids) {
            try { $pr = Get-Process -Id $i } catch { continue }
            if ($antes.ContainsKey($i)) { $cpuMs += $pr.TotalProcessorTime.TotalMilliseconds - $antes[$i] }
            $p = if ($privada.ContainsKey([int]$i)) { $privada[[int]$i] } else { $pr.WorkingSet64 }
            $ram += $p
            Write-Host ("  consumo: {0} (pid {1}) {2:N0} MB privados, {3:N0} MB no conjunto inteiro" -f $pr.ProcessName, $i, ($p / 1MB), ($pr.WorkingSet64 / 1MB))
          }
          $cpu = $cpuMs / ((Get-Date) - $t0).TotalMilliseconds / [Environment]::ProcessorCount * 100
          $ramMb = $ram / 1MB
          Write-Host ("consumo com a janela aberta: CPU {0:N2}% (limite {1}%), RAM {2:N0} MB (limite {3} MB), {4} processos" -f $cpu, $orcCpu, $ramMb, $orcRam, $ids.Count)
          if ($cpu -gt $orcCpu) { throw ("CPU acima do orcamento: {0:N2}%" -f $cpu) }
          if ($ramMb -gt $orcRam) { throw ("RAM acima do orcamento: {0:N0} MB" -f $ramMb) }

          # A barra propria: sem a barra de titulo do Windows, a area do
          # aplicativo comeca no topo da janela; na faixa de cima, fora dos
          # botoes, o Windows entende barra de titulo; no X, botao do aplicativo.
          Add-Type -Namespace T -Name U -MemberDefinition @'
          [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr h, int m, IntPtr w, IntPtr l);
          [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
          [DllImport("user32.dll")] public static extern bool ClientToScreen(IntPtr h, ref POINT p);
          [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
          [StructLayout(LayoutKind.Sequential)] public struct POINT { public int X, Y; }
          '@
          $h = (Get-Process -Id $j.Id).MainWindowHandle
          if ($h -eq [IntPtr]::Zero) { throw 'a janela nao tem identificador' }
          $wr = New-Object T.U+RECT; [void][T.U]::GetWindowRect($h, [ref]$wr)
          $pt = New-Object T.U+POINT; [void][T.U]::ClientToScreen($h, [ref]$pt)
          Write-Host "janela: topo $($wr.T), area do aplicativo comeca em $($pt.Y)"
          if ([Math]::Abs($pt.Y - $wr.T) -gt 1) { throw 'a barra de titulo do Windows continua la' }
          function Toque($x, $y) { [T.U]::SendMessage($h, 0x84, [IntPtr]::Zero, [IntPtr](($y -shl 16) -bor ($x -band 0xFFFF))).ToInt32() }
          $meio = [int](($wr.L + $wr.R) / 2)
          $naBarra = Toque $meio ($wr.T + 18)
          $noX = Toque ($wr.R - 20) ($wr.T + 18)
          $naPagina = Toque $meio ($wr.T + 200)
          Write-Host "toques: barra $naBarra, X $noX, pagina $naPagina"
          if ($naBarra -ne 2) { throw "a barra propria nao arrasta a janela ($naBarra)" }
          if ($noX -ne 1) { throw "o botao de fechar nao e do aplicativo ($noX)" }
          if ($naPagina -ne 1) { throw "a pagina nao recebe o clique ($naPagina)" }
          # A troca da janela pela atualizacao, com a janela aberta: ela fecha,
          # a pasta e trocada e ela abre de novo, sem ninguem mexer em nada.
          # Um atalho de versao antiga, com o icone no .exe: a troca o acerta.
          $velho = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk.FullName)
          $velho.IconLocation = "$janela,0"; $velho.Save()
          Remove-Item (Join-Path $destino 'app\versao.txt') -ErrorAction SilentlyContinue
          # So o instalador: -Wait esperaria tambem a janela que ele reabre.
          $p = Start-Process dist\trackeroao-instalador.exe -ArgumentList '/so-janela', "/destino=$destino" -PassThru
          if (-not $p.WaitForExit(120000)) { throw 'com a janela aberta, /so-janela nao terminou' }
          if ($p.ExitCode -ne 0) { throw "com a janela aberta, /so-janela saiu com $($p.ExitCode)" }
          if (-not $j.WaitForExit(1000)) { throw 'a janela antiga continuou aberta depois da troca' }
          if (-not (Test-Path (Join-Path $destino 'app\versao.txt'))) { throw 'a troca com a janela aberta nao gravou a versao' }
          $nova = $null
          for ($i = 0; $i -lt 20 -and -not $nova; $i++) { Start-Sleep -Milliseconds 500; $nova = (Trackeroaos) | Select-Object -First 1 }
          if (-not $nova) { throw 'a janela nao abriu de novo depois da troca' }
          Start-Sleep -Seconds 8
          $j = Get-Process -Id $nova.ProcessId -ErrorAction SilentlyContinue
          if (-not $j) { throw 'a janela reaberta fechou sozinha' }
          Write-Host "troca com a janela aberta: fechou, trocou e reabriu (pid $($nova.ProcessId))"
          if ((IconeDoAtalho) -notlike '*\trackeroao\trackeroao.ico,0') { throw "a troca nao acertou o icone do atalho: $(IconeDoAtalho)" }
          Write-Host "atalho com o icone do Trackeroao: $(IconeDoAtalho)"
          [System.Threading.EventWaitHandle]$sinal = $null
          if (-not [System.Threading.EventWaitHandle]::TryOpenExisting('Local\TrackeroaoFechar', [ref]$sinal)) { throw 'a janela nao ouve o Fechar da bandeja' }
          [void]$sinal.Set()
          if (-not $j.WaitForExit(15000)) { throw 'o Fechar da bandeja nao fechou a janela' }
          Remove-Item (Join-Path $destino 'app\versao.txt') -ErrorAction SilentlyContinue
          $p = Start-Process dist\trackeroao-instalador.exe -ArgumentList '/so-janela', "/destino=$destino" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "/so-janela saiu com $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $destino 'app\versao.txt'))) { throw '/so-janela nao gravou a versao da janela' }
          if (Test-Path (Join-Path $destino 'app-novo')) { throw '/so-janela deixou a pasta temporaria' }
          if (@(Trackeroaos -Bandeja).Count) { throw 'o icone da bandeja segurou o .exe durante a troca' }
          Write-Host 'a janela abriu, e unica e fecha pelo menu da bandeja'

          # "Forcar atualizacao": recem-instalada, a versao e a ultima.
          $r = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:8777/atualizar'
          Write-Host "atualizar: instalada $($r.instalada), ultima $($r.ultima), atual $($r.atual)"
          if (-not $r.atual) { throw 'a versao recem-instalada nao foi reconhecida como a ultima' }

          # "Fechar": o servico sai e nao volta sozinho, nem pela tarefa do logon;
          # so a abertura manual (a janela) o traz de volta.
          Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:8777/encerrar' | Out-Null
          Start-Sleep -Seconds 3
          if (-not (Test-Path (Join-Path $destino 'sync\fechado.flag'))) { throw 'o Fechar nao deixou a marca' }
          function Responde { try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 'http://127.0.0.1:8777/progress.json' | Out-Null; $true } catch { $false } }
          if (Responde) { throw 'o servico continuou de pe depois do Fechar' }
          if (@(Trackeroaos -Bandeja).Count) { throw 'o icone da bandeja ficou depois do Fechar' }
          schtasks /run /tn TrackeroaoSync | Out-Null
          Start-Sleep -Seconds 10
          if (Responde) { throw 'a tarefa do logon religou o servico depois do Fechar' }
          $j = Start-Process $janela -PassThru
          $voltou = $false
          for ($i = 0; $i -lt 30 -and -not $voltou; $i++) { Start-Sleep -Seconds 1; $voltou = Responde }
          if (-not $voltou) { throw 'abrir a janela nao trouxe o servico de volta' }
          [void]$sinal.Set()
          [void]$j.WaitForExit(15000)
          Write-Host 'fechar desliga tudo, e so a abertura manual religa'
          $logD = Join-Path $env:TEMP 'trackeroao-desinstalar.log'
          $p = Start-Process dist\trackeroao-instalador.exe -ArgumentList '/desinstalar', "/ensaio=$PWD\instalador\desinstalar.ps1", "/destino=$destino", '/fechar' -Wait -PassThru
          Get-Content $logD -Encoding UTF8 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  | $_" }
          if ($p.ExitCode -ne 0) { throw "a remocao saiu com $($p.ExitCode)" }
          if (Test-Path (Join-Path $destino 'sync\main.js')) { throw "a pasta $destino continua la" }
          $sobras = @()
          if (Get-ScheduledTask -TaskName 'TrackeroaoSync' -ErrorAction SilentlyContinue) { $sobras += 'tarefa agendada' }
          if (Get-NetFirewallRule -DisplayName 'trackeroao*' -ErrorAction SilentlyContinue) { $sobras += 'regra de firewall' }
          if (Get-ChildItem ([Environment]::GetFolderPath('Desktop')) -Filter 'trackeroao*.lnk') { $sobras += 'atalho' }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\trackeroao') { $sobras += 'registro em Aplicativos instalados' }
          $temps = @(Get-ChildItem $env:TEMP -Directory -Filter 'trackeroao-*' | Where-Object { $_.Name.Length -eq 43 -or $_.Name -like '*-apagando' })
          if ($temps) { $sobras += "pastas temporarias: $($temps.Name -join ', ')" }
          if ($sobras) { throw "a remocao deixou para tras: $($sobras -join '; ')" }
          Write-Host 'instalou e desinstalou pela janela, sem erro'

      - name: Publicar
        if: steps.versao.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.versao.outputs.tag }}
        run: |
          notas="releases/${TAG}.md"
          tail -n +3 "$notas" > corpo.md
          # O instalador do Windows e o aplicativo de Android, o mesmo que o
          # computador entrega ao celular pela rede de casa.
          cp dist/app/trackeroao.apk dist/trackeroao.apk
          gh release create "$TAG" dist/trackeroao-instalador.exe dist/trackeroao.apk \
            --target "${{ needs.catalogo.outputs.sha }}" --title "Trackeroao ${TAG#v}" --notes-file corpo.md

      - name: Titulos das releases so com nome e versao
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,name --jq '.[] | [.tagName, .name] | @tsv' |
          while IFS=$'\t' read -r tag nome; do
            certo="Trackeroao ${tag#v}"
            [ "$nome" = "$certo" ] || gh release edit "$tag" --title "$certo" >/dev/null
          done
          echo 'titulos conferidos'
