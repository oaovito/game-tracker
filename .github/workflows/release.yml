# Publica a release quando um arquivo de notas novo chega a main.
#
# A regra do projeto e que todo ciclo de inovacao ou de correcao termina com
# uma release nova, carregando o instalador daquele momento -- um .exe so, que
# tambem vira o desinstalador dentro da instalacao (ver construir-exe.ps1).
# Quem baixa pelo link da release recebe o .exe, e as instalacoes existentes
# se atualizam sozinhas para a release mais nova (sync/atualizar.js); uma
# release atrasada entrega codigo velho sem aviso nenhum.
#
# O gatilho e o arquivo releases/vX.Y.Z.md aparecer na main: o nome do
# arquivo e a tag, a primeira linha e o titulo (depois do "# ") e o resto e o
# corpo. A tag e criada pela propria publicacao. Release sem nota nao diz o que
# mudou, entao sem o arquivo nada sai.
#
# Publica toda versao de releases/ que ainda nao tem release, e nao so a do
# ultimo push: se uma execucao falhar, a seguinte recupera, e corrigir o texto
# de uma release que ja existe nao gera outra.
#
# O .exe nasce aqui, num runner Windows, a partir dos .ps1 desta mesma
# versao. Assim nao existe .exe esquecido de reconstruir depois de mexer no
# instalador, nem release que dependa de um Windows a mao.
#
# Toda mudanca em .ps1 passa tambem pelo parser do PowerShell, com ou sem
# release: um erro de sintaxe num script que so roda na maquina de quem instala
# nao pode ser descoberto por quem instala.

name: release

on:
  push:
    branches: [main]
    paths:
      - 'releases/v*.md'
      - 'instalador/**'
      - 'windows/**'
      - 'sync/*.ps1'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Os scripts do PowerShell sao validos
        shell: powershell
        run: |
          $erros = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            foreach ($x in $e) { $erros += "$($_.Name):$($x.Extent.StartLineNumber): $($x.Message)" }
          }
          if ($erros) { $erros | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host 'nenhum erro de sintaxe'

      - name: Qual versao falta publicar
        id: versao
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          faltam=""
          for f in releases/v*.md; do
            [ -e "$f" ] || continue
            t="$(basename "$f" .md)"
            gh release view "$t" >/dev/null 2>&1 || faltam="$faltam $t"
          done
          faltam="$(echo $faltam)"
          # O .exe e o desta versao do codigo. Duas versoes pendentes sairiam
          # com o mesmo executavel, e a mais antiga com o errado.
          case "$faltam" in *" "*) echo "mais de uma versao pendente: $faltam"; exit 1;; esac
          echo "tag=$faltam" >> "$GITHUB_OUTPUT"

      - name: Construir o executavel
        shell: powershell
        run: |
          .\instalador\construir-janela.ps1 -Saida dist\app
          .\instalador\construir-exe.ps1 -Saida dist -Versao "${{ steps.versao.outputs.tag }}" -App dist\app

      # A janela do instalador, num Windows de verdade: abre, le o protocolo
      # @@ do script, termina com 0 quando ele termina bem e com 1 quando ele
      # para com erro. Roda um script de ensaio no lugar do instalador, para
      # nao instalar nada no runner.
      - name: A janela do instalador funciona
        shell: powershell
        timeout-minutes: 5
        run: |
          $bom = New-Object Text.UTF8Encoding($true)
          # O acento vem de um codigo, e nao escrito aqui, para nao depender da
          # codificacao com que o runner grava este passo.
          $fim = 'Ensaio conclu' + [char]0x00ED + 'do'
          $ok = Join-Path $env:RUNNER_TEMP 'ensaio-ok.ps1'
          $ruim = Join-Path $env:RUNNER_TEMP 'ensaio-ruim.ps1'
          [IO.File]::WriteAllText($ok, @(
            'if (-not $env:TRACKEROAO_GUI) { exit 3 }',
            '[Console]::OutputEncoding = [Text.Encoding]::UTF8',
            '[Console]::Out.WriteLine("@@PASSO 40 Baixando o Trackeroao"); Start-Sleep -Milliseconds 2500',
            'Write-Host "uma linha qualquer, que vai so para o registro"',
            '[Console]::Out.WriteLine("@@DETALHE Ele abre sozinho quando voce comecar a jogar.")',
            ('[Console]::Out.WriteLine("@@PRONTO {0}")' -f $fim)
          ) -join "`r`n", $bom)
          [IO.File]::WriteAllText($ruim, @(
            '[Console]::Out.WriteLine("@@PASSO 20 Ensaio que falha")',
            '[Console]::Out.WriteLine("@@ERRO falhou de proposito")',
            'exit 1'
          ) -join "`r`n", $bom)
          $log = Join-Path $env:TEMP 'trackeroao-instalar.log'
          $p = Start-Process dist\trackeroao-instalador.exe -ArgumentList "/ensaio=$ok", '/fechar' -Wait -PassThru
          Get-Content $log -Encoding UTF8 | ForEach-Object { Write-Host "  | $_" }
          if ($p.ExitCode -ne 0) { throw "o ensaio que termina bem saiu com $($p.ExitCode)" }
          if (-not (Select-String -Path $log -SimpleMatch "@@PRONTO $fim" -Encoding UTF8)) { throw 'o registro nao tem a linha do fim, ou o acento chegou trocado' }
          $p = Start-Process dist\trackeroao-instalador.exe -ArgumentList "/ensaio=$ruim", '/fechar' -Wait -PassThru
          if ($p.ExitCode -ne 1) { throw "o ensaio que falha saiu com $($p.ExitCode), e nao 1" }
          # Um erro que o script nao tratou tambem tem de fechar com 1 e chegar ao registro.
          $excecao = Join-Path $env:RUNNER_TEMP 'ensaio-excecao.ps1'
          [IO.File]::WriteAllText($excecao, @(
            '$ErrorActionPreference = ''Stop''',
            'Get-Item ''C:\nao-existe-trackeroao'''
          ) -join "`r`n", $bom)
          $p = Start-Process dist\trackeroao-instalador.exe -ArgumentList "/ensaio=$excecao", '/fechar' -Wait -PassThru
          if ($p.ExitCode -ne 1) { throw "o ensaio com excecao saiu com $($p.ExitCode), e nao 1" }
          if (-not (Select-String -Path $log -SimpleMatch 'nao-existe-trackeroao')) { throw 'o erro do PowerShell nao chegou ao registro' }
          # node escrevendo em stderr, com 'Stop', pela janela: sem Nativo a
          # instalacao morre (era o que parava em 84%); com Nativo ela segue.
          $nativo = [regex]::Match((Get-Content instalador\instalar.ps1 -Raw -Encoding UTF8), '(?s)function Nativo.*?\n\}').Value
          if (-not $nativo) { throw 'nao achei a funcao Nativo no instalar.ps1' }
          $semNativo = Join-Path $env:RUNNER_TEMP 'ensaio-sem-nativo.ps1'
          $comNativo = Join-Path $env:RUNNER_TEMP 'ensaio-com-nativo.ps1'
          $aviso = '& node -e "console.error(''aviso em stderr'')" 2>&1 | ForEach-Object { Write-Host "$_" }'
          [IO.File]::WriteAllText($semNativo, @(
            '$ErrorActionPreference = ''Stop''', $aviso,
            ('[Console]::Out.WriteLine("@@PRONTO {0}")' -f $fim), 'exit 0'
          ) -join "`r`n", $bom)
          [IO.File]::WriteAllText($comNativo, @(
            '$ErrorActionPreference = ''Stop''', $nativo, "Nativo { $aviso }",
            'Nativo { & node -e "console.error(''outro aviso''); process.exit(3)" }',
            'if ($LASTEXITCODE -ne 3) { exit 4 }',
            ('[Console]::Out.WriteLine("@@PRONTO {0}")' -f $fim), 'exit 0'
          ) -join "`r`n", $bom)
          $p = Start-Process dist\trackeroao-instalador.exe -ArgumentList "/ensaio=$semNativo", '/fechar' -Wait -PassThru
          Write-Host "sem Nativo: saiu com $($p.ExitCode)"
          $p = Start-Process dist\trackeroao-instalador.exe -ArgumentList "/ensaio=$comNativo", '/fechar' -Wait -PassThru
          Get-Content $log -Encoding UTF8 | ForEach-Object { Write-Host "  | $_" }
          if ($p.ExitCode -ne 0) { throw "com Nativo, o aviso em stderr ainda derruba o script (saiu com $($p.ExitCode))" }
          $v = (Get-Item dist\trackeroao-instalador.exe).VersionInfo
          Write-Host "produto: $($v.ProductName)  versao: $($v.FileVersion)  descricao: $($v.FileDescription)"
          if ($v.ProductName -ne 'Trackeroao') { throw 'o .exe saiu sem as propriedades do produto' }
          Write-Host 'a janela abriu, leu o protocolo e fechou com o codigo certo'

      - name: A instalacao completa roda num Windows limpo
        timeout-minutes: 15
        shell: powershell
        run: |
          # O instalar.ps1 de verdade, pela janela, do comeco ao fim: baixa a
          # ultima release, copia, registra o servico, o atalho e a porta, e
          # roda a suite -- num Windows sem o jogo, que e o caso em que o
          # parse.js reclama em stderr. Depois, o desinstalar.ps1 desfaz tudo.
          $log = Join-Path $env:TEMP 'trackeroao-instalar.log'
          # Duas vezes seguidas: a segunda e uma reinstalacao por cima, e nada
          # pode sair em dobro por causa dela.
          foreach ($vez in 1, 2) {
            $p = Start-Process dist\trackeroao-instalador.exe -ArgumentList "/ensaio=$PWD\instalador\instalar.ps1", '/fechar' -Wait -PassThru
            Get-Content $log -Encoding UTF8 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  | $_" }
            if ($p.ExitCode -ne 0) { throw "a instalacao completa ($vez) saiu com $($p.ExitCode)" }
          }
          $tarefas = @(Get-ScheduledTask | Where-Object { $_.TaskName -like 'Trackeroao*' }).Count
          $regras = @(Get-NetFirewallRule -DisplayName 'trackeroao*' -ErrorAction SilentlyContinue).Count
          $atalhos = @(Get-ChildItem ([Environment]::GetFolderPath('Desktop')) -Filter 'trackeroao*.lnk').Count
          $chaves = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { $_.PSChildName -like 'trackeroao*' }).Count
          Write-Host "depois de instalar duas vezes: $tarefas tarefa(s), $regras regra(s), $atalhos atalho(s), $chaves registro(s)"
          if ($tarefas -ne 1 -or $regras -gt 1 -or $atalhos -ne 1 -or $chaves -ne 1) { throw 'a reinstalacao duplicou alguma coisa' }
          $destino = Join-Path $env:LOCALAPPDATA 'trackeroao'
          if (-not (Test-Path (Join-Path $destino 'sync\main.js'))) { throw "nada foi instalado em $destino" }

          # O instalador baixa o codigo da ultima release publicada; o que se
          # testa daqui em diante e o deste commit, posto por cima e religado.
          Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" |
            Where-Object { $_.CommandLine -like "*$destino*" } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          Start-Sleep -Seconds 2
          Copy-Item sync\*.js, sync\*.ps1, sync\*.vbs, sync\*.json (Join-Path $destino 'sync') -Force
          Copy-Item trackeroao.html $destino -Force
          schtasks /run /tn TrackeroaoSync | Out-Null
          $vivo = $false
          for ($i = 0; $i -lt 30 -and -not $vivo; $i++) {
            Start-Sleep -Seconds 1
            try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 'http://127.0.0.1:8777/progress.json' | Out-Null; $vivo = $true } catch { }
          }
          if (-not $vivo) { throw 'o servico deste commit nao subiu' }

          # A janela do Trackeroao: abre e fica de pe, uma segunda abertura nao
          # cria outra, e o sinal do "Fechar" da bandeja a fecha.
          $janela = Join-Path $destino 'app\Trackeroao.exe'
          if (-not (Test-Path $janela)) { throw 'a janela nao foi instalada' }
          $lnk = Get-ChildItem ([Environment]::GetFolderPath('Desktop')) -Filter 'trackeroao*.lnk' | Select-Object -First 1
          $alvo = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk.FullName).TargetPath
          if ($alvo -ne $janela) { throw "o atalho aponta para $alvo, e nao para a janela" }
          $j = Start-Process $janela -PassThru
          Start-Sleep -Seconds 12
          if ($j.HasExited) { throw "a janela fechou sozinha (codigo $($j.ExitCode))" }
          $segunda = Start-Process $janela -PassThru
          if (-not $segunda.WaitForExit(15000)) { throw 'a segunda abertura criou outra janela' }
          if (@(Get-Process -Name Trackeroao -ErrorAction SilentlyContinue).Count -ne 1) { throw 'mais de uma janela aberta' }
          # A troca da janela pela atualizacao nao mexe numa janela aberta.
          $p = Start-Process dist\trackeroao-instalador.exe -ArgumentList '/so-janela', "/destino=$destino" -Wait -PassThru
          if ($p.ExitCode -ne 3) { throw "com a janela aberta, /so-janela saiu com $($p.ExitCode), e nao 3" }
          [System.Threading.EventWaitHandle]$sinal = $null
          if (-not [System.Threading.EventWaitHandle]::TryOpenExisting('Local\TrackeroaoFechar', [ref]$sinal)) { throw 'a janela nao ouve o Fechar da bandeja' }
          [void]$sinal.Set()
          if (-not $j.WaitForExit(15000)) { throw 'o Fechar da bandeja nao fechou a janela' }
          Remove-Item (Join-Path $destino 'app\versao.txt') -ErrorAction SilentlyContinue
          $p = Start-Process dist\trackeroao-instalador.exe -ArgumentList '/so-janela', "/destino=$destino" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "/so-janela saiu com $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $destino 'app\versao.txt'))) { throw '/so-janela nao gravou a versao da janela' }
          if (Test-Path (Join-Path $destino 'app-novo')) { throw '/so-janela deixou a pasta temporaria' }
          Write-Host 'a janela abriu, e unica e fecha pelo menu da bandeja'

          # "Forcar atualizacao": recem-instalada, a versao e a ultima.
          $r = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:8777/atualizar'
          Write-Host "atualizar: instalada $($r.instalada), ultima $($r.ultima), atual $($r.atual)"
          if (-not $r.atual) { throw 'a versao recem-instalada nao foi reconhecida como a ultima' }

          # "Fechar": o servico sai e nao volta sozinho, nem pela tarefa do logon;
          # so a abertura manual (a janela) o traz de volta.
          Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:8777/encerrar' | Out-Null
          Start-Sleep -Seconds 3
          if (-not (Test-Path (Join-Path $destino 'sync\fechado.flag'))) { throw 'o Fechar nao deixou a marca' }
          function Responde { try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 'http://127.0.0.1:8777/progress.json' | Out-Null; $true } catch { $false } }
          if (Responde) { throw 'o servico continuou de pe depois do Fechar' }
          schtasks /run /tn TrackeroaoSync | Out-Null
          Start-Sleep -Seconds 10
          if (Responde) { throw 'a tarefa do logon religou o servico depois do Fechar' }
          $j = Start-Process $janela -PassThru
          $voltou = $false
          for ($i = 0; $i -lt 30 -and -not $voltou; $i++) { Start-Sleep -Seconds 1; $voltou = Responde }
          if (-not $voltou) { throw 'abrir a janela nao trouxe o servico de volta' }
          [void]$sinal.Set()
          [void]$j.WaitForExit(15000)
          Write-Host 'fechar desliga tudo, e so a abertura manual religa'
          $logD = Join-Path $env:TEMP 'trackeroao-desinstalar.log'
          $p = Start-Process dist\trackeroao-instalador.exe -ArgumentList '/desinstalar', "/ensaio=$PWD\instalador\desinstalar.ps1", "/destino=$destino", '/fechar' -Wait -PassThru
          Get-Content $logD -Encoding UTF8 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  | $_" }
          if ($p.ExitCode -ne 0) { throw "a remocao saiu com $($p.ExitCode)" }
          if (Test-Path (Join-Path $destino 'sync\main.js')) { throw "a pasta $destino continua la" }
          $sobras = @()
          if (Get-ScheduledTask -TaskName 'TrackeroaoSync' -ErrorAction SilentlyContinue) { $sobras += 'tarefa agendada' }
          if (Get-NetFirewallRule -DisplayName 'trackeroao*' -ErrorAction SilentlyContinue) { $sobras += 'regra de firewall' }
          if (Get-ChildItem ([Environment]::GetFolderPath('Desktop')) -Filter 'trackeroao*.lnk') { $sobras += 'atalho' }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\trackeroao') { $sobras += 'registro em Aplicativos instalados' }
          $temps = @(Get-ChildItem $env:TEMP -Directory -Filter 'trackeroao-*' | Where-Object { $_.Name.Length -eq 43 -or $_.Name -like '*-apagando' })
          if ($temps) { $sobras += "pastas temporarias: $($temps.Name -join ', ')" }
          if ($sobras) { throw "a remocao deixou para tras: $($sobras -join '; ')" }
          Write-Host 'instalou e desinstalou pela janela, sem erro'

      - name: Publicar
        if: steps.versao.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.versao.outputs.tag }}
        run: |
          notas="releases/${TAG}.md"
          titulo="$(head -n 1 "$notas" | sed 's/^# //')"
          tail -n +3 "$notas" > corpo.md
          gh release create "$TAG" dist/trackeroao-instalador.exe \
            --target "$GITHUB_SHA" --title "$titulo" --notes-file corpo.md
