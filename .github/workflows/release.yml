# Publica a release quando um arquivo de notas novo chega a main.
#
# A regra do projeto e que todo ciclo de inovacao ou de correcao termina com
# uma release nova, carregando o instalador daquele momento. Quem baixa pelo
# link da release recebe o .exe; uma release atrasada entrega um instalador
# velho sem aviso nenhum.
#
# O gatilho e o arquivo releases/vX.Y.Z.md aparecer na main: o nome do
# arquivo e a tag, a primeira linha e o titulo (depois do "# ") e o resto e o
# corpo. A tag e criada pela propria publicacao. Release sem nota nao diz o que
# mudou, entao sem o arquivo nada sai.
#
# Publica toda versao de releases/ que ainda nao tem release, e nao so a do
# ultimo push: se uma execucao falhar, a seguinte recupera, e corrigir o texto
# de uma release que ja existe nao gera outra.
#
# Antes de publicar, confere que o .exe foi gerado do instalar.ps1 desta
# mesma tag. O .exe so e reconstruido no Windows (construir-exe.ps1), entao
# esquecer de reconstrui-lo depois de mexer no instalador e o erro provavel.

name: release

on:
  push:
    branches: [main]
    paths: ['releases/v*.md', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Qual versao falta publicar
        id: versao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          faltam=""
          for f in releases/v*.md; do
            [ -e "$f" ] || continue
            t="$(basename "$f" .md)"
            gh release view "$t" >/dev/null 2>&1 || faltam="$faltam $t"
          done
          faltam="$(echo $faltam)"
          # O .exe e um so, o da main de agora. Duas versoes pendentes levariam
          # o mesmo instalador, e a mais antiga sairia com o .exe errado.
          case "$faltam" in *" "*) echo "mais de uma versao pendente: $faltam"; exit 1;; esac
          echo "tag=$faltam" >> "$GITHUB_OUTPUT"

      - name: O .exe carrega o instalar.ps1 atual
        if: steps.versao.outputs.tag != ''
        run: |
          python3 - <<'PY'
          import re, base64, sys
          exe = open('trackeroao-instalador.exe', 'rb').read()
          fonte = open('instalar.ps1', 'rb').read().decode('utf-8-sig').replace('\r\n', '\n')
          blocos = [x for off in (0, 1) for x in re.findall(r'[A-Za-z0-9+/=]{2000,}', exe[off:].decode('utf-16le', 'ignore'))]
          if not blocos:
              sys.exit('nao achei o instalar.ps1 embutido no .exe')
          embutido = base64.b64decode(blocos[0] + '=' * (-len(blocos[0]) % 4)).decode('utf-8').replace('\r\n', '\n')
          # O construir-exe.ps1 le o instalar.ps1 sem BOM como ANSI no PowerShell 5.1,
          # entao o acento pode chegar trocado. Desfazer a troca e comparar tambem.
          candidatos = [embutido]
          try:
              candidatos.append(embutido.encode('cp1252').decode('utf-8'))
          except (UnicodeEncodeError, UnicodeDecodeError):
              pass
          if fonte not in candidatos:
              sys.exit('o .exe foi gerado de outro instalar.ps1: rode construir-exe.ps1 e faca commit do .exe')
          print('o .exe carrega o instalar.ps1 atual')
          PY

      - name: Publicar
        if: steps.versao.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.versao.outputs.tag }}
        run: |
          notas="releases/${TAG}.md"
          titulo="$(head -n 1 "$notas" | sed 's/^# //')"
          tail -n +3 "$notas" > corpo.md
          gh release create "$TAG" trackeroao-instalador.exe \
            --target "$GITHUB_SHA" --title "$titulo" --notes-file corpo.md
