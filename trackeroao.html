<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>trackeroao</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16130f;
    --ink-soft: #23201a;
    --paper: #ece4d3;
    --paper-dim: #cfc4ab;
    --blood: #7a1f1f;
    --blood-bright: #a8321f;
    --gold: #a8853d;
    --line: rgba(236,228,211,0.14);
    --font-display: 'Shippori Mincho', serif;
    --font-body: 'Zen Kaku Gothic New', sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) {
    --bg: var(--ink);
    --bg-panel: var(--ink-soft);
    --text: var(--paper);
    --text-dim: var(--paper-dim);
  }
  /* Não há regra seguindo prefers-color-scheme de propósito: o site é escuro
     por padrão, e só fica claro se a pessoa pedir. Sem isto, quem usa o sistema
     no claro abriria no claro. */
  :root[data-theme="light"] {
    --bg: #ece4d3;
    --bg-panel: #ddd2b8;
    --text: #201a12;
    --text-dim: #4a3f2d;
    --line: rgba(32,26,18,0.14);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    /* `transparent` numa parada de gradiente é preto transparente, e a
       interpolação até ele deixa uma faixa cinza visível no meio. Terminar na
       mesma cor com alfa zero resolve, e o fixed evita emenda ao rolar. */
    background-image:
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(122,31,31,0.20), rgba(122,31,31,0) 70%);
    background-repeat: no-repeat;
    background-attachment: fixed;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 20px 80px; }

  header.top {
    border-bottom: 1px solid var(--line);
    padding-bottom: 22px;
    margin-bottom: 24px;
  }
  /* Tudo do cabeçalho numa coluna centrada: o título manda, e o que vem
     depois é subordinado a ele em vez de disputar a linha. */
  .top-centro { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  /*
   * O título, na tipografia do logo do jogo.
   *
   * O logo do Sekiro é feito sobre a Athelas — serifada de transição, com
   * serifas em cunha e estrutura clássica. Athelas é comercial (vem no macOS,
   * licenciada da TypeTogether), então não dá para servir num site. A Libre
   * Baskerville é a substituta livre apontada para ela, e a escolha não é
   * aproximação cega: a Athelas nasceu inspirada na impressão fina de livros
   * britânicos, que é a tradição de onde a Baskerville vem. Mesma família de
   * intenção, mesma cor de página.
   *
   * O resto é o arranjo do logo, que é metade do reconhecimento: caixa alta e
   * entreletra larga. Sem isso, a mesma fonte em caixa mista leria como um
   * livro, não como o jogo.
   *
   * O 進捗 fica de fora: a Baskerville não tem kanji, e esticar o espaçamento
   * de um par de ideogramas os quebraria. Ele continua na Mincho.
   */
  h1 {
    font-family: "Libre Baskerville", var(--font-display);
    font-weight: 700;
    font-size: 2.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    /* A entreletra larga põe espaço depois da última letra também, e isso
       desloca o conjunto para a esquerda do centro. */
    text-indent: 0.15em;
    margin: 0;
    line-height: 1.12;
    text-align: center;
  }
  h1 span {
    color: var(--blood-bright);
    font-family: var(--font-display);
    font-weight: 800;
    text-transform: none;
    letter-spacing: 0.02em;
  }

  /* Discreto mas legível: o mesmo tom apagado das outras notas, com um fio
     acima para separar. Não usa opacidade baixa, que some no tema claro. */
  .made-by {
    margin-top: 44px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.14em;
    text-transform: lowercase;
  }

  /* --- contador de mortes: campo próprio, abaixo do cabeçalho --- */
  /* Moldura de placa: fio externo, um segundo fio dourado por dentro e quatro
     cantoneiras. É o vocabulário de moldura do jogo — canto sempre reforçado,
     nunca arredondado — feito com a paleta que a página já tem, sem cor nova.
     Cantos retos de propósito: o raio de 3px amolecia a peça. */
  /* --- luto ---
   *
   * O bloco de mortes deixou de ser uma placa dourada com sangue e passou a
   * ser um velório. Isso separa os dois contadores: o de chefes é violência,
   * e sangra; este é a conta de quem morreu, e guarda luto.
   *
   * A moldura é o 鯨幕 (kujira-maku), a cortina de listras pretas e brancas
   * alternadas que se arma em velório japonês — chamada assim porque a baleia
   * é preta e branca. Ela vem faixa a faixa no topo e na base, não como borda
   * inteira, que é como a cortina se pendura de verdade.
   *
   * O branco não é escolha de contraste: até antes da era Shōwa o luto no
   * Japão era branco, e o preto só entra depois, por influência ocidental. O
   * Sekiro se passa muito antes disso, então o branco é a cor certa para o
   * período, e o dourado sai porque ouro é celebração.
   */
  .deaths-panel {
    position: relative;
    border: 1px solid rgba(214, 210, 200, 0.16);
    /* Sala de velório: uma luz só, vinda de cima, e o resto caindo no escuro.
       O fundo é mais fundo que o dos outros blocos de propósito — é o que dá
       peso sem precisar de mais desenho na borda. */
    background:
      radial-gradient(90% 62% at 50% 0%, rgba(236, 232, 222, 0.085), rgba(236,232,222,0) 68%),
      radial-gradient(140% 120% at 50% 42%, rgba(10, 10, 12, 0.35), rgba(4, 4, 5, 0.86) 88%),
      var(--bg-panel);
    border-radius: 0;
    padding: 40px 22px 20px;
    margin-bottom: 26px;
    overflow: hidden;
  }
  .deaths-panel::before,
  .deaths-panel::after {
    content: "";
    position: absolute;
    pointer-events: none;
  }
  /* A cortina: listras de 26px, brancas e pretas, no alto e no pé do bloco.
     A de baixo é mais apagada, como pano no escuro longe da vela. */
  /*
   * A cortina, refeita.
   *
   * A primeira tentativa era uma fita de 10px de listras alternadas, no topo e
   * no pé — e lia como faixa de pedestre, não como luto. O erro foi de
   * proporção: o 鯨幕 é pano PENDURADO, alto, que cai do alto da parede; uma
   * tira fina com listras de mesma largura é exatamente o desenho de uma
   * travessia de rua.
   *
   * Agora é tecido: alto o bastante para ter queda, com painéis verticais
   * separados por sombra, uma faixa de luz no alto onde o pano é esticado, e
   * a barra inferior escurecendo como pano que some na penumbra. O branco
   * também saiu do puro: linho envelhecido, não tinta.
   */
  .deaths-panel::before {
    left: 0; right: 0; top: 0;
    height: 30px;
    background:
      /* o pano perde luz para baixo, como cortina pendurada */
      linear-gradient(180deg,
        rgba(255,255,255,0.10) 0 2px,
        rgba(0,0,0,0) 22%,
        rgba(0,0,0,0.5) 80%,
        rgba(0,0,0,0.8) 100%),
      /* As listras com as bordas dissolvidas, e não em degrau. O degrau é o
         que fazia ler como tecla de piano: contraste duro em aresta reta é
         desenho gráfico, não pano. Aqui cada painel nasce e morre em
         gradiente, como vinco de tecido pega a luz. */
      repeating-linear-gradient(90deg,
        #b8b3a6 0 14px,
        #2a2825 20px 24px,
        #0e0d0f 30px 38px,
        #2a2825 44px 48px,
        #b8b3a6 54px 54px);
    opacity: 0.22;
    /* Barra desfiada embaixo: a cortina termina em franja, não em corte reto.
       O corte reto era metade do efeito de fita. */
    mask-image:
      repeating-radial-gradient(circle at 50% 0, #000 0 9px, rgba(0,0,0,0.25) 11px 13px),
      linear-gradient(180deg, #000 0 55%, rgba(0,0,0,0.3) 85%, transparent);
    -webkit-mask-image:
      repeating-radial-gradient(circle at 50% 0, #000 0 9px, rgba(0,0,0,0.25) 11px 13px),
      linear-gradient(180deg, #000 0 55%, rgba(0,0,0,0.3) 85%, transparent);
    mask-composite: intersect;
    -webkit-mask-composite: source-in;
    /* Pano parado é desenho de pano. A oscilação é mínima — dois pixels e meio
       grau — mas é ela que faz a faixa ter peso: o olho lê tecido pendurado
       respondendo a uma corrente de ar, não uma listra impressa na borda. */
    transform-origin: 50% 0;
    animation: balancar 11s ease-in-out infinite;
  }
  @keyframes balancar {
    0%, 100% { transform: translateX(0)      skewX(0deg); }
    28%      { transform: translateX(-2.5px) skewX(0.5deg); }
    54%      { transform: translateX(1.5px)  skewX(-0.35deg); }
    79%      { transform: translateX(-1px)   skewX(0.2deg); }
  }
  /*
   * A névoa do chão, no lugar de uma sombra chapada.
   *
   * O bloco precisava de mais peso fúnebre sem voltar à listra, e o caminho
   * não era mais padrão — era mais ATMOSFERA. Uma bruma baixa, que se move
   * devagar e nunca fecha a mesma forma, dá sala de velório; uma segunda
   * fileira de listras daria faixa de pedestre de novo.
   */
  .deaths-panel::after {
    left: -10%; right: -10%; bottom: 0;
    height: 74px;
    background:
      radial-gradient(60% 100% at 18% 100%, rgba(150,160,150,0.09), rgba(150,160,150,0) 72%),
      radial-gradient(50% 100% at 52% 100%, rgba(170,180,170,0.11), rgba(170,180,170,0) 70%),
      radial-gradient(64% 100% at 84% 100%, rgba(140,152,144,0.08), rgba(140,152,144,0) 74%),
      linear-gradient(180deg, transparent, rgba(0,0,0,0.55));
    animation: bruma 29s ease-in-out infinite;
  }
  @keyframes bruma {
    0%, 100% { transform: translateX(0);    opacity: 0.85; }
    33%      { transform: translateX(14px); opacity: 1; }
    66%      { transform: translateX(-11px); opacity: 0.72; }
  }
  /*
   * Hitodama (人魂): no folclore japonês, a alma de um morto vista como um
   * fogo-fátuo que paira. É o fantasma certo para este bloco — o ocidental, de
   * lençol, seria piada; este é luto.
   *
   * Cada alma é um bulbo com um rastro atrás (o ::after), subindo devagar e
   * desviando de lado, apagando antes de chegar ao topo. Os três tempos são
   * primos entre si de propósito: 13s, 17s e 19s nunca voltam a coincidir, e é
   * isso que impede a leitura de "três coisas piscando em fila".
   */
  /*
   * O rosto.
   *
   * A primeira versão era um bulbo com um rabo fino atrás, e não havia como
   * não ver espermatozoide: cabeça redonda mais cauda afilada é exatamente
   * esse desenho, em qualquer contexto. O que conserta não é diminuir o rabo —
   * é dar cara à coisa e trocar a cauda por fumaça larga, que dissolve em vez
   * de afilar.
   *
   * A cara é de desespero, que é o que um 幽霊 japonês tem: órbitas fundas e
   * escuras, e a boca aberta num lamento — alta e estreita, não um sorriso
   * redondo. O desespero está no contraste, então as cavidades são quase
   * pretas contra o pálido, e não cinzas.
   */
  /*
   * A alma é o desenho, e o span só carrega o movimento e o brilho.
   *
   * A primeira versão era um bulbo com rabo fino, e lia como espermatozoide —
   * cabeça redonda mais cauda afilada é esse desenho, em qualquer contexto. A
   * segunda tinha cara, mas cara genérica. Esta é o próprio Shinobi morto, e
   * o que a faz funcionar é ser ÍCONE: traço fechado, não gradiente. Gradiente
   * some no fundo escuro e vira borrão.
   */
  .alma {
    position: absolute;
    bottom: 10px;
    width: 28px; height: 38px;
    opacity: 0;
    pointer-events: none;
    /* O halo é do espírito, não do desenho: fica no contêiner para envolver a
       silhueta inteira em vez de cada caminho. */
    filter: drop-shadow(0 0 9px rgba(178, 216, 250, 0.7))
            drop-shadow(0 0 20px rgba(120, 170, 220, 0.35));
  }
  /*
   * O balanço do ícone.
   *
   * A alma subia rígida, e ícone rígido subindo em linha lê como adesivo
   * arrastado, não como coisa que flutua. O giro é pequeno — três graus — mas
   * pega o eixo no alto da cabeça, então a cauda descreve um arco embaixo e o
   * conjunto ganha peso.
   *
   * Cada alma recebe um atraso diferente para as cinco não balançarem em
   * bloco. A cauda ondula em SMIL, no próprio desenho, e os dois ritmos não
   * são múltiplos: é a soma deles que nunca fecha o mesmo quadro.
   */
  .alma svg {
    width: 100%; height: 100%; display: block;
    transform-origin: 50% 18%;
    animation: bambolear 5.3s ease-in-out infinite;
  }
  .alma.a2 svg { animation-duration: 6.1s; animation-delay: -1.4s; }
  .alma.a3 svg { animation-duration: 4.7s; animation-delay: -2.9s; }
  .alma.a4 svg { animation-duration: 6.7s; animation-delay: -0.7s; }
  .alma.a5 svg { animation-duration: 5.9s; animation-delay: -3.6s; }
  @keyframes bambolear {
    0%, 100% { transform: rotate(-3deg) translateX(-0.5px); }
    50%      { transform: rotate(3deg)  translateX(0.5px); }
  }
  /* O rastro: fumaça larga embaixo, sem contorno — contorno é o que fazia o
     rabo parecer cauda. */
  .alma::after {
    content: "";
    position: absolute;
    left: 50%; top: 82%;
    width: 150%; height: 130%;
    margin-left: -75%;
    background: radial-gradient(50% 42% at 50% 0%,
      rgba(200, 230, 252, 0.3) 0%, rgba(170, 210, 240, 0.12) 46%, rgba(150,195,230,0) 78%);
    filter: blur(3px);
  }
  /* Cinco almas, não três, e em períodos primos entre si: 11, 13, 17, 19 e 23
     segundos só voltam a coincidir depois de mais de 17 horas, então o bloco
     nunca repete a mesma cena. Com três havia intervalos longos de nada
     acontecendo; com cinco há sempre uma no ar. */
  .alma.a1 { left: 11%; animation: subir-alma 11s ease-in-out infinite; }
  .alma.a2 { left: 31%; animation: subir-alma 17s ease-in-out 3s infinite; }
  .alma.a3 { left: 52%; animation: subir-alma 13s ease-in-out 7s infinite; }
  .alma.a4 { left: 73%; animation: subir-alma 23s ease-in-out 5s infinite; }
  .alma.a5 { left: 89%; animation: subir-alma 19s ease-in-out 11s infinite; }
  /* Tamanhos diferentes viram profundidade: a menor lê como mais longe. */
  .alma.a2 { --corpo: 0.72; }
  .alma.a4 { --corpo: 1.25; }
  .alma.a5 { --corpo: 0.86; }
  /* O percurso ficou mais alto e o desvio mais largo — antes elas mal saíam
     do lugar antes de apagar. E o brilho agora pulsa no meio da subida, como
     chama que respira. */
  @keyframes subir-alma {
    0%   { transform: translate(0, 4px)      scale(calc(var(--corpo, 1) * 0.55)); opacity: 0; }
    10%  { transform: translate(9px, -16px)  scale(calc(var(--corpo, 1) * 1.05)); opacity: 0.95; }
    26%  { transform: translate(-13px, -42px) scale(calc(var(--corpo, 1) * 0.92)); opacity: 0.72; }
    44%  { transform: translate(11px, -70px) scale(calc(var(--corpo, 1) * 1.12)); opacity: 0.9; }
    62%  { transform: translate(-9px, -96px) scale(calc(var(--corpo, 1) * 0.95)); opacity: 0.55; }
    80%  { transform: translate(7px, -120px) scale(calc(var(--corpo, 1) * 0.82)); opacity: 0.28; }
    100% { transform: translate(-3px, -146px) scale(calc(var(--corpo, 1) * 0.6));  opacity: 0; }
  }
  /* Com o ponteiro em cima elas ganham corpo, sem acelerar: luto não corre. */
  .deaths-panel:hover .alma, .deaths-panel.animando .alma { filter: blur(0.3px) drop-shadow(0 0 12px rgba(190,230,255,0.95)); }

  .deaths-head { display: flex; align-items: baseline; gap: 12px; }
  /* O rótulo voltou ao lado do número, em inglês como o resto da interface.
     Ao lado, e não embaixo, para a linha ler como uma frase: 死 221 deaths. */
  .deaths-rot {
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #8d887d;
    align-self: baseline;
  }
  .deaths-kanji {
    font-family: var(--font-display);
    font-size: 1.9rem;
    font-weight: 800;
    /* Osso, não sangue: o 死 fica pálido, e a luz que ele recebe oscila devagar
       como a de uma vela num velório. */
    color: #cfcabd;
    line-height: 1;
    text-shadow: 0 0 10px rgba(226, 222, 212, 0.35);
    animation: vela 6.4s ease-in-out infinite;
  }
  /*
   * O número é lápide.
   *
   * O que o gradiente faz aqui é o contrário do de antes: no bloco de chefes a
   * cor escorre de cima para baixo, como sangue descendo; aqui a claridade
   * desce e para, como pedra que pega luz no alto e fica escura embaixo.
   * A sombra interna inclina para o baixo-direita, que é onde a luz de uma
   * vela posta à frente deixaria a sombra do sulco — é isso que dá a leitura
   * de gravado em vez de impresso.
   */
  .deaths-count {
    position: relative;
    font-family: var(--font-display);
    font-size: 2.9rem;
    font-weight: 800;
    line-height: 1;
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
    background-image: linear-gradient(
      180deg,
      #f2efe7 0%, #cdc8bb 26%, #8e8a80 58%, #55524b 82%, #2e2c29 100%);
    background-size: 100% 190%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    /* Sem varredura de ponta a ponta: o luto não pulsa, respira. O deslocamento
       é curto e lento de propósito. */
    animation: luto 9.2s ease-in-out infinite;
    filter: drop-shadow(0 1px 0 rgba(0, 0, 0, 0.9))
            drop-shadow(0 0 14px rgba(226, 222, 212, 0.22));
  }
  /* A luz sobre a lápide agora percorre o glifo inteiro em vez de tremer
     dentro de uma faixa de 28%. Continua lento — luto respira, não pulsa —,
     mas o percurso é largo o bastante para se ver a pedra pegando e perdendo
     luz, que era a ideia desde o começo. */
  /*
   * A luz percorre o glifo inteiro, em vez de tremer dentro de uma faixa de
   * 28%. Continua lento — luto respira, não pulsa —, mas o percurso é largo o
   * bastante para se ver a pedra pegando e perdendo luz.
   *
   * Só `background-position` aqui, de propósito. A tentação era somar um
   * `filter: brightness()` para engrossar o efeito, mas `filter` na animação
   * vence a declaração da regra, e levaria junto as duas sombras que dão o
   * relevo de gravado — e o tom esverdeado da podridão, que é aplicado pelo
   * mesmo caminho. Uma propriedade só, e nenhuma delas se atropela.
   */
  @keyframes luto {
    0%, 100% { background-position: 50% 2%; }
    34%      { background-position: 50% 54%; }
    67%      { background-position: 50% 92%; }
  }
  /*
   * A fumaça do incenso, no lugar da gota de sangue.
   *
   * Em velório japonês se oferece incenso ao morto, e a fumaça é o que se vê
   * subindo o tempo todo. Ela sobe da base do número, desvia de um lado para o
   * outro e some antes de chegar ao topo — nunca completa o trajeto, que é
   * como fumaça se comporta.
   */
  .deaths-count::after {
    content: "";
    position: absolute;
    left: 62%;
    top: 4%;
    width: 3px;
    height: 14px;
    border-radius: 50%;
    background: linear-gradient(180deg, rgba(232, 229, 220, 0), rgba(232, 229, 220, 0.5));
    filter: blur(2.5px);
    opacity: 0;
    animation: incenso 7.6s ease-out infinite;
  }
  /* A fumaça sobe mais alto e abre mais: antes ela morria a 54px com opacidade
     de 0.55 no pico, o que num bloco desta altura era quase nada. */
  @keyframes incenso {
    0%   { transform: translate(0, 8px)     scale(0.6); opacity: 0; }
    14%  { transform: translate(-4px, -10px) scale(1);   opacity: 0.8; }
    38%  { transform: translate(6px, -34px)  scale(1.7); opacity: 0.6; }
    64%  { transform: translate(-8px, -60px) scale(2.5); opacity: 0.34; }
    85%  { transform: translate(6px, -84px)  scale(3.2); opacity: 0.14; }
    100% { transform: translate(-2px, -102px) scale(3.8); opacity: 0; }
  }
  /* A vela: a luz não bate igual o tempo todo, e o intervalo entre as quedas
     não é regular — vela que oscila em compasso vira pisca-pisca. */
  /* A vela ficou de verdade. Antes a queda mais funda era de 18% de opacidade
     e o halo mal mudava — parado ao lado de um número imóvel, ninguém veria.
     Agora ela chega a quase apagar, e o brilho vai de 3px a 26px: é a
     diferença entre "tem uma animação ali" e "tem uma chama ali". */
  @keyframes vela {
    0%, 100% { opacity: 1;    text-shadow: 0 0 14px rgba(232, 228, 216, 0.55); }
    7%       { opacity: 0.55; text-shadow: 0 0 4px  rgba(232, 228, 216, 0.15); }
    11%      { opacity: 1;    text-shadow: 0 0 26px rgba(255, 246, 220, 0.8); }
    16%      { opacity: 0.72; text-shadow: 0 0 6px  rgba(232, 228, 216, 0.2); }
    22%      { opacity: 0.98; text-shadow: 0 0 18px rgba(255, 246, 220, 0.65); }
    48%      { opacity: 0.62; text-shadow: 0 0 5px  rgba(232, 228, 216, 0.18); }
    53%      { opacity: 1;    text-shadow: 0 0 24px rgba(255, 246, 220, 0.75); }
    59%      { opacity: 0.8;  text-shadow: 0 0 9px  rgba(232, 228, 216, 0.28); }
    77%      { opacity: 0.5;  text-shadow: 0 0 3px  rgba(232, 228, 216, 0.12); }
    82%      { opacity: 1;    text-shadow: 0 0 22px rgba(255, 246, 220, 0.7); }
    91%      { opacity: 0.86; text-shadow: 0 0 11px rgba(232, 228, 216, 0.34); }
  }
  .deaths-note {
    font-size: 0.72rem;
    color: var(--text-dim);
    line-height: 1.5;
    margin-top: 10px;
  }
  .deaths-note:empty { display: none; }

  /* Termômetro de 0 a 1000. O recuo lateral é metade da largura do pino, para
     ele não vazar do campo nos extremos da escala. */
  /* O recuo é metade da largura do pino, para ele não vazar do campo nos
     extremos. A pista interna tem a largura exata do tubo, e é isso que deixa o
     pino ser posicionado só com uma porcentagem — sem conta em pixel no script,
     que quebraria quando o rosto muda de tamanho no celular. */
  .therm { margin-top: 20px; padding: 0 22px; }
  .therm-rail { position: relative; padding-top: 40px; }
  .therm-track {
    height: 12px;
    border-radius: 99px;
    background: var(--bg);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .therm-fill {
    height: 100%;
    width: 0%;
    border-radius: 99px;
    /* A escala não esquenta, apaga. Sai da cera clara da vela, passa pela
       fumaça e termina na cinza: quanto mais se morreu, mais queimou. Ir para
       o vermelho aqui era o mesmo gesto do bloco de chefes, e este bloco
       precisa dizer outra coisa. */
    background: linear-gradient(90deg,
      #e8e4da, #b9b3a6 34%, #7c776d 66%, #46433e);
    transition: width 0.5s ease;
  }
  .therm-pin {
    position: absolute;
    top: 0;
    left: 0%;
    width: 40px;
    height: 40px;
    transform: translateX(-50%);
    transition: left 0.5s ease;
  }
  .therm-skull {
    display: block;
    font-size: 30px;
    line-height: 40px;
    text-align: center;
    /* Pedir a fonte de emoji do sistema é o ponto: cada aparelho desenha a
       caveira dele, e no iPhone sai a da Apple. */
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  /* Haste ligando o rosto ao tubo, para a leitura ser exata e não aproximada. */
  .therm-pin::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 100%;
    width: 1px;
    height: 10px;
    margin-left: -0.5px;
    background: #cfcabd;
    opacity: 0.7;
  }
  .therm-scale {
    display: flex;
    justify-content: space-between;
    margin-top: 7px;
    font-size: 0.66rem;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  /* Sem offset calibrado o número é desconhecido, não zero: o rosto sai de cena
     e o tubo fica vazio, em vez de fingir uma leitura em 0. */
  .deaths-panel.unknown .deaths-count,
  .deaths-panel.unknown .deaths-kanji { color: var(--text-dim); }
  .deaths-panel.unknown .therm-pin { opacity: 0.28; filter: grayscale(1); }
  .deaths-panel.unknown .therm-pin::after { background: var(--line); }
  /* Estourou a escala: o pino encosta no fim e o 1000 vira "1000+". Branco e
     não vermelho, porque aqui o excesso é de luto, não de sangue. */
  .deaths-panel.over .therm-scale span:last-child { color: #e8e4da; }
  /* Faixa do botão de tema: colada no topo, alinhada à direita. */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 10px;
  }
  .theme-toggle {
    background: none;
    border: 0;
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: 0.9rem;
    line-height: 1;
    padding: 2px 4px;
    cursor: pointer;
    opacity: 0.4;
    transition: opacity 0.15s ease;
  }
  .theme-toggle:hover { opacity: 1; color: var(--text); }
  /* Assinatura: presente, mas sem puxar o olho para longe do progresso. */
  /* Assinatura com peso: é o nome do projeto, não uma nota de rodapé. */
  .assinatura {
    font-family: var(--font-display);
    font-size: 0.92rem;
    font-weight: 500;
    color: var(--gold);
    letter-spacing: 0.22em;
    text-transform: lowercase;
    white-space: nowrap;
  }
  .theme-toggle:hover { color: var(--text); border-color: var(--gold); }

  .overall {
    margin-bottom: 30px;
  }
  .overall-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: var(--font-display);
    margin-bottom: 8px;
  }
  .overall-row .count { font-size: 1.4rem; font-weight: 700; }
  .overall-row .label { font-size: 0.85rem; color: var(--text-dim); font-family: var(--font-body); }
  .bar-track {
    height: 6px;
    background: var(--bg-panel);
    border-radius: 0;
    overflow: hidden;
    position: relative;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blood), var(--blood-bright));
    width: 0%;
    transition: width 0.4s ease;
  }

  /* --- os quadrados 1:1 --- */
  /* São duas fileiras de dois: chefes e Headless logo abaixo do menu, e
     conquistas e tempo de jogo no fim. O teto de 320px existe porque, com só
     dois quadrados por fileira, 1fr numa tela larga faria cada um virar um
     painel de 330px de altura; centralizados e limitados eles ficam do mesmo
     tamanho em qualquer largura. No celular o teto não pega e continua sendo
     dois por linha, como antes. */
  .dois-quadrados {
    display: grid;
    /* O teto vai no contêiner, não na faixa: com `minmax(148px, 320px)` o
       auto-fit conta as colunas pelo máximo, e no celular dava uma coluna só —
       os quadrados deixavam de ficar lado a lado. Com 1fr ele conta pelo
       mínimo e continuam sendo dois por linha em qualquer largura. */
    grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
    max-width: 652px;
    margin: 0 auto 20px;
    gap: 12px;
  }
  /* Sem moldura e sem fundo: estes dois não são placas como os de mortes e
     chefes, só precisam se parecer um com o outro. */
  .quadro {
    aspect-ratio: 1 / 1;
    border: 0;
    background: none;
    padding: 4px 6px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-width: 0;
    /* Sem isto o conteúdo mais alto que o quadrado estica a caixa e o 1:1
       vai embora: aspect-ratio cede para o conteúdo, não o contrário. */
    min-height: 0;
    overflow: hidden;
  }
  .quadro-topo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .quadro-num {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 2.1rem;
    line-height: 1;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .quadro-rot {
    font-size: 0.68rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .quadro-pe { width: 100%; }

  /* Anel de progresso: enche o quadrado, que era o problema da barra. */
  /* A seta de abrir, igual à dos blocos de chefe e de Headless. Sem ela nada
     na peça dizia que havia o que abrir: o anel parecia só um medidor, e a
     lista das 34 conquistas ficava escondida atrás de um clique que ninguém
     tinha motivo para tentar. */
  .quadro-anel { align-items: center; justify-content: center; gap: 8px; padding: 0; position: relative; }
  .quadro-anel::after {
    content: "▾";
    position: absolute; right: 8px; bottom: 6px;
    font-size: 0.7rem; color: var(--text-dim);
    transition: transform 0.2s ease;
    pointer-events: none;
  }
  .quadro-anel.aberto::after { transform: rotate(180deg); }
  /* A seta em dourado e um pouco maior que a dos outros blocos: aqui ela é o
     único sinal de que há o que abrir, enquanto nos de chefe o próprio número
     gigante já convida ao clique. Tentei somar a palavra "list" ao rótulo, mas
     "ACHIEVEMENTS · LIST" não cabe numa linha na largura do quadrado e quebrava
     o bloco em duas. */
  .quadro-anel::after {
    font-size: 0.86rem;
    color: var(--gold);
    opacity: 0.8;
  }
  .quadro-anel:hover::after { opacity: 1; }
  /* O quadrado inteiro é o botão, como nos blocos de chefe: alvo grande, e
     nada de alvo dentro de alvo. */
  .anel-abre {
    width: 100%; height: 100%;
    appearance: none; background: none; border: 0; padding: 4px 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; cursor: pointer; font-family: var(--font-body); min-height: 0;
  }

  /*
   * A coroa de fogo do anel.
   *
   * Só acende quando a sessão rendeu duas ou mais conquistas, e apaga sozinha
   * seis horas depois. É um segundo traço por cima do primeiro, na mesma
   * geometria: assim ele segue exatamente o progresso, em vez de ser um enfeite
   * solto girando em volta.
   *
   * O tracejado curto e o deslocamento correndo é o que dá a leitura de chama
   * lambendo o aro — uma borda contínua pulsando leria como brilho, não fogo.
   */
  .anel-fogo {
    fill: none;
    stroke: url(#chama);
    stroke-width: 9;
    stroke-linecap: round;
    transform: rotate(-90deg);
    transform-origin: 50% 50%;
    stroke-dasharray: 3 7;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  .anel-pegando .anel-fogo {
    opacity: 1;
    animation: lamber 1.1s linear infinite, bruxulear 2.3s ease-in-out infinite;
    filter: drop-shadow(0 0 5px rgba(255,150,40,0.9)) drop-shadow(0 0 14px rgba(255,90,20,0.6));
  }
  @keyframes lamber { to { stroke-dashoffset: -100; } }
  @keyframes bruxulear {
    0%, 100% { stroke-width: 8;  opacity: 0.85; }
    40%      { stroke-width: 11; opacity: 1; }
    70%      { stroke-width: 9;  opacity: 0.92; }
  }
  /* Com fogo aceso o número no meio também esquenta, senão o efeito fica só
     na borda e parece decalque. */
  .anel-pegando .anel-pct { color: #ffd9a8; text-shadow: 0 0 14px rgba(255,140,40,0.7); }

  /*
   * 竜咳 — a podridão do dragão.
   *
   * No jogo, morrer demais adoece os NPCs: eles começam a tossir sangue e o
   * mundo fica mais pobre. Aqui ela toma o bloco de mortes por seis horas
   * depois de cinco mortes numa sessão, e o desenho segue essa descrição —
   * manchas escuras que crescem devagar a partir das bordas, e um verde
   * doentio por cima do luto. Não é sangue vivo, que é do bloco de chefes;
   * é sangue velho em pano.
   */
  .deaths-panel.apodrecendo {
    box-shadow: inset 0 0 40px rgba(60, 74, 38, 0.45);
  }
  .deaths-panel.apodrecendo .manchas {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    background:
      radial-gradient(38% 46% at 8% 88%,  rgba(74, 26, 18, 0.55), rgba(74,26,18,0) 70%),
      radial-gradient(30% 40% at 92% 14%, rgba(58, 22, 16, 0.5),  rgba(58,22,16,0) 72%),
      radial-gradient(46% 36% at 72% 96%, rgba(52, 62, 30, 0.42), rgba(52,62,30,0) 70%),
      radial-gradient(26% 34% at 30% 4%,  rgba(46, 56, 28, 0.38), rgba(46,56,28,0) 74%);
    animation: alastrar 17s ease-in-out infinite;
    mix-blend-mode: multiply;
  }
  /* Cresce e recua, sem nunca voltar ao mesmo ponto: doença não pulsa em
     compasso. As quatro manchas usam a mesma animação porque são um fundo só,
     e o deslocamento de fundo é o que as faz respirar fora de sincronia. */
  @keyframes alastrar {
    0%, 100% { background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%; opacity: 0.75; }
    35%      { background-size: 128% 124%, 112% 130%, 118% 108%, 136% 120%; opacity: 1; }
    68%      { background-size: 112% 136%, 130% 110%, 104% 128%, 116% 132%; opacity: 0.88; }
  }
  /* O número adoece junto: o osso ganha um tom esverdeado de coisa parada. */
  .deaths-panel.apodrecendo .deaths-count {
    filter: drop-shadow(0 1px 0 rgba(0,0,0,0.9))
            drop-shadow(0 0 16px rgba(120, 140, 70, 0.5))
            sepia(0.35) hue-rotate(28deg) saturate(1.25);
  }
  .deaths-panel.apodrecendo .deaths-kanji { color: #b6bf94; }
  /* As almas também: alma de quem morreu de podridão não sobe branca. */
  .deaths-panel.apodrecendo .alma {
    background: radial-gradient(60% 55% at 50% 38%,
      #eef6dd 0%, #c3d79a 34%, #8ba25e 62%, rgba(110,130,70,0) 100%);
    filter: blur(0.4px) drop-shadow(0 0 7px rgba(170, 200, 110, 0.7));
  }

  /* --- a lista de conquistas --- */
  /* Lista de uma coluna, e não grade: cada conquista tem nome e descrição de
     comprimentos muito diferentes, e em grade as caixas ficam com alturas
     desencontradas e buracos. Em coluna a leitura é de cima para baixo, que é
     como se lê uma lista. */
  .conq-lista {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: -6px 0 22px;
  }
  .conq-lista[hidden] { display: none; }
  /* O cabeçalho de cada faixa de dificuldade. */
  .conq-faixa {
    display: flex; align-items: baseline; gap: 10px;
    margin: 14px 0 2px;
    font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--text-dim);
  }
  .conq-faixa:first-child { margin-top: 2px; }
  .conq-faixa::after {
    content: ""; flex: 1; height: 1px; background: var(--line);
  }
  .conq-faixa .conta { letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .conq-faixa.facil   { color: #9db98a; }
  .conq-faixa.media   { color: #c2ab6b; }
  .conq-faixa.dificil { color: #c08069; }
  .conq {
    display: flex; align-items: center; gap: 12px;
    border: 1px solid var(--line);
    background: var(--bg-panel);
    padding: 8px 12px 8px 8px;
    min-width: 0;
  }
  .conq-icone {
    flex: 0 0 auto;
    width: 40px; height: 40px;
    border: 1px solid var(--line);
    background: rgba(0,0,0,0.35) center / cover no-repeat;
  }
  /* A que falta já está esmaecida no conjunto; o ícone perde a cor também,
     que é como a própria Steam mostra conquista bloqueada. */
  .conq.presa .conq-icone { filter: grayscale(1) brightness(0.8); }
  /* A marca da mais rara, na linha dela. */
  .conq-tag {
    flex: 0 0 auto;
    font-size: 0.6rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 2px 6px;
    border: 1px solid var(--blood-bright);
    color: var(--blood-bright);
    white-space: nowrap;
  }
  .conq.presa .conq-tag { opacity: 0.8; }
  .conq.e-shinobi { border-color: rgba(212, 70, 42, 0.55); }

  /*
   * 忍殺 — o golpe mortal, quando a mais rara cai.
   *
   * O pedido era uma animação única no site inteiro, e o gesto que o jogo usa
   * para "isto acabou" é esse: o kanji vermelho estampado na tela no golpe
   * fatal. Não é enfeite emprestado de outro lugar; é a linguagem do próprio
   * Sekiro para o momento decisivo, e a conquista mais rara é a que exige
   * todas as outras.
   *
   * Cobre a viewport inteira, corre uma vez e sai. `pointer-events: none`
   * porque nada do site pode ficar sem clique enquanto ela passa.
   */
  .golpe {
    position: fixed; inset: 0; z-index: 90;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    opacity: 0;
  }
  .golpe.correndo { animation: golpe-cena 3.4s ease-out forwards; }
  @keyframes golpe-cena {
    0%   { opacity: 0; }
    6%   { opacity: 1; }
    72%  { opacity: 1; }
    100% { opacity: 0; }
  }
  /* A tinta: o vermelho entra pelas bordas, não pelo meio, como respingo. */
  .golpe::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 90% at 50% 50%, rgba(0,0,0,0) 38%, rgba(60, 8, 6, 0.82) 100%),
      radial-gradient(60% 50% at 8% 12%, rgba(168,30,18,0.5), rgba(168,30,18,0) 70%),
      radial-gradient(50% 60% at 94% 82%, rgba(168,30,18,0.45), rgba(168,30,18,0) 72%);
    animation: golpe-tinta 3.4s ease-out forwards;
  }
  @keyframes golpe-tinta {
    0%   { transform: scale(1.5); opacity: 0; }
    8%   { transform: scale(1);   opacity: 1; }
    100% { transform: scale(1.1); opacity: 0; }
  }
  .golpe-kanji {
    position: relative;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(4.5rem, 26vw, 13rem);
    line-height: 1;
    letter-spacing: 0.08em;
    color: #e8412a;
    text-shadow: 0 0 22px rgba(255, 70, 40, 0.75), 0 4px 10px rgba(0,0,0,0.9);
    animation: golpe-kanji 3.4s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
  }
  /* Entra grande e desabando para o tamanho, como carimbo: é o tempo do gesto
     no jogo — impacto primeiro, leitura depois. */
  @keyframes golpe-kanji {
    0%   { transform: scale(2.4); opacity: 0; filter: blur(8px); }
    7%   { transform: scale(1);   opacity: 1; filter: blur(0); }
    12%  { transform: scale(1.06); }
    18%  { transform: scale(1); }
    74%  { transform: scale(1);   opacity: 1; }
    100% { transform: scale(1.12); opacity: 0; }
  }
  /* O corte: um traço branco atravessa o kanji no instante do impacto. */
  .golpe-corte {
    position: absolute;
    left: -10%; right: -10%; top: 50%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #fff 18%, #ffd9cf 50%, #fff 82%, transparent);
    transform-origin: 50% 50%;
    animation: golpe-corte 3.4s ease-out forwards;
  }
  @keyframes golpe-corte {
    0%   { transform: rotate(-18deg) scaleX(0); opacity: 0; }
    5%   { transform: rotate(-18deg) scaleX(1); opacity: 1; }
    16%  { transform: rotate(-18deg) scaleX(1); opacity: 0; }
    100% { opacity: 0; }
  }
  /* Enquanto a marca está conquistada, a página inteira guarda um fio de
     vermelho na borda: o site não volta a ser o mesmo depois disso. */
  body.tem-shinobi::after {
    content: "";
    position: fixed; inset: 0; z-index: 2;
    pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(212, 70, 42, 0.35),
                inset 0 0 44px rgba(140, 26, 16, 0.22);
  }

  .conq-raridade {
    margin-left: auto;
    flex: 0 0 auto;
    font-size: 0.68rem;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  /* A que falta fica esmaecida, e não ausente: a lista é o mapa inteiro. */
  .conq.presa { opacity: 0.34; }
  .conq-marca {
    font-family: var(--font-display);
    font-size: 1rem; line-height: 1.2;
    color: var(--gold);
    flex: 0 0 auto;
  }
  .conq.presa .conq-marca { color: var(--text-dim); }
  .conq-texto { min-width: 0; }
  .conq-nome {
    font-family: var(--font-display);
    font-size: 0.9rem; line-height: 1.25; color: var(--text);
  }
  .conq-desc {
    font-size: 0.72rem; line-height: 1.4; color: var(--text-dim); margin-top: 2px;
  }
  /* Conquista oculta que ainda não caiu não tem descrição para mostrar; o
     jogo esconde de propósito, e inventar texto seria pior que o traço. */
  .conq-desc.segredo { font-style: italic; }
  /* O anel dimensiona pela ALTURA disponível, e não pela largura: assim ele
     nunca empurra o quadrado para fora do 1:1. */
  /* `align-self: center` e `width: auto` são o que faz o anel derivar a
     largura da altura. Sem eles o flex em coluna estica a caixa até a largura
     toda, o aspect-ratio puxa a altura junto, e o anel vaza do quadrado. */
  .anel {
    position: relative;
    flex: 0 1 auto;
    align-self: center;
    min-height: 0;
    height: 100%;
    width: auto;
    aspect-ratio: 1 / 1;
  }
  .anel svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  .anel circle { fill: none; stroke-width: 9; }
  /* O trilho era da cor do fundo, o que funcionava quando o quadrado tinha
     fundo próprio. Sem ele, o trilho sumia e só o arco preenchido aparecia —
     não dava para ver quanto falta. */
  .anel-trilho { stroke: var(--bg-panel); }
  .anel-fio {
    stroke: var(--blood-bright);
    stroke-linecap: butt;
    /* 2πr com r=42. O dasharray é o anel inteiro; o offset é o que falta. */
    stroke-dasharray: 263.89;
    stroke-dashoffset: 263.89;
    transition: stroke-dashoffset 0.6s ease;
  }
  .anel-meio {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px;
  }
  .anel-pct {
    font-family: var(--font-display); font-weight: 800;
    font-size: clamp(1.4rem, 5.5vw, 2.1rem);
    line-height: 1; color: var(--text); font-variant-numeric: tabular-nums;
  }
  .anel-num { font-size: 0.72rem; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .quadro-rot-centro { text-align: center; }
  /* --- tempo de jogo: o número é metal, e o metal melhora com as horas --- */
  .tempo-meio {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
  }
  .tempo-num {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(2.4rem, 11vw, 4.2rem);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    /* O brilho é um gradiente atravessando o glifo, recortado pelo texto. A
       faixa clara corre devagar, como luz passando por metal polido. */
    background-image: linear-gradient(
      100deg,
      var(--m1) 0%, var(--m2) 22%, var(--m3) 34%, #ffffff 40%,
      var(--m3) 46%, var(--m2) 60%, var(--m1) 100%);
    background-size: 320% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: polir 3.2s linear infinite;
    filter: drop-shadow(0 2px 1px rgba(0,0,0,0.75)) brightness(1.25) contrast(1.35);
  }
  @keyframes polir {
    0%   { background-position: 140% 50%; }
    100% { background-position: -40% 50%; }
  }
  /* Metais de partida; o script troca conforme as horas. */
  .quadro { --m1: #5d5952; --m2: #8d877e; --m3: #c9c3b8; }

  /* Marcos de 25 em 25 horas até 200. */
  .marcos { display: flex; gap: 2px; height: 8px; }
  .marcos i {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 1px;
  }
  .marcos i.cheio { background: var(--gold); border-color: var(--gold); }
  .marcos i.parcial { background: linear-gradient(90deg, var(--gold) var(--p), transparent var(--p)); }
  .marcos-esc {
    display: flex; justify-content: space-between;
    font-size: 0.6rem; color: var(--text-dim); margin-top: 5px;
  }

  /* Quadrado que é botão inteiro: alvo grande, nada de alvo dentro de alvo. */
  .quadro-botao { padding: 0; position: relative; }
  .quadro-abre {
    width: 100%; height: 100%;
    appearance: none; background: none; border: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
    cursor: pointer; font-family: var(--font-body);
  }
  .quadro-kanji { font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; line-height: 1; }
  .quadro-botao .quadro-num { font-size: clamp(2.2rem, 9vw, 3.4rem); }
  .quadro-botao .quadro-rot { text-align: center; }
  .quadro-botao::after {
    content: "▾";
    position: absolute; right: 8px; bottom: 6px;
    font-size: 0.7rem; color: var(--text-dim);
    transition: transform 0.2s ease;
  }
  .quadro-botao.aberto::after { transform: rotate(180deg); }

  /* --- bloco 3: mortes de chefe --- */
  /* --- sangue e terror: os dois quadrados de contagem --- */

  /* --- a moldura do bloco só se mexe quando se olha para ele ---
   *
   * A borda sangrando e o tremor do Headless rodando sem parar deixavam a
   * página sem ponto de descanso: são efeitos grandes, na periferia da visão,
   * e acontecendo sempre nenhum deles chega a ser notado. Parados, viram
   * resposta — o bloco reage a você.
   *
   * Isto vale só para o que é do bloco: a moldura, o tremor, as gotas que
   * escorrem pela caixa. O conteúdo fica de fora — o número e o kanji seguem
   * animando sozinhos o tempo todo, porque eles são a informação, e informação
   * que só se mexe sob o ponteiro obriga a passar o mouse para ler.
   *
   * O mecanismo é uma variável só. O bloco declara `--anim: paused`, e as
   * regras da moldura leem `animation-play-state: var(--anim)`. Variável de
   * CSS é herdada, então alcança pseudo-elemento e filho sem repetir seletor.
   * Pausada, a animação segura o primeiro quadro, que é justamente o repouso
   * do desenho: gota com opacidade zero, tremor em deslocamento zero.
   *
   * Dois gatilhos porque são dois aparelhos. `:hover` cobre o mouse; a classe
   * `animando`, posta por toque, cobre o celular, onde hover não existe.
   */
  .boss-quadro, .headless-quadro { --anim: paused; }
  .boss-quadro:hover, .boss-quadro.animando,
  .headless-quadro:hover, .headless-quadro.animando { --anim: running; }

  /* O sangue é o ponto do desenho. O resto da página é contido de propósito
     para que estes dois possam ser assim. */
  .boss-quadro {
    background: radial-gradient(120% 90% at 50% 0%, rgba(140,20,12,0.38), rgba(22,14,12,0.9) 72%);
    box-shadow: inset 0 0 26px rgba(168,50,31,0.45);
    overflow: hidden;
  }
  .boss-quadro::before {
    content: "";
    position: absolute; inset: 0;
    border: 2px solid transparent;
    border-image: linear-gradient(180deg,
      #400b07 0%, #8c1a10 18%, #d4462a 34%, #ff5b33 46%,
      #d4462a 58%, #8c1a10 78%, #400b07 100%) 1;
    animation: sangue-borda 2.6s ease-in-out infinite;
    animation-play-state: var(--anim, running);
    pointer-events: none;
  }
  @keyframes sangue-borda {
    0%, 100% { opacity: 0.55; filter: saturate(1) brightness(0.9); }
    50%      { opacity: 1;    filter: saturate(1.9) brightness(1.35); }
  }
  .boss-kanji { color: #ff5b33; text-shadow: 0 0 14px rgba(255,91,51,0.85), 0 0 34px rgba(168,50,31,0.6); }
  .boss-num {
    background-image: linear-gradient(180deg,
      #ffd8cc 0%, #ff6a3d 22%, #d4462a 40%, #8c1a10 62%, #4a0d08 100%);
    background-size: 100% 300%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
    animation: escorrer-forte 2.8s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(212,70,42,0.75)) drop-shadow(0 2px 2px rgba(0,0,0,0.8));
  }
  @keyframes escorrer-forte {
    0%   { background-position: 50% 0%; }
    45%  { background-position: 50% 100%; }
    100% { background-position: 50% 0%; }
  }

  /* Três gotas com tempos diferentes, para não virar um metrônomo. */
  .pingo {
    position: absolute; top: 0; width: 4px; border-radius: 0 0 60% 60%;
    background: linear-gradient(180deg, #ff5b33, #8c1a10 60%, transparent);
    opacity: 0; pointer-events: none;
  }
  /* O play-state vai dentro de cada uma, depois do atalho: `animation`
     reescreve todos os seus longhands, então a mesma declaração posta numa
     regra `.pingo` acima seria zerada pela linha que define a queda. */
  .pingo.p1 { left: 22%; height: 12px; animation: gotejar 3.4s ease-in infinite; animation-play-state: var(--anim, running); }
  .pingo.p2 { left: 51%; height: 16px; animation: gotejar 4.7s ease-in 0.8s infinite; animation-play-state: var(--anim, running); }
  .pingo.p3 { left: 76%; height: 10px; animation: gotejar 5.9s ease-in 1.9s infinite; animation-play-state: var(--anim, running); }
  @keyframes gotejar {
    0%       { transform: translateY(0) scaleY(0.3); opacity: 0; }
    12%      { transform: translateY(6px) scaleY(1); opacity: 1; }
    72%      { transform: translateY(78px) scaleY(1.7); opacity: 0.85; }
    100%     { transform: translateY(150px) scaleY(2.2); opacity: 0; }
  }

  /* Headless: roxo, e o medo é o tremor. A moldura pulsa fora de compasso com
     o sangue do vizinho, o que deixa os dois inquietos em vez de sincronizados. */
  .headless-quadro {
    background: radial-gradient(120% 90% at 50% 100%, rgba(78,26,120,0.42), rgba(16,12,22,0.92) 72%);
    box-shadow: inset 0 0 26px rgba(124,58,186,0.45);
    overflow: hidden;
    animation: tremor 6.1s ease-in-out infinite;
    animation-play-state: var(--anim, running);
  }
  .headless-quadro::before {
    content: "";
    position: absolute; inset: 0;
    border: 2px solid transparent;
    border-image: linear-gradient(180deg,
      #1b0f2b 0%, #4e1a78 20%, #7c3aba 38%, #b06bf0 50%,
      #7c3aba 62%, #4e1a78 80%, #1b0f2b 100%) 1;
    animation: medo-borda 3.7s ease-in-out infinite;
    animation-play-state: var(--anim, running);
    pointer-events: none;
  }
  @keyframes medo-borda {
    0%, 100% { opacity: 0.4;  filter: saturate(0.8) brightness(0.8); }
    38%      { opacity: 1;    filter: saturate(2) brightness(1.5); }
    52%      { opacity: 0.55; filter: saturate(1.2) brightness(1); }
  }
  /* Tremor curto e irregular: sustos, não balanço.
     O susto ficou mais violento — deslocamento cerca de quatro vezes maior,
     com giro e um empurrão de escala. O que não mudou foi a janela: ela
     continua sendo a mesma fatia do ciclo de 6,1s, de 88% a 100%. É isso que
     mantém igual o intervalo de espera entre um susto e o próximo; a
     intensidade subiu pelo tamanho e pela quantidade de solavancos dentro da
     janela, não por ela ter esticado. */
  /* Os vetores do susto apontam todos para baixo — sudoeste e sudeste,
     alternando —, e a escala só encolhe. Isso é o que faz o movimento
     comunicar medo em vez de agitação: quem se assusta se encolhe e recua
     para baixo, não pula para cima. Um tremor com componente para o norte
     lia como energia, como um bicho batendo na caixa por dentro. */
  @keyframes tremor {
    0%, 88%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
    88.7% { transform: translate(-7px, 5px) rotate(-1.4deg) scale(0.984); }
    90%   { transform: translate(6px, 6px)  rotate(1.2deg)  scale(0.978); }
    91.2% { transform: translate(-8px, 4px) rotate(-1.6deg) scale(0.974); }
    92.4% { transform: translate(7px, 5px)  rotate(1.4deg)  scale(0.981); }
    93.6% { transform: translate(-6px, 3px) rotate(-1.1deg) scale(0.987); }
    94.8% { transform: translate(5px, 4px)  rotate(0.9deg)  scale(0.99); }
    96%   { transform: translate(-4px, 2px) rotate(-0.7deg) scale(0.994); }
    97.2% { transform: translate(3px, 2px)  rotate(0.5deg)  scale(0.997); }
    98.4% { transform: translate(-2px, 1px) rotate(-0.3deg) scale(0.999); }
  }
  .headless-kanji { color: #b06bf0; text-shadow: 0 0 16px rgba(176,107,240,0.9), 0 0 38px rgba(124,58,186,0.6); }
  /* O número era roxo sobre fundo roxo: de longe sumia dentro do próprio
     bloco. Agora é luz de espírito — branco frio puxando para o azul em cima,
     resolvendo em violeta escuro embaixo. Contrasta com o fundo por
     temperatura e por brilho, continua no tema porque a raiz do gradiente e o
     halo em volta seguem roxos, e não se confunde com o vermelho do bloco de
     chefes ao lado. */
  .headless-num {
    background-image: linear-gradient(180deg,
      #f6fdff 0%, #c3ecff 20%, #86caf2 42%, #6470d8 66%, #2a1550 100%);
    background-size: 100% 300%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
    animation: escorrer-forte 4.3s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(198,236,255,0.85))
            drop-shadow(0 0 26px rgba(176,107,240,0.75))
            drop-shadow(0 2px 2px rgba(0,0,0,0.85));
  }
  .headless-quadro .pingo {
    background: linear-gradient(180deg, #b06bf0, #3d1361 60%, transparent);
  }

  /* --- a lista que os dois quadrados abrem --- */
  /* Fica fora da grade dos quadrados, logo depois dela: aberta, empurra o que
     vem abaixo pelo fluxo normal do documento; fechada, devolve tudo ao lugar.
     Nada de medir altura nem animar no script. */
  .boss-lista {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(136px, 1fr));
    gap: 10px;
    margin: -6px 0 22px;
  }
  /* `hidden` sozinho não vence `display: grid` do autor: sem esta regra a
     lista continuava aberta mesmo marcada como escondida. */
  .boss-lista[hidden] { display: none; }

  .boss-card {
    position: relative;
    border: 1px solid var(--line);
    background: var(--bg-panel);
    padding: 10px 10px 9px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }
  /* Quem ainda não caiu fica apagado, e não ausente: a lista continua sendo o
     mapa inteiro, não só o que já foi feito. */
  .boss-card.zero { opacity: 0.42; }
  .boss-card-n {
    position: absolute; top: 5px; right: 7px;
    font-family: var(--font-display);
    font-size: 0.82rem;
    color: var(--blood-bright);
    font-variant-numeric: tabular-nums;
  }
  .headless-lista .boss-card-n { color: #b06bf0; }
  .boss-icone {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.35);
    font-size: 1.7rem;
    color: var(--text-dim);
    overflow: hidden;
  }
  /* Com arte o kanji sai e a imagem preenche o quadrado; o enquadramento de
     cada chefe vem do JSON, porque as ilustrações não têm o mesmo corte. */
  .boss-icone.com-arte { font-size: 0; background-color: #0b0908; }
  .boss-card-nome {
    font-family: var(--font-display);
    font-size: 0.92rem;
    line-height: 1.25;
    text-align: center;
    color: var(--text);
  }
  .boss-card-area {
    font-size: 0.66rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    text-align: center;
  }

  /* --- menu de tópicos --- */
  /* Sem fio embaixo e sem os botões colados: o menu era uma régua de texto
     onde nada parecia clicável. Agora cada tópico é uma peça com contorno
     próprio, e o espaço entre elas faz o trabalho que a linha fazia. */
  .topics {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 26px;
  }
  .topic {
    appearance: none;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 2px;
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 10px 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .topic:hover { color: var(--text); border-color: var(--gold); }
  /* O escolhido é peça cheia, não sublinhado: de relance se vê onde se está. */
  .topic.on {
    color: var(--paper);
    background: var(--blood);
    border-color: var(--blood-bright);
  }
  .topic-n {
    margin-left: 8px;
    font-size: 0.66rem;
    letter-spacing: 0;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .topic.on .topic-n { color: var(--paper); opacity: 0.75; }

  /* A gaveta: três risquinhos, e o que não tem vaga fixa no menu mora dentro. */
  .gaveta { position: relative; }
  .gaveta-bt {
    display: inline-flex; flex-direction: column; justify-content: center;
    gap: 3px; padding: 12px 11px; min-width: 38px;
  }
  .gaveta-bt span {
    display: block; width: 14px; height: 2px;
    background: currentColor; border-radius: 1px;
    transition: transform 0.18s ease, opacity 0.18s ease;
  }
  .gaveta.aberta .gaveta-bt span:nth-child(1) { transform: translateY(5px) rotate(45deg); }
  .gaveta.aberta .gaveta-bt span:nth-child(2) { opacity: 0; }
  .gaveta.aberta .gaveta-bt span:nth-child(3) { transform: translateY(-5px) rotate(-45deg); }
  .gaveta-menu {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 20;
    min-width: 190px;
    border: 1px solid var(--line);
    background: var(--bg-panel);
    box-shadow: 0 10px 26px rgba(0,0,0,0.5);
  }
  .gaveta-item {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; gap: 12px;
    appearance: none; background: none; border: 0;
    border-bottom: 1px solid var(--line);
    padding: 12px 14px;
    font-family: var(--font-body); font-size: 0.7rem;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-dim); cursor: pointer; white-space: nowrap;
  }
  .gaveta-item:last-child { border-bottom: 0; }
  .gaveta-item:hover { color: var(--text); background: rgba(168,133,61,0.10); }
  .gaveta-item.on { color: var(--paper); background: var(--blood); }

  section.category {
    margin-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  /* `hidden` sozinho não vence a especificidade de section.category em alguns
     navegadores; explicitar evita a aba trocar e nada sumir. */
  section.category[hidden] { display: none; }
  .cat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    cursor: pointer;
    user-select: none;
    gap: 14px;
  }
  .cat-title-group { display: flex; align-items: baseline; gap: 10px; flex: 1; min-width: 0; }
  .cat-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.05rem;
    white-space: nowrap;
  }
  .cat-progress-text { font-size: 0.78rem; color: var(--text-dim); white-space: nowrap; }
  .cat-mini-bar {
    flex: 1;
    height: 3px;
    background: var(--bg-panel);
    min-width: 30px;
  }
  .cat-mini-fill {
    height: 100%;
    background: var(--gold);
    width: 0%;
    transition: width 0.4s ease;
  }
  /* Alfinete desenhado, não emoji: o emoji trazia cor e brilho que não são
     desta página, e não acompanhava o tema. Alvo de 34px porque o alvo de
     verdade no celular é o dedo, não o desenho. */
  .cat-header .pin {
    appearance: none;
    background: none;
    border: 0;
    padding: 0;
    width: 34px;
    height: 34px;
    margin: -8px -6px -8px 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    order: 1;
    color: var(--text-dim);
    opacity: 0.45;
    transition: opacity 0.15s ease, color 0.15s ease;
  }
  .cat-header .pin svg { width: 13px; height: 13px; display: block; }
  .cat-header .pin:hover { opacity: 0.9; }
  .cat-header .pin.on { opacity: 1; color: var(--gold); }
  .cat-header .chevron { order: 2; }

  .chevron {
    color: var(--text-dim);
    font-size: 0.75rem;
    transition: transform 0.25s ease;
    flex-shrink: 0;
  }
  .category.open .chevron { transform: rotate(90deg); }

  .items {
    display: none;
    padding: 0 0 18px 0;
  }
  .category.open .items { display: block; }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 9px 2px;
    border-bottom: 1px dashed var(--line);
  }
  .item:last-child { border-bottom: none; }
  .item input[type="checkbox"] {
    appearance: none;
    width: 18px;
    height: 18px;
    min-width: 18px;
    margin-top: 2px;
    border: 1px solid var(--gold);
    background: transparent;
    cursor: default;
    position: relative;
    border-radius: 2px;
  }
  .item input[type="checkbox"]:disabled { opacity: 1; }
  .item input[type="checkbox"]:checked {
    background: var(--blood-bright);
    border-color: var(--blood-bright);
  }
  .item input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 5px;
    top: 1px;
    width: 5px;
    height: 9px;
    border: solid var(--paper);
    border-width: 0 2px 2px 0;
    transform: rotate(40deg);
  }
  .item label {
    flex: 1;
    font-size: 0.92rem;
    line-height: 1.4;
    cursor: default;
  }
  .item.done label { color: var(--text-dim); text-decoration: line-through; text-decoration-color: var(--blood); }
  .item .loc { display: block; font-size: 0.72rem; color: var(--text-dim); margin-top: 1px; }
  .item .tag {
    font-size: 0.68rem;
    color: var(--gold);
    border: 1px solid var(--line);
    padding: 1px 6px;
    border-radius: 2px;
    white-space: nowrap;
    align-self: center;
  }

  /* --- sincronização com o save (mesma linguagem visual das tags) --- */
  .sync-line {
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  /* O ponto é um botão. Ele mostra 6px, mas a área de clique é 20px: num
     celular ninguém acerta um alvo de seis pixels. A margem negativa põe o
     ponto de volta exatamente onde ele estava antes de virar botão. */
  .sync-dot {
    appearance: none;
    border: 0;
    background: none;
    padding: 0;
    width: 20px;
    height: 20px;
    margin: -7px 0 -7px -6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .sync-dot::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: transform 0.15s ease;
  }
  .sync-dot:hover::before { transform: scale(1.5); }
  .sync-dot.on::before { background: var(--gold); }
  .sync-dot.off::before { background: var(--blood); }
  .sync-dot[aria-expanded="true"]::before { transform: scale(1.5); }
  .item .tag.auto { color: var(--gold); border-color: var(--gold); }

  /* --- contadores da seção de itens essenciais --- */
  .item.counter { align-items: center; }
  .count-ctl { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .count-val {
    min-width: 34px;
    text-align: right;
    font-family: var(--font-body);
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text);
  }
  .count-ctl .of { font-size: 0.72rem; color: var(--text-dim); white-space: nowrap; min-width: 26px; }
  .sub-head {
    font-size: 0.7rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 14px 2px 4px;
    border-bottom: 1px dashed var(--line);
  }
  .item .tag.pending { color: var(--text-dim); border-color: var(--line); }
  .item input[type="checkbox"].pending { border-style: dashed; opacity: .45; }
  .cat-aviso {
    font-size: 0.72rem;
    color: var(--text-dim);
    padding: 10px 2px 2px;
    line-height: 1.5;
  }

  /* --- novidades desde a última visita --- */
  .novidades {
    border: 1px solid var(--gold);
    border-radius: 3px;
    padding: 12px 14px 10px;
    margin-bottom: 26px;
  }
  .nov-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }
  .nov-titulo {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--gold);
  }
  .nov-lista { list-style: none; margin: 0; padding: 0; }
  .nov-lista li {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 0.82rem;
    padding: 4px 0;
    border-bottom: 1px dashed var(--line);
  }
  .nov-lista li:last-child { border-bottom: none; }
  .nov-lista .nov-tipo {
    font-size: 0.66rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    min-width: 74px;
    flex-shrink: 0;
  }
  .nov-lista .nov-label { flex: 1; min-width: 0; }
  .nov-lista .nov-texto { color: var(--gold); white-space: nowrap; }
  .nov-mais { font-size: 0.72rem; color: var(--text-dim); padding-top: 6px; }
  .visto-btn {
    background: none;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: var(--font-body);
    font-size: 0.7rem;
    padding: 4px 9px;
    border-radius: 2px;
    cursor: pointer;
    white-space: nowrap;
  }
  .visto-btn:hover { background: var(--gold); color: var(--ink); }
  .item .novo {
    width: 6px;
    height: 6px;
    min-width: 6px;
    border-radius: 50%;
    background: var(--gold);
    align-self: center;
  }
  .cat-novo {
    font-size: 0.66rem;
    color: var(--ink);
    background: var(--gold);
    border-radius: 8px;
    padding: 0 6px;
    white-space: nowrap;
  }

  /* Em tela estreita o título longo + a barrinha decorativa estouram a largura
     e a página passa a rolar para o lado. A contagem por seção continua. */
  @media (max-width: 460px) {
    h1 { font-size: 2.3rem; }
    .assinatura { font-size: 0.8rem; letter-spacing: 0.16em; }
    .topic { font-size: 0.64rem; padding: 11px 11px; letter-spacing: 0.06em; }
    .topics { gap: 6px; }
    .boss-card-nome { font-size: 0.85rem; }
    .deaths-panel { padding: 18px 16px 14px; }
    /* Dedo, não cursor: linha do menu e cabeçalho de seção ficam mais altos,
       e o alfinete ganha folga do chevron para não haver clique trocado. */
    .topic { font-size: 0.66rem; padding: 12px 11px 11px; letter-spacing: 0.06em; }
    .cat-header { padding: 16px 0; gap: 8px; }
    .cat-header .pin { width: 40px; height: 40px; margin: -10px -8px -10px 0; }
    .chevron { padding: 8px 0 8px 6px; }
    .dois-quadrados { gap: 10px; }
    .quadro { padding: 13px 14px; }
    .quadro-num { font-size: 1.7rem; }
    .skill { font-size: 2.1rem; }
    .boss-lista { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    .topic-n { margin-left: 5px; font-size: 0.6rem; }
    /* A rolagem lateral aqui era de quando o menu tinha onze tópicos e nenhuma
       gaveta. Com três tópicos e os três risquinhos ela só atrapalha: no
       celular o último item ficava cortado na borda e era preciso arrastar
       para descobrir que existia. Agora o menu quebra em duas colunas e cabe
       inteiro na tela, sem nada escondido fora do quadro. Duas colunas em vez
       de uma linha apertada continuam valendo se algum item for afixado. */
    .topics {
      flex-wrap: wrap;
      row-gap: 6px;
    }
    /* Só os filhos diretos: o botão da gaveta também tem a classe `topic`, e
       ele precisa continuar com os três risquinhos empilhados. */
    .topics > .topic {
      flex: 1 1 calc(50% - 6px);
      min-width: 0;
      display: flex;
      align-items: baseline;
      justify-content: center;
    }
    /* A gaveta não vira meia tela: fica do tamanho dela, encostada à direita
       da última fileira. */
    .topics .gaveta { flex: 0 0 auto; margin-left: auto; }
    .deaths-count { font-size: 2.3rem; }
    .deaths-kanji { font-size: 1.6rem; }
    /* Pino menor e recuo menor: no celular a pista é curta e o rosto grande
       comeria boa parte dela. */
    .therm { padding: 0 18px; }
    .therm-rail { padding-top: 34px; }
    .therm-pin { width: 32px; height: 32px; }
    .therm-skull { font-size: 24px; line-height: 32px; }
    .therm-scale { font-size: 0.6rem; }
    .cat-mini-bar { display: none; }
    .cat-title { white-space: normal; }
    .cat-title-group { min-width: 0; }
  }

  /* --- menos movimento ---
   *
   * Fica no fim da folha de propósito, e isso é correção de um defeito, não
   * arrumação. Estava declarado lá em cima, perto do painel de mortes, e
   * `animation: none` com a mesma especificidade da regra que liga a animação
   * perde para ela quando vem antes. Na prática: quem pedia menos movimento no
   * sistema recebia o número de mortes parado, mas continuava levando a borda
   * sangrando, o tremor do Headless e as gotas caindo — justamente os efeitos
   * grandes, que são os que incomodam. Daqui do fim, vence todos.
   */
  @media (prefers-reduced-motion: reduce) {
    .deaths-count, .deaths-kanji, .tempo-num, .boss-num, .headless-num,
    .boss-quadro::before, .headless-quadro::before, .headless-quadro {
      animation: none;
    }
    /* Sem a vela oscilando, o 死 fica na luz cheia em vez de num quadro
       qualquer do ciclo. */
    .deaths-kanji { opacity: 1; text-shadow: 0 0 10px rgba(226, 222, 212, 0.35); }
    .deaths-count { background-position: 50% 30%; }
    .tempo-num { background-position: 40% 50%; }
    .boss-num, .headless-num { background-position: 50% 30%; }
    .boss-quadro::before, .headless-quadro::before { opacity: 0.85; }
    .deaths-count::after, .pingo { display: none; }
  }

  a, button, input { -webkit-tap-highlight-color: transparent; }
  ::selection { background: var(--blood); color: var(--paper); }
</style>
</head>
<body>
<div class="wrap">

  <!-- Faixa só para o botão de tema, no extremo topo à direita: fora do
       cabeçalho, para não disputar espaço com o título nem com a assinatura. -->
  <!-- Ponto de sync na ponta esquerda, botão de tema na direita: a faixa do
       topo passa a ser só estado e controle, e o cabeçalho fica com o título. -->
  <div class="topbar">
    <div class="sync-line" id="syncLine">
      <button class="sync-dot" id="syncDot" type="button" aria-expanded="false"></button>
      <span id="syncText" hidden>looking for the save…</span>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button" title="Switch theme" aria-label="Switch theme">◐</button>
  </div>

  <header class="top">
    <div class="top-centro">
      <h1>Sekiro<span> 進捗</span></h1>
      <div class="assinatura">oaovito game progress</div>
    </div>
  </header>

  <nav class="topics" id="topics" aria-label="Sections" hidden></nav>

  <!-- Bloco 1: as duas contagens de combate, logo abaixo do menu. São o que
       se olha primeiro, então vêm primeiro. -->
  <div class="dois-quadrados">
    <!-- Contador de chefes: mesma proporção dos outros, e abre a lista. -->
    <section class="quadro quadro-botao boss-quadro" id="bossPanel" hidden>
      <button class="quadro-abre" id="bossHead" type="button" aria-expanded="false" aria-controls="bossLista">
        <span class="quadro-kanji boss-kanji">討</span>
        <span class="quadro-num boss-num" id="bossNum">—</span>
        <span class="quadro-rot">boss kills</span>
      </button>
    </section>

    <!-- Headless: roxo, e a moldura treme. -->
    <section class="quadro quadro-botao headless-quadro" id="headlessPanel" hidden>
      <button class="quadro-abre" id="headlessHead" type="button" aria-expanded="false" aria-controls="headlessLista">
        <span class="quadro-kanji headless-kanji">首</span>
        <span class="quadro-num headless-num" id="headlessNum">—</span>
        <span class="quadro-rot">headless</span>
      </button>
    </section>
  </div>

  <!-- Fora da grade de propósito: aberta, empurra o que vem abaixo; fechada,
       devolve tudo ao lugar. Fluxo normal do documento, sem script. -->
  <div class="boss-lista" id="bossLista" hidden></div>
  <div class="boss-lista headless-lista" id="headlessLista" hidden></div>

  <!-- Bloco 2: mortes. -->
  <section class="deaths-panel" id="deaths" hidden>
    <!-- As manchas da podridão. Vazio e invisível fora do efeito; um elemento
         próprio porque os dois pseudo-elementos do painel já são a cortina. -->
    <div class="manchas" aria-hidden="true"></div>

    <!--
      As almas que sobem são o próprio Shinobi, morto, em ícone chibi: cabeça
      grande, traço mínimo, e os três sinais que o identificam de relance — o
      coque espetado como ponta de abacaxi, as mechas prateadas e a marca de
      prata no rosto. Olhos em × porque está morto; é a convenção do desenho
      chibi e dispensa qualquer outro sinal.

      Um `symbol` desenhado uma vez e usado cinco: cinco cópias do mesmo
      caminho seriam cinco lugares para corrigir quando o desenho mudar.
    -->
    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
      <defs>
        <!-- O manto some para baixo: o espírito se desfaz, não termina. -->
        <linearGradient id="mantoAlma" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#dff0fb" stop-opacity="0.95"/>
          <stop offset="55%"  stop-color="#b6d9f0" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#8fbcdd" stop-opacity="0.05"/>
        </linearGradient>
      </defs>
      <symbol id="almaChibi" viewBox="0 0 24 34">
        <!--
          A cauda, embaixo de tudo para a cabeça cair por cima dela.

          A animação é SMIL e não CSS porque `use` clona o conteúdo numa árvore
          sombra, e seletor do documento não alcança lá dentro. SMIL viaja
          junto com o clone e anima nas cinco cópias.

          O `d` alterna entre três desenhos com o MESMO número de segmentos —
          é o que permite interpolar entre eles. As cristas trocam de lugar de
          um para o outro, e é isso que faz a barra ondular em vez de subir e
          descer inteira.
        -->
        <path fill="url(#mantoAlma)" opacity="0.55"
              d="M6.2 16c-1.3 3.4-2 6.7-2 10.2l1.9-1.8 1.9 2 1.9-2 2 2 2-2 1.9 2 1.9-2 1.9 1.8c0-3.5-.7-6.8-2-10.2z">
          <animate attributeName="d" dur="3.7s" repeatCount="indefinite"
            values="M6.2 16c-1.3 3.4-2 6.7-2 10.2l1.9-1.8 1.9 2 1.9-2 2 2 2-2 1.9 2 1.9-2 1.9 1.8c0-3.5-.7-6.8-2-10.2z;
                    M6.2 16c-1.3 3.4-2.2 6.9-1.7 10.6l2-2.4 1.8 2.3 2-2.3 1.9 2.4 1.9-2.4 2 2.3 1.8-2.3 2 2.4c.5-3.7-.4-7.2-1.7-10.6z;
                    M6.2 16c-1.3 3.4-1.8 6.5-2.3 10.1l2.2-1.5 1.8 1.7 2-1.8 1.9 1.9 1.9-1.9 2 1.8 1.8-1.7 2.2 1.5c-.5-3.6-1-6.7-2.3-10.1z;
                    M6.2 16c-1.3 3.4-2 6.7-2 10.2l1.9-1.8 1.9 2 1.9-2 2 2 2-2 1.9 2 1.9-2 1.9 1.8c0-3.5-.7-6.8-2-10.2z"/>
        </path>
        <!-- cabeça -->
        <path d="M3.4 12.4c0-4.9 3.6-8.3 8.6-8.3s8.6 3.4 8.6 8.3c0 5.3-3.7 8.9-8.6 8.9s-8.6-3.6-8.6-8.9z" fill="#eaf4fb"/>
        <!-- Cabelo: massa escura que desce pelas têmporas em duas madeixas,
             passando da altura dos olhos. Terminado numa linha reta sobre a
             testa ele lia como touca, não como cabelo. -->
        <path d="M3.5 12.6C3.5 7 7.2 3.7 12 3.7s8.5 3.3 8.5 8.9c-.5-1.6-1-2.8-1.6-3.6-.3 1.6-.5 2.9-.6 4-.5-1.6-.9-3-1.2-4.4-2.4 1-7 1-9.4 0-.3 1.4-.7 2.8-1.2 4.4-.1-1.1-.3-2.4-.6-4-.6.8-1.1 2-1.6 3.6z" fill="#222a36"/>
        <!-- Coque espetado, a ponta de abacaxi: é o sinal mais rápido de
             reconhecimento, então é o maior dos três. -->
        <path d="M10.4 4.4 12.1-.4l1.8 4.8 2.2-2.6-.7 3.4z" fill="#222a36"/>
        <!-- Mechas prateadas. Vão por cima do cabelo e em prata cheia: no tom
             anterior elas sumiam dentro do escuro e não existiam. -->
        <path d="M9.6 4.1c-.8 1.4-1.3 2.8-1.5 4.3M14.6 4c.7 1.4 1.1 2.9 1.3 4.4M12.2 1.1l.5 2.6"
              stroke="#d9e5f1" stroke-width="0.9" stroke-linecap="round" fill="none"/>
        <!-- A marca de prata no rosto -->
        <path d="M6.5 12.2c.6 1.4.7 2.8.4 4.2" stroke="#dbe6f2" stroke-width="1.2" stroke-linecap="round" fill="none"/>
        <!-- olhos em ×: está morto -->
        <path d="M8.2 12.1l2.2 2.2M10.4 12.1l-2.2 2.2M13.8 12.1l2.2 2.2M16 12.1l-2.2 2.2" stroke="#0b131e" stroke-width="1.1" stroke-linecap="round"/>
        <!-- boca aberta, pequena -->
        <ellipse cx="12.1" cy="17.4" rx="1.5" ry="1.9" fill="#0b131e"/>
      </symbol>
    </svg>

    <!-- As almas sobem devagar, desviando, e apagam antes do topo. -->
    <span class="alma a1" aria-hidden="true"><svg viewBox="0 0 24 34"><use href="#almaChibi"/></svg></span>
    <span class="alma a2" aria-hidden="true"><svg viewBox="0 0 24 34"><use href="#almaChibi"/></svg></span>
    <span class="alma a3" aria-hidden="true"><svg viewBox="0 0 24 34"><use href="#almaChibi"/></svg></span>
    <span class="alma a4" aria-hidden="true"><svg viewBox="0 0 24 34"><use href="#almaChibi"/></svg></span>
    <span class="alma a5" aria-hidden="true"><svg viewBox="0 0 24 34"><use href="#almaChibi"/></svg></span>

    <div class="deaths-head" role="group" aria-label="Deaths">
      <span class="deaths-kanji">死</span>
      <span class="deaths-count" id="deathsCount">—</span>
      <span class="deaths-rot">deaths</span>
    </div>

    <div class="therm" id="therm">
     <div class="therm-rail">
      <!-- A caveira é o emoji do sistema, não um desenho nosso: assim cada
           aparelho renderiza a dele, e no iPhone sai a caveira da Apple. -->
      <div class="therm-pin" id="thermPin"><span class="therm-skull" role="img" aria-label="deaths">💀</span></div>

      <div class="therm-track"><div class="therm-fill" id="thermFill"></div></div>
      <div class="therm-scale">
        <span>0</span><span>250</span><span>500</span><span>750</span><span>1000</span>
      </div>
     </div>
    </div>

    <div class="deaths-note" id="deathsNote"></div>
  </section>

  <!-- Bloco 3: progresso e tempo de jogo, lado a lado, quadrados. -->
  <div class="dois-quadrados">
    <!-- Anel em vez de barra: num quadrado 1:1 a barra fina deixava a maior
         parte do espaço vazio, e o anel ocupa o quadrado inteiro dizendo a
         mesma coisa. O número vive no meio dele. -->
    <section class="quadro quadro-anel" id="anelPanel">
      <button class="anel-abre" id="anelHead" type="button" aria-expanded="false" aria-controls="conqLista" title="Open the full list of achievements, by difficulty">
        <div class="anel">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <linearGradient id="chama" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0%"   stop-color="#8c1a10"/>
                <stop offset="45%"  stop-color="#ff6a1e"/>
                <stop offset="78%"  stop-color="#ffc24a"/>
                <stop offset="100%" stop-color="#fff2c2"/>
              </linearGradient>
            </defs>
            <circle class="anel-trilho" cx="50" cy="50" r="42"/>
            <circle class="anel-fio" id="anelFio" cx="50" cy="50" r="42"/>
            <!-- A coroa de fogo: só aparece quando a sessão rendeu duas ou
                 mais conquistas, e some sozinha seis horas depois. -->
            <circle class="anel-fogo" id="anelFogo" cx="50" cy="50" r="42"/>
          </svg>
          <div class="anel-meio">
            <span class="anel-pct" id="overallPct">—</span>
            <span class="anel-num" id="overallCount">—</span>
          </div>
        </div>
        <span class="quadro-rot quadro-rot-centro" id="overallLabel">complete</span>
      </button>
    </section>

    <section class="quadro" id="quadroTempo">
      <!-- O número é a peça: grande, no meio, e com o metal do momento. A
           barra abaixo situa isso numa escala de 0 a 200 horas. -->
      <div class="tempo-meio">
        <span class="tempo-num" id="tempoNum">—</span>
        <span class="quadro-rot" id="tempoRot">playtime</span>
      </div>
      <div class="quadro-pe">
        <div class="marcos" id="marcos"></div>
        <div class="marcos-esc"><span>0</span><span>100h</span><span>200h</span></div>
      </div>
    </section>
  </div>

  <!-- Fora da grade, logo depois dela: aberta, empurra o resto para baixo pelo
       fluxo normal do documento, como as listas de chefe e de Headless. -->
  <div class="conq-lista" id="conqLista" hidden></div>


  <div id="novidades"></div>

  <div id="essentials"></div>
  <div id="beads"></div>
  <div id="seeds"></div>
  <div id="bosses"></div>
  <div id="minibosses"></div>
  <div id="headless"></div>
  <div id="idols"></div>
  <div id="categories"></div>

  <footer class="made-by">made by oaovito</footer>

</div>

<script>
// O 4º campo de cada item é a chave de sincronização: "<chave>" para memória de
// chefe, "flag:" para event flag, "tool:"/"art:" para registro de arma e
// "good:" para posse de item. Toda linha tem uma — nada aqui é marcado à mão.
// Chefes, mini-chefes e Headless saem das secoes proprias, montadas a partir
// do save: nomes, areas e drops vem do config verificado, nao daqui. O que
// sobra aqui e o que nenhuma delas cobre.
const DATA = [
  { name: "Other Encounters", items: [
    ["Great Serpent", "Sunken Valley", "", "good:greatSerpent"],
  ]},
  { name: "Prosthetic Tools", items: [
    ["Loaded Axe", "", "", "tool:loadedAxe"],
    ["Sabimaru", "", "", "tool:sabimaru"],
    ["Loaded Spear", "", "", "tool:loadedSpear"],
    ["Shinobi Firecracker", "", "", "tool:shinobiFirecracker"],
    ["Flame Vent", "", "", "tool:flameVent"],
    ["Loaded Shuriken", "", "", "tool:loadedShuriken"],
    ["Loaded Umbrella", "", "", "tool:loadedUmbrella"],
    ["Mist Raven's Feathers", "", "", "tool:mistRaven"],
    ["Lazulite Sacred Flame", "Flame Vent upgrade", "", "tool:lazuliteFlame"],
    ["Finger Whistle", "", "", "tool:fingerWhistle"],
    ["Divine Abduction", "", "", "tool:divineAbduction"],
