    position: absolute; inset: 0;
    border: 2px solid transparent;
    border-image: linear-gradient(180deg,
      #1b0f2b 0%, #4e1a78 20%, #7c3aba 38%, #b06bf0 50%,
      #7c3aba 62%, #4e1a78 80%, #1b0f2b 100%) 1;
    animation: medo-borda 3.7s ease-in-out infinite;
    animation-play-state: var(--anim, running);
    pointer-events: none;
  }
  /* no jogo: 怖: o medidor de Terror enchendo de roxo na borda da tela */
  @keyframes medo-borda {
    0%, 100% { opacity: 0.4;  filter: saturate(0.8) brightness(0.8); }
    38%      { opacity: 1;    filter: saturate(2) brightness(1.5); }
    52%      { opacity: 0.55; filter: saturate(1.2) brightness(1); }
  }
  /* Tremor curto e irregular: sustos, não balanço.
     O susto ficou mais violento — deslocamento cerca de quatro vezes maior,
     com giro e um empurrão de escala. O que não mudou foi a janela: ela
     continua sendo a mesma fatia do ciclo de 6,1s, de 88% a 100%. É isso que
     mantém igual o intervalo de espera entre um susto e o próximo; a
     intensidade subiu pelo tamanho e pela quantidade de solavancos dentro da
     janela, não por ela ter esticado. */
  /* Os vetores do susto apontam todos para baixo — sudoeste e sudeste,
     alternando —, e a escala só encolhe. Isso é o que faz o movimento
     comunicar medo em vez de agitação: quem se assusta se encolhe e recua
     para baixo, não pula para cima. Um tremor com componente para o norte
     lia como energia, como um bicho batendo na caixa por dentro. */
  /* no jogo: 怖: o solavanco do Terror, que encolhe e recua para baixo */
  @keyframes tremor {
    0%, 88%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
    88.7% { transform: translate(-7px, 5px) rotate(-1.4deg) scale(0.984); }
    90%   { transform: translate(6px, 6px)  rotate(1.2deg)  scale(0.978); }
    91.2% { transform: translate(-8px, 4px) rotate(-1.6deg) scale(0.974); }
    92.4% { transform: translate(7px, 5px)  rotate(1.4deg)  scale(0.981); }
    93.6% { transform: translate(-6px, 3px) rotate(-1.1deg) scale(0.987); }
    94.8% { transform: translate(5px, 4px)  rotate(0.9deg)  scale(0.99); }
    96%   { transform: translate(-4px, 2px) rotate(-0.7deg) scale(0.994); }
    97.2% { transform: translate(3px, 2px)  rotate(0.5deg)  scale(0.997); }
    98.4% { transform: translate(-2px, 1px) rotate(-0.3deg) scale(0.999); }
  }
  .headless-kanji { color: #b06bf0; text-shadow: 0 0 16px rgba(176,107,240,0.9), 0 0 38px rgba(124,58,186,0.6); }
  /* O número era roxo sobre fundo roxo: de longe sumia dentro do próprio
     bloco. Agora é luz de espírito — branco frio puxando para o azul em cima,
     resolvendo em violeta escuro embaixo. Contrasta com o fundo por
     temperatura e por brilho, continua no tema porque a raiz do gradiente e o
     halo em volta seguem roxos, e não se confunde com o vermelho do bloco de
     chefes ao lado. */
  .headless-num {
    background-image: linear-gradient(180deg,
      #f6fdff 0%, #c3ecff 20%, #86caf2 42%, #6470d8 66%, #2a1550 100%);
    background-size: 100% 300%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
    animation: escorrer-forte 4.3s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(198,236,255,0.85))
            drop-shadow(0 0 26px rgba(176,107,240,0.75))
            drop-shadow(0 2px 2px rgba(0,0,0,0.85));
  }
  .headless-quadro .pingo {
    background: linear-gradient(180deg, #b06bf0, #3d1361 60%, transparent);
  }
  .headless-quadro .jorro {
    background: linear-gradient(0deg, #c98cf5, #7c3aba 42%, #3d1361 78%, rgba(40,12,70,0));
  }
  .headless-quadro .respingo { background: #6b2ba6; }
  .headless-quadro .poca {
    background: linear-gradient(0deg, rgba(74, 26, 120, 0.85), rgba(74,26,120,0.25) 55%, rgba(74,26,120,0));
  }

  /* --- a lista que os dois quadrados abrem --- */
  /* Fica fora da grade dos quadrados, logo depois dela: aberta, empurra o que
     vem abaixo pelo fluxo normal do documento; fechada, devolve tudo ao lugar.
     Nada de medir altura nem animar no script. */
  .boss-lista {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr));
    gap: 10px;
    margin: -6px 0 22px;
  }
  /* `hidden` sozinho não vence `display: grid` do autor: sem esta regra a
     lista continuava aberta mesmo marcada como escondida. */
  .boss-lista[hidden] { display: none; }

  .boss-card {
    position: relative;
    border: 1px solid var(--line);
    background: var(--bg-panel);
    padding: 10px 10px 9px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }
  /* Quem ainda não caiu fica apagado, e não ausente: a lista continua sendo o
     mapa inteiro, não só o que já foi feito. */
  .boss-card.zero { opacity: 0.42; }
  .boss-card-n {
    position: absolute; top: 5px; right: 7px;
    font-family: var(--font-display);
    font-size: 0.82rem;
    color: var(--blood-bright);
    font-variant-numeric: tabular-nums;
  }
  .headless-lista .boss-card-n { color: #b06bf0; }
  .boss-icone {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.35);
    font-size: 1.7rem;
    color: var(--text-dim);
    overflow: hidden;
  }
  /* Com arte o kanji sai e a imagem preenche o quadrado; o enquadramento de
     cada chefe vem do JSON, porque as ilustrações não têm o mesmo corte. */
  .boss-icone.com-arte { font-size: 0; background-color: #0b0908; }
  .boss-card-nome {
    font-family: var(--font-display);
    font-size: 0.92rem;
    line-height: 1.25;
    text-align: center;
    color: var(--text);
  }
  .boss-card-area {
    font-size: 0.66rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    text-align: center;
  }

  /* --- menu de tópicos --- */
  /* Sem fio embaixo e sem os botões colados: o menu era uma régua de texto
     onde nada parecia clicável. Agora cada tópico é uma peça com contorno
     próprio, e o espaço entre elas faz o trabalho que a linha fazia. */
  .topics {
    display: flex;
    flex-wrap: wrap;
    /* Centrado sob o título, que também é centrado. No celular a regra de
       tela estreita volta a alinhar à esquerda: lá cada tópico ocupa meia
       fileira e a gaveta vai para a direita. */
    justify-content: center;
    gap: 8px;
    margin-bottom: 26px;
  }
  /*
   * O menu, na estética do jogo.
   *
   * A versão anterior era caixa: fundo, borda de 1px, cantos, sombra. Isso é
   * linguagem de formulário, e o Sekiro não tem nada disso — a interface dele
   * é tinta sobre papel, traço fino, sem moldura. Uma fileira de retângulos no
   * topo brigava com a página inteira, que é escura e sóbria.
   *
   * Agora são palavras. O que marca é o traço embaixo: pincelada que afina nas
   * pontas em vez de linha reta, porque linha reta de espessura constante é
   * régua, não pincel. No escolhido ela é vermelhão de selo — a cor do carimbo
   * hanko, que é como o jogo marca o que vale.
   */
  .topic {
    appearance: none;
    position: relative;
    background: none;
    border: 0;
    border-radius: 0;
    color: var(--text-dim);
    font-family: var(--font-display);
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.5rem 0.2rem 0.62rem;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.2s ease, letter-spacing 0.2s ease;
  }
  /*
   * A pincelada.
   *
   * Três paradas de opacidade desiguais e uma altura de 2px que o `scaleY`
   * estica: isso dá a barriga no meio e a ponta seca nas extremidades, que é o
   * que diferencia pincel de régua. Ela nasce recolhida no centro.
   */
  .topic::after {
    content: "";
    position: absolute;
    left: 50%; right: 50%; bottom: 0.18rem;
    height: 2px;
    background: linear-gradient(90deg,
      rgba(214, 210, 200, 0) 0%,
      rgba(214, 210, 200, 0.75) 22%,
      rgba(214, 210, 200, 0.95) 52%,
      rgba(214, 210, 200, 0.55) 78%,
      rgba(214, 210, 200, 0) 100%);
    border-radius: 2px;
    transform: scaleY(0.55);
    transition: left 0.26s cubic-bezier(0.2, 0.8, 0.3, 1),
                right 0.26s cubic-bezier(0.2, 0.8, 0.3, 1),
                transform 0.26s ease, background 0.2s ease;
  }
  .topic:hover {
    color: var(--paper);
    letter-spacing: 0.22em;
  }
  .topic:hover::after { left: 0; right: 0; }
  .topic:focus-visible { outline: 0; color: var(--paper); }
  .topic:focus-visible::after { left: 0; right: 0; }

  /* O escolhido: vermelhão de selo, traço cheio e um ponto acima — o mesmo
     gesto de marcar no papel. */
  .topic.on { color: var(--paper); }
  .topic.on::after {
    left: 0; right: 0;
    transform: scaleY(1.1);
    background: linear-gradient(90deg,
      rgba(200, 40, 24, 0) 0%,
      rgba(214, 60, 36, 0.9) 18%,
      #d6402a 50%,
      rgba(214, 60, 36, 0.75) 82%,
      rgba(200, 40, 24, 0) 100%);
    box-shadow: 0 0 10px rgba(214, 64, 42, 0.45);
  }

  /* A contagem: miúda, alta e apagada, como anotação ao lado da palavra. */
  .topic-n {
    margin-left: 0.5rem;
    font-family: var(--font-body);
    font-size: 0.6rem;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    opacity: 0.65;
    font-variant-numeric: tabular-nums;
    vertical-align: super;
  }
  .topic:hover .topic-n { opacity: 0.95; color: var(--gold); }
  .topic.on .topic-n { color: var(--paper); opacity: 0.7; }

  /* --- a escolha de jogos --- */
  .jogos-nota {
    margin: 0 0 0.9rem;
    font-size: 0.78rem;
    line-height: 1.5;
    color: var(--text-dim);
  }
  .jogos-lista { display: flex; flex-direction: column; gap: 0.55rem; }
  /*
   * Cada jogo é uma linha inteira clicável, e não um quadradinho com rótulo ao
   * lado: alvo grande é o que faz isto funcionar no celular, onde a janela
   * também abre.
   */
  .jogo-linha {
    display: flex; align-items: center; gap: 0.8rem;
    width: 100%;
    padding: 0.6rem 0.2rem;
    background: none; border: 0;
    border-bottom: 1px solid var(--line);
    color: var(--text);
    text-align: left;
    cursor: pointer;
    font: inherit;
  }
  .jogo-linha:last-child { border-bottom: 0; }
  .jogo-linha[disabled] { cursor: default; opacity: 0.75; }
  /* A marca de vigiado é a chama, a mesma do bloco de mortes: onde ela está
     acesa, a aplicação acende. */
  .jogo-marca {
    flex: 0 0 auto;
    width: 1.1rem; height: 1.5rem;
    background-image: url("icones/chama.svg");
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0.18;
    filter: grayscale(1);
    transition: opacity 0.25s ease, filter 0.25s ease;
  }
  .jogo-linha.vigiado .jogo-marca {
    opacity: 1;
    filter: none;
    animation: vela 6.4s ease-in-out infinite;
  }
  .jogo-nome { font-family: var(--font-display); font-size: 0.95rem; }
  .jogo-estado {
    margin-left: auto;
    font-size: 0.62rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .jogo-linha.vigiado .jogo-estado { color: #5ec8f0; }

  /* A gaveta: três risquinhos, e o que não tem vaga fixa no menu mora dentro. */
  .gaveta { position: relative; }
  .gaveta-bt {
    display: inline-flex; flex-direction: column; justify-content: center;
    gap: 3px; padding: 12px 11px; min-width: 38px;
  }
  .gaveta-bt span {
    display: block; width: 14px; height: 2px;
    background: currentColor; border-radius: 1px;
    transition: transform 0.18s ease, opacity 0.18s ease;
  }
  .gaveta.aberta .gaveta-bt span:nth-child(1) { transform: translateY(5px) rotate(45deg); }
  .gaveta.aberta .gaveta-bt span:nth-child(2) { opacity: 0; }
  .gaveta.aberta .gaveta-bt span:nth-child(3) { transform: translateY(-5px) rotate(-45deg); }
  .gaveta-menu {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 20;
    min-width: 190px;
    border: 1px solid var(--line);
    background: var(--bg-panel);
    box-shadow: 0 10px 26px rgba(0,0,0,0.5);
  }
  .gaveta-item {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; gap: 12px;
    appearance: none; background: none; border: 0;
    border-bottom: 1px solid var(--line);
    padding: 12px 14px;
    font-family: var(--font-body); font-size: 0.7rem;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-dim); cursor: pointer; white-space: nowrap;
  }
  .gaveta-item:last-child { border-bottom: 0; }
  .gaveta-item:hover { color: var(--text); background: rgba(168,133,61,0.10); }
  .gaveta-item.on { color: var(--paper); background: var(--blood); }

  section.category {
    margin-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  /* `hidden` sozinho não vence a especificidade de section.category em alguns
     navegadores; explicitar evita a aba trocar e nada sumir. */
  section.category[hidden] { display: none; }
  .cat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    cursor: pointer;
    user-select: none;
    gap: 14px;
  }
  .cat-title-group { display: flex; align-items: baseline; gap: 10px; flex: 1; min-width: 0; }
  .cat-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.05rem;
    white-space: nowrap;
  }
  .cat-progress-text { font-size: 0.78rem; color: var(--text-dim); white-space: nowrap; }
  .cat-mini-bar {
    flex: 1;
    height: 3px;
    background: var(--bg-panel);
    min-width: 30px;
  }
  .cat-mini-fill {
    height: 100%;
    background: var(--gold);
    width: 0%;
    transition: width 0.4s ease;
  }
  /* Alfinete desenhado, não emoji: o emoji trazia cor e brilho que não são
     desta página, e não acompanhava o tema. Alvo de 34px porque o alvo de
     verdade no celular é o dedo, não o desenho. */
  .cat-header .pin {
    appearance: none;
    background: none;
    border: 0;
    padding: 0;
    width: 34px;
    height: 34px;
    margin: -8px -6px -8px 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    order: 1;
    color: var(--text-dim);
    opacity: 0.45;
    transition: opacity 0.15s ease, color 0.15s ease;
  }
  .cat-header .pin svg { width: 13px; height: 13px; display: block; }
  .cat-header .pin:hover { opacity: 0.9; }
  .cat-header .pin.on { opacity: 1; color: var(--gold); }
  .cat-header .chevron { order: 2; }

  .chevron {
    color: var(--text-dim);
    font-size: 0.75rem;
    transition: transform 0.25s ease;
    flex-shrink: 0;
  }
  .category.open .chevron { transform: rotate(90deg); }

  .items {
    display: none;
    padding: 0 0 18px 0;
  }
  .category.open .items { display: block; }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 9px 2px;
    border-bottom: 1px dashed var(--line);
  }
  .item:last-child { border-bottom: none; }
  .item input[type="checkbox"] {
    appearance: none;
    width: 18px;
    height: 18px;
    min-width: 18px;
    margin-top: 2px;
    border: 1px solid var(--gold);
    background: transparent;
    cursor: default;
    position: relative;
    border-radius: 2px;
  }
  .item input[type="checkbox"]:disabled { opacity: 1; }
  .item input[type="checkbox"]:checked {
    background: var(--blood-bright);
    border-color: var(--blood-bright);
  }
  .item input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 5px;
    top: 1px;
    width: 5px;
    height: 9px;
    border: solid var(--paper);
    border-width: 0 2px 2px 0;
    transform: rotate(40deg);
  }
  .item label {
    flex: 1;
    font-size: 0.92rem;
    line-height: 1.4;
    cursor: default;
  }
  .item.done label { color: var(--text-dim); text-decoration: line-through; text-decoration-color: var(--blood); }
  .item .loc { display: block; font-size: 0.72rem; color: var(--text-dim); margin-top: 1px; }
  .item .tag {
    font-size: 0.68rem;
    color: var(--gold);
    border: 1px solid var(--line);
    padding: 1px 6px;
    border-radius: 2px;
    white-space: nowrap;
    align-self: center;
  }

  /* --- sincronização com o save (mesma linguagem visual das tags) --- */
  .sync-line {
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  /* O ponto é um botão. Ele mostra 6px, mas a área de clique é 20px: num
     celular ninguém acerta um alvo de seis pixels. A margem negativa põe o
     ponto de volta exatamente onde ele estava antes de virar botão. */
  .sync-dot {
    appearance: none;
    border: 0;
    background: none;
    padding: 0;
    width: 20px;
    height: 20px;
    margin: -7px 0 -7px -6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .sync-dot::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: transform 0.15s ease;
  }
  .sync-dot:hover::before { transform: scale(1.5); }
  .sync-dot.on::before { background: var(--gold); }
  .sync-dot.off::before { background: var(--blood); }
  .sync-dot[aria-expanded="true"]::before { transform: scale(1.5); }
  .item .tag.auto { color: var(--gold); border-color: var(--gold); }

  /* --- contadores da seção de itens essenciais --- */
  .item.counter { align-items: center; }
  .count-ctl { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .count-val {
    min-width: 34px;
    text-align: right;
    font-family: var(--font-body);
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text);
  }
  .count-ctl .of { font-size: 0.72rem; color: var(--text-dim); white-space: nowrap; min-width: 26px; }
  .sub-head {
    font-size: 0.7rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 14px 2px 4px;
    border-bottom: 1px dashed var(--line);
  }
  .item .tag.pending { color: var(--text-dim); border-color: var(--line); }
  .item input[type="checkbox"].pending { border-style: dashed; opacity: .45; }
  .cat-aviso {
    font-size: 0.72rem;
    color: var(--text-dim);
    padding: 10px 2px 2px;
    line-height: 1.5;
  }

  /* --- novidades desde a última visita --- */
  .novidades {
    border: 1px solid var(--gold);
    border-radius: 3px;
    padding: 12px 14px 10px;
    margin-bottom: 26px;
  }
  .nov-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }
  .nov-titulo {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--gold);
  }
  .nov-lista { list-style: none; margin: 0; padding: 0; }
  .nov-lista li {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 0.82rem;
    padding: 4px 0;
    border-bottom: 1px dashed var(--line);
  }
  .nov-lista li:last-child { border-bottom: none; }
  .nov-lista .nov-tipo {
    font-size: 0.66rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    min-width: 74px;
    flex-shrink: 0;
  }
  .nov-lista .nov-label { flex: 1; min-width: 0; }
  .nov-lista .nov-texto { color: var(--gold); white-space: nowrap; }
  .nov-mais { font-size: 0.72rem; color: var(--text-dim); padding-top: 6px; }
  .visto-btn {
    background: none;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: var(--font-body);
    font-size: 0.7rem;
    padding: 4px 9px;
    border-radius: 2px;
    cursor: pointer;
    white-space: nowrap;
  }
  .visto-btn:hover { background: var(--gold); color: var(--ink); }
  .item .novo {
    width: 6px;
    height: 6px;
    min-width: 6px;
    border-radius: 50%;
    background: var(--gold);
    align-self: center;
  }
  .cat-novo {
    font-size: 0.66rem;
    color: var(--ink);
    background: var(--gold);
    border-radius: 8px;
    padding: 0 6px;
    white-space: nowrap;
  }

  /* Em tela estreita o título longo + a barrinha decorativa estouram a largura
     e a página passa a rolar para o lado. A contagem por seção continua. */
  @media (max-width: 460px) {
    h1 { font-size: 2.3rem; }
    .assinatura { font-size: 0.8rem; letter-spacing: 0.16em; }
    .topic { font-size: 0.64rem; padding: 11px 11px; letter-spacing: 0.06em; }
    .topics { gap: 6px; }
    .boss-card-nome { font-size: 0.85rem; }
    .deaths-panel { padding: 18px 16px 14px; }
    /* Dedo, não cursor: linha do menu e cabeçalho de seção ficam mais altos,
       e o alfinete ganha folga do chevron para não haver clique trocado. */
    .topic { font-size: 0.66rem; padding: 12px 11px 11px; letter-spacing: 0.06em; }
    .cat-header { padding: 16px 0; gap: 8px; }
    .cat-header .pin { width: 40px; height: 40px; margin: -10px -8px -10px 0; }
    .chevron { padding: 8px 0 8px 6px; }
    .dois-quadrados { gap: 10px; }
    .quadro { padding: 13px 14px; }
    .quadro-num { font-size: 1.7rem; }
    .skill { font-size: 2.1rem; }
    .boss-lista { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    .topic-n { margin-left: 5px; font-size: 0.6rem; }
    /* A rolagem lateral aqui era de quando o menu tinha onze tópicos e nenhuma
       gaveta. Com três tópicos e os três risquinhos ela só atrapalha: no
       celular o último item ficava cortado na borda e era preciso arrastar
       para descobrir que existia. Agora o menu quebra em duas colunas e cabe
       inteiro na tela, sem nada escondido fora do quadro. Duas colunas em vez
       de uma linha apertada continuam valendo se algum item for afixado. */
    .topics {
      flex-wrap: wrap;
      justify-content: flex-start;
      row-gap: 6px;
    }
    /* Só os filhos diretos: o botão da gaveta também tem a classe `topic`, e
       ele precisa continuar com os três risquinhos empilhados. */
    .topics > .topic {
      flex: 1 1 calc(50% - 6px);
      min-width: 0;
      display: flex;
      align-items: baseline;
      justify-content: center;
    }
    /* A gaveta não vira meia tela: fica do tamanho dela, encostada à direita
       da última fileira. */
    .topics .gaveta { flex: 0 0 auto; margin-left: auto; }
    .deaths-count { font-size: 2.3rem; }
    .deaths-chama { width: 1.7rem; height: 2.3rem; }
    /* Pino menor e recuo menor: no celular a pista é curta e o rosto grande
       comeria boa parte dela. */
    .therm { padding: 0 18px; }
    .therm-rail { padding-top: 34px; }
    .therm-pin { width: 32px; height: 32px; }
    .therm-skull { font-size: 24px; line-height: 32px; }
    .therm-scale { font-size: 0.6rem; }
    .cat-mini-bar { display: none; }
    .cat-title { white-space: normal; }
    .cat-title-group { min-width: 0; }
  }

  /* --- menos movimento ---
   *
   * Fica no fim da folha de propósito, e isso é correção de um defeito, não
   * arrumação. Estava declarado lá em cima, perto do painel de mortes, e
   * `animation: none` com a mesma especificidade da regra que liga a animação
   * perde para ela quando vem antes. Na prática: quem pedia menos movimento no
   * sistema recebia o número de mortes parado, mas continuava levando a borda
   * sangrando, o tremor do Headless e as gotas caindo — justamente os efeitos
   * grandes, que são os que incomodam. Daqui do fim, vence todos.
   */
  @media (prefers-reduced-motion: reduce) {
    .deaths-count, .deaths-chama, .tempo-num, .boss-num, .headless-num,
    .boss-quadro::before, .headless-quadro::before, .headless-quadro {
      animation: none;
    }
    /* Sem a oscilação, a chama fica na luz cheia em vez de num quadro
       qualquer do ciclo — e as fagulhas somem, porque movimento solto é
       justamente o que quem pede menos movimento não quer. */
    .deaths-chama { opacity: 1; filter: drop-shadow(0 0 8px rgba(94, 200, 240, 0.6)); }
    .deaths-chama .fagulha { display: none; }
    .deaths-count { background-position: 50% 30%; }
    .tempo-num { background-position: 40% 50%; }
    .boss-num, .headless-num { background-position: 50% 30%; }
    .boss-quadro::before, .headless-quadro::before { opacity: 0.85; }
    .deaths-count::after, .pingo { display: none; }
  }


  /* ============================================================ tela de jogos
   *
   * A tela que vem antes da página de cada jogo. Mostra os jogos que importam
   * aqui -- os que o tracker sabe ler, os vigiados e os instalados -- com dois
   * pinos em cada um: instalado nesta máquina, e vigiado (acende a aplicação
   * quando abre). "All games" leva à lista inteira: o que está no computador e
   * o que está na biblioteca da Steam.
   *
   * Ela só existe quando a leitura trouxe a lista de jogos. Sem ela, a página
   * abre direto no progresso, como sempre abriu.
   */
  /*
   * Identidade própria, sem nada do Sekiro.
   *
   * Esta tela é a porta de entrada para qualquer jogo, então não herda o
   * papel, o sangue e o dourado da página do Sekiro. A ideia é a tela inicial
   * de um console: a arte do jogo em foco ocupa o palco, o fundo inteiro
   * assume as cores dela (a mesma arte, desfocada), e os jogos ficam num
   * trilho de pôsteres logo abaixo. A interface em si é neutra -- vidro
   * escuro, texto claro, um único sinal verde-limão para foco e ação -- para
   * que a cor venha dos jogos, não da página.
   *
   * Tipografia: Unbounded, larga e geométrica, no nome e nos rótulos; Sora
   * no texto. Tudo sai dos tokens --j-*, definidos só quando o corpo está numa
   * das duas vistas, de modo que nada vaza para a página de um jogo.
   *
   * O escuro é o padrão desta tela, com chave de tema própria ("theme-jogos").
   * O palco fica escuro nos dois temas de propósito: o texto dele está em cima
   * da arte do jogo, e a arte não muda com o tema.
   */
  body.vista-hub, body.vista-bibli {
    --j-bg: #06070a;
    --j-vidro: rgba(20, 22, 29, 0.58);
    --j-vidro-forte: rgba(12, 13, 18, 0.8);
    --j-borda: rgba(255, 255, 255, 0.1);
    --j-texto: #f5f6f8;
    --j-apagado: rgba(245, 246, 248, 0.6);
    --j-sinal: #d8ff3c;
    --j-sinal-tinta: #0c0f02;
    --j-anel: #d8ff3c;
    --j-verde: #5ee6a8;
    --j-ciano: #62d6ff;
    --j-amb: 0.6;
    --j-veu-topo: rgba(6, 7, 10, 0.35);
    --j-veu-pe: rgba(6, 7, 10, 0.94);
    --j-sombra: rgba(0, 0, 0, 0.5);
    --text: var(--j-texto);
    --text-dim: var(--j-apagado);
    --line: var(--j-borda);
    --gold: var(--j-sinal);
    --font-display: 'Unbounded', 'Segoe UI', system-ui, sans-serif;
    --font-body: 'Sora', 'Segoe UI', system-ui, sans-serif;
    background: var(--j-bg);
    color: var(--j-texto);
    font-family: var(--font-body);
    color-scheme: dark;
  }
  :root[data-theme="light"] body.vista-hub, :root[data-theme="light"] body.vista-bibli {
    --j-bg: #eceef2;
    --j-vidro: rgba(255, 255, 255, 0.6);
    --j-vidro-forte: rgba(255, 255, 255, 0.85);
    --j-borda: rgba(10, 12, 18, 0.1);
    --j-texto: #0b0d12;
    --j-apagado: rgba(11, 13, 18, 0.6);
    --j-sinal: #cff533;
    --j-sinal-tinta: #0c0f02;
    --j-anel: #6c8c00;
    --j-verde: #0d8a58;
    --j-ciano: #0a7cab;
    --j-amb: 0.45;
    --j-veu-topo: rgba(236, 238, 242, 0.3);
    --j-veu-pe: rgba(236, 238, 242, 0.93);
    --j-sombra: rgba(30, 34, 50, 0.18);
    color-scheme: light;
  }
  /* Os efeitos de borda e as cenas da página do Sekiro não entram aqui. */
  body.vista-hub::before, body.vista-hub::after,
  body.vista-bibli::before, body.vista-bibli::after,
  .vista-hub .topbar::before, .vista-bibli .topbar::before,
  .vista-hub .kaiden-cena, .vista-bibli .kaiden-cena { display: none !important; }
  .vista-hub .wrap > :not(.topbar):not(#hub),
  .vista-bibli .wrap > :not(.topbar):not(#bibli) { display: none !important; }
  .vista-hub .wrap, .vista-bibli .wrap { max-width: 76rem; position: relative; z-index: 1; }
  .vista-hub ::selection, .vista-bibli ::selection { background: var(--j-sinal); color: var(--j-sinal-tinta); }

  /* O ambiente: a arte em foco, desfocada, cobrindo a tela inteira. */
  .ambiente { display: none; }
  .vista-hub .ambiente, .vista-bibli .ambiente {
    display: block; position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }
  .ambiente img {
    position: absolute; inset: -12%; width: 124%; height: 124%; object-fit: cover;
    filter: blur(64px) saturate(1.5); opacity: 0; transition: opacity 0.9s ease;
  }
  .ambiente img.pronta { opacity: var(--j-amb); }
  .ambiente::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, var(--j-veu-topo), var(--j-veu-pe) 70%);
  }

  .hub, .bibli { padding-top: 2px; }
  .hub-topo {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
    margin: 6px 0 22px;
  }
  .hub-titulo {
    font-family: var(--font-display); font-weight: 800;
    font-size: 2.3rem; letter-spacing: -0.02em; line-height: 1;
    text-transform: none; color: var(--j-texto); margin: 0;
  }
  .hub-titulo span { color: var(--j-anel); }
  .hub-relogio {
    font-family: var(--font-display); font-weight: 500; font-size: 1.5rem;
    font-variant-numeric: tabular-nums; letter-spacing: 0.02em; color: var(--j-apagado);
  }
  .hub-sub { margin: -10px 0 22px; font-size: 0.82rem; color: var(--j-apagado); }

  /* O palco. */
  .palco {
    position: relative; overflow: hidden; isolation: isolate;
    min-height: clamp(17rem, 34vw, 29rem);
    border-radius: 26px; border: 1px solid rgba(255, 255, 255, 0.12);
    background: #0b0c10; color: #fff;
    box-shadow: 0 30px 70px var(--j-sombra);
    display: flex; align-items: flex-end;
  }
  .palco-arte { position: absolute; inset: 0; z-index: -1; }
  .palco-arte img {
    width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; display: block;
    opacity: 0; transition: opacity 0.5s ease;
  }
  .palco-arte img.pronta { opacity: 1; }
  .palco-arte::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(5, 6, 9, 0.88) 0%, rgba(5, 6, 9, 0.55) 38%, rgba(5, 6, 9, 0) 70%),
      linear-gradient(0deg, rgba(5, 6, 9, 0.75) 0%, rgba(5, 6, 9, 0) 55%);
  }
  .palco-info {
    display: flex; flex-direction: column; align-items: flex-start; gap: 14px;
    padding: clamp(20px, 3vw, 36px); max-width: min(34rem, 100%); min-width: 0;
  }
  .palco-marca { min-height: 3rem; display: flex; align-items: flex-end; max-width: 100%; }
  .palco-logo {
    display: block; max-width: min(24rem, 100%); max-height: 7.5rem; width: auto; height: auto;
    object-fit: contain; object-position: left bottom;
    filter: drop-shadow(0 4px 18px rgba(0, 0, 0, 0.6));
    opacity: 0; transition: opacity 0.4s ease;
  }
  .palco-logo.pronta { opacity: 1; }
  .palco-nome {
    margin: 0; font-family: var(--font-display); font-weight: 800;
    font-size: clamp(1.6rem, 3.4vw, 2.6rem); line-height: 1.05; letter-spacing: -0.02em;
    text-wrap: balance; overflow-wrap: anywhere; text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
  }
  .palco-meta { display: flex; flex-direction: column; gap: 10px; }
  .palco .pino {
    background: rgba(255, 255, 255, 0.1); color: rgba(255, 255, 255, 0.7);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .palco .pino-instalado.on { color: #7ff0bd; }
  .palco .pino-vigiado.on { color: #8fe0ff; }
  .palco-extra { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.78rem; color: rgba(255, 255, 255, 0.72); }
  .palco-extra span + span::before { content: "·"; margin-right: 14px; color: rgba(255, 255, 255, 0.4); }
  .palco-abre {
    appearance: none; cursor: pointer; border: 0; border-radius: 999px;
    background: #d8ff3c; color: #0c0f02; padding: 12px 22px;
    font-family: var(--font-display); font-weight: 700; font-size: 0.82rem; letter-spacing: 0.02em;
    box-shadow: 0 8px 28px rgba(216, 255, 60, 0.28);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .palco-abre:hover, .palco-abre:focus-visible { outline: 0; transform: translateY(-1px); box-shadow: 0 10px 34px rgba(216, 255, 60, 0.42); }

  /* O trilho de pôsteres. */
  .trilho-cabeca { display: flex; align-items: center; gap: 10px; margin: 30px 0 4px; flex-wrap: wrap; }
  .trilho-rotulo {
    font-family: var(--font-display); font-weight: 600; font-size: 0.76rem;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--j-texto);
  }
  .trilho-conta {
    font-family: var(--font-display); font-size: 0.7rem; font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--j-apagado); border: 1px solid var(--j-borda); border-radius: 999px; padding: 2px 9px;
  }
  .trilho-cabeca .hub-bt { margin-left: auto; }
  .trilho {
    display: grid; grid-auto-flow: column;
    grid-auto-columns: clamp(8.5rem, 13vw, 11.5rem);
    gap: 18px; overflow-x: auto; overscroll-behavior-x: contain;
    padding: 16px 12px 20px; margin: 0 -12px;
    scroll-snap-type: x proximity; scrollbar-width: thin;
    scrollbar-color: var(--j-borda) transparent;
  }
  .jogo-card {
    position: relative; min-width: 0; cursor: pointer; outline: 0;
    scroll-snap-align: start; color: var(--j-apagado);
  }
  .jogo-capa {
    position: relative; aspect-ratio: 2 / 3; max-width: 100%;
    border-radius: 14px; overflow: hidden;
    background: var(--j-vidro); border: 1px solid var(--j-borda);
    box-shadow: 0 12px 28px var(--j-sombra);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .jogo-capa img, .jogo-faixa img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    opacity: 0; transition: opacity 0.4s ease;
  }
  .jogo-capa img.pronta, .jogo-faixa img.pronta { opacity: 1; }
  .jogo-card:hover .jogo-capa { transform: translateY(-3px); }
  .jogo-card.ativo .jogo-capa, .jogo-card:focus-visible .jogo-capa {
    transform: translateY(-5px) scale(1.035);
    box-shadow: 0 0 0 3px var(--j-bg), 0 0 0 5px var(--j-anel), 0 18px 40px var(--j-sombra);
  }
  .jogo-selos { position: absolute; top: 8px; right: 8px; display: flex; gap: 5px; }
  .jogo-selos span {
    width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(8, 9, 12, 0.72); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .jogo-selos svg { width: 13px; height: 13px; display: block; }
  .jogo-selos .selo-inst { color: #7ff0bd; }
  .jogo-selos .selo-vig { color: #8fe0ff; }
  .jogo-card-nome {
    margin-top: 11px; font-size: 0.8rem; font-weight: 600; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    overflow-wrap: anywhere; transition: color 0.2s ease;
  }
  .jogo-card.ativo .jogo-card-nome { color: var(--j-texto); }

  /* A arte de reserva: o nome sobre uma cor tirada do nome. */
  .arte-vazia {
    position: absolute; inset: 0; display: flex; align-items: flex-end; padding: 12px;
    background:
      radial-gradient(circle at 80% 15%, hsl(calc(var(--h) + 40) 85% 60% / 0.55), transparent 55%),
      linear-gradient(160deg, hsl(var(--h) 60% 34%), hsl(calc(var(--h) + 30) 55% 12%));
    color: #fff;
  }
  .arte-vazia span {
    font-family: 'Unbounded', 'Segoe UI', system-ui, sans-serif; font-weight: 800;
    font-size: 1.05rem; line-height: 1.05; letter-spacing: -0.01em; text-transform: uppercase;
    overflow-wrap: anywhere; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
  }
  .arte-vazia.grande { align-items: center; justify-content: flex-end; padding: 6% 7%; }
  .arte-vazia.grande span { font-size: clamp(2.4rem, 7vw, 5.5rem); opacity: 0.22; text-align: right; }
  .jogo-faixa .arte-vazia { padding: 6px; }
  .jogo-faixa .arte-vazia span { font-size: 0.55rem; }

  /* Pinos, fora do palco. */
  .jogo-pinos { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pino {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--font-body); font-weight: 600;
    font-size: 0.64rem; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--j-apagado); opacity: 0.6;
    background: var(--j-vidro); border: 1px solid transparent; border-radius: 999px;
    padding: 4px 10px 4px 8px;
  }
  .pino svg { width: 12px; height: 12px; display: block; }
  .pino.on { opacity: 1; }
  .pino-instalado.on { color: var(--j-verde); }
  .pino-vigiado.on { color: var(--j-ciano); }
  button.pino { cursor: pointer; }
  button.pino:hover { opacity: 1; border-color: currentColor; }

  .hub-bt {
    appearance: none; cursor: pointer;
    background: var(--j-vidro); color: var(--j-texto);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border: 1px solid var(--j-borda); border-radius: 999px; padding: 9px 18px;
    font-family: var(--font-display); font-weight: 600; font-size: 0.72rem; letter-spacing: 0.08em;
    text-transform: uppercase; transition: border-color 0.15s ease, color 0.15s ease;
  }
  .hub-bt:hover, .hub-bt:focus-visible { outline: 0; border-color: var(--j-anel); color: var(--j-anel); }
  .hub-acoes { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 26px 0 8px; }
  .hub-nota { text-align: center; font-size: 0.78rem; color: var(--j-apagado); margin-top: 12px; }

  /* Todos os jogos. */
  .bibli-grupo {
    margin-bottom: 20px; padding: 8px 20px 10px;
    background: var(--j-vidro); border: 1px solid var(--j-borda); border-radius: 20px;
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  }
  .bibli-grupo h2 {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    font-family: var(--font-display); font-size: 0.76rem; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--j-texto); font-weight: 600;
    margin: 0; padding: 12px 0; border-bottom: 1px solid var(--j-borda);
  }
  .bibli-grupo h2 b {
    font-weight: 700; letter-spacing: 0; font-variant-numeric: tabular-nums;
    background: var(--j-sinal); color: var(--j-sinal-tinta); border-radius: 999px; padding: 2px 9px; font-size: 0.7rem;
  }
  .bibli-linha {
    display: grid; grid-template-columns: 7.5rem minmax(0, 1fr) auto 6.5rem; align-items: center; gap: 16px;
    padding: 12px 0; border-bottom: 1px solid var(--j-borda);
  }
  .bibli-linha:last-child { border-bottom: 0; }
  .jogo-faixa {
    position: relative; aspect-ratio: 616 / 353; max-width: 100%;
    border-radius: 9px; overflow: hidden; background: var(--j-vidro-forte);
  }
  .bibli-nome { min-width: 0; overflow-wrap: anywhere; font-size: 0.92rem; font-weight: 600; }
  .bibli-vazio { font-size: 0.82rem; color: var(--j-apagado); margin: 12px 0; }
  .bibli-abre {
    justify-self: end; appearance: none; background: none; border: 0; cursor: pointer; padding: 4px 2px;
    font-family: var(--font-display); font-weight: 700; font-size: 0.72rem; color: var(--j-anel);
  }
  .bibli-abre:hover { text-decoration: underline; }

  @media (max-width: 640px) {
    .hub-titulo { font-size: 1.75rem; }
    .hub-relogio { font-size: 1.15rem; }
    .palco { min-height: 0; aspect-ratio: auto; flex-direction: column; align-items: stretch; }
    .palco-arte { position: relative; inset: auto; z-index: 0; aspect-ratio: 16 / 9; }
    .palco-arte::after { background: linear-gradient(0deg, rgba(11, 12, 16, 1) 0%, rgba(11, 12, 16, 0) 60%); }
    .palco-info { margin-top: -3.2rem; position: relative; padding: 0 18px 20px; }
    .palco-logo { max-height: 5rem; max-width: 80%; }
    .trilho { grid-auto-columns: 38vw; gap: 12px; }
    .bibli-grupo { padding: 6px 14px 8px; }
    .bibli-linha { grid-template-columns: 5.5rem minmax(0, 1fr); gap: 8px 12px; }
    .bibli-linha .jogo-pinos, .bibli-linha .bibli-abre { grid-column: 2; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ambiente img, .palco-arte img, .palco-logo, .jogo-capa, .jogo-capa img, .jogo-faixa img { transition: none; }
    .jogo-card.ativo .jogo-capa, .jogo-card:hover .jogo-capa { transform: none; }
  }

  a, button, input { -webkit-tap-highlight-color: transparent; }
  ::selection { background: var(--blood); color: var(--paper); }
</style>
</head>
<body>
<!-- O fundo da tela de jogos: a arte do jogo em foco, desfocada. -->
<div class="ambiente" aria-hidden="true"><img id="ambienteImg" alt=""></div>
<div class="wrap">

  <!-- Faixa só para o botão de tema, no extremo topo à direita: fora do
       cabeçalho, para não disputar espaço com o título nem com a assinatura. -->
  <!-- Ponto de sync na ponta esquerda, botão de tema na direita: a faixa do
       topo passa a ser só estado e controle, e o cabeçalho fica com o título. -->
  <div class="topbar">
    <div class="sync-line" id="syncLine">
      <button class="sync-dot" id="syncDot" type="button" aria-expanded="false"></button>
      <span id="syncText" hidden>looking for the save…</span>
    </div>
    <!-- Voltar, avançar e a tela inicial, em todas as páginas. -->
    <nav class="navegar" aria-label="Navigation">
      <button class="nav-bt" id="navVoltar" type="button" title="Back" aria-label="Back"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg></button>
      <button class="nav-bt" id="navAvancar" type="button" title="Forward" aria-label="Forward"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg></button>
      <button class="nav-bt" id="navInicio" type="button" title="Home" aria-label="Home"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7.5 8 3l5.5 4.5M4 6.5V13h3V9.5h2V13h3V6.5"/></svg></button>
    </nav>
    <button class="theme-toggle" id="themeToggle" type="button" title="Switch theme" aria-label="Switch theme">◐</button>
  </div>


  <!-- A tela de jogos, antes da página de cada um. Ver o CSS "tela de jogos". -->
  <section class="hub" id="hub" hidden>
    <div class="hub-topo">
      <h1 class="hub-titulo">Tracker<span>oao</span></h1>
      <div class="hub-relogio" id="hubRelogio" aria-hidden="true"></div>
    </div>
    <div class="palco" id="hubPalco" hidden>
      <div class="palco-arte" id="palcoArte"></div>
      <div class="palco-info">
        <div class="palco-marca" id="palcoMarca"></div>
        <div class="palco-meta" id="palcoMeta"></div>
        <button class="palco-abre" id="palcoAbre" type="button" hidden>Open progress <span aria-hidden="true">→</span></button>
      </div>
    </div>
    <div class="trilho-cabeca">
      <span class="trilho-rotulo">Your games</span>
      <span class="trilho-conta" id="hubConta"></span>
      <button class="hub-bt" id="hubTodos" type="button">All games</button>
    </div>
    <div class="trilho" id="hubGrade"></div>
    <div class="hub-nota" id="hubNota"></div>
  </section>

  <!-- Todos os jogos: o que está no computador e o que está na Steam. -->
  <section class="bibli" id="bibli" hidden>
    <div class="hub-topo">
      <h1 class="hub-titulo">All <span>games</span></h1>
    </div>
    <div class="hub-sub" id="bibliSub">on this computer and in the Steam library</div>
    <div id="bibliGrupos"></div>
    <div class="hub-acoes">
      <button class="hub-bt" id="bibliVarrer" type="button" hidden>Search again</button>
    </div>
    <div class="hub-nota" id="bibliNota"></div>
  </section>

  <header class="top">
    <div class="top-centro">
      <h1>Sekiro<span> 進捗</span></h1>
      <!--
        A assinatura sai do apelido do Steam, não do HTML.

        Escrita à mão aqui, ela mentia em qualquer máquina que não a de quem
        escreveu a página: instalado no PC de outra pessoa, o tracker
        anunciava o progresso dela com nome alheio.

        Sem Steam na máquina não há apelido, e aí a linha some inteira em vez
        de virar um "player" genérico — o cabeçalho fecha e fica só o título.
        Por isso ela nasce escondida: o estado honesto é não ter nome, e quem
        preenche é a leitura.
      -->
      <div class="assinatura" id="assinatura" hidden></div>
    </div>
  </header>

  <nav class="topics" id="topics" aria-label="Sections" hidden></nav>

  <!-- Bloco 1: as duas contagens de combate, logo abaixo do menu. São o que
       se olha primeiro, então vêm primeiro. -->
  <div class="dois-quadrados">
    <!-- Contador de chefes: mesma proporção dos outros, e abre a lista. -->
    <section class="quadro quadro-botao boss-quadro" id="bossPanel" hidden>
      <button class="quadro-abre" id="bossHead" type="button" aria-expanded="false" aria-controls="bossLista">
        <span class="quadro-kanji boss-kanji">討</span>
        <span class="quadro-num boss-num" id="bossNum">—</span>
        <span class="quadro-rot">boss kills</span>
      </button>
    </section>

    <!-- Headless: roxo, e a moldura treme. -->
    <section class="quadro quadro-botao headless-quadro" id="headlessPanel" hidden>
      <button class="quadro-abre" id="headlessHead" type="button" aria-expanded="false" aria-controls="headlessLista">
        <span class="quadro-kanji headless-kanji">首</span>
        <span class="quadro-num headless-num" id="headlessNum">—</span>
        <span class="quadro-rot">headless</span>
      </button>
    </section>
  </div>

  <!--
    As listas abrem em janela, e não empurrando a página.

    Antes elas entravam no fluxo do documento: clicar em Boss kills abria 19
    cartões ali mesmo e jogava tudo que vinha abaixo para longe, obrigando a
    rolar para voltar ao que se estava vendo. Numa página que é um painel de
    números, deslocar o painel para mostrar um detalhe é o avesso do que se
    quer.

    `dialog` nativo em vez de div com `position: fixed`: traz fundo escurecido,
    foco preso dentro da janela, Esc para fechar e devolução do foco ao botão —
    tudo isso sem uma linha de script.
  -->
  <dialog class="janela" id="bossJanela">
    <div class="janela-topo">
      <span class="janela-titulo">boss kills</span>
      <button class="janela-fecha" type="button" aria-label="Close">✕</button>
    </div>
    <div class="janela-corpo">
      <div class="boss-lista" id="bossLista"></div>
    </div>
  </dialog>

  <dialog class="janela" id="headlessJanela">
    <div class="janela-topo">
      <span class="janela-titulo">headless</span>
      <button class="janela-fecha" type="button" aria-label="Close">✕</button>
    </div>
    <div class="janela-corpo">
      <div class="boss-lista headless-lista" id="headlessLista"></div>
    </div>
  </dialog>

  <!-- Bloco 2: mortes. -->
  <section class="deaths-panel" id="deaths" hidden>
    <!--
      白菊, o crisântemo branco: a flor que o Japão põe no altar e na
      sepultura. Substituiu a cortina listrada, que pela terceira vez lia como
      faixa de pedestre — a referência estava certa, o desenho é que não
      sobrevive a ser uma faixa horizontal de claro e escuro.

      Dezesseis pétalas em duas coroas, a de dentro girada meia pétala, que é
      como a flor se abre. Desenhada e não emoji: emoji traz cor e brilho que
      não são desta página, e não dá para deixar quase invisível.
    -->
    <div class="kiku" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <g fill="none" stroke="#efeadf" stroke-width="1.1" stroke-linecap="round">
          <g id="kikuCoroa">
            <path d="M50 50C50 34 50 22 50 12c6 6 9 14 9 22 0 7-4 12-9 16z"/>
            <path d="M50 50C50 34 50 22 50 12c-6 6-9 14-9 22 0 7 4 12 9 16z"/>
          </g>
          <use href="#kikuCoroa" transform="rotate(45 50 50)"/>
          <use href="#kikuCoroa" transform="rotate(90 50 50)"/>
          <use href="#kikuCoroa" transform="rotate(135 50 50)"/>
          <use href="#kikuCoroa" transform="rotate(180 50 50)"/>
          <use href="#kikuCoroa" transform="rotate(225 50 50)"/>
          <use href="#kikuCoroa" transform="rotate(270 50 50)"/>
          <use href="#kikuCoroa" transform="rotate(315 50 50)"/>
          <g opacity="0.75">
            <use href="#kikuCoroa" transform="rotate(22.5 50 50) scale(0.62) translate(30.6 30.6)"/>
            <use href="#kikuCoroa" transform="rotate(67.5 50 50) scale(0.62) translate(30.6 30.6)"/>
            <use href="#kikuCoroa" transform="rotate(112.5 50 50) scale(0.62) translate(30.6 30.6)"/>
            <use href="#kikuCoroa" transform="rotate(157.5 50 50) scale(0.62) translate(30.6 30.6)"/>
            <use href="#kikuCoroa" transform="rotate(202.5 50 50) scale(0.62) translate(30.6 30.6)"/>
            <use href="#kikuCoroa" transform="rotate(247.5 50 50) scale(0.62) translate(30.6 30.6)"/>
            <use href="#kikuCoroa" transform="rotate(292.5 50 50) scale(0.62) translate(30.6 30.6)"/>
            <use href="#kikuCoroa" transform="rotate(337.5 50 50) scale(0.62) translate(30.6 30.6)"/>
          </g>
          <circle cx="50" cy="50" r="5.5"/>
        </g>
      </svg>
    </div>

    <!-- As manchas da podridão. Vazio e invisível fora do efeito; um elemento
         próprio porque os dois pseudo-elementos do painel já são a cortina. -->
    <div class="manchas" aria-hidden="true"></div>

    
    
    <div class="deaths-head" role="group" aria-label="Deaths">
      <!--
        A chama do Ídolo, no lugar do 死.
        =================================

        O kanji dizia "morte" e estava certo, mas era o mesmo recurso do resto
        da página — os outros blocos já abrem com 討 e com 首, e um terceiro
        ideograma na mesma posição vira padrão em vez de significado.

        A chama azul diz a mesma coisa por outro caminho, e diz mais: é o fogo
        que arde no alto de todo Ídolo do Escultor, o 鬼仏, que é onde se
        ressuscita. Quem jogou reconhece a cor antes de ler o número — ela é a
        única turquesa do jogo inteiro, e aparece exatamente onde se volta
        depois de morrer.

        Desenhada e não emoji: emoji traria a paleta de outra pessoa, e o tom
        aqui é o ponto.
      -->
      <span class="deaths-chama" role="img" aria-label="deaths">
        <svg viewBox="0 0 22 30" aria-hidden="true">
          <defs>
            <!--
              O degradê do fogo do Ídolo: base quase transparente, corpo
              turquesa e ponta branca. É a ordem inversa da chama de vela, que
              é amarela na ponta — fogo espiritual no jogo tem o núcleo claro.
            -->
            <linearGradient id="chamaIdolo" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%"   stop-color="#1d5f8a" stop-opacity="0.15"/>
              <stop offset="28%"  stop-color="#2e9fd4" stop-opacity="0.75"/>
              <stop offset="62%"  stop-color="#5ec8f0"/>
              <stop offset="88%"  stop-color="#c8f4ff"/>
              <stop offset="100%" stop-color="#ffffff"/>
            </linearGradient>
            <radialGradient id="chamaNucleo" cx="50%" cy="62%" r="50%">
              <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
              <stop offset="55%"  stop-color="#a5e9ff" stop-opacity="0.5"/>
              <stop offset="100%" stop-color="#5ec8f0" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <!--
            A língua de fogo. O `d` alterna entre três desenhos com o MESMO
            número de segmentos — é o que permite interpolar entre eles —, e o
            que muda é para que lado a ponta pende. É isso que faz a chama
            lamber em vez de só crescer e encolher.
          -->
          <path fill="url(#chamaIdolo)"
                d="M11 1.2c3.4 4.3 5.2 7.6 5.2 10.4 0 3-1.5 5.2-3.4 6.3 1-2 .7-3.9-1-5.6-.6 2.6-1.9 4.2-3.9 4.9-2.4.8-4.1-.6-4.1-3.2 0-4 2.4-8.4 7.2-12.8z">
            <animate attributeName="d" dur="2.9s" repeatCount="indefinite"
              values="M11 1.2c3.4 4.3 5.2 7.6 5.2 10.4 0 3-1.5 5.2-3.4 6.3 1-2 .7-3.9-1-5.6-.6 2.6-1.9 4.2-3.9 4.9-2.4.8-4.1-.6-4.1-3.2 0-4 2.4-8.4 7.2-12.8z;
                      M11.6 0.6c2.6 4.9 4.4 8.2 4.4 11 0 3-1.8 5-3.7 6 1.2-2.1 1.1-4-.5-5.8-.9 2.5-2.3 4-4.3 4.5-2.5.6-4-.9-3.8-3.5.3-4 2.9-8.1 7.9-12.2z;
                      M10.4 1.6c4 3.8 5.7 7 5.8 9.8.1 3-1.2 5.3-3 6.5.8-2.1.3-4-1.5-5.5-.3 2.6-1.5 4.3-3.5 5.2-2.3 1-4.1-.3-4.3-2.9-.3-4 1.9-8.5 6.5-13.1z;
                      M11 1.2c3.4 4.3 5.2 7.6 5.2 10.4 0 3-1.5 5.2-3.4 6.3 1-2 .7-3.9-1-5.6-.6 2.6-1.9 4.2-3.9 4.9-2.4.8-4.1-.6-4.1-3.2 0-4 2.4-8.4 7.2-12.8z"/>
          </path>
          <!-- O miolo claro, que é o que dá o branco no meio do azul. -->
          <ellipse cx="10.6" cy="13.4" rx="2.6" ry="3.6" fill="url(#chamaNucleo)"/>
          <!--
            As fagulhas que sobem soltas. No jogo elas se desprendem da chama e
            apagam antes de chegar longe; aqui são três, em períodos que não
            são múltiplos, para nunca subirem juntas.
          -->
          <circle class="fagulha f1" cx="7.6" cy="9" r="0.85" fill="#bfefff"/>
          <circle class="fagulha f2" cx="14.2" cy="11" r="0.7" fill="#9ae0fb"/>
          <circle class="fagulha f3" cx="11" cy="7" r="0.55" fill="#e8fbff"/>
        </svg>
      </span>
      <span class="deaths-count" id="deathsCount">—</span>
      <span class="deaths-rot">deaths</span>
    </div>

    <div class="therm" id="therm">
     <div class="therm-rail">
      <!-- A caveira é o emoji do sistema, não um desenho nosso: assim cada
           aparelho renderiza a dele, e no iPhone sai a caveira da Apple.
           O bebê, antes da primeira morte, segue a mesma regra. Só um dos
           dois aparece. -->
      <div class="therm-pin" id="thermPin"><span class="therm-skull" role="img" aria-label="deaths">💀</span><span class="therm-skull therm-bebe" role="img" aria-label="no deaths yet">👶</span></div>

      <div class="therm-track"><div class="therm-fill" id="thermFill"></div></div>
      <div class="therm-scale">
        <span>0</span><span>250</span><span>500</span><span>750</span><span>1000</span>
      </div>
     </div>
    </div>

    <!--
      Os dois estados que andam junto com morrer, em ícone e não em texto.

      Os dois vêm do inventário, que é como o jogo conta estas duas coisas: o
      sino põe o "Bell Demon" na bolsa enquanto o efeito vale, e cada NPC
      adoecido larga uma Rot Essence com o nome dele. Nenhum dos dois tem
      campo próprio no save.

      Tamanhos diferentes de propósito. O sino é um liga-desliga e cabe em
      pouco: quem toca sabe que tocou, o ícone só confirma. A podridão tem
      nome, conta e gente dentro, então é a peça maior e a única que abre.
    -->
    <div class="estados" id="estados" hidden>
      <!--
        O Sino Demoníaco: duas figuras, não uma figura com duas cores.
        =============================================================

        A versão anterior era o mesmo sino em dois tons, e isso não bastava:
        quem olha de relance vê o desenho, não a saturação. Agora as duas
        leituras são diferentes de forma.

        Sem o efeito, o sino está pendurado e quieto: contorno fino, boca
        vazia, badalo recolhido, e nenhuma onda. Com o efeito, o corpo se
        preenche, o badalo aparece fora do eixo (é o que denuncia um sino que
        acabou de bater), as ondas saem dos dois lados e o conjunto inclina.

        O rótulo também troca, e troca para o nome que o jogo usa: SINISTER
        BURDEN é como a interface do Sekiro chama o estado de quem tocou o
        sino. "Bell rung" era descrição minha do que aconteceu; o que interessa
        é o nome do que se está carregando.
      -->
      <div class="estado estado-sino" id="estadoSino" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <g class="sino-ondas">
            <path d="M3.4 10.2C3.8 7.4 5 5.1 6.9 3.4"/>
            <path d="M20.6 10.2C20.2 7.4 19 5.1 17.1 3.4"/>
            <path d="M1.2 11.6C1.6 8.2 3 5.4 5.3 3.2" class="sino-onda-larga"/>
            <path d="M22.8 11.6C22.4 8.2 21 5.4 18.7 3.2" class="sino-onda-larga"/>
          </g>
          <g class="sino-corpo">
            <!-- 梵鐘: o sino de templo japonês é um cilindro de ombro reto e
                 boca larga, não a campânula ocidental de alça. -->
            <path class="sino-casco"
                  d="M12 3.1c-3.5 0-5.6 2.4-5.6 6v5.6h-1v2.1h13.2v-2.1h-1V9.1c0-3.6-2.1-6-5.6-6z"/>
            <path d="M9.1 7.6h5.8M9.1 10.6h5.8" class="sino-frisos"/>
            <circle cx="12" cy="2.2" r="1.1"/>
            <!-- O badalo. Só existe aceso, e fora do eixo: sino em repouso tem
                 o badalo no centro, e é justamente o desalinho que diz que ele
                 acabou de bater. -->
            <path class="sino-badalo" d="M12 11.4v3.4"/>
            <circle class="sino-badalo-ponta" cx="12" cy="15.4" r="1.15"/>
          </g>
          <path class="sino-tronco" d="M20.6 16.1h2.6"/>
        </svg>
        <span class="estado-rot" id="sinoRot">demon bell</span>
      </div>

      <!--
        Dragonrot: o número é a peça.
        =============================

        O pedido é claro sobre a hierarquia — "dragon rot" e a contagem de
        atingidos bem destacados —, então a contagem deixa de ser um sufixo do
        rótulo e vira o elemento maior do ícone, com o 竜 atrás dela em vez de
        ao lado. O nome fica embaixo, na mesma família do resto da página mas
        sem apagar.

        Como nos dois estados: sem podridão não há número, o 竜 fica em
        contorno vazado e a mancha não existe. Com podridão o kanji se
        preenche, a mancha nasce atrás e cresce com a contagem, e o número
        aparece por cima. São duas figuras diferentes, e não a mesma em dois
        tons.

        Quem são os atingidos continua fora do desenho: eles abrem numa janela
        ao tocar o ícone. É o que impede o ícone de virar parágrafo.
      -->
      <button class="estado estado-rot-bt" id="estadoRot" type="button"
              aria-haspopup="dialog" aria-expanded="false" hidden>
        <span class="rot-peca">
          <span class="rot-mancha" aria-hidden="true"></span>
          <span class="rot-kanji" aria-hidden="true">竜</span>
          <span class="rot-n" id="rotN" aria-hidden="true"></span>
        </span>
        <span class="estado-rot" id="rotRot">dragon rot</span>
      </button>
    </div>

    <div class="deaths-note" id="deathsNote"></div>
  </section>

  <!-- A lista de quem está com a podridão. Janela, e não bloco empurrando a
       página: é detalhe sob demanda, do mesmo jeito que as outras listas. -->
  <!--
    A cena do selo: a página inteira responde ao toque nele.

    O pedido é contemplar, então ela não é um golpe como as outras cenas — é
    lenta. Uma lavagem de tinta sobe do pé da tela, o carimbo se imprime no
    meio, e as partículas douradas atravessam o quadro. Fica fora do fluxo e
    não trava nada: quem quiser rolar a página durante, rola.
  -->
  <div class="kaiden-cena" id="kaidenCena" hidden aria-hidden="true">
    <div class="kaiden-lavagem"></div>
    <div class="kaiden-selo">皆伝</div>
    <div class="kaiden-poeira"></div>
  </div>

  <dialog class="janela" id="rotJanela">
    <div class="janela-topo">
      <span class="janela-titulo">Dragonrot</span>
      <button class="janela-fecha" type="button" aria-label="Close">&times;</button>
    </div>
    <div class="janela-corpo">
      <div class="rot-lista" id="rotLista"></div>
    </div>
  </dialog>

  <!-- Bloco 3: progresso e tempo de jogo, lado a lado, quadrados. -->
  <div class="dois-quadrados">
    <!-- Anel em vez de barra: num quadrado 1:1 a barra fina deixava a maior
         parte do espaço vazio, e o anel ocupa o quadrado inteiro dizendo a
         mesma coisa. O número vive no meio dele. -->
    <!--
      O bloco das conquistas, que muda de natureza aos 100%.

      Até lá ele é um medidor: anel, número, e pronto. Aos 100% deixa de medir
      (não há mais o que medir) e passa a comemorar — vira a peça mais alta da
      página, com o selo em cima e o anel em ouro.
    -->
    <section class="quadro quadro-anel" id="anelPanel">
      <!--
        皆伝 (kaiden), "transmissão completa": nas escolas de artes marciais
        japonesas é a licença mais alta que existe, a que diz que o mestre já
        ensinou tudo que sabe. É o que 100% significa aqui, e é mais preciso
        que 全 ou 完 — aqueles diriam "tudo" ou "fim"; este diz que não sobrou
        técnica nenhuma por aprender, que é a frase certa para um jogo sobre um
        shinobi de uma escola.

        O desenho é um 落款, o carimbo vermelhão de tinta: quadrado de cantos
        arredondados, borda grossa, kanji vazado. A borda é irregular de
        propósito — carimbo de tinta não sai perfeito, e o que sai perfeito lê
        como adesivo.

        Fica absoluto sobre o topo do quadrado: aos 100% ele aparece sem
        empurrar nada, porque não ocupa lugar no fluxo. O layout da página é o
        mesmo antes e depois.
      -->
      <button class="selo" id="selo" type="button" hidden
              aria-label="All achievements complete">
        <span class="selo-tinta" aria-hidden="true"></span>

<script>
// O 4º campo de cada item é a chave de sincronização: "<chave>" para memória de
// chefe, "flag:" para event flag, "tool:"/"art:" para registro de arma e
// "good:" para posse de item. Toda linha tem uma — nada aqui é marcado à mão.
// Chefes, mini-chefes e Headless saem das secoes proprias, montadas a partir
// do save: nomes, areas e drops vem do config verificado, nao daqui. O que
// sobra aqui e o que nenhuma delas cobre.
const DATA = [
  { name: "Other Encounters", items: [
    ["Great Serpent", "Sunken Valley", "", "good:greatSerpent"],
  ]},
  { name: "Prosthetic Tools", items: [
    ["Loaded Axe", "", "", "tool:loadedAxe"],
    ["Sabimaru", "", "", "tool:sabimaru"],
    ["Loaded Spear", "", "", "tool:loadedSpear"],
    ["Shinobi Firecracker", "", "", "tool:shinobiFirecracker"],
    ["Flame Vent", "", "", "tool:flameVent"],
    ["Loaded Shuriken", "", "", "tool:loadedShuriken"],
    ["Loaded Umbrella", "", "", "tool:loadedUmbrella"],
    ["Mist Raven's Feathers", "", "", "tool:mistRaven"],
    ["Lazulite Sacred Flame", "Flame Vent upgrade", "", "tool:lazuliteFlame"],
    ["Finger Whistle", "", "", "tool:fingerWhistle"],
    ["Divine Abduction", "", "", "tool:divineAbduction"],
    ["Puppeteer Ninjutsu", "", "ninjutsu", "good:puppeteerNinjutsu"],
    ["Phoenix's Lilac Umbrella", "Loaded Umbrella upgrade", "", "tool:phoenixUmbrella"],
  ]},
  { name: "Key Combat Arts", items: [
    ["Mortal Draw", "", "", "art:mortalDraw"],
    ["Ichimonji", "", "", "art:ichimonji"],
    ["Ichimonji: Double", "", "", "art:ichimonjiDouble"],
    ["Shadowrush", "", "", "art:shadowrush"],
    ["Whirlwind Slash", "", "", "art:whirlwindSlash"],
    ["One Mind", "", "", "art:oneMind"],
    ["Nightjar Slash", "", "", "art:nightjarSlash"],
    ["Empowered Mortal Draw", "", "", "art:empoweredMortalDraw"],
    ["Mikiri Counter", "", "", "art:mikiriCounter"],
    ["High Monk", "", "", "art:highMonk"],
    ["Ashina Cross", "", "", "art:ashinaCross"],
    ["Dragon Flash", "", "", "art:dragonFlash"],
    ["Praying Strikes", "", "", "art:prayingStrikes"],
    ["Floating Passage", "", "", "art:floatingPassage"],
  ]},
];

// Itens essenciais. `auto` diz de onde o valor vem no progress.json.
const ESSENTIALS = [
  { group: "Vitality and healing" },
  { key: "prayerBeads", label: "Prayer Beads", hint: "raise vitality and posture", auto: "beads", total: 40 },
  { key: "prayerNecklaces", label: "Prayer Necklaces", hint: "4 beads = 1 necklace", auto: "necklaces", total: 10 },
  { key: "gourdSeeds", label: "Gourd Seeds", hint: "raise healing charges", auto: "seeds", total: 9 },
  { key: "gourdCharges", label: "Healing Gourd charges", hint: "1 to start, +1 per seed given to Emma", auto: "charges", total: 10 },
  { group: "Prosthetic materials" },
  { key: "scrapIron", label: "Scrap Iron", hint: "common scrap", auto: "mat:scrapIron" },
  { key: "scrapMagnetite", label: "Scrap Magnetite", hint: "tier 2 scrap", auto: "mat:scrapMagnetite" },
  { key: "blackGunpowder", label: "Black Gunpowder", hint: "tier 1 gunpowder", auto: "mat:blackGunpowder" },
  { key: "yellowGunpowder", label: "Yellow Gunpowder", hint: "tier 2 gunpowder", auto: "mat:yellowGunpowder" },
  { key: "lumpOfFatWax", label: "Lump of Fat Wax", hint: "tier 2 wax", auto: "mat:lumpOfFatWax" },
  { key: "lumpOfGraveWax", label: "Lump of Grave Wax", hint: "tier 3 wax", auto: "mat:lumpOfGraveWax" },
  { key: "adamantiteScrap", label: "Adamantite Scrap", hint: "tier 3 scrap", auto: "mat:adamantiteScrap" },
  { key: "fulminatedMercury", label: "Fulminated Mercury", hint: "tier 3 gunpowder", auto: "mat:fulminatedMercury" },
  { key: "lapisLazuli", label: "Lapis Lazuli", hint: "endgame material", auto: "mat:lapisLazuli" },
];

/**
 * As chaves de armazenamento levam o nome do projeto.
 *
 * `guardado` lê a chave nova e, não achando nada, tenta a antiga — o nome do
 * projeto mudou e quem já usava a página tem preferências gravadas sob
 * "sekiro-progresso-*". Sem essa ponte, renomear a chave apagaria em silêncio
 * o tema escolhido e as abas alfinetadas de quem já estava usando.
 */
function guardado(chave) {
  try {
    const novo = localStorage.getItem("trackeroao-" + chave);
    if (novo !== null) return novo;
    return localStorage.getItem("sekiro-progresso-" + chave);
  } catch (e) { return null; }
}
function guardar(chave, valor) {
  try { localStorage.setItem("trackeroao-" + chave, valor); } catch (e) { /* aba anônima */ }
}
function esquecer(chave) {
  try {
    localStorage.removeItem("trackeroao-" + chave);
    localStorage.removeItem("sekiro-progresso-" + chave);
  } catch (e) { /* aba anônima */ }
}

const THEME_KEY = "theme";
// Quando este aparelho viu as novidades pela última vez. É estado de leitura,
// por aparelho — não é progresso, que continua vindo só do save.
const VISTO_KEY = "visto";

// Último progress.json lido. null = o servidor ainda não respondeu.
// A página inteira é um reflexo disto: não existe estado marcado à mão.
let sync = null;
const temSync = () => !!(sync && sync.ok);

let visto = null;
visto = guardado(VISTO_KEY);

// Prefixo que liga uma mudança do histórico à chave usada nas linhas do DATA.
const PREFIXO = {
  "boss": "",
  "mini-boss": "flag:",
  "headless": "headless:",
  "prayer-bead": "prayerBeadList:",
  "gourd-seed": "gourdSeedList:",
  "prosthetic": "tool:",
  "art": "art:",
  "item": "good:",
};

// Chave da linha -> item que aquele chefe larga. Vem do progress.json para
// ficar numa fonte só: a config do leitor, não duplicado aqui.
function dropMap() {
  const map = {};
  if (!temSync()) return map;
  for (const b of sync.bosses || []) if (b.drop) map[b.key] = b.drop;
  for (const m of sync.miniBosses || []) if (m.drop) map["flag:" + m.key] = m.drop;
  for (const g of sync.goodsUnlocks || []) if (g.drop) map["good:" + g.key] = g.drop;
  return map;
}

function novidades() {
  if (!temSync() || !Array.isArray(sync.history)) return [];
  if (!visto) return sync.history.slice();
  return sync.history.filter((h) => h.at > visto);
}

/** Chaves (do DATA) e rótulos (dos contadores) que mudaram e ainda não foram vistos. */
function marcasNovas() {
  const linhas = new Set();
  const contadores = new Set();
  for (const h of novidades()) {
    if (h.tipo === "counter") contadores.add(h.label);
    else if (PREFIXO[h.tipo] !== undefined) linhas.add(PREFIXO[h.tipo] + h.chave);
  }
  return { linhas, contadores };
}

function marcarVisto() {
  const lista = novidades();
  const maisNovo = lista.length ? lista[lista.length - 1].at : new Date().toISOString();
  visto = maisNovo;
  guardar(VISTO_KEY, visto);
  render();
}

function slug(catIdx, itemIdx) { return "c" + catIdx + "i" + itemIdx; }

// Quais seções estão abertas. Guardado fora do DOM porque a página é
// redesenhada inteira a cada sincronização (a cada poucos segundos), e sem
// isso a seção que você abriu se fecharia sozinha na próxima atualização.
const openState = new Set();
function setOpen(section, idx) {
  const open = section.classList.toggle("open");
  if (open) openState.add(idx);
  else openState.delete(idx);
  // Com uma aba escolhida, fechar a última seção dela é fechar a aba: a página
  // volta ao menu e ao estado limpo. Deixar a seção ali, aberta-mas-vazia, não
  // seria ter fechado nada.
  //
  // "Última" é o que importa desde que um tópico passou a reunir várias
  // seções: em "Items" são seis, e recolher as contas de oração para ler o
  // resto não pode derrubar a aba inteira. Enquanto sobrar uma irmã aberta,
  // vale o acordeão de sempre.
  if (!open && abaAtual) {
    const irmas = secoesDoTopico(abaAtual);
    const sobrou = topicos.some((t) => irmas.indexOf(t.nome) >= 0 &&
      t.section !== section && t.section.classList.contains("open"));
    if (!sobrou) selecionarAba(null);
  }
}

/* ------------------------------------------------------------------- abas */

/**
 * Menu de tópicos no topo.
 *
 * Cada função de render registra a seção que acabou de montar, em vez de o
 * menu sair varrendo o DOM atrás de `.cat-title`. Isso importa por dois
 * motivos: o menu nunca lista uma seção que não foi desenhada (o que aconteceu
 * de haver, porque seção sem dado nenhum não é montada), e continua verificável
 * fora do navegador.
 */
// Sem "All": o menu passou a ser três tópicos e uma gaveta, e uma aba que
// mostra tudo de uma vez desfaz o propósito de ter separado.
const ABA_CHAVE = "aba";
const FIX_CHAVE = "fixadas";
// Ordem de quem vem primeiro no menu. O resto entra depois, na ordem da página.
// Um tópico do menu pode reunir várias seções. "Items" é isso: junta tudo que
// é item numa aba só, com contas, sementes e materiais no topo — que é a ordem
// em que se consulta, não a ordem em que a página monta.
const GRUPOS = {
  Bosses: ["Bosses"],
  "Mini-bosses": ["Mini-bosses"],
  Items: ["Prayer Beads", "Gourd Seeds", "Essential Items",
    "Sculptor's Idols", "Key Combat Arts", "Other Encounters"],
};
// Fora do menu principal, atrás dos três risquinhos.
const GAVETA = { "Prosthetic Tools": ["Prosthetic Tools"] };
const ORDEM_MENU = ["Bosses", "Mini-bosses", "Items"];
let topicos = [];
let abaAtual = null;
let gavetaAberta = false;
abaAtual = guardado(ABA_CHAVE);

/** Quais seções aparecem no menu. Começa nas três e muda pelo alfinete. */
let fixadas = new Set(ORDEM_MENU);
try {
  const salvo = JSON.parse(guardado(FIX_CHAVE));
  if (Array.isArray(salvo)) fixadas = new Set(salvo);
} catch (e) { /* nada salvo, ou storage bloqueado */ }

function gravarFixadas() {
  guardar(FIX_CHAVE, JSON.stringify([...fixadas]));
}

function alternarPin(nome) {
  if (fixadas.has(nome)) {
    fixadas.delete(nome);
    // A seção aberta acabou de sair do menu. Deixá-la aberta sem botão que a
    // feche seria um beco sem saída, então volta ao estado limpo.
    if (abaAtual === nome) { abaAtual = null; esquecer(ABA_CHAVE); }
  } else {
    fixadas.add(nome);
  }
  gravarFixadas();
  renderTopicos();
}

/**
 * O alfinete vai no cabeçalho de cada seção.
 *
 * Posto aqui, e não nas cinco funções de render, porque todas montam o
 * cabeçalho como primeiro filho da seção — então dá para fazer uma vez só.
 * O clique precisa parar de subir: o cabeçalho inteiro abre e fecha a seção, e
 * sem isso alfinetar fecharia a seção junto.
 */
function aplicarPins() {
  for (const t of topicos) {
    const header = t.section.children[0];
    if (!header) continue;
    const fixo = fixadas.has(t.nome);
    const b = document.createElement("button");
    b.type = "button";
    b.className = "pin" + (fixo ? " on" : "");
    // Alfinete desenhado, e não o emoji: o emoji trazia cor e brilho que não
    // são desta página e não acompanhava o tema. Este herda `currentColor`.
    b.innerHTML =
      '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M6 1.8h4l-.7 4.1 2.4 2.3H4.3l2.4-2.3z"/>' +
      '<path d="M8 8.2V14"/></svg>';
    const rotulo = fixo ? "Remove from the menu" : "Add to the menu";
    b.title = rotulo;
    b.setAttribute("aria-label", rotulo);
    b.setAttribute("aria-pressed", fixo ? "true" : "false");
    b.addEventListener("click", (ev) => {
      if (ev && ev.stopPropagation) ev.stopPropagation();
      alternarPin(t.nome);
    });
    header.appendChild(b);
  }
}

function registrarTopico(nome, contagem, section) {
  topicos.push({ nome, contagem, section });
}

/** `null` fecha a aba: volta ao menu e à página limpa. */
function selecionarAba(chave) {
  abaAtual = chave;
  try {
    // Gravar o nulo daria a string "null" na próxima visita, que não casa com
    // tópico nenhum — funcionaria por acidente. Apagar é o que diz a verdade.
    if (chave === null) esquecer(ABA_CHAVE);
    else guardar(ABA_CHAVE, chave);
  } catch (e) { /* aba anônima */ }
  renderTopicos();
}

/** As seções que um tópico mostra. Tópico sem grupo mostra a si mesmo. */
function secoesDoTopico(nome) {
  return (GRUPOS[nome] || GAVETA[nome] || [nome]);
}

/**
 * Mostra as seções do tópico escolhido — dentro da janela.
 *
 * Valem as mesmas regras dos contadores, inclusive para o que está atrás dos
 * três risquinhos: escolher um tópico não pode empurrar a página. Antes as
 * seções apareciam no fluxo do documento, e clicar em "Items" jogava 178
 * linhas entre você e o resto do painel.
 *
 * As seções ficam onde sempre estiveram no documento e são MOVIDAS para o
 * corpo da janela quando escolhidas, voltando ao lugar quando ela fecha.
 * Movê-las preserva os nós — os ouvintes de clique e o estado aberto seguem
 * valendo — e evita manter duas cópias da mesma seção em sincronia.
 */
function aplicarAba() {
  const janela = document.getElementById("abaJanela");
  const corpo = janela ? janela.querySelector(".janela-corpo") : null;
  const alvo = abaAtual ? secoesDoTopico(abaAtual) : [];

  /*
   * O corpo da janela é refeito do zero a cada aplicação.
   *
   * `render()` reconstrói as seções inteiras — nós novos a cada leitura, de
   * cinco em cinco segundos. Mover só os atuais para dentro deixava os
   * antigos lá, e a janela mostrava a cópia velha: os números apareciam como
   * traço porque aquele nó nunca mais fora atualizado. Esvaziar antes custa
   * nada e garante que o que está na janela é o que acabou de ser desenhado.
   */
  if (corpo) corpo.innerHTML = "";

  for (const t of topicos) {
    const mostrar = alvo.indexOf(t.nome) >= 0;
    t.section.hidden = !mostrar;
    if (!mostrar) continue;
    t.section.classList.add("open");
    openState.add(t.section.dataset.idx);
    // A ordem do grupo manda: contas, sementes e materiais antes do resto.
    t.section.style.order = alvo.indexOf(t.nome);
    if (corpo) corpo.appendChild(t.section);
  }

  if (!janela) return;
  ligarJanela(janela, null);
  // Fechar a janela é fechar a aba: sem isto o menu continuaria marcado e o
  // tópico ficaria "escolhido" sem nada na tela, que é um estado mentiroso.
  if (!janela.dataset.aoFechar) {
    janela.dataset.aoFechar = "1";
    janela.addEventListener("close", () => { if (abaAtual) selecionarAba(null); });
  }
  const titulo = janela.querySelector(".janela-titulo");
  if (titulo) titulo.textContent = abaAtual || "";
  if (alvo.length) abrirJanela(janela, null);
  else if (janela.open) janela.close();
}

function renderTopicos() {
  const nav = document.getElementById("topics");
  nav.innerHTML = "";
  aplicarPins();
  if (!topicos.length) { nav.hidden = true; return; }
  nav.hidden = false;

  // A barra é os três tópicos de sempre mais o que foi alfinetado. Uma seção
  // alfinetada entra como tópico próprio: ela não pertence a nenhum dos três
  // grupos, então mostra a si mesma. Sem isto o alfinete não fazia nada — o
  // menu tinha virado uma lista fixa e o botão de alfinetar continuava lá,
  // acendendo e apagando sem efeito nenhum.
  const alfinetados = [...fixadas].filter(
    (n) => ORDEM_MENU.indexOf(n) < 0 && !GAVETA[n] && topicos.some((t) => t.nome === n));
  const BARRA = ORDEM_MENU.concat(alfinetados);

  // Estado inicial: nenhuma aba. A página abre só com o menu, e a área abaixo
  // fica vazia até alguém escolher. Aba guardada que sumiu volta para cá.
  const conhecidos = BARRA.concat(Object.keys(GAVETA));
  if (abaAtual && conhecidos.indexOf(abaAtual) < 0) abaAtual = null;

  // A contagem de um tópico é a soma das seções que ele reúne.
  const contar = (nomes) => {
    let feitos = 0, todos = 0, achou = false;
    for (const nome of nomes) {
      const t = topicos.find((x) => x.nome === nome);
      if (!t || !t.contagem) continue;
      const m = /^(\d+|—)\/(\d+)$/.exec(t.contagem);
      if (!m) continue;
      achou = true;
      if (m[1] !== "—") feitos += Number(m[1]);
      todos += Number(m[2]);
    }
    return achou ? feitos + "/" + todos : "";
  };

  const fazerBotao = (nome, classe) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = classe + (nome === abaAtual ? " on" : "");
    const c = contar(secoesDoTopico(nome));
    b.appendChild(document.createTextNode(nome));
    if (c) {
      const n = document.createElement("span");
      n.className = "topic-n";
      n.textContent = c;
      b.appendChild(n);
    }
    return b;
  };

  for (const nome of BARRA) {
    if (!secoesDoTopico(nome).some((x) => topicos.some((t) => t.nome === x))) continue;
    const b = fazerBotao(nome, "topic");
    b.addEventListener("click", () => selecionarAba(nome === abaAtual ? null : nome));
    nav.appendChild(b);
  }

  // A gaveta: o que não merece vaga fixa no menu, mas precisa existir.
  const naGaveta = Object.keys(GAVETA).filter((nome) =>
    secoesDoTopico(nome).some((x) => topicos.some((t) => t.nome === x)));
  if (naGaveta.length) {
    const wrap = document.createElement("div");
    wrap.className = "gaveta" + (gavetaAberta ? " aberta" : "");

    const bt = document.createElement("button");
    bt.type = "button";
    bt.className = "topic gaveta-bt" + (naGaveta.indexOf(abaAtual) >= 0 ? " on" : "");
    bt.title = "More sections";
    bt.setAttribute("aria-label", "More sections");
    bt.setAttribute("aria-expanded", gavetaAberta ? "true" : "false");
    for (let i = 0; i < 3; i++) bt.appendChild(document.createElement("span"));
    bt.addEventListener("click", () => { gavetaAberta = !gavetaAberta; renderTopicos(); });
    wrap.appendChild(bt);

    const menu = document.createElement("div");
    menu.className = "gaveta-menu";
    menu.hidden = !gavetaAberta;
    for (const nome of naGaveta) {
      const it = fazerBotao(nome, "gaveta-item");
      it.addEventListener("click", () => {
        gavetaAberta = false;
        selecionarAba(nome === abaAtual ? null : nome);
      });
      menu.appendChild(it);
    }
    /*
     * A escolha de jogos entra na gaveta, e não na barra: ela não é uma seção
     * do progresso, é um ajuste — e a barra é para o que se olha, não para o
     * que se configura.
     */
    const bt2 = fazerBotao("Games watched", "gaveta-item");
    bt2.addEventListener("click", () => {
      gavetaAberta = false;
      renderTopicos();
      const j = document.getElementById("jogosJanela");
      ligarJanela(j, null);
      abrirJanela(j, null);
    });
    menu.appendChild(bt2);

    wrap.appendChild(menu);
    nav.appendChild(wrap);
  }

  aplicarAba();
}
