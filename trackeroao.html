// Tudo que o save consegue confirmar sozinho, numa chave só:
//   "<chave>"      memória de chefe
//   "tool:<chave>" ferramenta protética
//   "art:<chave>"  arte de combate
function autoUnlockMap() {
  const map = {};
  if (!sync || !sync.ok) return map;
  for (const b of sync.bosses || []) if (b.defeated) map[b.key] = true;
  for (const t of sync.tools || []) if (t.unlocked) map["tool:" + t.key] = true;
  for (const a of sync.arts || []) if (a.unlocked) map["art:" + a.key] = true;
  for (const m of sync.miniBosses || []) if (m.defeated) map["flag:" + m.key] = true;
  for (const g of sync.goodsUnlocks || []) if (g.unlocked) map["good:" + g.key] = true;
  return map;
}

// Valor automático de um contador, ou null quando o save não sabe responder.
function autoCount(spec) {
  if (!temSync() || !sync.essentials) return null;
  const e = sync.essentials;
  // Um progress.json parcial devolveria undefined aqui, e quem consome testa
  // `=== null` — o que imprimiria "undefined" e contaminaria a soma com NaN.
  const num = (v) => (typeof v === "number" && isFinite(v) ? v : null);
  if (spec === "beads") return e.prayerBeads ? num(e.prayerBeads.collected) : null;
  if (spec === "necklaces") return e.prayerBeads ? num(e.prayerBeads.necklaces) : null;
  // A semente desaparece da bolsa quando é entregue à Emma, então `held` conta
  // as não entregues, não o progresso. `collected` vem das nove flags de coleta.
  if (spec === "seeds") return e.gourdSeeds ? num(e.gourdSeeds.collected) : null;
  if (spec === "charges") return e.gourdSeeds ? num(e.gourdSeeds.charges) : null;
  if (spec && spec.indexOf("mat:") === 0) {
    const key = spec.slice(4);
    const found = (e.materials || []).filter(function (m) { return m.key === key; })[0];
    return found ? num(found.qty) : null;
  }
  return null;
}

/**
 * Checklists de item colecionável: Prayer Beads e Gourd Seeds.
 *
 * Cada unidade tem flag própria no save, então a lista é nominal: não é "você
 * tem 39 de 40", é "falta esta". Faltando vem primeiro, que é o motivo de abrir
 * a lista.
 */
function renderChecklist(containerId, campo, titulo, resumoExtra) {
  const root = document.getElementById(containerId);
  root.innerHTML = "";
  const lista = temSync() && Array.isArray(sync[campo]) ? sync[campo] : null;
  if (!lista || !lista.length) return null;

  const feitos = lista.filter((x) => x.collected).length;
  const faltam = lista.filter((x) => !x.collected);
  const novas = marcasNovas();
  const novasAqui = lista.filter((x) => novas.linhas.has(campo + ":" + x.key)).length;

  const section = document.createElement("section");
  section.className = "category";
  section.dataset.idx = campo;

  const header = document.createElement("div");
  header.className = "cat-header";
  header.innerHTML = `
    <div class="cat-title-group">
      <span class="cat-title">${titulo}</span>
      <div class="cat-mini-bar"><div class="cat-mini-fill" style="width:${feitos / lista.length * 100}%"></div></div>
    </div>
    ${novasAqui ? `<span class="cat-novo">${novasAqui} new</span>` : ""}
    <span class="cat-progress-text">${feitos}/${lista.length}</span>
    <span class="chevron">▸</span>
  `;
  header.addEventListener("click", () => setOpen(section, campo));
  section.appendChild(header);

  const wrap = document.createElement("div");
  wrap.className = "items";

  const resumo = document.createElement("div");
  resumo.className = "cat-aviso";
  const porOrigem = {};
  for (const x of faltam) porOrigem[x.from] = (porOrigem[x.from] || 0) + 1;
  const partes = Object.keys(porOrigem).map((k) => porOrigem[k] + " " + k);
  resumo.textContent = faltam.length
    ? faltam.length + " missing (" + partes.join(", ") + ")."
    : "All " + lista.length + " collected.";
  if (resumoExtra) resumo.textContent += " " + resumoExtra;
  wrap.appendChild(resumo);

  const grupos = [
    { titulo: "Still missing", itens: faltam },
    { titulo: "Already collected", itens: lista.filter((x) => x.collected) },
  ];
  for (const g of grupos) {
    if (!g.itens.length) continue;
    const h = document.createElement("div");
    h.className = "sub-head";
    h.textContent = g.titulo + " (" + g.itens.length + ")";
    wrap.appendChild(h);
    for (const x of g.itens) {
      const detalhe = [x.area, x.where].filter(Boolean).join(" · ");
      const row = document.createElement("div");
      row.className = "item" + (x.collected ? " done" : "");
      row.innerHTML = `
        <input type="checkbox" ${x.collected ? "checked" : ""} disabled>
        <label>${x.label}${detalhe ? '<span class="loc">' + detalhe + "</span>" : ""}</label>
        <span class="tag auto">auto</span>
        ${novas.linhas.has(campo + ":" + x.key) ? '<span class="novo" title="new since your last visit"></span>' : ""}
      `;
      wrap.appendChild(row);
    }
  }

  section.appendChild(wrap);
  root.appendChild(section);
  registrarTopico(titulo, feitos + "/" + lista.length, section);
  return { feitos, total: lista.length };
}

/**
 * As três listas de inimigos: chefes, mini-chefes e Headless. São a mesma
 * forma — agrupadas por área, na ordem do jogo — então dividem um renderizador.
 *
 * `detected: false` significa "o save não conta isso", e não "está vivo". Nesse
 * caso a linha sai com a caixa tracejada, igual aos ídolos sem calibração: não
 * saber não é a mesma coisa que não ter feito.
 */
function renderEnemies(containerId, campo, titulo, prefixo, detalheExtra) {
  const root = document.getElementById(containerId);
  root.innerHTML = "";
  const lista = temSync() && Array.isArray(sync[campo]) ? sync[campo] : null;
  if (!lista || !lista.length) return 0;

  const rastreaveis = lista.filter((x) => x.detected !== false);
  const feitos = rastreaveis.filter((x) => x.defeated === true).length;
  const semPista = lista.length - rastreaveis.length;
  const novas = marcasNovas();
  const ehNova = (x) => novas.linhas.has(prefixo + x.key);
  const novasAqui = lista.filter(ehNova).length;

  const section = document.createElement("section");
  section.className = "category";
  section.dataset.idx = campo;

  const header = document.createElement("div");
  header.className = "cat-header";
  header.innerHTML = `
    <div class="cat-title-group">
      <span class="cat-title">${titulo}</span>
      <div class="cat-mini-bar"><div class="cat-mini-fill" style="width:${rastreaveis.length ? (feitos / rastreaveis.length * 100) : 0}%"></div></div>
    </div>
    ${novasAqui ? `<span class="cat-novo">${novasAqui} new</span>` : ""}
    <span class="cat-progress-text">${feitos}/${rastreaveis.length}</span>
    <span class="chevron">▸</span>
  `;
  header.addEventListener("click", () => setOpen(section, campo));
  section.appendChild(header);

  const wrap = document.createElement("div");
  wrap.className = "items";

  const faltam = rastreaveis.filter((x) => x.defeated !== true);
  const resumo = document.createElement("div");
  resumo.className = "cat-aviso";
  if (!faltam.length) {
    resumo.textContent = "All " + rastreaveis.length + " done.";
  } else if (faltam.length <= 6) {
    resumo.textContent = faltam.length + " left: " +
      faltam.map((x) => x.label + " (" + x.area + ")").join("; ");
  } else {
    resumo.textContent = faltam.length + " of " + rastreaveis.length + " left.";
  }
  if (semPista) {
    resumo.textContent += " " + semPista + " more " + (semPista === 1 ? "is" : "are") +
      " not recorded anywhere the save can be read from, so " +
      (semPista === 1 ? "it is" : "they are") + " left unmarked.";
  }
  wrap.appendChild(resumo);

  let areaAtual = null;
  for (const x of lista) {
    if (x.area !== areaAtual) {
      areaAtual = x.area;
      const g = document.createElement("div");
      g.className = "sub-head";
      g.textContent = areaAtual || "—";
      wrap.appendChild(g);
    }
    const rastreado = x.detected !== false;
    const marcado = rastreado && x.defeated === true;
    const detalhe = [x.drop ? "drops " + x.drop : "", detalheExtra ? detalheExtra(x) : ""]
      .filter(Boolean).join(" · ");
    const row = document.createElement("div");
    row.className = "item" + (marcado ? " done" : "");
    row.innerHTML = `
      <input type="checkbox" ${marcado ? "checked" : ""} ${rastreado ? "" : 'class="pending"'} disabled>
      <label>${x.label}${detalhe ? '<span class="loc">' + detalhe + "</span>" : ""}</label>
      ${rastreado ? '<span class="tag auto">auto</span>' : '<span class="tag pending">not tracked</span>'}
      ${ehNova(x) ? '<span class="novo" title="new since your last visit"></span>' : ""}
    `;
    wrap.appendChild(row);
  }

  section.appendChild(wrap);
  root.appendChild(section);
  registrarTopico(titulo, feitos + "/" + rastreaveis.length, section);
  return { feitos, total: rastreaveis.length };
}

/**
 * Contador de mortes no cabeçalho.
 *
 * O jogo não guarda essa conta em nenhum lugar conhecido do save, então
 * enquanto o offset não for descoberto o número é um traço, não zero — dizer
 * "0 deaths" seria afirmar algo que não sabemos.
 */
function renderDeaths() {
  const box = document.getElementById("deaths");
  const num = document.getElementById("deathsCount");
  const d = temSync() ? sync.deaths : null;

  if (!d) {                       // sem save lido ainda: não ocupar o cabeçalho
    box.hidden = true;
    return;
  }
  box.hidden = false;
  const nota = document.getElementById("deathsNote");
  const fill = document.getElementById("thermFill");
  const pin = document.getElementById("thermPin");
  const TOPO = 1000;

  if (d.known) {
    // Acima de 1000 o pino encosta no fim: a escala é essa, e esticá-la
    // silenciosamente faria as leituras anteriores mudarem de lugar.
    const pct = Math.min(d.count, TOPO) / TOPO * 100;
    box.className = "deaths-panel" + (d.count > TOPO ? " over" : "");
    num.textContent = d.count;
    fill.style.width = pct + "%";
    pin.style.left = pct + "%";
    // O jogo não guarda contagem de mortes: a busca pelo campo confirmou isso
    // na prática, depois de dez gravações. Então o número é contado por nós, e
    // o texto diz exatamente o que ele é — inclusive o que ele não pega.
    box.title =
      d.how === "counted"
        ? "Counted by watching the save since " +
          (d.desde ? new Date(d.desde).toLocaleDateString() : "tracking started") +
          ". A death only shows up when it costs Sen, and Unseen Aid cancels that loss sometimes."
        : "Read straight from the save.";
    // O painel não carrega parágrafo: é um número para ler de relance. A
    // ressalva não some do produto, muda de lugar — está no `title` acima,
    // que já diz desde quando a conta vale e o que ela não pega.
    nota.textContent =
      d.how === "discovered" && d.count > TOPO ? "Past the end of the scale." : "";
    guardarRessalva(box);
    return;
  }

  box.className = "deaths-panel unknown";
  num.textContent = "—";
  fill.style.width = "0%";
  pin.style.left = "0%";

  const p = d.progresso || {};
  if (d.how === "not-in-save") {
    nota.textContent = "The save does not record deaths.";
    box.title = p.motivo || "";
    guardarRessalva(box);
    return;
  }
  // Nenhuma morte ainda: no lugar da caveira, o bebê.
  if (!p.mortes) box.className += " esperando";
  // Ainda procurando. O traço já diz que não se sabe; explicar isso em texto
  // fixo no painel só ocupava espaço. O andamento fica no title, para quem
  // quiser saber por que ainda não tem número.
  nota.textContent = "";
  box.title =
    "Sekiro has no death counter of its own, so the tracker is working out which " +
    "field it is by watching the save. " +
    (p.mortes
      ? p.mortes + " death" + (p.mortes === 1 ? "" : "s") + " seen so far" +
        (p.candidatos ? ", " + p.candidatos + " candidate fields left." : ".")
      : "Waiting for the first death.");
  guardarRessalva(box);
}

/**
 * Guarda a ressalva do painel para quem vier depois compor em cima.
 *
 * Dois desenhos escreviam o mesmo `title`: este, que explica de onde vem a
 * contagem, e o da podridão, que anuncia o efeito. O segundo roda depois e
 * apagava o primeiro — o hover do bloco perdia a explicação sempre que não
 * havia podridão acesa, que é quase sempre.
 */
function guardarRessalva(box) {
  box.dataset.ressalva = box.title || "";
}

/** Liga o clique do ponto uma vez só: dentro do render, cada leitura
 *  empilharia mais um ouvinte e o texto piscaria a cada clique. */
function ligarPontoDeSync() {
  const dot = document.getElementById("syncDot");
  const text = document.getElementById("syncText");
  dot.addEventListener("click", () => {
    const mostrar = text.hidden;
    text.hidden = !mostrar;
    dot.setAttribute("aria-expanded", mostrar ? "true" : "false");
  });
}

/* ------------------------------------------- tempo de jogo e maestria */

// A escala vai até 200 horas, em oito marcos de 25. O emoji é a leitura de
// relance: quanto mais tempo, mais ele insiste na ideia de domínio.
const HORAS_MAX = 200;
const MARCOS = 8;

// A escada agora é de metal, não de emote. Segue a ordem em que os materiais
// aparecem no próprio jogo — ferro, magnetita, adamantita, lazulita —, com
// bronze, prata e ouro no meio, e termina no lazulito, que é o material de fim
// de jogo. Cada degrau são três cores: sombra, corpo e brilho.
const ESCADA = [
  [0,   "scrap iron",  ["#4c4842", "#7b756c", "#b0a99e"]],
  [25,  "iron",        ["#565049", "#8a8479", "#c4bdb1"]],
  [50,  "magnetite",   ["#3f4650", "#6d7787", "#a9b3c2"]],
  [75,  "bronze",      ["#5d3a20", "#9a6533", "#d69a56"]],
  [100, "steel",       ["#4a5158", "#848d96", "#ccd4dc"]],
  [125, "silver",      ["#6a6e73", "#a9aeb4", "#eef1f4"]],
  [150, "gold",        ["#6e4f12", "#b9902f", "#f6dc8a"]],
  [175, "adamantite",  ["#2f3a3f", "#5f7a82", "#a8ccd4"]],
  [200, "lazulite",    ["#1d3a6b", "#3f6dbd", "#9fc6ff"]],
];

function degrau(horas) {
  let atual = ESCADA[0];
  for (const d of ESCADA) if (horas >= d[0]) atual = d;
  return atual;
}

function renderTempo() {
  const num = document.getElementById("tempoNum");
  const quadro = document.getElementById("quadroTempo");
  const marcos = document.getElementById("marcos");
  const t = temSync() ? sync.playtime : null;

  if (!t) {
    num.textContent = "—";
    marcos.innerHTML = "";
    quadro.title = "Playtime comes from Steam's own record. Not available right now.";
    return;
  }

  const horas = t.horas;
  // O "h" vai colado no número, e não num rótulo embaixo: sem ele, "82.3"
  // sozinho não diz se são horas, partidas ou porcentagem.
  num.textContent = (horas >= 100 ? Math.round(horas) : horas.toFixed(1)) + "h";
  const d = degrau(horas);
  // O metal do momento entra como variáveis; o gradiente do número as usa.
  // O NOME do metal não aparece mais: "BRONZE" embaixo de um número de horas
  // lia como categoria de alguma coisa, e não como o que era — uma escala de
  // material que existe só para a cor do número evoluir. A cor continua; a
  // palavra saiu.
  quadro.style.setProperty("--m1", d[2][0]);
  quadro.style.setProperty("--m2", d[2][1]);
  quadro.style.setProperty("--m3", d[2][2]);
  /*
   * O hover abre o número exato — e em duas medidas, porque são duas coisas.
   *
   * O relógio da Steam não tem segundo: a fonte grava minutos inteiros, e
   * escrever "00s" ali seria precisão inventada. O tempo interno do jogo vem
   * em milissegundos da mesma struct que a contagem de mortes, e esse tem
   * segundo de verdade — mas conta menos, porque ignora menu e carregamento.
   * Mostrar os dois, cada um até onde ele sabe, diz mais do que um só.
   */
  const hm = (min) => `${Math.floor(min / 60)}h ${String(min % 60).padStart(2, "0")}m`;
  const hms = (seg) => `${Math.floor(seg / 3600)}h `
    + `${String(Math.floor((seg % 3600) / 60)).padStart(2, "0")}m `
    + `${String(seg % 60).padStart(2, "0")}s`;

  const linhas = [`${hm(t.minutos)} on the Steam clock, which counts menus and loading`];
  if (typeof t.internoSegundos === "number") {
    linhas.push(`${hms(t.internoSegundos)} of in-game time, read from the game itself`);
    if (!temSync() || !sync.deaths || sync.deaths.aoVivo === false) {
      linhas.push("(in-game time is the last reading; the game is not running now)");
    }
  }
  linhas.push(`the number is cast in ${d[1]}, and the material changes every 25 hours`);
  quadro.title = linhas.join("\n");

  // Oito blocos de 25h. O bloco onde você está fica preenchido em parte, para a
  // barra andar dentro do marco em vez de saltar só ao completá-lo.
  marcos.innerHTML = "";
  for (let i = 0; i < MARCOS; i++) {
    const de = (HORAS_MAX / MARCOS) * i;
    const ate = de + HORAS_MAX / MARCOS;
    const el = document.createElement("i");
    if (horas >= ate) el.className = "cheio";
    else if (horas > de) {
      el.className = "parcial";
      el.style.setProperty("--p", ((horas - de) / (ate - de) * 100) + "%");
    }
    el.title = de + "h – " + ate + "h";
    marcos.appendChild(el);
  }

  // O título detalhado é montado lá em cima, antes dos marcos. Havia uma
  // segunda atribuição aqui, do texto antigo, que apagava aquele sem deixar
  // rastro — o hover mostrava a versão velha e nada indicava por quê.
}

/* --------------------------------------------------- mortes de chefe */

/** Três gotas com tempos diferentes, para não virar metrônomo. */
/*
 * O sangue do bloco de chefes, no volume que a referência pede.
 *
 * Eram três fios escorrendo devagar. O que o próprio jogo faz no golpe mortal
 * é outra coisa: jorro arterial em gêiser, herdado do Tenchu e da tradição
 * chanbara do cinema samurai, onde o sangue sai sob pressão e pinta a cena
 * inteira — não pinga.
 *
 * Então são três camadas, e nenhuma delas sozinha faria o efeito:
 *   jorro    — sai de baixo para cima, sob pressão, e desaba
 *   fio      — escorre pela parede do bloco, engrossando
 *   respingo — pontos que aparecem de uma vez e escurecem, como gota que
 *              bateu e secou
 * A poça no rodapé cresce e nunca recua, porque sangue não volta.
 */
function porGotas(quadro) {
  for (let i = 0; i < 4; i++) {
    const j = document.createElement("span");
    j.className = "jorro j" + (i + 1);
    quadro.appendChild(j);
  }
  for (let i = 0; i < 6; i++) {
    const g = document.createElement("span");
    g.className = "pingo p" + (i + 1);
    quadro.appendChild(g);
  }
  for (let i = 0; i < 7; i++) {
    const r = document.createElement("i");
    r.className = "respingo r" + (i + 1);
    quadro.appendChild(r);
  }
  const poca = document.createElement("span");
  poca.className = "poca";
  quadro.appendChild(poca);
}

/**
 * Os dois quadrados de contagem: chefes e Headless.
 *
 * A lista fica fora da grade, logo depois dela. Abrir e fechar é só trocar o
 * `hidden`: o fluxo do documento empurra o que vem abaixo e devolve sozinho,
 * sem medir nada nem animar altura à mão.
 */
function renderContador(cfg) {
  const painel = document.getElementById(cfg.painel);
  const num = document.getElementById(cfg.num);
  const lista = document.getElementById(cfg.lista);
  const dados = temSync() && Array.isArray(sync[cfg.campo]) ? sync[cfg.campo] : null;

  if (!dados || !dados.length) {
    painel.hidden = true;
    const j = lista.closest("dialog");
    if (j && j.open) j.close();
    return;
  }
  painel.hidden = false;
  num.textContent = cfg.total(dados);
  // Marca no próprio nó em vez de procurar por seletor: o desenho acontece a
  // cada leitura, e sem a marca as gotas se acumulariam a cada passagem.
  if (!painel.dataset.gotas) { porGotas(painel); painel.dataset.gotas = "1"; }

  lista.innerHTML = "";
  for (const b of dados) {
    const card = document.createElement("div");
    card.className = "boss-card" + (cfg.feito(b) ? "" : " zero");

    const n = document.createElement("span");
    n.className = "boss-card-n";
    n.textContent = cfg.marca(b);

    const slot = document.createElement("div");
    slot.className = "boss-icone";
    const kanji = document.createElement("span");
    kanji.textContent = b.emblema || cfg.emblema || "?";
    slot.appendChild(kanji);

    const nome = document.createElement("div");
    nome.className = "boss-card-nome";
    nome.textContent = b.label;

    card.appendChild(n); card.appendChild(slot); card.appendChild(nome);
    if (b.area) {
      const area = document.createElement("div");
      area.className = "boss-card-area";
      area.textContent = b.area;
      card.appendChild(area);
    }

    if (cfg.arte && typeof Image === "function") {
      const caminho = "icones/" + b.key + ".png";
      const img = new Image();
      img.addEventListener("load", () => {
        slot.innerHTML = "";
        slot.style.backgroundImage = "url(" + caminho + ")";
        slot.style.backgroundSize = (b.enquadre && b.enquadre.size) || "cover";
        slot.style.backgroundPosition = (b.enquadre && b.enquadre.pos) || "center";
        slot.style.backgroundRepeat = "no-repeat";
        slot.classList.add("com-arte");
      });
      img.src = caminho;
    }

    card.title = cfg.dica(b);
    lista.appendChild(card);
  }
  document.getElementById(cfg.botao).title = cfg.resumo(dados);
}

/**
 * A lista de jogos vigiados.
 *
 * Quem decide se dá para mexer é a origem da página, e não uma configuração:
 * servida de localhost, o servidor aceita gravar a escolha; servida pelo
 * GitHub Pages, não há servidor nenhum do outro lado. Então a mesma lista
 * aparece nos dois lugares e só um deles responde ao clique — e a janela diz
 * qual dos dois é, em vez de deixar o clique falhar em silêncio.
 */
function renderJogos() {
  const lista = document.getElementById("jogosLista");
  const nota = document.getElementById("jogosNota");
  if (!lista || !nota) return;

  const j = temSync() && sync.jogosVigiados ? sync.jogosVigiados : null;
  const daMaquina = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);

  lista.innerHTML = "";
  if (!j || !j.lista || !j.lista.length) {
    nota.textContent = "Waiting for the save.";
    return;
  }

  nota.textContent = daMaquina
    ? "The app opens by itself — quietly, only in the tray — when one of these starts. The desktop shortcut opens it any time."
    : "Read-only here: the choice is made on the computer that runs the service.";

  for (const g of j.lista) {
    const linha = document.createElement("button");
    linha.type = "button";
    linha.className = "jogo-linha" + (g.vigiado ? " vigiado" : "");
    if (!daMaquina) linha.disabled = true;

    const marca = document.createElement("span");
    marca.className = "jogo-marca";
    marca.setAttribute("aria-hidden", "true");

    const nome = document.createElement("span");
    nome.className = "jogo-nome";
    nome.textContent = g.nome;

    const estado = document.createElement("span");
    estado.className = "jogo-estado";
    estado.textContent = g.vigiado ? "watched" : "ignored";

    linha.appendChild(marca);
    linha.appendChild(nome);
    linha.appendChild(estado);

    // A ressalva vai para o hover: a lista é lista, não parágrafo.
    linha.title = g.leitura === "completa"
      ? "Save and memory are read for this game."
      : "Only the launch is detected for this game; nothing is read from it.";

    if (daMaquina) {
      linha.addEventListener("click", () => {
        /*
         * A lista nova é montada a partir do que está na tela, e não de um
         * estado paralelo em JavaScript: a página se redesenha a cada cinco
         * segundos, e um estado próprio ficaria brigando com o que chega da
         * leitura.
         */
        const marcados = [];
        for (const g2 of j.lista) {
          const ligado = g2.chave === g.chave ? !g2.vigiado : g2.vigiado;
          if (ligado) marcados.push(g2.chave);
        }
        fetch("/selecao", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ jogos: marcados }),
        }).then((r) => r.json()).then((novo) => {
          sync.jogosVigiados = novo;
          renderJogos();
        }).catch(() => {
          nota.textContent = "Could not save the choice. Is the service running?";
        });
      });
    }

    lista.appendChild(linha);
  }
}

/**
 * Os dois estados do bloco de mortes.
 *
 * Nenhum dos dois inventa um valor quando a leitura não veio: o elemento
 * some. Um sino desenhado como "desligado" sem save lido afirmaria uma coisa
 * que não se sabe, e este é o tipo de erro que a página não pode cometer —
 * ela é lida como informação de referência.
 */
function renderEstados() {
  const caixa = document.getElementById("estados");
  const sino = document.getElementById("estadoSino");
  const rot = document.getElementById("estadoRot");
  if (!caixa || !sino || !rot) return;

  const b = temSync() ? sync.demonBell : null;
  const d = temSync() ? sync.dragonrot : null;

  sino.hidden = !b;
  if (b) {
    sino.classList.toggle("on", !!b.ativo);
    sino.classList.toggle("off", !b.ativo);
    /*
     * O rótulo aceso é o nome que a interface do jogo dá ao estado: SINISTER
     * BURDEN. "Bell rung" descrevia o que aconteceu; o que interessa é o nome
     * do que se está carregando, e quem jogou reconhece esse.
     */
    const rotulo = document.getElementById("sinoRot");
    if (rotulo) rotulo.textContent = b.ativo ? "sinister burden" : "demon bell";
    // A ressalva vai para o hover, não para a página: o bloco é contador.
    sino.title = b.ativo
      ? "Sinister Burden: the Bell Demon is being carried. Enemies are stronger and drop more. Return it at an idol to remove."
      : "The Demon Bell has not been rung, or the Bell Demon has been returned.";
  }

  rot.hidden = !d;
  if (d) {
    rot.classList.toggle("on", !!d.ativo);
    rot.classList.toggle("off", !d.ativo);
    /*
     * O número é a peça do ícone, então ele só existe quando há o que contar.
     * Escrever "0" seria uma medição onde o que existe é a ausência dela, e é
     * a mesma regra que rege o resto da página.
     */
    const n = document.getElementById("rotN");
    if (n) n.textContent = d.ativo ? String(d.quantos) : "";
    /*
     * A mancha cresce com o número, mas satura: a partir de um terço dos NPCs
     * a diferença entre seis e sete doentes não é o que a pessoa lê no ícone,
     * e deixar crescer até o fim viraria borrão.
     */
    const fracao = d.total ? Math.min(1, d.quantos / (d.total / 3)) : 0;
    rot.style.setProperty("--rot", d.ativo ? Math.max(0.35, fracao).toFixed(2) : "0");
    const rotulo = document.getElementById("rotRot");
    if (rotulo) rotulo.textContent = "dragon rot";
    rot.title = d.ativo
      ? "Rot Essence held for " + d.quantos + " of " + d.total + " characters. Open for the names."
      : "No Rot Essence in the inventory.";
  }

  caixa.hidden = !b && !d;
  renderRotLista(d);
}

/**
 * A lista de quem está com a podridão.
 *
 * O texto diz "held", e não "sick": o que se verificou é o que está no
 * inventário. Se a essência some ao curar a pessoa, as duas frases seriam a
 * mesma; como isso não está confirmado em fonte nenhuma, a página fica com a
 * que é verdade dos dois jeitos.
 */

/**
 * A assinatura do cabeçalho: "<apelido> game progress".
 *
 * Sem apelido não há linha. Não é o mesmo que uma linha vazia: `hidden` tira
 * o elemento do fluxo, então o `gap` da coluna do cabeçalho também some e a
 * borda de baixo sobe para junto do título, em vez de deixar uma faixa de ar
 * do tamanho de um texto que não existe.
 *
 * Enquanto a leitura não chegou, a linha também fica fora — piscar "oaovito"
 * e trocar por outro nome meio segundo depois seria pior que não mostrar.
 */
function renderAssinatura() {
  const el = document.getElementById("assinatura");
  if (!el) return;
  if (el.dataset && el.dataset.editando) return;
  const nick = temSync() && sync.jogador && sync.jogador.nick ? sync.jogador.nick : null;
  /*
   * No próprio computador o nome se escolhe aqui, com ou sem Steam: um clique
   * na assinatura vira campo de texto. Sem Steam e sem nome escolhido, a
   * linha aparece só ali, como convite discreto; no link público ela continua
   * sumindo quando não há nome.
   */
  const local = daMaquinaLocal() && temSync();
  el.hidden = !nick && !local;
  el.textContent = nick ? nick + " game progress" : (local ? "name this progress" : "");
  if (el.classList) el.classList.toggle("sem-nome", !nick);
  if (local && !el.dataset.ligado) {
    el.dataset.ligado = "1";
    el.title = "Click to choose the name shown here.";
    el.style.cursor = "pointer";
    el.addEventListener("click", editarAssinatura);
  }
}

function editarAssinatura() {
  const el = document.getElementById("assinatura");
  if (!el || el.dataset.editando) return;
  el.dataset.editando = "1";
  const atual = sync.jogador && sync.jogador.fonte === "escolhido" ? sync.jogador.nick : (sync.jogador && sync.jogador.nick) || "";
  el.textContent = "";
  const campo = document.createElement("input");
  campo.className = "assinatura-campo";
  campo.maxLength = 32;
  campo.value = atual;
  campo.placeholder = "your name";
  campo.setAttribute("aria-label", "Name shown on the page");
  el.appendChild(campo);
  campo.focus();
  const fim = (gravar) => {
    if (!el.dataset.editando) return;
    delete el.dataset.editando;
    if (!gravar) { renderAssinatura(); return; }
    fetch("/jogador", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ nick: campo.value }),
    }).then((r) => r.json()).then((j) => { sync.jogador = j; renderAssinatura(); })
      .catch(() => renderAssinatura());
  };
  campo.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") fim(true);
    if (ev.key === "Escape") fim(false);
  });
  campo.addEventListener("blur", () => fim(true));
}

  });

/**
 * Abre uma janela e devolve a página ao estado anterior ao fechar.
 *
 * `showModal` cuida do fundo, do foco e do Esc. O que ele não faz é travar a
 * rolagem de trás: sem isso, rolar dentro da lista continua rolando a página
 * embaixo quando a lista chega ao fim, e a pessoa fecha a janela num lugar
 * diferente de onde abriu — que é exatamente o incômodo que a janela veio
 * resolver.
 */
function abrirJanela(janela, botao) {
  if (!janela || janela.open) return;
  document.body.classList.add("com-janela");
  janela.showModal();
  if (botao) botao.setAttribute("aria-expanded", "true");
  janela.addEventListener("close", () => {
    document.body.classList.remove("com-janela");
    if (botao) botao.setAttribute("aria-expanded", "false");
  }, { once: true });
}

function ligarJanela(janela, botao) {
  if (!janela || janela.dataset.ligada) return;
  janela.dataset.ligada = "1";
  const fechar = janela.querySelector(".janela-fecha");
  if (fechar) fechar.addEventListener("click", () => janela.close());
  // Clique fora fecha: o alvo do clique é o próprio `dialog` só quando cai no
  // backdrop, porque o conteúdo está todo dentro dos filhos.
  janela.addEventListener("click", (ev) => { if (ev.target === janela) janela.close(); });
}

function ligarQuadrosAbrem() {
  for (const [botao, janela] of [
    ["bossHead", "bossJanela"],
    ["headlessHead", "headlessJanela"],
  ]) {
    const b = document.getElementById(botao);
    const j = document.getElementById(janela);
    if (!b || !j || b.dataset.ligado) continue;
    b.dataset.ligado = "1";
    ligarJanela(j, b);
    b.addEventListener("click", () => abrirJanela(j, b));
  }
}

function renderSyncLine() {
  const dot = document.getElementById("syncDot");
  const text = document.getElementById("syncText");
  const aberto = dot.getAttribute("aria-expanded") === "true";
  dot.className = "sync-dot";
  dot.setAttribute("aria-expanded", aberto ? "true" : "false");
  if (!sync) {
    dot.classList.add("off");
    // Não mandar rodar nada: o serviço sobe sozinho no login. Se esta linha
    // aparece, ou o PC está desligado/dormindo, ou o serviço caiu.
    text.textContent = "not syncing — the service is not responding";
    return;
  }
  if (!sync.ok) {
    dot.classList.add("off");
    text.textContent = "save not read: " + (sync.message || sync.error || "erro");
    return;
  }
  if (sync.stale) {
    // Os números são de uma leitura boa anterior — o save ficou indisponível
    // depois dela. Melhor mostrar o progresso conhecido e avisar do que zerar.
    dot.classList.add("off");
    /*
     * Aqui valia a mesma coisa: a hora da última leitura boa é a hora em que se
     * jogou por outro nome. O aviso que importa é que o número é velho, e esse
     * cabe sem data nenhuma.
     */
    text.textContent = "save unavailable — showing the last known reading";
    return;
  }
  dot.classList.add("on");
  /*
   * A hora do último save saiu da linha, e não só da versão pública.
   *
   * Ela vinha de `source.saveModified`, que o publicador poda por dizer quando
   * a pessoa jogou. O resultado era a linha dizer "saved at 28/09, 15:18" na
   * máquina e "saved at ?" no link — a página passava a ter dois
   * comportamentos, e o público era o pior dos dois.
   *
   * Isso contraria a função da aplicação: o link público não é uma versão
   * reduzida da página, é a mesma página. Como o dado não pode ir para o ar,
   * o que sai é o dado dos dois lados. O que a linha precisa dizer — que está
   * sincronizado, e de qual slot — continua inteiro.
   */
  const slot = sync.source ? sync.source.slot : "?";
  text.textContent = "synced with the save · slot " + slot;
}

// O rótulo do botão acompanha o texto escondido. Envolver é o jeito certo:
// renderSyncLine sai por vários `return` diferentes, e pôr isto no fim do corpo
// cobriria só o último caminho.
const renderSyncLineCru = renderSyncLine;
renderSyncLine = function () {
  renderSyncLineCru();
  const dot = document.getElementById("syncDot");
  const text = document.getElementById("syncText");
  dot.setAttribute("aria-label", "Sync status: " + text.textContent);
  dot.title = text.textContent;
};

/* ------------------------------------------------------- itens essenciais */

function essentialsProgress() {
  // Só contas e sementes contam como progresso: materiais são consumíveis
  // e a contagem deles sobe e desce conforme você melhora as próteses.
  let done = 0, total = 0;
  for (const row of ESSENTIALS) {
    if (row.group || !row.total) continue;
    if (row.key === "prayerNecklaces") continue; // já representado pelas contas
    const auto = autoCount(row.auto);
    done += Math.min(auto === null ? 0 : auto, row.total);
    total += row.total;
  }
  return { done, total };
}

    <div class="cat-title-group">

      <div class="cat-mini-bar"><div class="cat-mini-fill" style="width:${(temSync() && prog.total ? prog.done / prog.total * 100 : 0)}%"></div></div>
    </div>
    <span class="cat-progress-text">${temSync() ? prog.done : "—"}/${prog.total}</span>
    <span class="chevron">▸</span>
  `;
  header.addEventListener("click", () => setOpen(section, "essentials"));
  section.appendChild(header);

  const itemsWrap = document.createElement("div");
  itemsWrap.className = "items";

  for (const row of ESSENTIALS) {
    if (row.group) {
      const g = document.createElement("div");
      g.className = "sub-head";
      g.textContent = row.group;
      itemsWrap.appendChild(g);
      continue;
    }

    const auto = autoCount(row.auto);

    const el = document.createElement("div");
    el.className = "item counter";
    el.innerHTML = `
      <label>${row.label}${row.hint ? `<span class="loc">${row.hint}</span>` : ""}</label>
      <span class="tag auto">auto</span>
      ${novas.contadores.has(row.label) ? `<span class="novo" title="changed since your last visit"></span>` : ""}
      <div class="count-ctl">
        <span class="count-val">${auto === null ? "—" : auto}</span>
        <span class="of">${row.total ? "/ " + row.total : ""}</span>
      </div>
    `;

    itemsWrap.appendChild(el);
  }

  section.appendChild(itemsWrap);
  root.appendChild(section);
  registrarTopico("Essential Items", (temSync() ? prog.done : "—") + "/" + prog.total, section);
}


/* ------------------------------------------------------------ tela de jogos */

/*
 * Qual tela aparece: a de jogos, a lista inteira, ou o progresso de um jogo.
 *
 * Quem decide é o endereço (#sekiro, #all) e se a leitura trouxe a lista de
 * jogos. Sem lista, o progresso abre direto, como sempre abriu -- e é o caso
 * de uma leitura antiga, de antes desta tela existir.
 */

function listaDeJogos() {
  return temSync() && sync.jogosVigiados && Array.isArray(sync.jogosVigiados.lista)
    ? sync.jogosVigiados.lista : null;
}

function vistaAtual() {
  const lista = listaDeJogos();
  const h = (typeof location !== "undefined" && location.hash || "").replace(/^#/, "");
  if (!lista) return "jogo";
  if (h === "all") return "bibli";
  if (h && lista.some((g) => g.chave === h && g.leitura === "completa")) return "jogo";
  return "hub";
}

/* A tela de jogos tem tema próprio, escuro por padrão, separado do da página
   do jogo: quem deixou o Sekiro no claro continua vendo a tela de jogos no
   escuro até escolher o contrário ali mesmo. */
const TEMA_JOGOS = "theme-jogos";
function naTelaDeJogos() {
  const c = typeof document !== "undefined" && document.body && document.body.classList;
  return !!(c && (c.contains("vista-hub") || c.contains("vista-bibli")));
}
function chaveDoTema() { return naTelaDeJogos() ? TEMA_JOGOS : THEME_KEY; }

function aplicarVista() {
  const v = vistaAtual();
  const corpo = document.body;
  if (corpo && corpo.classList) {
    const antes = naTelaDeJogos();
    corpo.classList.toggle("vista-hub", v === "hub");
    corpo.classList.toggle("vista-bibli", v === "bibli");
    // Cada lado guarda o próprio tema; ao atravessar, vale o do lado novo.
    if (antes !== naTelaDeJogos() && typeof applyTheme === "function" && document.getElementById("themeToggle")) {
      applyTheme(guardado(chaveDoTema()));
    }
  }
  const hub = document.getElementById("hub");
  const bibli = document.getElementById("bibli");
  if (hub) hub.hidden = v !== "hub";
  if (bibli) bibli.hidden = v !== "bibli";
  atualizarNavegacao(v);
  return v;
}

function irPara(destino) {
  if (typeof location === "undefined") return;
  if (destino) location.hash = destino;
  else if (typeof history !== "undefined" && history.pushState) history.pushState("", "", location.pathname + location.search);
  else location.hash = "";
  aplicarVista();
  renderHub();
  if (typeof window !== "undefined" && window.scrollTo) window.scrollTo(0, 0);
}

function daMaquinaLocal() {
  return typeof location !== "undefined" && /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
}

/* Os dois pinos. Desenhados, como o alfinete das seções. */
const SVG_PINO = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" ' +
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M6 1.8h4l-.7 4.1 2.4 2.3H4.3l2.4-2.3z"/><path d="M8 8.2V14"/></svg>';
const SVG_OLHO = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" ' +
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8z"/>' +
  '<circle cx="8" cy="8" r="2"/></svg>';

function fazerPinos(g) {
  const caixa = document.createElement("div");
  caixa.className = "jogo-pinos";

  const inst = document.createElement("span");
  inst.className = "pino pino-instalado" + (g.instalado ? " on" : "");
  inst.innerHTML = SVG_PINO + "<span>" + (g.instalado ? "installed" : "not installed") + "</span>";
  inst.title = g.instalado ? "Installed on this computer." : "Not found on this computer.";
  caixa.appendChild(inst);

  const local = daMaquinaLocal();
  const vig = document.createElement(local ? "button" : "span");
  if (local) vig.type = "button";
  vig.className = "pino pino-vigiado" + (g.vigiado ? " on" : "");
  vig.innerHTML = SVG_OLHO + "<span>" + (g.vigiado ? "watched" : "not watched") + "</span>";
  vig.title = g.vigiado
    ? "Watched: the app lights up in the tray when this game starts."
    : "Not watched." + (local ? " Tap to watch it." : "");
  if (local) {
    vig.addEventListener("click", (ev) => {
      if (ev && ev.stopPropagation) ev.stopPropagation();
      alternarVigia(g.chave);
    });
  }
  caixa.appendChild(vig);
  return caixa;
}

/** Liga ou desliga a vigia de um jogo, pelo mesmo caminho da janela de jogos. */
function alternarVigia(chave) {
  const lista = listaDeJogos();
  if (!lista) return;
  const marcados = lista.filter((g) => (g.chave === chave ? !g.vigiado : g.vigiado)).map((g) => g.chave);
  fetch("/selecao", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ jogos: marcados }),
  }).then((r) => r.json()).then((novo) => {
    sync.jogosVigiados = novo;
    renderHub();
    renderJogos();
  }).catch(() => {
    const n = document.getElementById("hubNota");
    if (n) n.textContent = "Could not save the choice. Is the service running?";
  });
}

/*
 * A arte de cada jogo, da maior resolução para a menor.
 *
 * O serviço manda `arte` pronta (ver sync/arte.js), inclusive para quem não
 * está na Steam. Sem ela -- página antiga, leitura antiga -- a arte da Steam
 * sai do appId que a chave carrega. Cada peça é uma lista: a imagem tenta o
 * primeiro endereço e desce para o próximo quando ele não existe.
 */
const CDN_STEAM = [
  "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/",
  "https://cdn.cloudflare.steamstatic.com/steam/apps/",
];
function arteDaSteam(id) {
  if (!id) return null;
  const em = (arquivos) => {
    const r = [];
    for (const a of arquivos) for (const c of CDN_STEAM) r.push(c + id + "/" + a);
    return r;
  };
  return {
    heroi: em(["library_hero_2x.jpg", "library_hero.jpg"]),
    capa: em(["library_600x900_2x.jpg", "library_600x900.jpg"]),
    logo: em(["logo_2x.png", "logo.png"]),
    faixa: em(["capsule_616x353.jpg", "header.jpg"]),
  };
}
function arteDe(g) {
  if (g.arte) return g.arte;
  const m = /^steam-(\d+)$/.exec(g.chave || "");
  return arteDaSteam(m ? m[1] : g.chave === "sekiro" ? "814380" : null) || { heroi: [], capa: [], logo: [], faixa: [] };
}
/* A peça pedida, e depois as outras como reserva, sem repetir endereço. */
function enderecos(g, ordem) {
  const a = arteDe(g);
  const r = [];
  for (const k of ordem) for (const u of a[k] || []) if (!r.includes(u)) r.push(u);
  return r;
}

/* Carrega a primeira que existir; `falhou` roda quando nenhuma existe. */
function carregarImg(img, urls, falhou) {
  let i = 0;
  img.decoding = "async";
  img.onload = () => img.classList.add("pronta");
  img.onerror = () => {
    i++;
    if (i < urls.length) img.src = urls[i];
    else { img.onerror = null; if (falhou) falhou(); }
  };
  if (urls.length) img.src = urls[0];
  else if (falhou) falhou();
}

/* O pôster de reserva: o nome do jogo em cima de uma cor tirada do próprio nome. */
function matizDe(nome) {
  let h = 0;
  for (const c of String(nome || "")) h = (h * 31 + c.charCodeAt(0)) % 360;
  return h;
}
function arteVazia(g, grande) {
  const d = document.createElement("div");
  d.className = "arte-vazia" + (grande ? " grande" : "");
  d.style.setProperty("--h", matizDe(g.nome));
  const t = document.createElement("span");
  t.textContent = g.nome || "?";
  d.appendChild(t);
  return d;
}

/* Capa em pé (trilho) ou faixa deitada (lista), sempre com reserva. */
function fazerCapa(g, tipo) {
  const capa = document.createElement("div");
  capa.className = tipo === "faixa" ? "jogo-faixa" : "jogo-capa";
  const img = document.createElement("img");
  img.alt = "";
  img.loading = "lazy";
  capa.appendChild(img);
  const ordem = tipo === "faixa" ? ["faixa", "heroi", "capa"] : ["capa", "faixa", "heroi"];
  carregarImg(img, enderecos(g, ordem), () => { img.remove(); capa.appendChild(arteVazia(g)); });
  return capa;
}

/* O relógio do canto, como na tela inicial de um console. */
function ligarRelogio() {
  const el = document.getElementById("hubRelogio");
  if (!el || el.dataset.ligado) return;
  el.dataset.ligado = "1";
  // setTimeout encadeado, e não setInterval: o único intervalo da página é o
  // da leitura, que tem ritmo próprio e testado.
  const tic = () => {
    const d = new Date();
    el.textContent = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    setTimeout(tic, (60 - d.getSeconds()) * 1000);
  };
  tic();
}

/* O fundo da tela é a arte do jogo em foco, desfocada: o ambiente muda com ele. */
function ambienteCom(src) {
  const amb = document.getElementById("ambienteImg");
  if (!amb) return;
  if (!src) { amb.classList.remove("pronta"); return; }
  if (amb.getAttribute("src") === src) return;
  amb.classList.remove("pronta");
  amb.onload = () => amb.classList.add("pronta");
  amb.src = src;
}

let jogoEmFoco = null;

/* O palco: a arte larga do jogo em foco, o logotipo e o que se sabe dele. */
function mostrarNoPalco(g) {
  jogoEmFoco = g.chave;
  const palco = document.getElementById("hubPalco");
  if (!palco) return;
  document.querySelectorAll("#hubGrade .jogo-card").forEach((c) => {
    c.classList.toggle("ativo", c.dataset.chave === g.chave);
  });

  const arte = document.getElementById("palcoArte");
  arte.innerHTML = "";
  const img = document.createElement("img");
  img.alt = "";
  arte.appendChild(img);
  carregarImg(img, enderecos(g, ["heroi", "faixa", "capa"]), () => {
    img.remove();
    arte.appendChild(arteVazia(g, true));
    ambienteCom(null);
  });
  img.addEventListener("load", () => ambienteCom(img.currentSrc || img.src));

  const marca = document.getElementById("palcoMarca");
  marca.innerHTML = "";
  const nome = document.createElement("h2");
  nome.className = "palco-nome";
  nome.textContent = g.nome;
  const logos = (arteDe(g).logo || []).slice();
  if (logos.length) {
    const logo = document.createElement("img");
    logo.className = "palco-logo";
    logo.alt = g.nome;
    marca.appendChild(logo);
    carregarImg(logo, logos, () => { logo.remove(); marca.appendChild(nome); });
  } else {
    marca.appendChild(nome);
  }

  const meta = document.getElementById("palcoMeta");
  meta.innerHTML = "";
  meta.appendChild(fazerPinos(g));
  const extra = document.createElement("div");
  extra.className = "palco-extra";
  const selo = (txt) => { const s = document.createElement("span"); s.textContent = txt; extra.appendChild(s); };
  selo(g.leitura === "completa" ? "full progress tracking" : "launch detection");
  if (g.popular) selo("#" + g.popular + " most played");
  if (g.naSteam) selo("in the Steam library");
  meta.appendChild(extra);

  const abre = document.getElementById("palcoAbre");
  abre.hidden = g.leitura !== "completa";
  abre.onclick = () => irPara(g.chave);
}

function renderHub() {
  const v = aplicarVista();
  const lista = listaDeJogos();
  if (!lista) return;
  ligarRelogio();
  // A leitura chega a cada poucos segundos; só redesenha quando algo mudou,
  // para não recarregar as artes nem perder a rolagem do trilho.
  const assinatura = v + "|" + JSON.stringify(lista) + "|" + daMaquinaLocal();
  if (renderHub.ultima === assinatura) return;
  renderHub.ultima = assinatura;

  if (v === "hub") {
    const grade = document.getElementById("hubGrade");
    if (!grade) return;
    grade.innerHTML = "";
    const peso = (g) => (g.leitura === "completa" ? 0 : g.vigiado ? 1 : 2);
    const mostrar = lista
      .filter((g) => g.leitura === "completa" || g.vigiado || g.instalado)
      .sort((a, b) => peso(a) - peso(b) || String(a.nome).localeCompare(String(b.nome)));
    const conta = document.getElementById("hubConta");
    if (conta) conta.textContent = String(mostrar.length);
    for (const g of mostrar) {
      const card = document.createElement("div");
      card.className = "jogo-card" + (g.leitura === "completa" ? " lido" : "");
      card.dataset.chave = g.chave;
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", g.nome);
      card.tabIndex = 0;
      card.appendChild(fazerCapa(g, "capa"));
      const selos = document.createElement("div");
      selos.className = "jogo-selos";
      const selo = (classe, titulo, svg) => {
        const s = document.createElement("span");
        s.className = classe;
        s.title = titulo;
        s.innerHTML = svg;
        selos.appendChild(s);
      };
      if (g.instalado) selo("selo-inst", "Installed", SVG_PINO);
      if (g.vigiado) selo("selo-vig", "Watched", SVG_OLHO);
      card.appendChild(selos);
      const nome = document.createElement("div");
      nome.className = "jogo-card-nome";
      nome.textContent = g.nome;
      card.appendChild(nome);
      const abrir = () => {
        if (jogoEmFoco === g.chave && g.leitura === "completa") irPara(g.chave);
        else mostrarNoPalco(g);
      };
      card.addEventListener("click", abrir);
      card.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); abrir(); } });
      card.addEventListener("focus", () => mostrarNoPalco(g));
      card.addEventListener("mouseenter", () => { if (typeof matchMedia === "function" && matchMedia("(hover: hover)").matches) mostrarNoPalco(g); });
      grade.appendChild(card);
    }
    const palco = document.getElementById("hubPalco");
    if (palco) palco.hidden = !mostrar.length;
    if (mostrar.length) mostrarNoPalco(mostrar.find((g) => g.chave === jogoEmFoco) || mostrar[0]);
    const nota = document.getElementById("hubNota");
    if (nota) {
      const var_ = sync.jogosVigiados.varredura;
      nota.textContent = mostrar.length ? "" : "No games found yet. The search runs a minute after the service starts.";
      if (var_ && var_.comSteam === false) nota.textContent += (nota.textContent ? " " : "") + "Searched without Steam.";
    }
    const bt = document.getElementById("hubTodos");
    if (bt && !bt.dataset.ligado) {
      bt.dataset.ligado = "1";
      bt.addEventListener("click", () => irPara("all"));
    }
    return;
  }

  if (v === "bibli") {
    const caixa = document.getElementById("bibliGrupos");
    if (!caixa) return;
    caixa.innerHTML = "";
    const lido = lista.find((g) => g.leitura === "completa") || lista[0];
    if (lido) {
      const probe = document.createElement("img");
      carregarImg(probe, enderecos(lido, ["heroi", "faixa"]), () => ambienteCom(null));
      probe.addEventListener("load", () => ambienteCom(probe.currentSrc || probe.src));
    }
    const grupos = [
      ["On this computer", lista.filter((g) => g.instalado)],
      ["In the Steam library", lista.filter((g) => g.naSteam && !g.instalado)],
    ];
    for (const [titulo, jogos] of grupos) {
      const grupo = document.createElement("div");
      grupo.className = "bibli-grupo";
      const h = document.createElement("h2");
      const rot = document.createElement("span");
      rot.textContent = titulo;
      const num = document.createElement("b");
      num.textContent = String(jogos.length);
      h.appendChild(rot);
      h.appendChild(num);
      grupo.appendChild(h);
      if (!jogos.length) {
        const p = document.createElement("p");
        p.className = "bibli-vazio";
        p.textContent = titulo === "On this computer" ? "Nothing found on the disks yet." : "No Steam library on this computer, or nothing beyond what is installed.";
        grupo.appendChild(p);
      }
      for (const g of jogos.slice().sort((a, b) => String(a.nome).localeCompare(String(b.nome)))) {
        const linha = document.createElement("div");
        linha.className = "bibli-linha";
        linha.appendChild(fazerCapa(g, "faixa"));
        const nome = document.createElement("span");
        nome.className = "bibli-nome";
        nome.textContent = g.nome;
        linha.appendChild(nome);
        linha.appendChild(fazerPinos(g));
        if (g.leitura === "completa") {
          const abre = document.createElement("button");
          abre.type = "button";
          abre.className = "bibli-abre";
          abre.textContent = "Progress →";
          abre.addEventListener("click", () => irPara(g.chave));
          linha.appendChild(abre);
        }
        grupo.appendChild(linha);
      }
      caixa.appendChild(grupo);
    }
    const varrer = document.getElementById("bibliVarrer");
    if (varrer) {
      varrer.hidden = !daMaquinaLocal();
      if (!varrer.dataset.ligado) {
        varrer.dataset.ligado = "1";
        varrer.addEventListener("click", () => {
          fetch("/varrer", { method: "POST" }).then(() => {
            const n = document.getElementById("bibliNota");
            if (n) n.textContent = "Searching between two reads; the list updates by itself.";
          }).catch(() => {});
        });
      }
    }
  }
}

/*
 * Voltar, avançar e início.
 *
 * Voltar e avançar são o histórico do próprio navegador, que já registra cada
 * troca de tela (#sekiro, #all, a tela inicial). Início é a tela de jogos; sem
 * lista de jogos, a página inicial é o próprio progresso. Onde o navegador
 * sabe dizer se há para onde ir (a Navigation API), o botão sem destino fica
 * apagado; onde não sabe, fica sempre aceso.
 */
function atualizarNavegacao(v) {
  if (typeof document === "undefined") return;
  const nav = typeof navigation !== "undefined" ? navigation : null;
  const por = (id, desligado) => {
    const b = document.getElementById(id);
    if (b) b.disabled = !!desligado;
  };
  por("navVoltar", nav && "canGoBack" in nav ? !nav.canGoBack : false);
  por("navAvancar", nav && "canGoForward" in nav ? !nav.canGoForward : false);
  por("navInicio", (v || vistaAtual()) === (listaDeJogos() ? "hub" : "jogo"));
}

(function ligarVistas() {
  if (typeof document === "undefined") return;
  const liga = (id, fn) => {
    const b = document.getElementById(id);
    if (b && b.addEventListener) b.addEventListener("click", fn);
  };
  liga("navVoltar", () => { if (typeof history !== "undefined") history.back(); });
  liga("navAvancar", () => { if (typeof history !== "undefined") history.forward(); });
  liga("navInicio", () => irPara(""));
  if (typeof window !== "undefined" && window.addEventListener) {
    const trocou = () => { aplicarVista(); renderHub(); };
    window.addEventListener("hashchange", trocou);
    window.addEventListener("popstate", trocou);
  }
})();

/* ------------------------------------------------------------ checklists */

function render() {
  renderSyncLine();
  renderAssinatura();
  renderEstados();
  renderJogos();
  renderHub();
  renderDeaths();
  renderTempo();
  renderBossKills();
  renderHeadlessConta();
  renderNovidades();
  renderEssentials();
  const listas = [renderBeads(), renderSeeds()].filter(Boolean);
  // Estas três seções também contam para o total geral, senão a barra passaria
  // a medir só próteses e artes de combate.
  const extras = listas.concat([renderBosses(), renderMiniBosses(), renderHeadless()].filter(Boolean));
  renderIdols();

  const autoUnlocked = autoUnlockMap();
  const novas = marcasNovas();
  const drops = dropMap();
  const root = document.getElementById("categories");
  root.innerHTML = "";
  let totalDone = 0, totalAll = 0;

  DATA.forEach((cat, ci) => {
    const section = document.createElement("section");
    section.className = "category";
    section.dataset.idx = ci;

    const isDone = (ii) => {
      const autoKey = cat.items[ii][3];
      return !!(autoKey && autoUnlocked[autoKey]);
    };

    const doneInCat = cat.items.filter((_, ii) => isDone(ii)).length;
    const novasNaCat = cat.items.filter((it) => it[3] && novas.linhas.has(it[3])).length;
    totalDone += doneInCat;
    totalAll += cat.items.length;

    const header = document.createElement("div");
    header.className = "cat-header";
    header.innerHTML = `
      <div class="cat-title-group">
        <span class="cat-title">${cat.name}</span>
        <div class="cat-mini-bar"><div class="cat-mini-fill" style="width:${(temSync() && (doneInCat/cat.items.length*100))||0}%"></div></div>
      </div>
      ${novasNaCat ? `<span class="cat-novo">${novasNaCat} new</span>` : ""}
      <span class="cat-progress-text">${temSync() ? doneInCat : "—"}/${cat.items.length}</span>
      <span class="chevron">▸</span>
    `;
    header.addEventListener("click", () => setOpen(section, String(ci)));
    section.appendChild(header);

    const itemsWrap = document.createElement("div");
    itemsWrap.className = "items";

    cat.items.forEach((item, ii) => {
      const [name, loc, tag, autoKey] = item;
      const id = slug(ci, ii);
      const drop = autoKey ? drops[autoKey] : null;
      const detalhe = [loc, drop ? "drops " + drop : ""].filter(Boolean).join(" · ");
      const checked = isDone(ii);
      const row = document.createElement("div");
      row.className = "item" + (checked ? " done" : "");
      // Toda linha tem fonte no save, então toda linha é somente leitura e
      // carrega a etiqueta. A etiqueta descritiva (mini-chefe, NG+) continua.
      row.innerHTML = `
        <input type="checkbox" id="${id}" ${checked ? "checked" : ""} disabled>
        <label for="${id}">${name}${detalhe ? `<span class="loc">${detalhe}</span>` : ""}</label>
        ${tag ? `<span class="tag">${tag}</span>` : ""}
        ${autoKey ? `<span class="tag auto">auto</span>` : ""}
        ${autoKey && novas.linhas.has(autoKey) ? `<span class="novo" title="new since your last visit"></span>` : ""}
      `;
      itemsWrap.appendChild(row);
    });

    section.appendChild(itemsWrap);
    root.appendChild(section);
    registrarTopico(cat.name, (temSync() ? doneInCat : "—") + "/" + cat.items.length, section);
  });

  // Sem save lido, nada aqui é medição — mostrar "0 / 62" faria parecer que o
  // progresso é zero, quando na verdade é desconhecido.
  for (const e of extras) { totalDone += e.feitos; totalAll += e.total; }

  // O anel passa a medir as conquistas do Steam, que é o placar que o jogo
  // reconhece. A contagem interna das listas continua somando por trás, mas
  // não é ela que o bloco mostra.
  const conq = temSync() && sync.achievements ? sync.achievements : null;
  const ok = temSync() && !!conq;
  const feitas = conq ? conq.desbloqueadas : 0;
  const todas = conq ? conq.total : 0;
  const pct = ok && todas ? feitas / todas * 100 : 0;
  document.getElementById("overallPct").textContent = ok ? Math.round(pct) + "%" : "—";
  document.getElementById("overallCount").textContent = ok ? feitas + " / " + todas : "";
  document.getElementById("overallLabel").textContent = ok ? "achievements" : "waiting for the save";
  // O anel anda pelo offset: o traço inteiro mede 263.89 (2πr, r=42), e o que
  // sobra é o que falta. Sem save lido, fica vazio em vez de fechado em zero.
  const VOLTA = 263.89;
  document.getElementById("anelFio").style.strokeDashoffset = VOLTA - (VOLTA * pct / 100);

  renderKaiden(ok && todas > 0 && feitas >= todas);
  renderConquistas(conq);
  renderEfeitos();
  renderMarcos();
}

/**
 * 皆伝: o estado de 100% nas conquistas.
 *
 * Só entra quando a contagem é real. `feitas >= todas` com `todas` valendo
 * zero seria verdade por vacuidade, e a página carimbaria "completou tudo"
 * antes de ler save nenhum — o mesmo erro que as cenas de chefe já tiveram
 * com `every` de lista vazia.
 *
 * A classe some quando a condição deixa de valer. Isso importa mais do que
 * parece: em NG+ o placar da Steam não zera, mas um save novo lido num outro
 * computador pode chegar com menos, e um selo que nunca sai passaria a
 * mentir.
 */
function renderKaiden(completo) {
  const painel = document.getElementById("anelPanel");
  const selo = document.getElementById("selo");
  if (!painel || !selo) return;

  painel.classList.toggle("kaiden", !!completo);
  selo.hidden = !completo;
  if (!completo) return;

  selo.title = "皆伝 — every achievement unlocked.";
  if (selo.dataset.ligado) return;
  selo.dataset.ligado = "1";
  selo.addEventListener("click", tocarKaiden);
}

/**
 * A cena do selo, na página inteira.
 *
 * Reinicia se já estiver rodando: clicar de novo tem de responder de novo,
 * senão o segundo clique parece que não funcionou. Tirar o nó do documento e
 * repor é o jeito de reiniciar animação de CSS — reatribuir a classe sozinho
 * não relança, porque o navegador não vê mudança.
 */
function tocarKaiden() {
  const cena = document.getElementById("kaidenCena");
  if (!cena) return;
  const pai = cena.parentNode;
  const novo = cena.cloneNode(true);
  pai.replaceChild(novo, cena);
  novo.hidden = false;
  // 5,2 s é a duração declarada no CSS das três camadas. Guardar o número em
  // dois lugares é o tipo de coisa que desanda; aqui ele existe uma vez no
  // CSS e o JS só espera um pouco mais que isso para esconder.
  setTimeout(() => { novo.hidden = true; }, 5400);
}

/**
 * A lista de conquistas, aberta pelo anel.
 *
 * As que faltam aparecem esmaecidas, e não ausentes: a lista é o mapa
 * inteiro, e só some do mapa o que o jogo não deixa ver — a descrição de uma
 * conquista oculta ainda não obtida, que fica como traço em vez de texto
 * inventado.
 */
function renderConquistas(conq) {
  const painel = document.getElementById("anelPanel");
  const lista = document.getElementById("conqLista");
  const botao = document.getElementById("anelHead");
  if (!painel || !lista) return;

  const janela = document.getElementById("conqJanela");
  const itens = conq && Array.isArray(conq.lista) ? conq.lista : null;
  if (!itens || !itens.length) {
    if (janela && janela.open) janela.close();
    botao.setAttribute("aria-expanded", "false");
    return;
  }

  lista.innerHTML = "";

  /*
   * Separadas em fácil, média e difícil — e a divisão não é opinião minha.
   *
   * O jogo não classifica conquista por dificuldade. O que existe de objetivo
   * é quantos jogadores no mundo têm cada uma, que a Steam publica, e é isso
   * que define a faixa. Raridade não é exatamente dificuldade — uma conquista
   * de fim de jogo também é rara porque pouca gente termina —, mas é medida
   * real e igual para todos, e a porcentagem fica à vista para quem quiser
   * julgar por conta própria.
   *
   * Sem a tabela colhida (`npm run conquistas`), não há faixa: aí a lista sai
   * inteira, sem inventar uma classificação.
   */
  const FAIXAS = [
    ["facil", "easy"],
    ["media", "medium"],
    ["dificil", "hard"],
  ];
  const temFaixa = itens.some((c) => c.dificuldade);

  const cartao = (c) => {
    const el = document.createElement("div");
    el.className = "conq" + (c.conquistada ? "" : " presa");

    if (c.icone) {
      const ico = document.createElement("div");
      ico.className = "conq-icone";
      ico.style.backgroundImage = "url(" + c.icone + ")";
      el.appendChild(ico);
    } else {
      const marca = document.createElement("span");
      marca.className = "conq-marca";
      marca.textContent = c.conquistada ? "✦" : "·";
      el.appendChild(marca);
    }

    const texto = document.createElement("div");
    texto.className = "conq-texto";
    const nome = document.createElement("div");
    nome.className = "conq-nome";
    nome.textContent = c.nome || c.chave;
    texto.appendChild(nome);

    // Toda conquista tem descrição agora, inclusive as 23 que o jogo esconde.
    // Onde o texto veio da reserva, o itálico marca que não é o que o Sekiro
    // mostraria — é a descrição do mesmo troféu no PlayStation.
    const desc = document.createElement("div");
    desc.className = "conq-desc" + (c.descricaoOculta ? " segredo" : "");
    desc.textContent = c.descricao || "";
    if (c.descricaoOculta) desc.title = "The game hides this one's text until you unlock it; "
      + "this is the same trophy's description on PlayStation.";
    if (desc.textContent) texto.appendChild(desc);
    /*
     * De onde veio a resposta. As conquistas saem do save; a Steam, quando
     * está na máquina, confere. Duas situações pedem uma linha: o save não
     * tem como provar esta (e não há Steam para dizer), e os dois discordam.
     */
    let origem = "";
    if (c.incerta) origem = "not provable from the save";
    else if (c.confere === false) origem = c.conquistada ? "Steam has it; this save does not" : "the save has it; Steam does not";
    if (origem) {
      const o = document.createElement("div");
      o.className = "conq-origem";
      o.textContent = origem;
      texto.appendChild(o);
    }
    el.title = c.fonte === "ambos" ? "Proven by the save, confirmed by Steam."
      : c.fonte === "save" ? "Proven by the save."
      : c.fonte === "steam" ? "Unlocked on Steam; the save alone cannot show it."
      : "";
    el.appendChild(texto);

    if (c.shinobi) {
      el.classList.add("e-shinobi");
      const tag = document.createElement("span");
      tag.className = "conq-tag";
      tag.textContent = "shinobi";
      tag.title = "The rarest of them all — and it asks for every other one";
      el.appendChild(tag);
    }

    if (typeof c.raridade === "number") {
      const r = document.createElement("span");
      r.className = "conq-raridade";
      r.textContent = c.raridade.toFixed(0) + "%";
      r.title = c.raridade.toFixed(1) + "% of players have this one";
      el.appendChild(r);
    }
    return el;
  };

  // Dentro de cada faixa, as obtidas primeiro: a lista é para olhar o que se
  // tem, e o que falta vem depois, esmaecido, como horizonte.
  const porObtidas = (a, b) => Number(b.conquistada) - Number(a.conquistada)
    || (b.raridade || 0) - (a.raridade || 0);

  if (!temFaixa) {
    for (const c of itens.slice().sort(porObtidas)) lista.appendChild(cartao(c));
  } else {
    for (const [chave, rotulo] of FAIXAS) {
      const desta = itens.filter((c) => c.dificuldade === chave).sort(porObtidas);
      if (!desta.length) continue;
      const feitas = desta.filter((c) => c.conquistada).length;

      const cab = document.createElement("div");
      cab.className = "conq-faixa " + chave;
      cab.appendChild(document.createTextNode(rotulo));
      const conta = document.createElement("span");
      conta.className = "conta";
      conta.textContent = feitas + "/" + desta.length;
      cab.appendChild(conta);
      lista.appendChild(cab);

      for (const c of desta) lista.appendChild(cartao(c));
    }
  }

  // A janela sobrevive ao redesenho: o conteúdo é refeito, mas se ela estava
  // aberta continua aberta, e a pessoa não perde o lugar a cada leitura.
  ligarJanela(janela, botao);
  if (!botao.dataset.ligado) {
    botao.dataset.ligado = "1";
    botao.addEventListener("click", () => abrirJanela(janela, botao));
  }
}

/**
 * Os efeitos temporários: fogo no anel, podridão nas mortes.
 *
 * O serviço manda quantos segundos faltam, e não a hora em que começou — hora
 * diria quando se jogou. A página só liga e desliga a classe; quem conta é o
 * relógio do serviço, que a página consulta a cada leitura.
 */
/**
 * O golpe mortal, quando a conquista shinobi cai.
 *
 * Duas coisas que o desenho tem de acertar e são fáceis de errar:
 *
 * A primeira é não repetir. A página relê o progresso a cada cinco segundos, e
 * disparar a cena a cada leitura em que a marca aparece conquistada faria o
 * site piscar 忍殺 para sempre. Quem decide é a TRANSIÇÃO — de não conquistada
 * para conquistada —, e o estado anterior fica gravado no aparelho, para a
 * cena também rodar quando o desbloqueio acontece com a página fechada.
 *
 * A segunda é não rodar na primeira visita de quem já tinha a conquista. Sem
 * marca gravada, considera-se que já se sabia: alguém abrindo o link pela
 * primeira vez não presenciou nada, e uma comemoração ali seria falsa.
 */
/*
 * Os marcos: três, e cada um com a linguagem do bloco a que pertence.
 *
 * Os kanji não foram escolhidos por soarem bem. O 忍殺 é o que o próprio jogo
 * estampa no golpe mortal. O 怖 é o kanji que o Sekiro usa para o Terror, que
 * é justamente o que os Headless causam — não o 恐怖 mais formal, o 怖 mesmo.
 * O 討 é o que o bloco de chefes já usa; procurei o nome japonês da conquista
 * de derrotar todos e as fontes não confirmam, então reaproveitar o kanji do
 * bloco é melhor do que inventar uma expressão.
 */
const MARCOS_CENA = [
  {
    chave: "shinobi-visto",
    classe: "tem-shinobi",
    tipo: "shinobi",
    kanji: "忍殺",
    atingido: (s) => {
      const m = s.achievements && Array.isArray(s.achievements.lista)
        ? s.achievements.lista.find((a) => a.shinobi) : null;
      return !!(m && m.conquistada);
    },
  },
  {
    chave: "chefes-visto",
    classe: "tem-chefes",
    tipo: "chefes",
    kanji: "討",
    atingido: (s) => Array.isArray(s.bosses) && s.bosses.length > 0
      && s.bosses.every((b) => b.defeated),
  },
  {
    chave: "headless-visto",
    classe: "tem-headless",
    tipo: "headless",
    kanji: "怖",
    atingido: (s) => Array.isArray(s.headless) && s.headless.length > 0
      && s.headless.every((h) => h.defeated),
  },
];

/**
 * Decide, para cada marco, se ele está atingido e se a cena deve rodar.
 *
 * Três coisas que o desenho tem de acertar, e as três são fáceis de errar:
 *
 * A primeira é não repetir. A página relê o progresso a cada cinco segundos, e
 * rodar a cena a cada leitura em que o marco aparece atingido faria o site
 * piscar para sempre. Quem decide é a TRANSIÇÃO — de não atingido para
 * atingido —, e o estado anterior fica gravado no aparelho, para a cena também
 * rodar quando o marco cair com a página fechada.
 *
 * A segunda é não rodar na primeira visita de quem já tinha aquilo feito. Sem
 * marca gravada, considera-se que já se sabia: quem abre o link pela primeira
 * vez não presenciou nada, e comemorar ali seria falso.
 *
 * A terceira é não empilhar duas cenas. Se dois marcos caírem na mesma
 * leitura, a segunda entra na fila em vez de desenhar por cima da primeira.
 */
function renderMarcos() {
  if (!temSync()) return;
  let espera = 0;
  for (const m of MARCOS_CENA) {
    const caiu = (() => { try { return !!m.atingido(sync); } catch (e) { return false; } })();
    document.body.classList.toggle(m.classe, caiu);

    const antes = guardado(m.chave);
    if (caiu) guardar(m.chave, "1");
    else if (antes) esquecer(m.chave);

    if (!caiu || antes === "1" || antes === null) continue;
    setTimeout(() => tocarCena(m), espera);
    espera += 4200;
  }
}

function tocarCena(marco) {
  const velho = document.querySelector(".golpe");
  if (velho) velho.remove();

  const cena = document.createElement("div");
  cena.className = "golpe golpe-" + marco.tipo;
  cena.setAttribute("aria-hidden", "true");

  const kanji = document.createElement("div");
  kanji.className = "golpe-kanji";
  kanji.textContent = marco.kanji;
  cena.appendChild(kanji);

  // O corte branco é do golpe mortal e só dele; sangue e terror têm os seus.
  if (marco.tipo === "shinobi") {
    const corte = document.createElement("div");
    corte.className = "golpe-corte";
    cena.appendChild(corte);
  }
  if (marco.tipo === "chefes") {
    // Os fios de sangue escorrendo pela tela, em posições e tempos diferentes.
    for (let i = 0; i < 7; i++) {
      const fio = document.createElement("i");
      fio.className = "golpe-fio";
      fio.style.left = (6 + i * 13.5) + "%";
      fio.style.animationDelay = (0.1 + i * 0.09).toFixed(2) + "s";
      fio.style.animationDuration = (1.5 + (i % 3) * 0.45).toFixed(2) + "s";
      cena.appendChild(fio);
    }
  }
  if (marco.tipo === "headless") {
    const bruma = document.createElement("i");
    bruma.className = "golpe-bruma";
    cena.appendChild(bruma);
  }

  document.body.appendChild(cena);
  // A classe entra num quadro seguinte para a animação começar do zero em vez
  // de o navegador considerar que ela já estava correndo.
  requestAnimationFrame(() => cena.classList.add("correndo"));
  setTimeout(() => cena.remove(), 4000);
}

function renderEfeitos() {
  const ef = (temSync() && sync.efeitos) || {};
  const anel = document.getElementById("anelPanel");
  const mortes = document.getElementById("deaths");

  const horas = (s) => (s / 3600).toFixed(1);
  if (anel) {
    const pegando = ef.fogo > 0;
    anel.classList.toggle("anel-pegando", pegando);
    if (pegando) anel.title = `On fire: two or more achievements fell this session. `
      + `${horas(ef.fogo)} h left.`;
    else anel.removeAttribute("title");
  }
  if (mortes) {
    const podre = ef.podridao > 0;
    mortes.classList.toggle("apodrecendo", podre);
    // Compõe em cima da ressalva em vez de trocá-la: o efeito é um aviso a
    // mais, não um substituto da explicação de onde vem a contagem.
    const ressalva = mortes.dataset.ressalva || "";
    if (podre) {
      mortes.title = `Dragonrot: five or more deaths this session. `
        + `${horas(ef.podridao)} h left.` + (ressalva ? String.fromCharCode(10) + ressalva : "");
    } else if (ressalva) {
      mortes.title = ressalva;
    } else {
      mortes.removeAttribute("title");
    }
  }
}

const origRender = render;
render = function() {
  topicos = [];          // a página é redesenhada inteira; a lista também
  origRender();
  document.querySelectorAll(".category").forEach(sec => {
    if (openState.has(sec.dataset.idx)) sec.classList.add("open");
  });
  renderTopicos();
};

// theme toggle
// Escuro é o padrão, não o do sistema: o visual da página foi feito para o
// escuro, e quem abre pela primeira vez tem de ver isso. O claro continua
// disponível, mas é escolha explícita e fica guardada.
function applyTheme(t) {
  const efetivo = t === "light" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", efetivo);
  const botao = document.getElementById("themeToggle");
  const proximo = efetivo === "light" ? "dark" : "light";
  botao.title = "Switch to " + proximo + " mode";
  botao.setAttribute("aria-label", botao.title);
  const cor = document.querySelector('meta[name="theme-color"]');
  if (cor) cor.setAttribute("content", naTelaDeJogos() ? (efetivo === "light" ? "#f2f3f9" : "#090b12") : (efetivo === "light" ? "#ece4d3" : "#16130f"));
}
let savedTheme = null;
savedTheme = guardado(chaveDoTema());
applyTheme(savedTheme);
ligarPontoDeSync();
ligarQuadrosAbrem();
document.getElementById("themeToggle").addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
  guardar(chaveDoTema(), next);
  applyTheme(next);
});

/* --------------------------------------------- leitura do progress.json */

let lastStamp = null;

function cair(motivo) {
  // Zerar lastStamp junto é obrigatório: sem isso, quando o progress.json
  // voltar idêntico, a comparação de carimbo corta o caminho antes de
  // reatribuir `sync` e a página fica presa no erro até recarregar.
  lastStamp = null;
  if (sync !== null || motivo) { sync = motivo || null; render(); }
}

async function pollProgress() {
  try {
    const res = await fetch("progress.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) {
      // O servidor devolve 404 com corpo {ok:false,...} quando o arquivo ainda
      // não existe. Esse corpo diz o motivo real, então vale lê-lo em vez de
      // culpar o servidor.
      let corpo = null;
      try { corpo = await res.json(); } catch (e2) { corpo = null; }
      cair(corpo && corpo.ok === false ? corpo : null);
      return;
    }
    const data = await res.json();
    const stamp = JSON.stringify([data.ok, data.generatedAt, data.error]);
    if (stamp === lastStamp) return;
    lastStamp = stamp;
    sync = data;
    // Fora do try: um erro de desenho não é falha de rede, e tratá-lo como tal
    // fazia a página dizer "não estou sincronizando" enquanto o problema real
    // era um erro de script — que ficava invisível.
  } catch (e) {
    // Aberto como file://, ou servidor fora do ar.
    cair(null);
    return;
  }
  render();
}

/**
 * O gatilho de toque da moldura.
 *
 * No mouse quem liga é o `:hover`, direto no CSS. No celular hover não existe,
 * então o toque precisa ligar — e desligar também, senão o primeiro toque
 * deixaria tudo correndo para sempre e a pausa teria sido inútil.
 *
 * O ouvinte fica no documento, e não em cada bloco: os quadrados de chefe e de
 * Headless são redesenhados a cada leitura do save, e ouvinte preso neles
 * morreria junto. Daqui vale para qualquer bloco que exista agora ou venha a
 * existir.
 *
 * Tocar num bloco desliga o outro. São duas molduras grandes competindo por
 * atenção; deixar as duas correndo devolveria a página ao que ela era antes.
 */
const BLOCOS_ANIMADOS = ".boss-quadro, .headless-quadro";

document.addEventListener("click", (ev) => {
  const alvo = ev.target && ev.target.closest ? ev.target.closest(BLOCOS_ANIMADOS) : null;
  for (const b of document.querySelectorAll(BLOCOS_ANIMADOS)) {
    if (b === alvo) b.classList.toggle("animando");
    else b.classList.remove("animando");
  }
});

// open first category by default
openState.add("essentials");
render();
pollProgress();
// Na rede local o progress.json muda em segundos, e vale perguntar sempre. No
// GitHub Pages ele só muda quando o serviço publica, e vem de CDN com cache:
// perguntar de 5 em 5 segundos ali seria gastar rede da pessoa à toa.
const NA_REDE_LOCAL =
  location.protocol === "file:" ||
  /^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname) ||
  /\.local$/.test(location.hostname);
setInterval(pollProgress, NA_REDE_LOCAL ? 5000 : 60000);

/*
 * O service worker que torna o link instalável no celular. O navegador só o
 * aceita em https ou no próprio computador; pela rede local (http) a página
 * segue funcionando igual, só não vira aplicativo.
 */
if (typeof navigator !== "undefined" && "serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
