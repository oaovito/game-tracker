<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>trackeroao</title>
<!-- Instalável como aplicativo no iPhone e no Android: ver docs/sw.js. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="app/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="app/icone-192.png">
<meta name="theme-color" content="#16130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="trackeroao">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Unbounded:wght@500;600;700;800&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16130f;
    --ink-soft: #23201a;
    --paper: #ece4d3;
    --paper-dim: #cfc4ab;
    --blood: #7a1f1f;
    --blood-bright: #a8321f;
    --gold: #a8853d;
    --line: rgba(236,228,211,0.14);
    --font-display: 'Shippori Mincho', serif;
    --font-body: 'Zen Kaku Gothic New', sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) {
    --bg: var(--ink);
    --bg-panel: var(--ink-soft);
    --text: var(--paper);
    --text-dim: var(--paper-dim);
  }
  /* Não há regra seguindo prefers-color-scheme de propósito: o site é escuro
     por padrão, e só fica claro se a pessoa pedir. Sem isto, quem usa o sistema
     no claro abriria no claro. */
  :root[data-theme="light"] {
    --bg: #ece4d3;
    --bg-panel: #ddd2b8;
    --text: #201a12;
    --text-dim: #4a3f2d;
    --line: rgba(32,26,18,0.14);
  }
  /*
   * A página acompanha a escala do monitor.
   *
   * Tudo aqui é medido em rem, então mexer no corpo da raiz redimensiona o
   * conjunto inteiro de uma vez — título, números, espaçamento, quadrados —
   * mantendo as proporções. Redimensionar peça por peça daria uma página
   * desmontada em telas grandes: número gigante ao lado de rótulo miúdo.
   *
   * A reta vai de 16px em 1280 de largura até 22px em 2560, e trava nas duas
   * pontas. Abaixo de 1280 nada muda: celular e notebook continuam exatamente
   * como estavam, e o ganho é só para quem tem monitor sobrando.
   */
  html {
    font-size: clamp(16px, 0.469vw + 10px, 22px);
    scroll-padding-top: env(safe-area-inset-top, 0px);
    height: 100%;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    /* `transparent` numa parada de gradiente é preto transparente, e a
       interpolação até ele deixa uma faixa cinza visível no meio. Terminar na
       mesma cor com alfa zero resolve, e o fixed evita emenda ao rolar. */
    background-image:
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(122,31,31,0.20), rgba(122,31,31,0) 70%);
    background-repeat: no-repeat;
    background-attachment: fixed;
  }
  /* Em rem, não em px: assim a largura do corpo cresce junto com a escala da
     raiz em vez de virar uma coluna estreita no meio de um monitor grande. */
  /*
   * `hidden` vence qualquer `display` de classe.
   *
   * A regra do navegador para `[hidden]` é `display: none` com a
   * especificidade mais baixa que existe, então QUALQUER classe que declare
   * um display a atropela sem avisar. O elemento continua com o atributo, o
   * JavaScript continua achando que o escondeu, e ele aparece na tela.
   *
   * Isso não é hipótese: aconteceu duas vezes no mesmo dia. O selo de 100%
   * apareceu com as conquistas em 20 de 34, porque `.selo` declara
   * `display: grid`; e a assinatura do cabeçalho continuava ocupando lugar
   * numa máquina sem Steam, porque `.assinatura` declara `display: flex`.
   * Nos dois casos o JavaScript estava certo e o CSS é que desfazia.
   *
   * Uma regra global resolve para sempre, inclusive para o que ainda vai ser
   * escrito — que é o ponto, porque o defeito é invisível em revisão: o código
   * que esconde parece correto.
   *
   * O `!important` é necessário e não é preguiça: sem ele qualquer classe com
   * display continuaria ganhando por especificidade.
   */
  [hidden] { display: none !important; }

    .wrap { max-width: 45rem; margin: 0 auto; padding: 1.75rem 1.25rem 5rem; }

  /* O cabeçalho encolheu sem o título encolher: o que saiu foi espaço — a
     folga interna, a margem abaixo e o vão entre título e assinatura. São
     ~26px devolvidos ao corpo da página, que é o que se via de diferença numa
     tela de celular. */
  /* Sem fio embaixo: o cabeçalho e o corpo já se separam pelo espaço e pela
     diferença de corpo entre o título e o que vem depois. A régua só
     acrescentava uma horizontal a uma página que já tem a pincelada do menu
     logo abaixo — duas linhas paralelas a poucos pixels uma da outra. */
  header.top {
    padding-bottom: 12px;
    margin-bottom: 16px;
  }
  /* Tudo do cabeçalho numa coluna centrada: o título manda, e o que vem
     depois é subordinado a ele em vez de disputar a linha. */
  .top-centro { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  /*
   * O título, na tipografia do logo do jogo.
   *
   * O logo do Sekiro é feito sobre a Athelas — serifada de transição, com
   * serifas em cunha e estrutura clássica. Athelas é comercial (vem no macOS,
   * licenciada da TypeTogether), então não dá para servir num site. A Libre
   * Baskerville é a substituta livre apontada para ela, e a escolha não é
   * aproximação cega: a Athelas nasceu inspirada na impressão fina de livros
   * britânicos, que é a tradição de onde a Baskerville vem. Mesma família de
   * intenção, mesma cor de página.
   *
   * O resto é o arranjo do logo, que é metade do reconhecimento: caixa alta e
   * entreletra larga. Sem isso, a mesma fonte em caixa mista leria como um
   * livro, não como o jogo.
   *
   * O 進捗 fica de fora: a Baskerville não tem kanji, e esticar o espaçamento
   * de um par de ideogramas os quebraria. Ele continua na Mincho.
   */
  h1 {
    font-family: "Libre Baskerville", var(--font-display);
    font-weight: 700;
    font-size: 2.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    /* A entreletra larga põe espaço depois da última letra também, e isso
       desloca o conjunto para a esquerda do centro. */
    text-indent: 0.15em;
    margin: 0;
    line-height: 1.12;
    text-align: center;
  }
  h1 span {
    color: var(--blood-bright);
    font-family: var(--font-display);
    font-weight: 800;
    text-transform: none;
    letter-spacing: 0.02em;
  }

  /* Discreto mas legível: o mesmo tom apagado das outras notas, com um fio
     acima para separar. Não usa opacidade baixa, que some no tema claro. */
  .made-by {
    margin-top: 44px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.14em;
    text-transform: lowercase;
  }

  /* --- contador de mortes: campo próprio, abaixo do cabeçalho --- */
  /* Moldura de placa: fio externo, um segundo fio dourado por dentro e quatro
     cantoneiras. É o vocabulário de moldura do jogo — canto sempre reforçado,
     nunca arredondado — feito com a paleta que a página já tem, sem cor nova.
     Cantos retos de propósito: o raio de 3px amolecia a peça. */
  /* --- luto ---
   *
   * O bloco de mortes deixou de ser uma placa dourada com sangue e passou a
   * ser um velório. Isso separa os dois contadores: o de chefes é violência,
   * e sangra; este é a conta de quem morreu, e guarda luto.
   *
   * A moldura é o 鯨幕 (kujira-maku), a cortina de listras pretas e brancas
   * alternadas que se arma em velório japonês — chamada assim porque a baleia
   * é preta e branca. Ela vem faixa a faixa no topo e na base, não como borda
   * inteira, que é como a cortina se pendura de verdade.
   *
   * O branco não é escolha de contraste: até antes da era Shōwa o luto no
   * Japão era branco, e o preto só entra depois, por influência ocidental. O
   * Sekiro se passa muito antes disso, então o branco é a cor certa para o
   * período, e o dourado sai porque ouro é celebração.
   */
  .deaths-panel {
    position: relative;
    border: 1px solid rgba(214, 210, 200, 0.16);
    /* Sala de velório: uma luz só, vinda de cima, e o resto caindo no escuro.
       O fundo é mais fundo que o dos outros blocos de propósito — é o que dá
       peso sem precisar de mais desenho na borda. */
    background:
      radial-gradient(90% 62% at 50% 0%, rgba(236, 232, 222, 0.085), rgba(236,232,222,0) 68%),
      radial-gradient(140% 120% at 50% 42%, rgba(10, 10, 12, 0.35), rgba(4, 4, 5, 0.86) 88%),
      var(--bg-panel);
    border-radius: 0;
    padding: 40px 22px 20px;
    margin-bottom: 26px;
    overflow: hidden;
  }
  .deaths-panel::before,
  .deaths-panel::after {
    content: "";
    position: absolute;
    pointer-events: none;
  }
  /* A cortina: listras de 26px, brancas e pretas, no alto e no pé do bloco.
     A de baixo é mais apagada, como pano no escuro longe da vela. */
  /*
   * A cortina, refeita.
   *
   * A primeira tentativa era uma fita de 10px de listras alternadas, no topo e
   * no pé — e lia como faixa de pedestre, não como luto. O erro foi de
   * proporção: o 鯨幕 é pano PENDURADO, alto, que cai do alto da parede; uma
   * tira fina com listras de mesma largura é exatamente o desenho de uma
   * travessia de rua.
   *
   * Agora é tecido: alto o bastante para ter queda, com painéis verticais
   * separados por sombra, uma faixa de luz no alto onde o pano é esticado, e
   * a barra inferior escurecendo como pano que some na penumbra. O branco
   * também saiu do puro: linho envelhecido, não tinta.
   */
  /*
   * A listra acabou.
   *
   * O 鯨幕 é a referência certa e mesmo assim não funcionou três vezes: como
   * fita fina virou faixa de pedestre, mais alta virou tecla de piano, e
   * apagada virou sujeira na borda. O problema não era o ajuste — é que
   * claro-e-escuro alternando em faixa horizontal é um sinal de trânsito antes
   * de ser qualquer outra coisa, e nenhuma dose conserta isso.
   *
   * No lugar, 白菊 — o crisântemo branco, a flor que o Japão põe no altar e na
   * sepultura. É a mesma referência cultural (luto japonês), mas em desenho em
   * vez de padrão, e desenho não se confunde com pavimentação. Elegância aqui
   * é uma coisa só, grande, quase apagada, atrás do número: marca d'água de
   * lápide, não decoração de borda.
   *
   * O fio de luz no alto fica, sozinho: um traço fino é o que separa uma placa
   * memorial de um retângulo qualquer.
   */
  .deaths-panel::before {
    left: 0; right: 0; top: 0;
    height: 1px;
    background: linear-gradient(90deg,
      rgba(226, 222, 212, 0) 0%,
      rgba(226, 222, 212, 0.38) 22%,
      rgba(226, 222, 212, 0.5) 50%,
      rgba(226, 222, 212, 0.38) 78%,
      rgba(226, 222, 212, 0) 100%);
  }
  /* O crisântemo: grande, à direita, e tão apagado que só se percebe depois de
     olhar. Gira devagaríssimo — uma volta a cada dez minutos —, o que o olho
     não vê acontecer mas percebe que mudou. */
  .deaths-panel .kiku {
    position: absolute;
    right: -6%; top: 50%;
    width: 210px; height: 210px;
    transform: translateY(-50%);
    opacity: 0.07;
    pointer-events: none;
    animation: kiku-gira 600s linear infinite;
  }
  .deaths-panel .kiku svg { width: 100%; height: 100%; display: block; }
  /* no jogo: 白菊: o crisântemo branco do altar, girando devagar como marca d'água */
  @keyframes kiku-gira {
    0%   { transform: translateY(-50%) rotate(0deg); }
    100% { transform: translateY(-50%) rotate(360deg); }
  }
  /*
   * A névoa do chão, no lugar de uma sombra chapada.
   *
   * O bloco precisava de mais peso fúnebre sem voltar à listra, e o caminho
   * não era mais padrão — era mais ATMOSFERA. Uma bruma baixa, que se move
   * devagar e nunca fecha a mesma forma, dá sala de velório; uma segunda
   * fileira de listras daria faixa de pedestre de novo.
   */
  .deaths-panel::after {
    left: -10%; right: -10%; bottom: 0;
    height: 74px;
    background:
      radial-gradient(60% 100% at 18% 100%, rgba(150,160,150,0.09), rgba(150,160,150,0) 72%),
      radial-gradient(50% 100% at 52% 100%, rgba(170,180,170,0.11), rgba(170,180,170,0) 70%),
      radial-gradient(64% 100% at 84% 100%, rgba(140,152,144,0.08), rgba(140,152,144,0) 74%),
      linear-gradient(180deg, transparent, rgba(0,0,0,0.55));
    animation: bruma 29s ease-in-out infinite;
  }
  /* no jogo: a névoa parada de Mibu Village e das Ashina Depths */
  @keyframes bruma {
    0%, 100% { transform: translateX(0);    opacity: 0.85; }
    33%      { transform: translateX(14px); opacity: 1; }
    66%      { transform: translateX(-11px); opacity: 0.72; }
  }
  /*
   * Hitodama (人魂): no folclore japonês, a alma de um morto vista como um
   * fogo-fátuo que paira. É o fantasma certo para este bloco — o ocidental, de
   * lençol, seria piada; este é luto.
   *
   * Cada alma é um bulbo com um rastro atrás (o ::after), subindo devagar e
   * desviando de lado, apagando antes de chegar ao topo. Os três tempos são
   * primos entre si de propósito: 13s, 17s e 19s nunca voltam a coincidir, e é
   * isso que impede a leitura de "três coisas piscando em fila".
   */
  /*
   * O rosto.
   *
   * A primeira versão era um bulbo com um rabo fino atrás, e não havia como
   * não ver espermatozoide: cabeça redonda mais cauda afilada é exatamente
   * esse desenho, em qualquer contexto. O que conserta não é diminuir o rabo —
   * é dar cara à coisa e trocar a cauda por fumaça larga, que dissolve em vez
   * de afilar.
   *
   * A cara é de desespero, que é o que um 幽霊 japonês tem: órbitas fundas e
   * escuras, e a boca aberta num lamento — alta e estreita, não um sorriso
   * redondo. O desespero está no contraste, então as cavidades são quase
   * pretas contra o pálido, e não cinzas.
   */
  .deaths-head { display: flex; align-items: baseline; gap: 12px; }
  /* O rótulo voltou ao lado do número, em inglês como o resto da interface.
     Ao lado, e não embaixo, para a linha ler como uma frase: 死 221 deaths. */
  .deaths-rot {
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #8d887d;
    align-self: baseline;
  }
  /*
   * A chama do Ídolo, à esquerda do número.
   *
   * Tom: o turquesa do 鬼仏. É a única cor dessa família no jogo inteiro e
   * aparece exatamente onde se volta depois de morrer, então ela diz "morte"
   * sem precisar de palavra — e diz melhor que o 死 que estava aqui, porque os
   * outros dois blocos já abrem com ideograma e um terceiro na mesma posição
   * vira padrão em vez de significado.
   *
   * A altura acompanha o número, e não é fixa: os dois crescem juntos quando a
   * página escala com o monitor.
   */
  .deaths-chama {
    display: block;
    width: 2.1rem; height: 2.85rem;
    flex: 0 0 auto;
    align-self: center;
    /* O halo é do fogo, não do traço: envolve a silhueta inteira em vez de
       cada caminho, que é o que faz a luz parecer sair de dentro. */
    filter: drop-shadow(0 0 7px rgba(94, 200, 240, 0.75))
            drop-shadow(0 0 20px rgba(46, 159, 212, 0.45));
    animation: vela 6.4s ease-in-out infinite;
  }
  .deaths-chama svg { width: 100%; height: 100%; display: block; overflow: visible; }
  /*
   * As fagulhas.
   *
   * Sobem soltas e apagam antes de chegar longe, como as do Ídolo. Os três
   * períodos não são múltiplos entre si: é a soma deles que impede o conjunto
   * de fechar um ciclo visível e virar pisca-pisca.
   */
  .deaths-chama .fagulha { opacity: 0; }
  .deaths-chama .f1 { animation: fagulha 3.1s ease-out infinite; }
  .deaths-chama .f2 { animation: fagulha 4.3s ease-out infinite -1.6s; }
  .deaths-chama .f3 { animation: fagulha 5.7s ease-out infinite -3.4s; }
  /* no jogo: as fagulhas que se desprendem da chama do Ídolo e apagam no ar */
  @keyframes fagulha {
    0%   { opacity: 0;    transform: translateY(0)      scale(1); }
    18%  { opacity: 0.95; transform: translateY(-2px)   scale(0.95); }
    100% { opacity: 0;    transform: translateY(-11px)  scale(0.3); }
  }

  /*
   * O número é lápide.
   *
   * O que o gradiente faz aqui é o contrário do de antes: no bloco de chefes a
   * cor escorre de cima para baixo, como sangue descendo; aqui a claridade
   * desce e para, como pedra que pega luz no alto e fica escura embaixo.
   * A sombra interna inclina para o baixo-direita, que é onde a luz de uma
   * vela posta à frente deixaria a sombra do sulco — é isso que dá a leitura
   * de gravado em vez de impresso.
   */
  .deaths-count {
    position: relative;
    font-family: var(--font-display);
    font-size: 2.9rem;
    font-weight: 800;
    line-height: 1;
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
    background-image: linear-gradient(
      180deg,
      #f2efe7 0%, #cdc8bb 26%, #8e8a80 58%, #55524b 82%, #2e2c29 100%);
    background-size: 100% 190%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    /* Sem varredura de ponta a ponta: o luto não pulsa, respira. O deslocamento
       é curto e lento de propósito. */
    animation: luto 9.2s ease-in-out infinite;
    filter: drop-shadow(0 1px 0 rgba(0, 0, 0, 0.9))
            drop-shadow(0 0 14px rgba(226, 222, 212, 0.22));
  }
  /* A luz sobre a lápide agora percorre o glifo inteiro em vez de tremer
     dentro de uma faixa de 28%. Continua lento — luto respira, não pulsa —,
     mas o percurso é largo o bastante para se ver a pedra pegando e perdendo
     luz, que era a ideia desde o começo. */
  /*
   * A luz percorre o glifo inteiro, em vez de tremer dentro de uma faixa de
   * 28%. Continua lento — luto respira, não pulsa —, mas o percurso é largo o
   * bastante para se ver a pedra pegando e perdendo luz.
   *
   * Só `background-position` aqui, de propósito. A tentação era somar um
   * `filter: brightness()` para engrossar o efeito, mas `filter` na animação
   * vence a declaração da regra, e levaria junto as duas sombras que dão o
   * relevo de gravado — e o tom esverdeado da podridão, que é aplicado pelo
   * mesmo caminho. Uma propriedade só, e nenhuma delas se atropela.
   */
  /* no jogo: a respiração de quem vela: o número inspira e expira, não pulsa */
  @keyframes luto {
    0%, 100% { background-position: 50% 2%; }
    34%      { background-position: 50% 54%; }
    67%      { background-position: 50% 92%; }
  }
  /*
   * Nada sobe do número. A fumaça de incenso que saía dele lia como fantasma
   * pairando sobre a contagem, e foi retirada a pedido; a chama do Ídolo, à
   * esquerda, já carrega sozinha a ideia de morte e retorno.
   */
  /* A vela: a luz não bate igual o tempo todo, e o intervalo entre as quedas
     não é regular — vela que oscila em compasso vira pisca-pisca. */
  /* A vela ficou de verdade. Antes a queda mais funda era de 18% de opacidade
     e o halo mal mudava — parado ao lado de um número imóvel, ninguém veria.
     Agora ela chega a quase apagar, e o brilho vai de 3px a 26px: é a
     diferença entre "tem uma animação ali" e "tem uma chama ali". */
  /* no jogo: a chama do Ídolo do Escultor oscilando, que quase apaga e volta */
  @keyframes vela {
    0%, 100% { opacity: 1;    text-shadow: 0 0 14px rgba(232, 228, 216, 0.55); }
    7%       { opacity: 0.55; text-shadow: 0 0 4px  rgba(232, 228, 216, 0.15); }
    11%      { opacity: 1;    text-shadow: 0 0 26px rgba(255, 246, 220, 0.8); }
    16%      { opacity: 0.72; text-shadow: 0 0 6px  rgba(232, 228, 216, 0.2); }
    22%      { opacity: 0.98; text-shadow: 0 0 18px rgba(255, 246, 220, 0.65); }
    48%      { opacity: 0.62; text-shadow: 0 0 5px  rgba(232, 228, 216, 0.18); }
    53%      { opacity: 1;    text-shadow: 0 0 24px rgba(255, 246, 220, 0.75); }
    59%      { opacity: 0.8;  text-shadow: 0 0 9px  rgba(232, 228, 216, 0.28); }
    77%      { opacity: 0.5;  text-shadow: 0 0 3px  rgba(232, 228, 216, 0.12); }
    82%      { opacity: 1;    text-shadow: 0 0 22px rgba(255, 246, 220, 0.7); }
    91%      { opacity: 0.86; text-shadow: 0 0 11px rgba(232, 228, 216, 0.34); }
  }
  .deaths-note {
    font-size: 0.72rem;
    color: var(--text-dim);
    line-height: 1.5;
    margin-top: 10px;
  }
  .deaths-note:empty { display: none; }

  /* Termômetro de 0 a 1000. O recuo lateral é metade da largura do pino, para
     ele não vazar do campo nos extremos da escala. */
  /* O recuo é metade da largura do pino, para ele não vazar do campo nos
     extremos. A pista interna tem a largura exata do tubo, e é isso que deixa o
     pino ser posicionado só com uma porcentagem — sem conta em pixel no script,
     que quebraria quando o rosto muda de tamanho no celular. */
  .therm { margin-top: 20px; padding: 0 22px; }
  .therm-rail { position: relative; padding-top: 40px; }
  .therm-track {
    height: 12px;
    border-radius: 99px;
    background: var(--bg);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .therm-fill {
    height: 100%;
    width: 0%;
    border-radius: 99px;
    /* A escala não esquenta, apaga. Sai da cera clara da vela, passa pela
       fumaça e termina na cinza: quanto mais se morreu, mais queimou. Ir para
       o vermelho aqui era o mesmo gesto do bloco de chefes, e este bloco
       precisa dizer outra coisa. */
    background: linear-gradient(90deg,
      #e8e4da, #b9b3a6 34%, #7c776d 66%, #46433e);
    transition: width 0.5s ease;
  }
  .therm-pin {
    position: absolute;
    top: 0;
    left: 0%;
    width: 40px;
    height: 40px;
    transform: translateX(-50%);
    transition: left 0.5s ease;
  }
  .therm-skull {
    display: block;
    font-size: 30px;
    line-height: 40px;
    text-align: center;
    /* Pedir a fonte de emoji do sistema é o ponto: cada aparelho desenha a
       caveira dele, e no iPhone sai a da Apple. */
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  /* O bebê só existe no estado "esperando a primeira morte". */
  .therm-pin .therm-bebe { display: none; }
  .deaths-panel.esperando .therm-skull { display: none; }
  .deaths-panel.esperando .therm-pin .therm-bebe { display: block; }
  /* Haste ligando o rosto ao tubo, para a leitura ser exata e não aproximada. */
  .therm-pin::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 100%;
    width: 1px;
    height: 10px;
    margin-left: -0.5px;
    background: #cfcabd;
    opacity: 0.7;
  }
  .therm-scale {
    display: flex;
    justify-content: space-between;
    margin-top: 7px;
    font-size: 0.66rem;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  /* Sem offset calibrado o número é desconhecido, não zero: o rosto sai de cena
     e o tubo fica vazio, em vez de fingir uma leitura em 0. */
  /*
   * Os dois estados do bloco de mortes: sino e podridão.
   *
   * Ficam numa fileira própria embaixo do termômetro, alinhados à direita,
   * porque a esquerda já é do número e a linha do meio é do termômetro.
   *
   * A regra que vale para os dois: ligado e desligado são duas FIGURAS, não a
   * mesma figura em dois tons. Quem olha de relance lê o desenho, não a
   * saturação — foi o que a primeira versão errou.
   */
  .estados {
    position: relative; z-index: 2;
    display: flex; align-items: flex-end; justify-content: flex-end;
    gap: 1.4rem;
    margin-top: 0.9rem;
  }
  .estado {
    display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
    background: none; border: 0; padding: 0;
    color: var(--text-dim);
    transition: color 0.25s ease, opacity 0.25s ease;
  }
  .estado-rot {
    font-family: var(--font-display);
    font-size: 0.68rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    white-space: nowrap;
    transition: color 0.25s ease, letter-spacing 0.25s ease;
  }

  /* ---------------------------------------------------------- o Sino Demoníaco */
  .estado-sino svg { width: 2rem; height: 2rem; display: block; overflow: visible; }
  .estado-sino .sino-corpo {
    fill: none; stroke: currentColor; stroke-width: 1.3;
    stroke-linejoin: round;
    transform-origin: 12px 2.2px;
  }
  .estado-sino .sino-frisos { stroke-width: 0.85; opacity: 0.6; }
  .estado-sino .sino-tronco {
    fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round;
    opacity: 0.3;
  }
  .estado-sino .sino-ondas {
    fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round;
    opacity: 0;
  }
  .estado-sino .sino-badalo {
    stroke: currentColor; stroke-width: 1.2; stroke-linecap: round;
    opacity: 0;
  }
  .estado-sino .sino-badalo-ponta { fill: currentColor; opacity: 0; }
  .estado-sino .sino-casco { fill: none; transition: fill 0.3s ease; }

  /*
   * Desligado: pendurado e quieto.
   *
   * Contorno fino, boca vazia, sem badalo e sem onda. É o estado normal, então
   * não chama — mas continua legível, porque "não estou carregando nada" é uma
   * informação e não uma ausência.
   */
  .estado-sino.off { opacity: 0.4; }
  .estado-sino.off .sino-corpo { stroke-width: 1.1; }

  /*
   * Ligado: o sino bateu e o que ficou é o peso.
   *
   * O corpo se preenche de vermelhão de selo, o badalo aparece fora do eixo (é
   * o desalinho que denuncia um sino que acabou de tocar), as ondas saem dos
   * dois lados em duas camadas, e o conjunto balança. Nenhuma dessas quatro
   * coisas existe no estado desligado — é outra figura, não outra cor.
   */
  .estado-sino.on { color: #d6402a; opacity: 1; }
  .estado-sino.on .sino-casco { fill: rgba(214, 64, 42, 0.22); }
  .estado-sino.on .sino-ondas { opacity: 0.9; animation: sino-onda 1.9s ease-in-out infinite; }
  .estado-sino.on .sino-onda-larga { opacity: 0.45; }
  .estado-sino.on .sino-badalo,
  .estado-sino.on .sino-badalo-ponta { opacity: 1; }
  .estado-sino.on .sino-corpo { animation: sino-bate 1.9s ease-in-out infinite; }
  .estado-sino.on .sino-tronco { opacity: 0.75; }
  /* O nome que o jogo dá ao estado é mais longo que o do repouso, então a
     entreletra aperta um pouco para ele não empurrar a fileira. */
  .estado-sino.on .estado-rot {
    color: #d6402a;
    letter-spacing: 0.1em;
    text-shadow: 0 0 12px rgba(214, 64, 42, 0.45);
  }
  /* no jogo: 鬼仏の鐘, o Sino Demoníaco balançando depois de tocado */
  @keyframes sino-bate {
    0%, 100% { transform: rotate(-8deg); }
    50%      { transform: rotate(8deg); }
  }
  /* no jogo: a onda de som saindo do sino, que é o que aflige quem o tocou */
  @keyframes sino-onda {
    0%, 100% { opacity: 0.3; transform: scale(0.92); }
    50%      { opacity: 1;   transform: scale(1.08); }
  }

  /* ------------------------------------------------------------- a podridão */
  .estado-rot-bt { cursor: pointer; }
  .rot-peca {
    position: relative;
    display: grid; place-items: center;
    width: 3.2rem; height: 2.6rem;
  }
  /*
   * O 竜 é o fundo, e o número é a peça.
   *
   * A hierarquia é o conteúdo do pedido: a contagem tem de se ler primeiro.
   * Então o kanji recua para trás dela, grande e apagado, funcionando como
   * campo em vez de disputar leitura — e o número vem por cima, em corpo de
   * contador.
   */
  .rot-kanji {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-family: var(--font-display);
    font-size: 2.5rem;
    line-height: 1;
    transition: color 0.3s ease, opacity 0.3s ease;
  }
  .rot-n {
    position: relative; z-index: 2;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.75rem;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  /*
   * A mancha.
   *
   * Uma auréola irregular que cresce com o número de essências, via --rot
   * (0 a 1). Ela não existe no estado limpo: zero não é uma mancha pequena, é
   * a ausência dela.
   */
  .rot-mancha {
    position: absolute;
    left: 50%; top: 50%;
    width: 3.6rem; height: 3.6rem;
    transform: translate(-50%, -50%) scale(calc(0.6 + 0.4 * var(--rot, 0)));
    border-radius: 48% 52% 55% 45% / 52% 46% 54% 48%;
    background: radial-gradient(circle at 42% 38%,
      rgba(150, 168, 96, calc(0.55 * var(--rot, 0))) 0%,
      rgba(110, 132, 66, calc(0.3 * var(--rot, 0))) 48%,
      rgba(90, 110, 54, 0) 72%);
    filter: blur(2.5px);
    pointer-events: none;
    transition: transform 0.4s ease;
  }

  /*
   * Limpo: só o kanji, vazado e quieto.
   *
   * Sem número (não há o que contar), sem mancha, sem brilho. O ícone segue
   * dizendo de que assunto se trata, sem afirmar que ele está acontecendo.
   */
  .estado-rot-bt.off { opacity: 0.45; }
  .estado-rot-bt.off .rot-kanji { font-size: 1.9rem; opacity: 0.85; }
  .estado-rot-bt.off .rot-n { display: none; }

  /*
   * Com podridão: o número manda, o kanji vira campo e a mancha nasce.
   */
  .estado-rot-bt.on { color: #c3cf9a; }
  .estado-rot-bt.on .rot-kanji { color: #6f7f4c; opacity: 0.55; }
  .estado-rot-bt.on .rot-n {
    color: #dbe6b4;
    text-shadow: 0 0 14px rgba(150, 168, 96, 0.7), 0 1px 2px rgba(0,0,0,0.8);
  }
  .estado-rot-bt.on .rot-mancha { animation: rot-pulsa 6.5s ease-in-out infinite; }
  .estado-rot-bt.on .estado-rot {
    color: #c3cf9a;
    text-shadow: 0 0 12px rgba(150, 168, 96, 0.4);
  }
  .estado-rot-bt:hover, .estado-rot-bt:focus-visible { color: var(--paper); outline: 0; }
  .estado-rot-bt:hover .rot-n, .estado-rot-bt:focus-visible .rot-n { color: var(--paper); }
  /* no jogo: 竜咳, a mancha da podridão, que muda de forma sem mudar de lugar */
  @keyframes rot-pulsa {
    0%, 100% { border-radius: 48% 52% 55% 45% / 52% 46% 54% 48%; }
    50%      { border-radius: 54% 46% 44% 56% / 46% 56% 44% 54%; }
  }

  /* A lista dentro da janela: item em cima, nome de quem embaixo. */
  .rot-lista { display: flex; flex-direction: column; gap: 0.7rem; }
  .rot-linha {
    display: flex; flex-direction: column; gap: 0.12rem;
    padding-bottom: 0.7rem;
    border-bottom: 1px solid var(--line);
  }
  .rot-linha:last-child { border-bottom: 0; padding-bottom: 0; }
  .rot-item {
    font-family: var(--font-display);
    font-size: 0.95rem;
    color: #c3cf9a;
  }
  .rot-npc { font-size: 0.78rem; color: var(--text-dim); }
  .rot-vazio { font-size: 0.85rem; color: var(--text-dim); line-height: 1.5; }

  .deaths-panel.unknown .deaths-count,
  /* Sem leitura, o fogo apaga: fica o traço cinza, sem halo. Uma chama acesa
     sobre um número desconhecido afirmaria que há o que contar. */
  .deaths-panel.unknown:not(.esperando) .deaths-chama { filter: grayscale(1) opacity(0.4); }
  .deaths-panel.unknown .therm-pin { opacity: 0.28; filter: grayscale(1); }
  .deaths-panel.unknown .therm-pin::after { background: var(--line); }
  /* Esperando a primeira morte não é leitura faltando: é zero ainda por
     acontecer, e o bebê aparece inteiro, sem o cinza do "não sei". */
  .deaths-panel.unknown.esperando .therm-pin { opacity: 1; filter: none; }
  /* Estourou a escala: o pino encosta no fim e o 1000 vira "1000+". Branco e
     não vermelho, porque aqui o excesso é de luto, não de sangue. */
  .deaths-panel.over .therm-scale span:last-child { color: #e8e4da; }
  /* Faixa do botão de tema: colada no topo, alinhada à direita. */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 10px;
  }
  /* Voltar, avançar e início: no meio da faixa do topo, em toda página. */
  .navegar { display: flex; align-items: center; gap: 6px; }
  .nav-bt {
    appearance: none; cursor: pointer; display: grid; place-items: center;
    width: 2rem; height: 2rem; padding: 0; border-radius: 50%;
    background: none; border: 1px solid var(--line); color: var(--text-dim);
    transition: color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
  }
  .nav-bt svg {
    width: 0.95rem; height: 0.95rem; display: block;
    fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
  }
  .nav-bt:hover:not(:disabled), .nav-bt:focus-visible { outline: 0; color: var(--text); border-color: var(--gold); }
  .nav-bt:disabled { opacity: 0.3; cursor: default; }
  .vista-hub .nav-bt, .vista-bibli .nav-bt {
    background: var(--j-vidro); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .theme-toggle {
    background: none;
    border: 0;
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: 0.9rem;
    line-height: 1;
    padding: 2px 4px;
    cursor: pointer;
    opacity: 0.4;
    transition: opacity 0.15s ease;
  }
  .theme-toggle:hover { opacity: 1; color: var(--text); }
  /* Assinatura: presente, mas sem puxar o olho para longe do progresso. */
  /* Assinatura com peso: é o nome do projeto, não uma nota de rodapé. */
  /*
   * Menor e ainda assim mais presente.
   *
   * Tamanho não é a única moeda de destaque, e aqui era a errada: a assinatura
   * competia por corpo com um título três vezes maior e perdia de qualquer
   * jeito. Encolhida, ela ganha o que o título não tem — peso alto, entreletra
   * bem aberta e um fio dourado de cada lado, que isola a linha em vez de
   * deixá-la solta embaixo. Lê-se como legenda de placa, não como sobra.
   */
  .assinatura {
    font-family: var(--font-display);
    font-size: 0.78rem;
    font-weight: 800;
    color: var(--gold);
    letter-spacing: 0.34em;
    text-transform: lowercase;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 12px;
    text-shadow: 0 0 14px rgba(168, 133, 61, 0.35);
  }
  .assinatura::before,
  .assinatura::after {
    content: "";
    width: 26px; height: 1px;
    background: linear-gradient(90deg, rgba(168,133,61,0), var(--gold));
  }
  .assinatura::after { background: linear-gradient(90deg, var(--gold), rgba(168,133,61,0)); }
  .assinatura.sem-nome { opacity: 0.45; }
  .assinatura-campo {
    background: none; border: 0; border-bottom: 1px solid var(--gold);
    color: var(--gold); font: inherit; letter-spacing: inherit; text-align: center;
    width: 14em; max-width: 60vw; padding: 0 0 2px; outline: 0;
  }
  .theme-toggle:hover { color: var(--text); border-color: var(--gold); }

  .overall {
    margin-bottom: 30px;
  }
  .overall-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: var(--font-display);
    margin-bottom: 8px;
  }
  .overall-row .count { font-size: 1.4rem; font-weight: 700; }
  .overall-row .label { font-size: 0.85rem; color: var(--text-dim); font-family: var(--font-body); }
  .bar-track {
    height: 6px;
    background: var(--bg-panel);
    border-radius: 0;
    overflow: hidden;
    position: relative;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blood), var(--blood-bright));
    width: 0%;
    transition: width 0.4s ease;
  }

  /* --- os quadrados 1:1 --- */
  /* São duas fileiras de dois: chefes e Headless logo abaixo do menu, e
     conquistas e tempo de jogo no fim. O teto de 320px existe porque, com só
     dois quadrados por fileira, 1fr numa tela larga faria cada um virar um
     painel de 330px de altura; centralizados e limitados eles ficam do mesmo
     tamanho em qualquer largura. No celular o teto não pega e continua sendo
     dois por linha, como antes. */
  .dois-quadrados {
    display: grid;
    /* O teto vai no contêiner, não na faixa: com `minmax(148px, 320px)` o
       auto-fit conta as colunas pelo máximo, e no celular dava uma coluna só —
       os quadrados deixavam de ficar lado a lado. Com 1fr ele conta pelo
       mínimo e continuam sendo dois por linha em qualquer largura. */
    grid-template-columns: repeat(auto-fit, minmax(9.25rem, 1fr));
    max-width: 40.75rem;
    margin: 0 auto 1.25rem;
    gap: 12px;
  }
  /* Sem moldura e sem fundo: estes dois não são placas como os de mortes e
     chefes, só precisam se parecer um com o outro. */
  .quadro {
    aspect-ratio: 1 / 1;
    border: 0;
    background: none;
    padding: 4px 6px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-width: 0;
    /* Sem isto o conteúdo mais alto que o quadrado estica a caixa e o 1:1
       vai embora: aspect-ratio cede para o conteúdo, não o contrário. */
    min-height: 0;
    overflow: hidden;
  }
  .quadro-topo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .quadro-num {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 2.1rem;
    line-height: 1;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .quadro-rot {
    font-size: 0.68rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .quadro-pe { width: 100%; }

  /* Anel de progresso: enche o quadrado, que era o problema da barra. */
  /* A seta de abrir, igual à dos blocos de chefe e de Headless. Sem ela nada
     na peça dizia que havia o que abrir: o anel parecia só um medidor, e a
     lista das 34 conquistas ficava escondida atrás de um clique que ninguém
     tinha motivo para tentar. */
  .quadro-anel { align-items: center; justify-content: center; gap: 8px; padding: 0; position: relative; }
  .quadro-anel::after {
    content: "▾";
    position: absolute; right: 8px; bottom: 6px;
    font-size: 0.7rem; color: var(--text-dim);
    transition: transform 0.2s ease;
    pointer-events: none;
  }
  .quadro-anel.aberto::after { transform: rotate(180deg); }
  /* A seta em dourado e um pouco maior que a dos outros blocos: aqui ela é o
     único sinal de que há o que abrir, enquanto nos de chefe o próprio número
     gigante já convida ao clique. Tentei somar a palavra "list" ao rótulo, mas
     "ACHIEVEMENTS · LIST" não cabe numa linha na largura do quadrado e quebrava
     o bloco em duas. */
  .quadro-anel::after {
    font-size: 0.86rem;
    color: var(--gold);
    opacity: 0.8;
  }
  .quadro-anel:hover::after { opacity: 1; }
  /* O quadrado inteiro é o botão, como nos blocos de chefe: alvo grande, e
     nada de alvo dentro de alvo. */
  .anel-abre {
    width: 100%; height: 100%;
    appearance: none; background: none; border: 0; padding: 4px 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; cursor: pointer; font-family: var(--font-body); min-height: 0;
  }

  /*
   * A coroa de fogo do anel.
   *
   * Só acende quando a sessão rendeu duas ou mais conquistas, e apaga sozinha
   * seis horas depois. É um segundo traço por cima do primeiro, na mesma
   * geometria: assim ele segue exatamente o progresso, em vez de ser um enfeite
   * solto girando em volta.
   *
   * O tracejado curto e o deslocamento correndo é o que dá a leitura de chama
   * lambendo o aro — uma borda contínua pulsando leria como brilho, não fogo.
   */
  .anel-fogo {
    fill: none;
    stroke: url(#chama);
    stroke-width: 9;
    stroke-linecap: round;
    transform: rotate(-90deg);
    transform-origin: 50% 50%;
    stroke-dasharray: 3 7;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  .anel-pegando .anel-fogo {
    opacity: 1;
    animation: lamber 1.1s linear infinite, bruxulear 2.3s ease-in-out infinite;
    filter: drop-shadow(0 0 5px rgba(255,150,40,0.9)) drop-shadow(0 0 14px rgba(255,90,20,0.6));
  }
  /* no jogo: a língua de fogo do Flame Vent lambendo a borda */
  @keyframes lamber { to { stroke-dashoffset: -100; } }
  /* no jogo: a chama azul que arde no alto de todo Ídolo do Escultor */
  @keyframes bruxulear {
    0%, 100% { stroke-width: 8;  opacity: 0.85; }
    40%      { stroke-width: 11; opacity: 1; }
    70%      { stroke-width: 9;  opacity: 0.92; }
  }
  /* Com fogo aceso o número no meio também esquenta, senão o efeito fica só
     na borda e parece decalque. */
  .anel-pegando .anel-pct { color: #ffd9a8; text-shadow: 0 0 14px rgba(255,140,40,0.7); }

  /*
   * 竜咳 — a podridão do dragão.
   *
   * No jogo, morrer demais adoece os NPCs: eles começam a tossir sangue e o
   * mundo fica mais pobre. Aqui ela toma o bloco de mortes por seis horas
   * depois de cinco mortes numa sessão, e o desenho segue essa descrição —
   * manchas escuras que crescem devagar a partir das bordas, e um verde
   * doentio por cima do luto. Não é sangue vivo, que é do bloco de chefes;
   * é sangue velho em pano.
   */
  .deaths-panel.apodrecendo {
    box-shadow: inset 0 0 40px rgba(60, 74, 38, 0.45);
  }
  .deaths-panel.apodrecendo .manchas {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    background:
      radial-gradient(38% 46% at 8% 88%,  rgba(74, 26, 18, 0.55), rgba(74,26,18,0) 70%),
      radial-gradient(30% 40% at 92% 14%, rgba(58, 22, 16, 0.5),  rgba(58,22,16,0) 72%),
      radial-gradient(46% 36% at 72% 96%, rgba(52, 62, 30, 0.42), rgba(52,62,30,0) 70%),
      radial-gradient(26% 34% at 30% 4%,  rgba(46, 56, 28, 0.38), rgba(46,56,28,0) 74%);
    animation: alastrar 17s ease-in-out infinite;
    mix-blend-mode: multiply;
  }
  /* Cresce e recua, sem nunca voltar ao mesmo ponto: doença não pulsa em
     compasso. As quatro manchas usam a mesma animação porque são um fundo só,
     e o deslocamento de fundo é o que as faz respirar fora de sincronia. */
  /* no jogo: o fogo do Flame Vent se espalhando pelo alvo, que cresce do ponto de contato para fora */
  @keyframes alastrar {
    0%, 100% { background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%; opacity: 0.75; }
    35%      { background-size: 128% 124%, 112% 130%, 118% 108%, 136% 120%; opacity: 1; }
    68%      { background-size: 112% 136%, 130% 110%, 104% 128%, 116% 132%; opacity: 0.88; }
  }
  /* O número adoece junto: o osso ganha um tom esverdeado de coisa parada. */
  .deaths-panel.apodrecendo .deaths-count {
    filter: drop-shadow(0 1px 0 rgba(0,0,0,0.9))
            drop-shadow(0 0 16px rgba(120, 140, 70, 0.5))
            sepia(0.35) hue-rotate(28deg) saturate(1.25);
  }
  /* A podridão adoece o fogo pelo filtro, e não por cor: o degradê tem cinco
     paradas, e repintar cada uma seria cinco lugares para errar. */
  .deaths-panel.apodrecendo .deaths-chama {
    filter: drop-shadow(0 0 7px rgba(150, 168, 96, 0.7))
            sepia(0.5) hue-rotate(24deg) saturate(1.2);
  }
  /* --- a lista de conquistas --- */
  /* Lista de uma coluna, e não grade: cada conquista tem nome e descrição de
     comprimentos muito diferentes, e em grade as caixas ficam com alturas
     desencontradas e buracos. Em coluna a leitura é de cima para baixo, que é
     como se lê uma lista. */
  .conq-lista {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: -6px 0 22px;
  }
  .conq-lista[hidden] { display: none; }

  /* --- a janela --- */
  .janela {
    width: min(42.5rem, calc(100vw - 2rem));
    max-height: 86vh;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 2px;
    background: var(--bg-panel);
    color: var(--text);
    overflow: hidden;
    /* `dialog` aberto é flex para o corpo poder rolar sozinho; fechado o
       navegador esconde, e `display: flex` aqui venceria isso. */
    flex-direction: column;
  }
  .janela[open] { display: flex; }
  .janela::backdrop {
    background: rgba(6, 5, 6, 0.78);
    backdrop-filter: blur(2px);
  }
  .janela-topo {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  .janela-titulo {
    font-size: 0.74rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-dim);
  }
  .janela-fecha {
    appearance: none; background: none; border: 0;
    color: var(--text-dim); cursor: pointer;
    font-size: 1rem; line-height: 1;
    padding: 6px 8px; margin: -6px -8px -6px 0;
  }
  .janela-fecha:hover { color: var(--text); }
  /* O corpo rola; o topo fica. Sem isto a janela inteira cresceria além da
     tela e o botão de fechar sairia de vista. */
  .janela-corpo {
    overflow-y: auto;
    padding: 14px 16px 16px;
    flex: 1 1 auto;
    min-height: 0;
  }
  .janela-corpo .boss-lista,
  .janela-corpo .conq-lista,
  .janela-corpo .category { margin: 0; }
  /* Seção dentro da janela não precisa do cabeçalho que abre e fecha: quem
     escolheu o tópico no menu já disse o que quer ver. */
  .janela-corpo .category { border-bottom: 0; }
  .janela-corpo .cat-header { cursor: default; padding-top: 0; }
  .janela-corpo .cat-header .pin,
  .janela-corpo .chevron { display: none; }

  /* Com a janela aberta a página de trás não rola: sem isto, chegar ao fim da
     lista continua rolando o que está embaixo, e ao fechar a pessoa está num
     lugar diferente de onde abriu — o incômodo que a janela veio resolver. */
  body.com-janela { overflow: hidden; }
  /* O cabeçalho de cada faixa de dificuldade. */
  .conq-faixa {
    display: flex; align-items: baseline; gap: 10px;
    margin: 14px 0 2px;
    font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--text-dim);
  }
  .conq-faixa:first-child { margin-top: 2px; }
  .conq-faixa::after {
    content: ""; flex: 1; height: 1px; background: var(--line);
  }
  .conq-faixa .conta { letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .conq-faixa.facil   { color: #9db98a; }
  .conq-faixa.media   { color: #c2ab6b; }
  .conq-faixa.dificil { color: #c08069; }
  .conq {
    display: flex; align-items: center; gap: 12px;
    border: 1px solid var(--line);
    background: var(--bg-panel);
    padding: 8px 12px 8px 8px;
    min-width: 0;
  }
  .conq-icone {
    flex: 0 0 auto;
    width: 40px; height: 40px;
    border: 1px solid var(--line);
    background: rgba(0,0,0,0.35) center / cover no-repeat;
  }
  /* A que falta já está esmaecida no conjunto; o ícone perde a cor também,
     que é como a própria Steam mostra conquista bloqueada. */
  .conq.presa .conq-icone { filter: grayscale(1) brightness(0.8); }
  /* A marca da mais rara, na linha dela. */
  .conq-tag {
    flex: 0 0 auto;
    font-size: 0.6rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 2px 6px;
    border: 1px solid var(--blood-bright);
    color: var(--blood-bright);
    white-space: nowrap;
  }
  .conq.presa .conq-tag { opacity: 0.8; }
  .conq.e-shinobi { border-color: rgba(212, 70, 42, 0.55); }

  /*
   * 忍殺 — o golpe mortal, quando a mais rara cai.
   *
   * O pedido era uma animação única no site inteiro, e o gesto que o jogo usa
   * para "isto acabou" é esse: o kanji vermelho estampado na tela no golpe
   * fatal. Não é enfeite emprestado de outro lugar; é a linguagem do próprio
   * Sekiro para o momento decisivo, e a conquista mais rara é a que exige
   * todas as outras.
   *
   * Cobre a viewport inteira, corre uma vez e sai. `pointer-events: none`
   * porque nada do site pode ficar sem clique enquanto ela passa.
   */
  .golpe {
    position: fixed; inset: 0; z-index: 90;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    opacity: 0;
  }
  .golpe.correndo { animation: golpe-cena 3.4s ease-out forwards; }
  /* no jogo: 忍殺: a tela que o jogo mostra no golpe mortal */
  @keyframes golpe-cena {
    0%   { opacity: 0; }
    6%   { opacity: 1; }
    72%  { opacity: 1; }
    100% { opacity: 0; }
  }
  /* A tinta: o vermelho entra pelas bordas, não pelo meio, como respingo. */
  .golpe::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 90% at 50% 50%, rgba(0,0,0,0) 38%, rgba(60, 8, 6, 0.82) 100%),
      radial-gradient(60% 50% at 8% 12%, rgba(168,30,18,0.5), rgba(168,30,18,0) 70%),
      radial-gradient(50% 60% at 94% 82%, rgba(168,30,18,0.45), rgba(168,30,18,0) 72%);
    animation: golpe-tinta 3.4s ease-out forwards;
  }
  /* no jogo: o respingo de tinta que acompanha o kanji do golpe */
  @keyframes golpe-tinta {
    0%   { transform: scale(1.5); opacity: 0; }
    8%   { transform: scale(1);   opacity: 1; }
    100% { transform: scale(1.1); opacity: 0; }
  }
  .golpe-kanji {
    position: relative;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(4.5rem, 26vw, 13rem);
    line-height: 1;
    letter-spacing: 0.08em;
    color: #e8412a;
    text-shadow: 0 0 22px rgba(255, 70, 40, 0.75), 0 4px 10px rgba(0,0,0,0.9);
    animation: golpe-kanji 3.4s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
  }
  /* Entra grande e desabando para o tamanho, como carimbo: é o tempo do gesto
     no jogo — impacto primeiro, leitura depois. */
  /* no jogo: o kanji do 忍殺 entrando como carimbo, impacto antes de leitura */
  @keyframes golpe-kanji {
    0%   { transform: scale(2.4); opacity: 0; filter: blur(8px); }
    7%   { transform: scale(1);   opacity: 1; filter: blur(0); }
    12%  { transform: scale(1.06); }
    18%  { transform: scale(1); }
    74%  { transform: scale(1);   opacity: 1; }
    100% { transform: scale(1.12); opacity: 0; }
  }
  /* O corte: um traço branco atravessa o kanji no instante do impacto. */
  .golpe-corte {
    position: absolute;
    left: -10%; right: -10%; top: 50%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #fff 18%, #ffd9cf 50%, #fff 82%, transparent);
    transform-origin: 50% 50%;
    animation: golpe-corte 3.4s ease-out forwards;
  }
  /* no jogo: o traço do corte que atravessa a tela no instante do 忍殺 */
  @keyframes golpe-corte {
    0%   { transform: rotate(-18deg) scaleX(0); opacity: 0; }
    5%   { transform: rotate(-18deg) scaleX(1); opacity: 1; }
    16%  { transform: rotate(-18deg) scaleX(1); opacity: 0; }
    100% { opacity: 0; }
  }
  /*
   * --- 討: todos os chefes ---
   *
   * A linguagem do bloco de chefes é sangue, então a cena sangra: o vermelho
   * vem de cima e ESCORRE, em vez de estampar e sair como o golpe mortal. Sete
   * fios com tempos diferentes, porque sangue escorrendo em compasso vira
   * cortina de teatro.
   */
  .golpe-chefes::before {
    background:
      radial-gradient(120% 90% at 50% 40%, rgba(0,0,0,0) 30%, rgba(74, 6, 4, 0.9) 100%),
      linear-gradient(180deg, rgba(150, 18, 10, 0.75), rgba(150,18,10,0) 42%);
  }
  .golpe-chefes .golpe-kanji {
    color: #e0301c;
    text-shadow: 0 0 26px rgba(255, 50, 25, 0.8), 0 6px 14px rgba(0,0,0,0.95);
  }
  .golpe-fio {
    position: absolute; top: 0;
    width: 4px; height: 0;
    border-radius: 0 0 60% 60%;
    background: linear-gradient(180deg, #ff4522, #8c1a10 62%, rgba(90,10,6,0));
    animation-name: escorrer-tela;
    animation-timing-function: cubic-bezier(0.35, 0, 0.6, 1);
    animation-fill-mode: forwards;
  }
  /* no jogo: o mesmo sangue, na tela inteira da cena de chefes */
  @keyframes escorrer-tela {
    0%   { height: 0;    opacity: 0; }
    12%  { opacity: 1; }
    100% { height: 108vh; opacity: 0.85; }
  }

  /*
   * --- 怖: todos os Headless ---
   *
   * 怖 é o kanji que o próprio Sekiro usa para o Terror — e o Terror é
   * exatamente o que os Headless impõem. A cena treme, com os mesmos vetores
   * apontando para o sul do bloco deles: medo encolhe e recua para baixo, não
   * pula. A bruma roxa entra por baixo, que é de onde eles vêm.
   */
  .golpe-headless::before {
    background:
      radial-gradient(120% 90% at 50% 50%, rgba(0,0,0,0) 26%, rgba(26, 8, 44, 0.92) 100%),
      radial-gradient(90% 60% at 50% 100%, rgba(124, 58, 186, 0.55), rgba(124,58,186,0) 72%);
  }
  .golpe-headless .golpe-kanji {
    color: #c98cf5;
    text-shadow: 0 0 28px rgba(176, 107, 240, 0.9), 0 0 60px rgba(90, 30, 150, 0.7),
                 0 6px 14px rgba(0,0,0,0.95);
    animation: golpe-kanji 3.4s cubic-bezier(0.1, 0.9, 0.2, 1) forwards,
               pavor 0.42s steps(2, end) infinite;
  }
  /* O tremor da cena usa os vetores do bloco: sul, alternando sudoeste e
     sudeste, e a escala só encolhe. */
  /* no jogo: 怖: o tremor que o Terror imprime na imagem */
  @keyframes pavor {
    0%, 100% { margin: 0; }
    25%      { margin: 3px 0 -3px -4px; }
    75%      { margin: 3px -4px -3px 0; }
  }
  .golpe-bruma {
    position: absolute; left: -12%; right: -12%; bottom: -10%;
    height: 70%;
    background:
      radial-gradient(52% 100% at 22% 100%, rgba(150, 90, 220, 0.5), rgba(150,90,220,0) 70%),
      radial-gradient(46% 100% at 58% 100%, rgba(124, 58, 186, 0.55), rgba(124,58,186,0) 72%),
      radial-gradient(58% 100% at 86% 100%, rgba(110, 50, 170, 0.45), rgba(110,50,170,0) 74%);
    filter: blur(6px);
    animation: subir-bruma 3.4s ease-out forwards;
  }
  /* no jogo: a névoa de Mibu subindo do chão frio */
  @keyframes subir-bruma {
    0%   { transform: translateY(40%) scaleY(0.6); opacity: 0; }
    18%  { transform: translateY(0) scaleY(1);     opacity: 1; }
    100% { transform: translateY(-22%) scaleY(1.3); opacity: 0; }
  }

  /* Enquanto o marco está de pé, a página guarda a cor dele na borda: o site
     não volta a ser o mesmo depois disso. As três podem coexistir. */
  body.tem-chefes::before {
    content: "";
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    box-shadow: inset 0 0 0 2px rgba(168, 50, 31, 0.4),
                inset 0 6px 40px rgba(140, 26, 16, 0.3);
  }
  body.tem-headless .topbar::before {
    content: "";
    position: fixed; left: 0; right: 0; bottom: 0; height: 90px;
    z-index: 2; pointer-events: none;
    background: linear-gradient(0deg, rgba(124, 58, 186, 0.22), rgba(124,58,186,0));
  }
  body.tem-shinobi::after {
    content: "";
    position: fixed; inset: 0; z-index: 2;
    pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(212, 70, 42, 0.35),
                inset 0 0 44px rgba(140, 26, 16, 0.22);
  }

  .conq-raridade {
    margin-left: auto;
    flex: 0 0 auto;
    font-size: 0.68rem;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  /* A que falta fica esmaecida, e não ausente: a lista é o mapa inteiro. */
  .conq.presa { opacity: 0.34; }
  .conq-marca {
    font-family: var(--font-display);
    font-size: 1rem; line-height: 1.2;
    color: var(--gold);
    flex: 0 0 auto;
  }
  .conq.presa .conq-marca { color: var(--text-dim); }
  .conq-texto { min-width: 0; }
  .conq-origem {
    margin-top: 3px; font-size: 0.62rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--gold); opacity: 0.8;
  }
  .conq-nome {
    font-family: var(--font-display);
    font-size: 0.9rem; line-height: 1.25; color: var(--text);
  }
  .conq-desc {
    font-size: 0.72rem; line-height: 1.4; color: var(--text-dim); margin-top: 2px;
  }
  /* Conquista oculta que ainda não caiu não tem descrição para mostrar; o
     jogo esconde de propósito, e inventar texto seria pior que o traço. */
  .conq-desc.segredo { font-style: italic; }
  /* O anel dimensiona pela ALTURA disponível, e não pela largura: assim ele
     nunca empurra o quadrado para fora do 1:1. */
  /* `align-self: center` e `width: auto` são o que faz o anel derivar a
     largura da altura. Sem eles o flex em coluna estica a caixa até a largura
     toda, o aspect-ratio puxa a altura junto, e o anel vaza do quadrado. */
  .anel {
    position: relative;
    flex: 0 1 auto;
    align-self: center;
    min-height: 0;
    height: 100%;
    width: auto;
    aspect-ratio: 1 / 1;
  }
  .anel svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  .anel circle { fill: none; stroke-width: 9; }
  /* O trilho era da cor do fundo, o que funcionava quando o quadrado tinha
     fundo próprio. Sem ele, o trilho sumia e só o arco preenchido aparecia —
     não dava para ver quanto falta. */
  .anel-trilho { stroke: var(--bg-panel); }
  .anel-fio {
    stroke: var(--blood-bright);
    stroke-linecap: butt;
    /* 2πr com r=42. O dasharray é o anel inteiro; o offset é o que falta. */
    stroke-dasharray: 263.89;
    stroke-dashoffset: 263.89;
    transition: stroke-dashoffset 0.6s ease;
  }
  /*
   * ===== 皆伝: o estado de 100% nas conquistas =====
   *
   * Duas coisas mudam, e a segunda é a que importa: o bloco ganha detalhe, e
   * ganha hierarquia. Até os 100% ele é um medidor entre iguais; a partir
   * dali é o assunto da página, e a página tem de dizer isso sem reorganizar
   * nada — quem já conhece o layout não pode se perder nele.
   *
   * Como se resolve isso sem mexer no fluxo: o quadrado sobe um pouco
   * (translate, que não ocupa espaço), ganha halo por fora (box-shadow, que
   * também não), e o selo mora absoluto sobre o topo dele. Nenhuma das três
   * empurra vizinho nenhum.
   */
  .quadro-anel.kaiden {
    transform: translateY(-0.35rem);
    transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.8s ease;
    box-shadow:
      0 0 0 1px rgba(168, 133, 61, 0.55),
      0 0 26px rgba(168, 133, 61, 0.22),
      0 0 70px rgba(214, 64, 42, 0.14);
    overflow: visible;
  }
  /* A moldura de luz: um arco dourado dando a volta na borda do quadrado,
     devagar. É o detalhe que o pedido chama de "muito detalhada" sem virar
     enfeite — ele descreve a peça em vez de cobri-la. */
  /*
   * A moldura de luz: um fio dourado dando a volta na borda, devagar.
   *
   * Ela mora num elemento próprio, e não num pseudo-elemento do quadrado, por
   * um motivo concreto: o `::after` do `.quadro-anel` já é a setinha que diz
   * que o bloco abre. Usá-lo aqui apagou a seta e pintou um retângulo por
   * cima do conteúdo inteiro — o bloco sumiu da tela.
   *
   * O recorte para sobrar só a borda também não usa `mask`: a forma
   * abreviada com prefixo `-webkit-` não pegou, e o que apareceu foi a fatia
   * do gradiente cônico atravessando o bloco na diagonal. Aqui o miolo é
   * tapado por um filho do tamanho de dentro, pintado com o fundo da página.
   * Sobra a moldura de 1px, e funciona em qualquer navegador que saiba
   * desenhar um gradiente.
   */
  .kaiden-moldura { display: none; }
  .quadro-anel.kaiden .kaiden-moldura {
    display: block;
    position: absolute; inset: -1px;
    border-radius: inherit;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .quadro-anel.kaiden .kaiden-moldura::before {
    content: "";
    position: absolute;
    /* Maior que a caixa e quadrado, senão ao girar as quinas do gradiente
       saem de dentro do bloco e a volta fica com buracos. */
    left: 50%; top: 50%;
    width: 160%; aspect-ratio: 1;
    transform: translate(-50%, -50%);
    background: conic-gradient(from 0deg,
      rgba(168,133,61,0) 0deg, rgba(168,133,61,0) 62deg,
      rgba(255, 226, 150, 0.95) 90deg,
      rgba(168,133,61,0) 118deg, rgba(168,133,61,0) 360deg);
    animation: kaiden-fio 7s linear infinite;
    animation-play-state: var(--anim, running);
  }
  /* O tampão. Herda a cor de fundo da página, que muda com o tema — por isso
     é `var(--bg)` e não uma cor escrita à mão. */
  .quadro-anel.kaiden .kaiden-moldura::after {
    content: "";
    position: absolute; inset: 1px;
    border-radius: inherit;
    background: var(--bg);
  }
  /* O conteúdo fica por cima da moldura; a seta do canto continua onde
     estava, porque nada aqui toca no `::after` do quadrado. */
  .quadro-anel.kaiden > .anel-abre,
  .quadro-anel.kaiden > .selo { position: relative; z-index: 2; }
  /* no jogo: o fio de ouro na borda, como o de um pergaminho de licença */
  @keyframes kaiden-fio { to { transform: translate(-50%, -50%) rotate(360deg); } }

  /* O anel fechado é ouro, não sangue: sangue é a medida em curso, ouro é o
     que acabou. E a ponta do traço vira redonda — o corte reto aparecia como
     emenda no topo, que num círculo completo é defeito. */
  .quadro-anel.kaiden .anel-fio {
    stroke: #e8c877;
    stroke-linecap: round;
    filter: drop-shadow(0 0 7px rgba(255, 200, 90, 0.6));
  }
  .quadro-anel.kaiden .anel-trilho { stroke: rgba(168, 133, 61, 0.18); }
  .quadro-anel.kaiden .anel-pct {
    color: transparent;
    background-image: linear-gradient(100deg,
      #8a6a22 0%, #a8853d 12%, #e8c877 26%, #fff6da 42%, #e8c877 58%, #a8853d 100%);
    -webkit-background-clip: text; background-clip: text;
    background-size: 220% 100%;
    animation: kaiden-brilho 5.5s linear infinite;
    animation-play-state: var(--anim, running);
    text-shadow: 0 0 20px rgba(255, 210, 120, 0.35);
  }
  /* no jogo: 蒔絵 maki-e: a luz correndo no ouro sobre laca */
  @keyframes kaiden-brilho {
    0%   { background-position: 220% 0; }
    100% { background-position: -20% 0; }
  }
  .quadro-anel.kaiden .anel-num,
  .quadro-anel.kaiden .quadro-rot { color: var(--gold); letter-spacing: 0.22em; }

  /*
   * O selo 落款.
   *
   * Absoluto sobre o topo do quadrado e centrado: não ocupa lugar no fluxo,
   * então aparecer aos 100% não move nada na página. Os cantos têm raios
   * desiguais, que é o que dá a irregularidade de carimbo — quadrado perfeito
   * lê como adesivo.
   */
  .selo {
    position: absolute;
    top: -1.05rem; left: 50%;
    transform: translateX(-50%) rotate(-4deg);
    z-index: 4;
    width: 2.7rem; height: 2.7rem;
    display: grid; place-items: center;
    background: none; border: 0; padding: 0;
    cursor: pointer;
    animation: selo-nasce 1.4s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  /* Entra como carimbo batido: desce de cima, esmaga, e assenta. */
  /* no jogo: 落款: o carimbo descendo, esmagando e assentando no papel */
  @keyframes selo-nasce {
    0%   { opacity: 0; transform: translateX(-50%) rotate(-14deg) scale(2.2); filter: blur(6px); }
    45%  { opacity: 1; transform: translateX(-50%) rotate(-2deg)  scale(0.9); filter: blur(0); }
    70%  { transform: translateX(-50%) rotate(-5deg) scale(1.07); }
    100% { transform: translateX(-50%) rotate(-4deg) scale(1); }
  }
  .selo-tinta {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 24% 20%, rgba(255,120,100,0.35) 0%, rgba(255,120,100,0) 42%),
      #c62f1e;
    border-radius: 24% 17% 26% 19% / 18% 26% 17% 25%;
    box-shadow:
      inset 0 0 0 1px rgba(255, 180, 160, 0.25),
      inset 0 -3px 7px rgba(120, 18, 10, 0.4),
      0 0 16px rgba(198, 47, 30, 0.55);
  }
  .selo-kanji {
    position: relative; z-index: 1;
    font-family: var(--font-display);
    font-size: 0.82rem;
    font-weight: 700;
    line-height: 0.95;
    letter-spacing: 0;
    color: #fff3ec;
    writing-mode: vertical-rl;
    text-shadow: 0 1px 2px rgba(120, 20, 10, 0.6);
  }
  .selo:hover, .selo:focus-visible {
    outline: 0;
    transform: translateX(-50%) rotate(-1deg) scale(1.08);
    transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .selo:hover .selo-tinta { box-shadow: inset 0 0 0 1px rgba(255,200,180,0.4), 0 0 26px rgba(214, 64, 42, 0.85); }

  /*
   * ===== a cena do selo, na página inteira =====
   *
   * As outras cenas são golpes: entram, batem e somem em três segundos. Esta
   * não — o pedido é contemplar. Então ela é lenta, translúcida e não tapa a
   * página: quem quiser continuar lendo por baixo, lê.
   *
   * `pointer-events: none` é o que garante isso. Uma cena que engole o clique
   * transformaria "contemplar" em "esperar".
   */
  .kaiden-cena {
    position: fixed; inset: 0;
    z-index: 60;
    pointer-events: none;
    overflow: hidden;
  }
  /* A lavagem de tinta sobe do pé da tela, como papel absorvendo. */
  .kaiden-lavagem {
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 70% at 50% 108%, rgba(198, 47, 30, 0.34) 0%, rgba(198, 47, 30, 0) 62%),
      radial-gradient(90% 60% at 50% -8%, rgba(168, 133, 61, 0.26) 0%, rgba(168, 133, 61, 0) 58%);
    animation: kaiden-lava 5.2s ease-out forwards;
  }
  /* no jogo: 墨 sumi: a lavagem de tinta subindo pelo papel que a absorve */
  @keyframes kaiden-lava {
    0%   { opacity: 0; transform: translateY(14%) scale(1.15); }
    18%  { opacity: 1; transform: translateY(0) scale(1); }
    72%  { opacity: 1; }
    100% { opacity: 0; transform: scale(1.06); }
  }
  /* O carimbo grande, no meio: mesma leitura do selinho, em tamanho de tela. */
  /*
   * O carimbo ocupa a altura inteira da tela, e não meia.
   *
   * Em escrita vertical a altura disponível é o que decide quantos glifos
   * cabem numa coluna. Ancorado em `top: 50%`, sobrava metade da tela, os
   * dois kanji não cabiam juntos e o segundo ia para uma coluna à esquerda —
   * que em vertical-rl é a coluna SEGUINTE. Na tela lia-se 伝皆, invertido.
   */
  .kaiden-selo {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display);
    font-size: clamp(5rem, 26vw, 15rem);
    font-weight: 700;
    line-height: 0.9;
    writing-mode: vertical-rl;
    color: rgba(230, 62, 40, 0.92);
    text-shadow: 0 0 60px rgba(214, 64, 42, 0.55), 0 6px 26px rgba(0,0,0,0.75);
    animation: kaiden-bate 5.2s cubic-bezier(0.14, 0.9, 0.2, 1) forwards;
  }
  /* no jogo: 落款: o carimbo de tinta sendo batido no papel */
  @keyframes kaiden-bate {
    0%   { opacity: 0; transform: scale(2.6) rotate(-10deg); filter: blur(14px); }
    12%  { opacity: 1; transform: scale(1) rotate(-3deg);    filter: blur(0); }
    18%  { transform: scale(1.04) rotate(-4deg); }
    26%  { transform: scale(1) rotate(-4deg); }
    76%  { opacity: 0.92; }
    100% { opacity: 0; transform: scale(1.14) rotate(-4deg); }
  }
  /* A poeira dourada: faíscas subindo devagar, como cinza de incenso. São
     pontos num gradiente repetido, não elementos — cem nós para um efeito de
     fundo seria caro e não se veria diferença. */
  .kaiden-poeira {
    position: absolute; inset: -20% 0 0 0;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 82%, rgba(255,226,150,0.9), transparent),
      radial-gradient(1.2px 1.2px at 28% 64%, rgba(255,210,120,0.7), transparent),
      radial-gradient(1.8px 1.8px at 44% 91%, rgba(255,240,190,0.85), transparent),
      radial-gradient(1.1px 1.1px at 61% 72%, rgba(255,205,110,0.65), transparent),
      radial-gradient(1.6px 1.6px at 77% 86%, rgba(255,232,165,0.8), transparent),
      radial-gradient(1.3px 1.3px at 89% 68%, rgba(255,215,130,0.7), transparent),
      radial-gradient(1.4px 1.4px at 35% 40%, rgba(255,226,150,0.6), transparent),
      radial-gradient(1.2px 1.2px at 68% 33%, rgba(255,240,190,0.55), transparent);
    animation: kaiden-sobe 5.2s linear forwards;
  }
  /* no jogo: a cinza do incenso subindo, que é o que se olha enquanto se contempla */
  @keyframes kaiden-sobe {
    0%   { opacity: 0; transform: translateY(12%); }
    20%  { opacity: 1; }
    80%  { opacity: 0.8; }
    100% { opacity: 0; transform: translateY(-34%); }
  }

  .anel-meio {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px;
  }
  .anel-pct {
    font-family: var(--font-display); font-weight: 800;
    font-size: clamp(1.4rem, 5.5vw, 2.1rem);
    line-height: 1; color: var(--text); font-variant-numeric: tabular-nums;
  }
  .anel-num { font-size: 0.72rem; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .quadro-rot-centro { text-align: center; }
  /* --- tempo de jogo: o número é metal, e o metal melhora com as horas --- */
  .tempo-meio {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
  }
  .tempo-num {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(2.4rem, 11vw, 4.2rem);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    /* O brilho é um gradiente atravessando o glifo, recortado pelo texto. A
       faixa clara corre devagar, como luz passando por metal polido. */
    background-image: linear-gradient(
      100deg,
      var(--m1) 0%, var(--m2) 22%, var(--m3) 34%, #ffffff 40%,
      var(--m3) 46%, var(--m2) 60%, var(--m1) 100%);
    background-size: 320% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: polir 3.2s linear infinite;
    filter: drop-shadow(0 2px 1px rgba(0,0,0,0.75)) brightness(1.25) contrast(1.35);
  }
  /* no jogo: a luz correndo no aço da lâmina do Lobo quando ele a limpa */
  @keyframes polir {
    0%   { background-position: 140% 50%; }
    100% { background-position: -40% 50%; }
  }
  /* Metais de partida; o script troca conforme as horas. */
  .quadro { --m1: #5d5952; --m2: #8d877e; --m3: #c9c3b8; }

  /* Marcos de 25 em 25 horas até 200. */
  .marcos { display: flex; gap: 2px; height: 8px; }
  .marcos i {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 1px;
  }
  .marcos i.cheio { background: var(--gold); border-color: var(--gold); }
  .marcos i.parcial { background: linear-gradient(90deg, var(--gold) var(--p), transparent var(--p)); }
  .marcos-esc {
    display: flex; justify-content: space-between;
    font-size: 0.6rem; color: var(--text-dim); margin-top: 5px;
  }

  /* Quadrado que é botão inteiro: alvo grande, nada de alvo dentro de alvo. */
  .quadro-botao { padding: 0; position: relative; }
  .quadro-abre {
    width: 100%; height: 100%;
    appearance: none; background: none; border: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
    cursor: pointer; font-family: var(--font-body);
  }
  .quadro-kanji { font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; line-height: 1; }
  .quadro-botao .quadro-num { font-size: clamp(2.2rem, 9vw, 3.4rem); }
  .quadro-botao .quadro-rot { text-align: center; }
  .quadro-botao::after {
    content: "▾";
    position: absolute; right: 8px; bottom: 6px;
    font-size: 0.7rem; color: var(--text-dim);
    transition: transform 0.2s ease;
  }
  .quadro-botao.aberto::after { transform: rotate(180deg); }

  /* --- bloco 3: mortes de chefe --- */
  /* --- sangue e terror: os dois quadrados de contagem --- */

  /* --- a moldura do bloco só se mexe quando se olha para ele ---
   *
   * A borda sangrando e o tremor do Headless rodando sem parar deixavam a
   * página sem ponto de descanso: são efeitos grandes, na periferia da visão,
   * e acontecendo sempre nenhum deles chega a ser notado. Parados, viram
   * resposta — o bloco reage a você.
   *
   * Isto vale só para o que é do bloco: a moldura, o tremor, as gotas que
   * escorrem pela caixa. O conteúdo fica de fora — o número e o kanji seguem
   * animando sozinhos o tempo todo, porque eles são a informação, e informação
   * que só se mexe sob o ponteiro obriga a passar o mouse para ler.
   *
   * O mecanismo é uma variável só. O bloco declara `--anim: paused`, e as
   * regras da moldura leem `animation-play-state: var(--anim)`. Variável de
   * CSS é herdada, então alcança pseudo-elemento e filho sem repetir seletor.
   * Pausada, a animação segura o primeiro quadro, que é justamente o repouso
   * do desenho: gota com opacidade zero, tremor em deslocamento zero.
   *
   * Dois gatilhos porque são dois aparelhos. `:hover` cobre o mouse; a classe
   * `animando`, posta por toque, cobre o celular, onde hover não existe.
   */
  .boss-quadro, .headless-quadro { --anim: paused; }
  .boss-quadro:hover, .boss-quadro.animando,
  .headless-quadro:hover, .headless-quadro.animando { --anim: running; }

  /* O sangue é o ponto do desenho. O resto da página é contido de propósito
     para que estes dois possam ser assim. */
  .boss-quadro {
    background: radial-gradient(120% 90% at 50% 0%, rgba(140,20,12,0.38), rgba(22,14,12,0.9) 72%);
    box-shadow: inset 0 0 26px rgba(168,50,31,0.45);
    overflow: hidden;
  }
  .boss-quadro::before {
    content: "";
    position: absolute; inset: 0;
    border: 2px solid transparent;
    border-image: linear-gradient(180deg,
      #400b07 0%, #8c1a10 18%, #d4462a 34%, #ff5b33 46%,
      #d4462a 58%, #8c1a10 78%, #400b07 100%) 1;
    animation: sangue-borda 2.6s ease-in-out infinite;
    animation-play-state: var(--anim, running);
    pointer-events: none;
  }
  /* A borda pulsa como pressão arterial: sobe rápido, sustenta, e cai devagar
     — em vez do vai e vem simétrico, que lia como brilho de néon. */
  /* no jogo: a pressão sanguínea da moldura, assimétrica como pulso */
  @keyframes sangue-borda {
    0%, 100% { opacity: 0.45; filter: saturate(1) brightness(0.8); }
    12%      { opacity: 1;    filter: saturate(2.4) brightness(1.6); }
    28%      { opacity: 0.9;  filter: saturate(2) brightness(1.35); }
    40%      { opacity: 1;    filter: saturate(2.6) brightness(1.7); }
    100%     { opacity: 0.45; filter: saturate(1) brightness(0.8); }
  }
  .boss-kanji { color: #ff5b33; text-shadow: 0 0 14px rgba(255,91,51,0.85), 0 0 34px rgba(168,50,31,0.6); }
  .boss-num {
    background-image: linear-gradient(180deg,
      #ffd8cc 0%, #ff6a3d 22%, #d4462a 40%, #8c1a10 62%, #4a0d08 100%);
    background-size: 100% 300%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
    animation: escorrer-forte 2.8s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(212,70,42,0.75)) drop-shadow(0 2px 2px rgba(0,0,0,0.8));
  }
  /* no jogo: o sangue escorrendo da lâmina depois do deathblow */
  @keyframes escorrer-forte {
    0%   { background-position: 50% 0%; }
    45%  { background-position: 50% 100%; }
    100% { background-position: 50% 0%; }
  }

  /* Três gotas com tempos diferentes, para não virar um metrônomo. */
  .pingo {
    position: absolute; top: 0; width: 4px; border-radius: 0 0 60% 60%;
    background: linear-gradient(180deg, #ff5b33, #8c1a10 60%, transparent);
    opacity: 0; pointer-events: none;
  }
  /* O play-state vai dentro de cada uma, depois do atalho: `animation`
     reescreve todos os seus longhands, então a mesma declaração posta numa
     regra `.pingo` acima seria zerada pela linha que define a queda. */
  /* Os fios são seis e mais grossos, e descem o bloco inteiro em vez de
     morrer no meio. */
  .pingo.p1 { left: 9%;  width: 5px; height: 22px; animation: gotejar 3.4s ease-in infinite;        animation-play-state: var(--anim, running); }
  .pingo.p2 { left: 24%; width: 3px; height: 16px; animation: gotejar 4.7s ease-in 0.8s infinite;   animation-play-state: var(--anim, running); }
  .pingo.p3 { left: 41%; width: 6px; height: 26px; animation: gotejar 3.9s ease-in 1.5s infinite;   animation-play-state: var(--anim, running); }
  .pingo.p4 { left: 58%; width: 4px; height: 19px; animation: gotejar 5.3s ease-in 0.4s infinite;   animation-play-state: var(--anim, running); }
  .pingo.p5 { left: 74%; width: 5px; height: 24px; animation: gotejar 4.1s ease-in 2.2s infinite;   animation-play-state: var(--anim, running); }
  .pingo.p6 { left: 89%; width: 3px; height: 14px; animation: gotejar 5.9s ease-in 1.1s infinite;   animation-play-state: var(--anim, running); }

  /*
   * O jorro: sai de baixo sob pressão, sobe, e desaba.
   *
   * É o gesto que o jogo faz no golpe mortal — gêiser arterial, não gota. Sem
   * esta camada o bloco continua parecendo um cano furado em vez de um corte.
   */
  .jorro {
    position: absolute; bottom: 0;
    width: 7px; height: 8px;
    border-radius: 60% 60% 40% 40%;
    background: linear-gradient(0deg, #ff6a3d, #d4462a 42%, #8c1a10 78%, rgba(90,10,6,0));
    opacity: 0; pointer-events: none;
    filter: blur(0.3px);
  }
  .jorro.j1 { left: 17%; animation: jorrar 4.3s cubic-bezier(0.15,0.7,0.4,1) 0.2s infinite;  animation-play-state: var(--anim, running); }
  .jorro.j2 { left: 44%; animation: jorrar 5.7s cubic-bezier(0.15,0.7,0.4,1) 1.9s infinite;  animation-play-state: var(--anim, running); }
  .jorro.j3 { left: 68%; animation: jorrar 3.7s cubic-bezier(0.15,0.7,0.4,1) 3.1s infinite;  animation-play-state: var(--anim, running); }
  .jorro.j4 { left: 86%; animation: jorrar 6.1s cubic-bezier(0.15,0.7,0.4,1) 0.9s infinite;  animation-play-state: var(--anim, running); }
  /* no jogo: o jorro arterial do deathblow, que é o gesto mais forte do jogo */
  @keyframes jorrar {
    0%   { transform: translateY(0) scaleY(0.4) scaleX(1);   opacity: 0; }
    6%   { transform: translateY(-18px) scaleY(2.6) scaleX(0.8); opacity: 1; }
    16%  { transform: translateY(-62px) scaleY(4.2) scaleX(0.6); opacity: 0.95; }
    26%  { transform: translateY(-88px) scaleY(2.2) scaleX(0.9); opacity: 0.7; }
    38%  { transform: translateY(-58px) scaleY(1.4) scaleX(1.3); opacity: 0.45; }
    52%  { transform: translateY(-14px) scaleY(0.9) scaleX(1.8); opacity: 0.2; }
    64%, 100% { transform: translateY(0) scaleY(0.4) scaleX(2.2); opacity: 0; }
  }

  /* O respingo aparece de uma vez, como gota que bateu, e escurece secando. */
  .respingo {
    position: absolute;
    width: 6px; height: 5px;
    border-radius: 54% 46% 62% 38% / 58% 62% 38% 42%;
    background: #a8201a;
    opacity: 0; pointer-events: none;
  }
  .respingo.r1 { left: 13%; top: 22%; animation: bater 5.1s steps(1, end) 0.3s infinite;  animation-play-state: var(--anim, running); }
  .respingo.r2 { left: 31%; top: 61%; animation: bater 6.3s steps(1, end) 1.7s infinite;  animation-play-state: var(--anim, running); }
  .respingo.r3 { left: 47%; top: 34%; animation: bater 4.7s steps(1, end) 2.9s infinite;  animation-play-state: var(--anim, running); }
  .respingo.r4 { left: 62%; top: 72%; animation: bater 7.1s steps(1, end) 0.8s infinite;  animation-play-state: var(--anim, running); }
  .respingo.r5 { left: 79%; top: 45%; animation: bater 5.9s steps(1, end) 3.6s infinite;  animation-play-state: var(--anim, running); }
  .respingo.r6 { left: 22%; top: 84%; animation: bater 6.7s steps(1, end) 2.2s infinite;  animation-play-state: var(--anim, running); }
  .respingo.r7 { left: 91%; top: 18%; animation: bater 4.3s steps(1, end) 4.4s infinite;  animation-play-state: var(--anim, running); }
  /* no jogo: o sangue do 忍殺 batendo no chão depois do golpe */
  @keyframes bater {
    0%, 4%   { opacity: 0;    transform: scale(0.4); }
    5%       { opacity: 0.95; transform: scale(1.35); }
    9%       { opacity: 0.9;  transform: scale(1); }
    60%      { opacity: 0.5;  transform: scale(1); filter: brightness(0.6); }
    100%     { opacity: 0;    transform: scale(1); filter: brightness(0.35); }
  }

  /* A poça: cresce e não recua, porque sangue não volta. */
  .poca {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 26px;
    background: linear-gradient(0deg, rgba(120, 14, 9, 0.85), rgba(120,14,9,0.25) 55%, rgba(120,14,9,0));
    opacity: 0; pointer-events: none;
    transform-origin: 50% 100%;
    animation: empocar 9.4s ease-in-out infinite;
    animation-play-state: var(--anim, running);
  }
  /* no jogo: a poça que fica no chão depois de um deathblow */
  @keyframes empocar {
    0%   { opacity: 0.18; transform: scaleY(0.35); }
    55%  { opacity: 0.7;  transform: scaleY(1.15); }
    100% { opacity: 0.18; transform: scaleY(0.35); }
  }
  /* no jogo: o sangue pingando da moldura, no tempo de uma ferida aberta */
  @keyframes gotejar {
    0%       { transform: translateY(0) scaleY(0.3); opacity: 0; }
    12%      { transform: translateY(6px) scaleY(1); opacity: 1; }
    72%      { transform: translateY(78px) scaleY(1.7); opacity: 0.85; }
    100%     { transform: translateY(150px) scaleY(2.2); opacity: 0; }
  }

  /* Headless: roxo, e o medo é o tremor. A moldura pulsa fora de compasso com
     o sangue do vizinho, o que deixa os dois inquietos em vez de sincronizados. */
  .headless-quadro {
    background: radial-gradient(120% 90% at 50% 100%, rgba(78,26,120,0.42), rgba(16,12,22,0.92) 72%);
    box-shadow: inset 0 0 26px rgba(124,58,186,0.45);
    overflow: hidden;
    animation: tremor 6.1s ease-in-out infinite;
    animation-play-state: var(--anim, running);
  }
  .headless-quadro::before {
    content: "";
